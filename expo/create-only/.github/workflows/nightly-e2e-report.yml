# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)

name: 🌙 Nightly E2E Report

# The REPORTING half of the nightly e2e standard, and the companion to
# `nightly-e2e-health.yml`.
#
# The gate tells whoever opened a pull request that the nightly is red. It tells
# nobody else. A red suite with no open pull requests is invisible, there is
# nothing to assign, and there is no record that it came back. This workflow
# keeps exactly ONE open tracking issue per suite: filed the first red night,
# refreshed every night it is still red, closed automatically the night a full
# green run lands.
#
# ## This is NOT a gate — never make it a required check
#
# Requiring this context would hand an issues-API outage the power to block every
# pull request, which is exactly the coupling the two-workflow split exists to
# prevent: the gate workflow does not request `issues:` scope at all, so it
# cannot file, and this one is not required, so it cannot block.
#
# ## Publishing is BEST EFFORT — this job's result tracks the SUITE
#
# The verdict goes to `$GITHUB_STEP_SUMMARY` first, then the tracking issue is
# attempted, then whatever publishing did becomes a `::warning::`. So:
#
#   * A tracking issue that could not be written — Issues disabled on the
#     repository, an API outage, a revoked scope — is a WARNING, and the verdict
#     is still on the run's summary. The report channel does not die because its
#     optional publishing destination is unavailable.
#   * A genuinely RED suite fails this job.
#   * A verdict that could not be resolved at all fails this job.
#
# Do NOT reach for `continue-on-error:` on the job below to quieten a failing
# publish. It greens every run, including the ones that genuinely failed to
# report — which is the failure this design exists to avoid. If publishing is
# failing, the warning names the cause; fix that.
#
# ## Wiring this up
#
#   1. Keep `suites` and `branch` IDENTICAL to your `nightly-e2e-health.yml`
#      caller. Two different tables means the issues describe a different set of
#      suites than the one blocking merges.
#   2. Schedule it AFTER your nightly suites finish, not before. It reports on
#      the runs they produced; running it first reports on yesterday's.
#   3. Leave the `nightly-e2e` label alone once issues exist under it — the label
#      is how this job finds the issue it already owns.
#   4. If you renamed either half of the gate's job name, set `gate_context` to
#      match — see below.
#
# ## What the issue says about blocking merges is MEASURED (§10.7)
#
# The reporter reads `dev`'s branch rules at generation time and renders one of
# `required` / `not_required` / `unknown` into the issue title, body and close
# comment. It does NOT assume. That is a fix, not a feature: this reporter used
# to state that pull requests were blocked in every issue it filed, and in one
# measured adopter that was false — zero required contexts on `dev` matched the
# gate, and people were burning audited bypass labels to clear a gate that was
# not gating.
#
# If your issues say `not blocking merges` and you expected otherwise, the gate
# is not wired into your ruleset. That is the ruleset to fix, not this file.
#
# ## Concurrency
#
# Deliberately absent here. The non-cancelling group lives in Lisa's reusable
# workflow, on the job that writes, so an adopter cannot forget it — a forgotten
# group lets two overlapping reports both read "no open issue" and both file one.

on:
  schedule:
    # ~90 minutes after a midnight-UTC nightly, so the suites it reports on have
    # finished. Move it if yours run at another hour; reporting on a suite that
    # is still running produces "no completed run" every night.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Reading the nightly run history — the same read the gate does.
  actions: read
  pull-requests: read
  # The one scope the GATE deliberately does not have. Filing lives here so an
  # issues outage can never redden a required check.
  issues: write

jobs:
  report:
    name: 🌙 Nightly E2E Report
    # PIN AN IMMUTABLE REF, for the same reason the gate caller does: the two
    # halves must speak the same contract major, and `@main` can change between
    # a report and the gate reading the same night.
    uses: CodySwannGT/lisa/.github/workflows/nightly-e2e-report.yml@v3.35.0
    with:
      branch: dev
      # The status-check context the GATE publishes, used to MEASURE whether it
      # is actually required on `branch`. This default is the composite GitHub
      # builds from `nightly-e2e-health.yml`'s job name plus the reusable's job
      # name (`🌙 Nightly E2E Health` / `🌙 Gate`), byte for byte, emoji
      # included. Change it only if you renamed either half — and if you did,
      # your ruleset needs the same edit or the gate is already disarmed (§5).
      gate_context: '🌙 Nightly E2E Health / 🌙 Gate'
      # Quoted in the issue's waiver instructions, and only when the gate is
      # actually required. KEEP IT IDENTICAL to nightly-e2e-health.yml's
      # `bypass_label`, or the issue will tell people to apply a label the gate
      # does not read.
      bypass_label: nightly-e2e-bypass
      # Pin the tracking issue while its suite is red; unpin it on green.
      # OFF by default — GitHub allows only three pinned issues per repository,
      # so spending one is a choice. Past the limit the pin is a warning and the
      # issue is still filed correctly; a full pin board never fails this job.
      pin_issues: false
      # KEEP THIS IDENTICAL to the `suites` value in nightly-e2e-health.yml.
      #
      # `"gated": false` on a suite makes its issue say "this suite does not
      # gate merges" instead of claiming to block. Use it for a suite you track
      # but do not enforce — an ungated suite that claimed to block merges is
      # crying wolf, and a reader who catches one gate lying stops believing the
      # ones telling the truth. It can only make the claim WEAKER: `true` never
      # manufactures a blocking claim on a branch where the gate is not
      # required.
      suites: |
        [
          {
            "label": "Maestro native e2e",
            "workflow": "maestro-e2e.yml",
            "match": { "mode": "run" }
          }
        ]
