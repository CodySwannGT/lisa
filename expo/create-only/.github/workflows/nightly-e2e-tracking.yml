# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)
name: 📌 Nightly E2E Condition Tracking

on:
  workflow_run:
    workflows:
      - 🎭 Playwright Web E2E
      - 📱 Maestro Native E2E
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: nightly-e2e-tracking-${{ github.repository }}
  cancel-in-progress: false

jobs:
  track:
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch ==
      github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # TRACK `@main` — see the note in `nightly-e2e-health.yml`. This one was a
    # raw SHA, the worst of the two pinning shapes: a history rewrite makes the
    # commit unreachable, the workflow cannot load, zero jobs run, and the
    # check goes ABSENT rather than red.
    #
    # Written on one line deliberately. As a folded scalar (`uses: >-` with the
    # value below it) the reference was invisible to every line-based sweep,
    # including the gate whose job is checking these refs — it reported this
    # file as having none at all.
    uses: CodySwannGT/lisa/.github/workflows/nightly-e2e-tracking.yml@main
    secrets: inherit
