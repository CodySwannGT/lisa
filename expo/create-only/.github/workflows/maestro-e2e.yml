# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)

name: 📱 Maestro Native E2E

# Native (iOS + Android) e2e suite on GitHub-hosted runners — the
# self-hosted alternative to Maestro Cloud. Playwright in ci.yml covers web;
# this workflow is the native counterpart. Too heavy to gate PRs: it runs
# nightly plus on-demand via workflow_dispatch.
#
# The heavy lifting lives in Lisa's reusable maestro-native-e2e.yml (EAS
# build, Android emulator, iOS simulator, JUnit reports, and graceful
# skipping while prerequisites are missing). This caller owns the cadence
# and the project-specific values.
#
# To wire this project up:
#   1. Add a `dev-e2e` build profile to eas.json (non-dev-client, dev
#      backend, its own update channel so an OTA never overwrites the code
#      under test).
#   2. Provision the EXPO_TOKEN repository secret.
#   3. Put flows in .maestro/flows. Until 1-3 are done, runs skip with a
#      warning instead of failing.
#   4. Set the app id inputs below (they are forwarded to flows as
#      MAESTRO_APP_ID), plus any variables your flows read via maestro_env.
#      Sensitive values (test-account passwords) go in a MAESTRO_SECRET_ENV
#      repository secret — same newline-separated KEY=VALUE format — passed
#      through below.
#
# TWO SETUP SEAMS — pick the right one, it is not a style choice:
#
#   pre_suite_command  runs ONCE per run, in its own job, before either
#                      platform starts. Everything that mutates shared state
#                      goes here: data resets, fixture pruning, conditional
#                      seeding ("if none exists, create one"), environment
#                      leasing. Export values with
#                      `echo "MAESTRO_X=$V" >> "$MAESTRO_PRE_SUITE_ENV"`.
#                      If it fails, no suite runs — that is deliberate.
#
#   setup_command      runs in EACH platform job, and the two platform jobs
#                      run CONCURRENTLY — so it executes twice, at the same
#                      time, on two runners. Only idempotent, read-only,
#                      per-leg work is safe here. A destructive sweep or a
#                      read-modify-write in this seam is a live race: both
#                      runners answer "does it exist?" against the same
#                      pre-write state and both act on the answer.

on:
  schedule:
    # Nightly against the default branch. Offset from other nightly suites
    # (e.g. a Playwright nightly) so backend load doesn't overlap.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      platform:
        # NARROWING THIS DOES NOT CLEAR THE NIGHTLY GATE. Picking `android` or
        # `ios` skips the other platform's job, and GitHub still concludes the
        # run `success` — a skipped job does not redden its run. The
        # nightly-e2e-health gate reads the jobs behind a `success` run for
        # exactly this reason (truth-table row 26 in Lisa's
        # `docs/nightly-e2e-gate.md`), so a narrowed run reports
        # `incomplete_run` and keeps blocking. Use these options to iterate on
        # one platform; dispatch with `all` when the point is to clear a red
        # nightly.
        description: 'Platform(s) to run — use `all` when dispatching to clear the nightly gate'
        type: choice
        default: all
        options:
          - all
          - android
          - ios

permissions:
  contents: read
  # Read-only, and only this run's own job list. It is granted HERE, in the
  # caller, because that is the only place it can safely be granted: a called
  # workflow that DECLARES a scope its caller did not grant is a
  # `startup_failure` for the whole run. So this line plus the forwarded
  # LEG_ORDER_TOKEN secret below are what let `serialize_platform_legs` read
  # when the iOS leg finished.
  #
  # Drop this line and nothing breaks — the ordering job reports the gap and
  # lets the Android leg start. You lose the ordering, not the suite.
  actions: read

# Keyed on the ENVIRONMENT this suite drives, not on the ref. Every run of this
# workflow targets the same backend no matter which branch dispatched it, so
# keying on `github.ref` would hand two branches two different groups over one
# database — which is not exclusion. Rename `-dev` if your suite targets a
# different environment; keep it a CONSTANT.
concurrency:
  group: maestro-e2e-dev
  cancel-in-progress: false

jobs:
  maestro:
    name: 📱 Maestro Native E2E
    uses: CodySwannGT/lisa/.github/workflows/maestro-native-e2e.yml@main
    with:
      platform: ${{ inputs.platform || 'all' }}
      # Return the shared environment to a known state before either platform
      # starts. Both lifecycle commands are mandatory. If this project needs no
      # seeded fixtures, environment:reseed is an explicit verified no-op; the
      # step is still invoked so every suite follows reset then reseed.
      prepare_environment: 'development'
      prepare_verbs: 'reset,reseed'
      # android_app_id: 'com.example.app'
      # ios_app_id: 'com.example.app'
      # maestro_env: |
      #   MAESTRO_TEST_PHONE=0000000000
      #   MAESTRO_TEST_OTP=555555
      #
      # Once per run, before either platform starts — resets, sweeps, seeding.
      # pre_suite_command: |
      #   node scripts/maestro/prune-e2e-fixtures.mjs
      #   SEED=$(node scripts/maestro/resolve-seed-data.mjs)
      #   [[ -n "$SEED" ]] || { echo "::error::empty seed id"; exit 1; }
      #   echo "MAESTRO_SEED_ID=$SEED" >> "$MAESTRO_PRE_SUITE_ENV"
      # pre_suite_install_dependencies: true  # only if it needs node_modules
      #
      # Once per PLATFORM, concurrently — read-only, idempotent work only.
      # setup_command: node scripts/maestro/read-platform-config.mjs
      #
      # Uncomment when another suite drives the SAME backend — typically a
      # Playwright nightly calling quality.yml, which takes an input of the same
      # name. Pass both the identical string and they queue instead of running
      # at once against one database and one set of test accounts. Key it on the
      # environment; must differ from this workflow's own group above. Staggered
      # crons are not a substitute: a run waits for a hosted runner before it
      # starts, and those waits have been measured at 2h24m and 6h55m — longer
      # than any stagger, so the suite scheduled first can begin hours after the
      # one scheduled second.
      # concurrency_group: 'e2e-shared-test-user-dev'
      #
      # Uncomment when both platform legs sign in as the SAME test account. The
      # legs run concurrently by default and each one's sign-in invalidates the
      # other's session, so the loser hits a sign-in screen mid-suite and fails
      # an assertion that has nothing wrong with it. This runs iOS first, then
      # Android. It is ordering, not gating: a FAILING iOS leg still releases
      # Android, so turning it on never narrows what gets tested. Needs the
      # `actions: read` permission above AND the LEG_ORDER_TOKEN secret below;
      # without either it reports the gap and runs the legs concurrently rather
      # than failing. Leave it off if your legs use per-platform accounts — the
      # concurrency is free coverage in that case. The cost when on is the suite
      # taking iOS PLUS Android instead of the slower of the two.
      # serialize_platform_legs: true
      #
      # Uncomment when EAS build quota — not build freshness — is what limits
      # this suite. On Expo's Free plan the monthly iOS quota is what stops the
      # nightly running at all, and a rebuild of native inputs that did not
      # change buys nothing. `eas fingerprint:generate` hashes those inputs; a
      # match means the finished binary IS the app this commit would build, so
      # it is downloaded instead of rebuilt. A miss falls back to the latest
      # finished build for the profile, and only then does a fresh build start.
      # Leave it off if your e2e profile embeds the JS bundle: JS-only changes
      # do not move the fingerprint, so reuse would test stale JS.
      # reuse_build_by_fingerprint: true
      #
      # Uncomment to have a failed build say WHY when Expo refuses it for
      # quota. Without this the run reds with a generic build error and the
      # cause is only in the raw log. The cost is that the build's stderr is
      # buffered and replayed at the end rather than streaming live.
      # diagnose_eas_quota_exhaustion: true
      #
      # Uncomment once every flow declares `appId: ${MAESTRO_APP_ID}` and any
      # runFlow-included SUBFLOWS live OUTSIDE .maestro/flows. The app id
      # arrives as `-e MAESTRO_APP_ID=…`, so a flow naming a different variable
      # (or none) launches an EMPTY app id — which Maestro reports as a launch
      # failure naming no cause, after you have already paid for an EAS build
      # and an emulator boot. This turns that into a grep in preflight.
      # `maestro test` recurses, so anything under the flows directory is a
      # flow and is expected to declare an appId.
      # lint_flow_app_id: true
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      MAESTRO_SECRET_ENV: ${{ secrets.MAESTRO_SECRET_ENV }}
      # Only read when serialize_platform_legs is true. A forwarded secret
      # carries THIS workflow's token and therefore THIS workflow's
      # `actions: read` — which is why the scope can be granted above without
      # the reusable workflow having to declare it and startup-fail every caller
      # that grants less. Harmless to pass when the input is off.
      LEG_ORDER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
