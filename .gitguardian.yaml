# GitGuardian / ggshield configuration.
#
# This file exists to exclude ONE generated artifact, and should stay that way.
# Every other path in the repository is scanned normally; adding a broad
# exclusion here would quietly disable the gate rather than inform it.

version: 2

secret:
  ignored-paths:
    # src/core/upstream-evidence-manifest.ts is generated by
    # `bun run build:upstream-evidence-manifest`. Its entire content is a map of
    # repository path -> SHA-256 of that file's contents, so it cannot hold a
    # credential by construction — there is nowhere in it for a value that is
    # not a digest of tracked, public source.
    #
    # The Generic High Entropy Secret detector flags it anyway, and the reason is
    # worth writing down because it will recur. The manifest already carries over
    # a thousand of these digests on main and scans clean. What trips the detector
    # is *filename adjacency*: entries whose path contains the word "secret" pair
    # a secret-ish key with a high-entropy value, which is indistinguishable from
    # `secret_key: <token>` to a generic matcher:
    #
    #   "plugins/.../lisa-secrets-access/scripts/read-secret-note.mjs":
    #     "1471d21...aa9a27ffbcc"
    #
    # So the finding is a property of what the files are *named*, not of what the
    # manifest contains. Renaming accurate files to satisfy a regex would be the
    # wrong trade, and pinning individual secret SHAs would need a new entry every
    # time any of those files changed.
    - src/core/upstream-evidence-manifest.ts
