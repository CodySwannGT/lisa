# This file is managed by Lisa and IS replaced on each `lisa` run.
# Do not edit directly — durable changes belong upstream in Lisa.

pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: '*.rb'
      run: bundle exec rubocop --force-exclusion {staged_files}
    threshold-ratchet:
      # Quality thresholds (simplecov minimums, rubocop Metrics maximums, …)
      # may tighten, never weaken. Same deterministic comparator as the
      # agent-time hooks and CI; self-skips when node or the script is absent
      # (CI still enforces the gate).
      run: sh -c 'command -v node >/dev/null 2>&1 || exit 0; [ -f scripts/check-threshold-ratchet.mjs ] || exit 0; node scripts/check-threshold-ratchet.mjs --staged'
    bundler-audit:
      # The wrapper removes Git's complete documented local environment before
      # `--update` enters the nested ruby-advisory-db repository.
      run: sh scripts/lisa-clean-git-env.sh bundle exec bundler-audit check --update
      fail_text: 'Security audit failed. Follow the lisa-security-audit-handling skill (upgrade, evaluate impact, then document or stop for a human). Never bypass this hook.'

prepare-commit-msg:
  commands:
    work-item-trailer:
      run: node scripts/lisa-work-item.mjs prepare-commit-msg {1} {2} {3}

commit-msg:
  commands:
    work-item:
      run: node scripts/lisa-work-item.mjs validate-commit {1}
    conventional-commit:
      run: 'head -1 {1} | grep -qE "^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?: .+" || (echo "Commit message must follow conventional format" && exit 1)'

pre-push:
  commands:
    rails-prepush:
      run: >-
        node --input-type=module -e 'try { const { main } = await import("./scripts/lisa-rails-prepush.mjs"); const rc = await main(process.argv.slice(1)); if (rc !== 0) console.error(`Rails pre-push refused (exit ${rc}). Retry the same git push command and inspect rails-prepush output for scanner and work-item details.`); process.exitCode = rc; } catch { console.error("Managed Rails push tooling is unavailable or damaged. Run full Lisa apply and retry; raw bootstrap errors are withheld."); process.exitCode = 1; }' {1}
      use_stdin: true
    rspec:
      # One start-of-run sweep (stale Lisa temp entries, orphaned test
      # processes of dead runs) replaces the retired scratch supervisor
      # (CodySwannGT/lisa#4603). It never fails the push. The payload then runs
      # as itself, exported as LISA_TEST_RUN_OWNER so a later sweep recognises
      # any child it orphans.
      #
      # The gate itself runs through scripts/lisa-rails-gates.mjs
      # (CodySwannGT/lisa#4613): the push-gate pass cache (a re-push of a tree
      # that already passed prints CACHED PASS), headroom admission, and a
      # parallel full run when config/database.yml allows it. Without node or
      # the script, the command runs as it always did.
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lib/lisa-cleanup-sweep.mjs ]; then node scripts/lib/lisa-cleanup-sweep.mjs; else echo "🧹 cleanup sweep skipped (node or scripts/lib/lisa-cleanup-sweep.mjs unavailable)"; fi; export LISA_TEST_RUN_OWNER="$$:0"; if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs rspec; fi; exec bundle exec rspec'
    brakeman:
      # Cached by scripts/lisa-rails-gates.mjs; runs as before without it.
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs brakeman; fi; exec bundle exec brakeman --no-pager --quiet'
    reek:
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs reek; fi; exec bundle exec reek app/ lib/'
    flog:
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs flog; fi; exec bundle exec flog --all --group app/ lib/'
    flay:
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs flay; fi; exec bundle exec flay app/ lib/'
    mutation:
      # Opt-in, diff-only mutation gate. Self-skips instantly when disabled
      # (mutation.gate.yml: enabled: false), so it adds no cost until opted in.
      # The same start-of-run sweep as rspec runs before the gate script.
      # When enabled it waits for machine headroom (never cached).
      run: sh scripts/lisa-clean-git-env.sh sh -c 'if command -v node >/dev/null 2>&1 && [ -f scripts/lib/lisa-cleanup-sweep.mjs ]; then node scripts/lib/lisa-cleanup-sweep.mjs; else echo "🧹 cleanup sweep skipped (node or scripts/lib/lisa-cleanup-sweep.mjs unavailable)"; fi; export LISA_TEST_RUN_OWNER="$$:0"; if command -v node >/dev/null 2>&1 && [ -f scripts/lisa-rails-gates.mjs ]; then exec node scripts/lisa-rails-gates.mjs mutation; fi; exec bash scripts/lisa-mutation.sh'
