# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)
# Release + Deploy workflow for Rails on AWS ECS Fargate.
#
# Step 1: Call the reusable release workflow for version bumping and tagging.
# Step 2: Build Docker images, push to ECR, run migrations, update ECS services.
#
# Customize the env vars and steps below to match your infrastructure.

name: Release and Deploy

on:
  push:
    branches:
      - staging
      # Production deployment is OPT-IN and is left off deliberately. It is not
      # an oversight, and it is not ready to simply uncomment — this workflow
      # separates environments by AWS ACCOUNT, not by resource name, so a push
      # to `main` needs a production account that already exists.
      #
      # To enable it, uncomment `- main` below AFTER all four are true:
      #
      #   1. A repository secret named `AWS_ACCOUNT_ID_MAIN` holds the
      #      production AWS account ID. The name is not arbitrary:
      #      `noliran/branch-based-secrets` below turns `AWS_ACCOUNT_ID` into
      #      `AWS_ACCOUNT_ID_<BRANCH IN UPPERCASE>`, so `staging` reads
      #      `AWS_ACCOUNT_ID_STAGING` and `main` reads `AWS_ACCOUNT_ID_MAIN`.
      #      Without it the account id resolves empty and the deploy fails at
      #      the credentials step.
      #   2. That account has the `DeployServiceRole` IAM role, trusting this
      #      repository's OIDC subject — the role this job assumes.
      #   3. That account has the ECS cluster and services this file names in
      #      `env:` — `webCluster`, `web-rails-service`, `worker-service` —
      #      and the ECR repositories `web` and `worker2`. The names are FIXED,
      #      not suffixed per environment, so production needs its own account
      #      carrying the same names rather than differently-named resources
      #      beside staging's.
      #   4. Your Rails app has a `production` environment configured. The
      #      build already maps the branch for you: `APP_STAGE` below resolves
      #      `main` to `production` and is passed as `RAILS_ENV`.
      #
      # Until then production is still reachable by hand: `workflow_dispatch`
      # takes no inputs, so you can run this workflow against any branch from
      # the Actions tab. What is switched off here is the AUTOMATIC deploy on
      # every push to `main`.
      # - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-deploy
  cancel-in-progress: true

jobs:
  # ── Pre-deploy gates ──────────────────────────────────────────────────────
  # Resolves `pre-deploy:<branch>` from the `gates` block of .lisa.config.json
  # and runs whatever is declared there, BEFORE the release.
  #
  # This is what makes a declaration like
  #
  #   "runtime-web-vulnerability": { "pre-deploy:main": "required" }
  #
  # mean something. A required gate that fails — or that resolves to no prover at
  # all, which is UNPROVABLE rather than passing — stops the workflow here, so
  # the release is never cut. A gate job running BESIDE the deploy would go red
  # after the thing had already shipped, which is a report.
  #
  # `install_dependencies: false` because this project's dependencies are Ruby's,
  # not the runner's: the gate façade only needs `node` and the project's
  # `package.json` scripts to resolve a prover. A project whose deploy-moment
  # provers need Bundler should point `runner` in .lisa.config.json at a command
  # that sets it up, or replace this job with one that does.
  pre_deploy_gates:
    name: 🚦 Pre-Deploy Gates
    uses: CodySwannGT/lisa/.github/workflows/gates.yml@main
    with:
      moment: pre-deploy:${{ github.ref_name }}
      install_dependencies: false
    # No `secrets:` key: gates.yml declares none in its `workflow_call`, so
    # passing any grants everything to a callee that reads nothing (#3065).

  release:
    name: Release
    uses: CodySwannGT/lisa/.github/workflows/release-rails.yml@main
    needs: [pre_deploy_gates]
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  deploy_rails:
    name: Deploy
    needs: [release]
    # `!cancelled()` suppresses the implicit `success()` GitHub otherwise ANDs
    # onto this condition. Without it a failed release SKIPPED this job, and a
    # skipped job renders as neutral and counts as a satisfied required check —
    # so the deploy that never happened left no signal at all. The release
    # result is now read by the guard STEP below, which fails this job loudly
    # instead (#3467). The `chore(release):` clause is unchanged: that push is
    # the release commit coming back round, and skipping it is correct.
    if: >-
      !cancelled() &&
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # needed to interact with GitHub's OIDC Token endpoint.
      contents: read
    env:
      AWS_REGION: us-east-1
      WORKER_ECR_REPO: worker2
      RAILS_ECR_REPO: web
      CLUSTER_NAME: webCluster
      RAILS_SERVICE_NAME: web-rails-service
      WORKER_SERVICE_NAME: worker-service
      RAILS_TASK_FAMILY: web-rails-task
      WORKER_TASK_FAMILY: worker-task
      RAILS_CONTAINER_NAME: AppFargateTaskContainer
      GITHUB_REF_NAME: ${{ github.ref_name }}

    steps:
      # Deploy-outcome guard. Deliberately the FIRST step: it decides whether the
      # rest of this job may proceed, and it reports a verdict on EVERY run, so
      # this check is green or red and never the third, silent state.
      #
      # Keep the `run:` body byte-identical to the guard in every other Lisa
      # deploy workflow — an operator reads the same words whichever stack they
      # are on, and a test asserts the copies have not drifted apart.
      - name: 🚨 Confirm the release shipped
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "${RELEASE_RESULT}" = "success" ]; then
            echo "✅ The release succeeded. Deploying to ${DEPLOY_ENVIRONMENT}."
            exit 0
          fi
          {
            echo "### 🚨 Nothing new was deployed to ${DEPLOY_ENVIRONMENT}"
            echo ""
            echo "The **Release** step did not succeed (it reported \`${RELEASE_RESULT}\`), so no"
            echo "new version reached \`${DEPLOY_ENVIRONMENT}\`. Whatever was already running"
            echo "there is untouched and still working — this change simply has not shipped."
            echo ""
            echo "**What to do next**"
            echo ""
            echo "1. Open the **Release** job in this run and read the step marked in red."
            echo "2. The most common cause is that this version number was already released from"
            echo "   another branch. The fix is to raise \`version\` in \`package.json\` above every"
            echo "   version already released, then merge again."
            echo "3. If anything here is unclear, send this run's link to whoever looks after"
            echo "   deployments. Do not merge anything else into this branch until it is fixed."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          echo "::error title=Nothing new was deployed to ${DEPLOY_ENVIRONMENT}::The release did not succeed (${RELEASE_RESULT}), so this change did not ship and the previous version is still running. Open the Release job in this run to see why, fix it, then merge again."
          exit 1
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: noliran/branch-based-secrets@ef9182f16f118c7c3d05c36973546ebc990b8c69 # v1 (2020-10-09, no semver tag)
        with:
          secrets: AWS_ACCOUNT_ID

      - name: Set APP_STAGE environment variable
        run: echo "APP_STAGE=$([[ $GITHUB_REF_NAME == 'main' ]] && echo 'production' || echo $GITHUB_REF_NAME)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets[env.AWS_ACCOUNT_ID_NAME] }}:role/DeployServiceRole
          role-session-name: fedeploysession
          aws-region: ${{ env.AWS_REGION }}

      - name: Export AWS credentials to environment
        run: |
          eval "$(aws configure export-credentials --format env)"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV

      - name: Retrieve S3 bucket name
        run: |
          S3_BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?starts_with(Name, 'ClientUploadBucket')].Value | [0]" \
            --output json | jq -r '.')
          if [ "$S3_BUCKET_NAME" = "null" ] || [ -z "$S3_BUCKET_NAME" ]; then
            echo "::error::Could not find CloudFormation export starting with 'ClientUploadBucket'"
            exit 1
          fi
          echo "S3_BUCKET_NAME=${S3_BUCKET_NAME}" >> $GITHUB_ENV

      - name: Amazon ECR Login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Prepare AWS credentials file for BuildKit
        run: |
          cat > aws_credentials <<CREDS
          AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN=${{ env.AWS_SESSION_TOKEN }}
          AWS_REGION=${{ env.AWS_REGION }}
          CREDS

      - name: Build and push Rails image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg RAILS_ENV=${{ env.APP_STAGE }} \
            --build-arg S3_BUCKET_NAME=${{ env.S3_BUCKET_NAME }} \
            --secret id=aws_credentials,src=aws_credentials \
            -t $ECR_REGISTRY/${{ env.RAILS_ECR_REPO }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.RAILS_ECR_REPO }}:latest .
          docker push $ECR_REGISTRY/${{ env.RAILS_ECR_REPO }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.RAILS_ECR_REPO }}:latest

      - name: Build and push Worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f worker.Dockerfile \
            --build-arg RAILS_ENV=${{ env.APP_STAGE }} \
            -t $ECR_REGISTRY/${{ env.WORKER_ECR_REPO }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.WORKER_ECR_REPO }}:latest .
          docker push $ECR_REGISTRY/${{ env.WORKER_ECR_REPO }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.WORKER_ECR_REPO }}:latest

      - name: Retrieve VPC network configuration
        run: |
          PRIVATE_SUBNETS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='vpcPrivateSubnets'].Value | [0]" \
            --output json | jq -r '.')
          ECS_SECURITY_GROUP=$(aws cloudformation list-exports \
            --query "Exports[?Name=='ecsSecurityGroupId'].Value | [0]" \
            --output json | jq -r '.')
          if [ "$PRIVATE_SUBNETS" = "null" ] || [ -z "$PRIVATE_SUBNETS" ]; then
            echo "::error::Could not find CloudFormation export 'vpcPrivateSubnets'"
            exit 1
          fi
          if [ "$ECS_SECURITY_GROUP" = "null" ] || [ -z "$ECS_SECURITY_GROUP" ]; then
            echo "::error::Could not find CloudFormation export 'ecsSecurityGroupId'"
            exit 1
          fi
          echo "PRIVATE_SUBNETS=${PRIVATE_SUBNETS}" >> $GITHUB_ENV
          echo "ECS_SECURITY_GROUP=${ECS_SECURITY_GROUP}" >> $GITHUB_ENV

      - name: Register new ECS task definitions
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for FAMILY_ECR in \
            "${{ env.RAILS_TASK_FAMILY }}:${{ env.RAILS_ECR_REPO }}" \
            "${{ env.WORKER_TASK_FAMILY }}:${{ env.WORKER_ECR_REPO }}"
          do
            IFS=: read -r FAMILY ECR_REPO <<< "$FAMILY_ECR"

            TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition')
            NEW_IMAGE="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
            echo "$TASK_DEF" | jq --arg IMG "$NEW_IMAGE" \
              '.containerDefinitions |= map(if .essential == true then .image = $IMG else . end) |
               del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              > /tmp/task-def.json
            NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "Registered $FAMILY -> $NEW_ARN"

            if [ "$FAMILY" = "${{ env.RAILS_TASK_FAMILY }}" ]; then
              echo "RAILS_TASK_DEF_ARN=${NEW_ARN}" >> $GITHUB_ENV
            else
              echo "WORKER_TASK_DEF_ARN=${NEW_ARN}" >> $GITHUB_ENV
            fi
          done

      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.CLUSTER_NAME }} \
            --task-definition "${{ env.RAILS_TASK_DEF_ARN }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ env.PRIVATE_SUBNETS }}],securityGroups=[${{ env.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --overrides "{
              \"containerOverrides\": [{
                \"name\": \"${{ env.RAILS_CONTAINER_NAME }}\",
                \"command\": [\"bin/rails\", \"db:migrate\"]
              }]
            }" \
            --started-by "github-actions-deploy" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "::error::Failed to start migration task (no task placed)"
            exit 1
          fi

          echo "Migration task started: $TASK_ARN"

          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.CLUSTER_NAME }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.CLUSTER_NAME }} \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name == \`${{ env.RAILS_CONTAINER_NAME }}\`] | [0].exitCode" \
            --output text)

          echo "Migration task exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" = "None" ] || [ -z "$EXIT_CODE" ]; then
            echo "::error::Migration container did not produce an exit code (may have failed to start)"
            REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.CLUSTER_NAME }} \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "::error::Stopped reason: $REASON"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migration failed with exit code $EXIT_CODE"
            REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.CLUSTER_NAME }} \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "::error::Stopped reason: $REASON"
            exit 1
          fi

      - name: Update ECS services
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service "${{ env.RAILS_SERVICE_NAME }}" \
            --task-definition "${{ env.RAILS_TASK_DEF_ARN }}" \
            --force-new-deployment

          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service "${{ env.WORKER_SERVICE_NAME }}" \
            --task-definition "${{ env.WORKER_TASK_DEF_ARN }}" \
            --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          MAX_ATTEMPTS=60
          DELAY=15
          SERVICES="${{ env.RAILS_SERVICE_NAME }} ${{ env.WORKER_SERVICE_NAME }}"

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            RESULT=$(aws ecs describe-services \
              --cluster ${{ env.CLUSTER_NAME }} \
              --services $SERVICES \
              --query 'services[].{name:serviceName,running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' \
              --output json)

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS:"
            echo "$RESULT" | jq -c '.[]'

            ALL_COMPLETE=$(echo "$RESULT" | jq 'all(.[]; .rollout == "COMPLETED" and .running == .desired)')
            if [ "$ALL_COMPLETE" = "true" ]; then
              echo "All services stable."
              exit 0
            fi

            ANY_FAILED=$(echo "$RESULT" | jq 'any(.[]; .rollout == "FAILED")')
            if [ "$ANY_FAILED" = "true" ]; then
              echo "::error::Service deployment failed"
              echo "$RESULT" | jq '.[] | select(.rollout == "FAILED")'
              exit 1
            fi

            sleep $DELAY
          done

          echo "::error::Services did not stabilize within $((MAX_ATTEMPTS * DELAY / 60)) minutes"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -f aws_credentials
          docker system prune -f

  # ── Post-deploy gates ─────────────────────────────────────────────────────
  # Proves a property of what is now live. A red here does not un-ship the
  # release; it names the gate that does not hold so an operator can act on it,
  # which is the difference between a post-deploy gate and a post-deploy log.
  post_deploy_gates:
    name: 🚦 Post-Deploy Gates
    uses: CodySwannGT/lisa/.github/workflows/gates.yml@main
    needs: [deploy_rails]
    if: ${{ always() && !cancelled() && needs.deploy_rails.result == 'success' }}
    with:
      moment: post-deploy:${{ github.ref_name }}
      install_dependencies: false
    # No `secrets:` key: gates.yml declares none in its `workflow_call`, so
    # passing any grants everything to a callee that reads nothing (#3065).
