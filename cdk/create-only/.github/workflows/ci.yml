# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)

name: 🔍 CI Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  determine_environment:
    name: 🌍 Determine Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      cdk_env: ${{ steps.env.outputs.cdk_env }}
      aws_account_id: ${{ steps.env.outputs.aws_account_id }}
      role_arn: ${{ steps.env.outputs.role_arn }}
      role_name: ${{ steps.env.outputs.role_name }}
    steps:
      - name: 🔄 Set environment
        id: env
        env:
          # Non-secret REPOSITORY VARIABLE (Settings → Variables), not a secret
          # — a role name is not sensitive and secrets are unreadable when you
          # need to debug this. Read through `env:` rather than interpolated
          # straight into the shell below, because `${{ vars.* }}` pasted into a
          # `run:` body is a script-injection seam.
          CDK_CI_READ_ONLY_ROLE_NAME: ${{ vars.CDK_CI_READ_ONLY_ROLE_NAME }}
        run: |
          # For workflow dispatch, use the input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          # For pull requests, use the target branch
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
            case $TARGET_BRANCH in
              main)
                TARGET_ENV="production"
                ;;
              staging)
                TARGET_ENV="staging"
                ;;
              dev)
                TARGET_ENV="dev"
                ;;
              *)
                TARGET_ENV="dev"  # Default to dev for other branches
                ;;
            esac
          else
            TARGET_ENV="dev"  # Default fallback
          fi

          echo "environment=$TARGET_ENV" >> $GITHUB_OUTPUT

          # ─────────────────────────────────────────────────────────────────
          # Pick the AWS identity by TRIGGER, not by environment.
          #
          # This job only READS — cdk synth, cdk diff, unit tests — so a pull
          # request must not be able to obtain deploy credentials. GitHub emits
          # the SAME OIDC subject for every pull request no matter which branch
          # it targets:
          #
          #   pull_request      -> repo:<owner>/<repo>:pull_request
          #   workflow_dispatch -> repo:<owner>/<repo>:ref:refs/heads/<branch>
          #
          # Because this workflow maps base branch -> account, a deploy role
          # used here has to trust `...:pull_request` in EVERY account this
          # repo validates against, production included. Anyone who can open a
          # pull request could then assume the production deploy role.
          #
          # ⚠️ Do NOT collapse this to a single role. The branch is the whole
          # point. A read-only role whose trust policy admits only the
          # `pull_request` subject will REFUSE the `ref:refs/heads/<branch>`
          # subject that workflow_dispatch presents, and the failure is opaque:
          #
          #   Not authorized to perform sts:AssumeRoleWithWebIdentity
          #
          # with nothing in it naming the subject that was rejected. You would
          # only discover it the day you reach for the manual-dispatch path.
          #
          # To adopt the least-privileged default, create a role (default name
          # CiReadOnlyServiceRole) in each account, with:
          #   - a trust policy on the GitHub OIDC provider whose
          #     token.actions.githubusercontent.com:sub condition is
          #     repo:<owner>/<repo>:pull_request
          #   - read-only permissions, plus whatever the CDK bootstrap lookup
          #     role needs for `cdk synth` / `cdk diff`.
          # Name it something else? Set the repository VARIABLE
          # CDK_CI_READ_ONLY_ROLE_NAME. Haven't provisioned it yet? Set that
          # same variable to DeployServiceRole — behaviour is then identical to
          # a repo scaffolded before this seam existed, and nothing here breaks.
          # ─────────────────────────────────────────────────────────────────
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ROLE_NAME="${CDK_CI_READ_ONLY_ROLE_NAME:-CiReadOnlyServiceRole}"
          else
            ROLE_NAME="DeployServiceRole"
          fi

          echo "role_name=$ROLE_NAME" >> $GITHUB_OUTPUT

          # Map to CDK environment name.
          # Set your per-environment AWS account IDs as repository or environment
          # secrets: AWS_ACCOUNT_ID_PRODUCTION / AWS_ACCOUNT_ID_STAGING / AWS_ACCOUNT_ID_DEV.
          # The role name comes from the trigger-based selection above — do not
          # hardcode one here, or the pull-request narrowing is silently undone.
          case $TARGET_ENV in
            production)
              echo "cdk_env=production" >> $GITHUB_OUTPUT
              echo "aws_account_id=${{ secrets.AWS_ACCOUNT_ID_PRODUCTION }}" >> $GITHUB_OUTPUT
              echo "role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PRODUCTION }}:role/$ROLE_NAME" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "cdk_env=staging" >> $GITHUB_OUTPUT
              echo "aws_account_id=${{ secrets.AWS_ACCOUNT_ID_STAGING }}" >> $GITHUB_OUTPUT
              echo "role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/$ROLE_NAME" >> $GITHUB_OUTPUT
              ;;
            dev|*)
              echo "cdk_env=dev" >> $GITHUB_OUTPUT
              echo "aws_account_id=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_OUTPUT
              echo "role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/$ROLE_NAME" >> $GITHUB_OUTPUT
              ;;
          esac

  cdk-checks:
    name: 🏗️ CDK Validation
    needs: [determine_environment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # needed to interact with GitHub's OIDC Token endpoint.
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '22.21.1'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🔧 Install CDK
        run: npm install -g aws-cdk

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ needs.determine_environment.outputs.role_arn }}
          role-session-name: cdk-ci-checks
          aws-region: us-east-1

      - name: 🪪 Verify assumed identity
        id: verify_identity
        env:
          EXPECTED_ROLE: ${{ needs.determine_environment.outputs.role_name }}
        run: |
          # Every remaining step in this job only reads, so a silent revert to
          # the deploy role would pass all of them. Without this assertion the
          # over-privilege regression is invisible. sts:GetCallerIdentity needs
          # no IAM permissions at all, so it works under the read-only role.
          CALLER_ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "${CALLER_ARN}" in
            *":assumed-role/${EXPECTED_ROLE}/"*)
              echo "✅ assumed ${EXPECTED_ROLE}"
              ;;
            *)
              echo "::error::Expected to assume ${EXPECTED_ROLE}, but the caller identity is ${CALLER_ARN}"
              exit 1
              ;;
          esac

      - name: 📋 CDK Synth
        run: |
          echo "🔍 Running CDK synth for ${{ needs.determine_environment.outputs.environment }} environment..."
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_INFRA_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=us-east-1

          npx cdk synth --all \
            --quiet

      - name: 🔍 CDK Diff
        run: |
          echo "📊 Running CDK diff for ${{ needs.determine_environment.outputs.environment }} environment..."
          export CDK_DEFAULT_ACCOUNT=${{ secrets.AWS_INFRA_ACCOUNT_ID }}
          export CDK_DEFAULT_REGION=us-east-1

          npx cdk diff --all \
            || true  # Don't fail on diff, just report changes

      - name: 🧪 Run Tests (including snapshots)
        run: |
          echo "🧪 Running unit tests with snapshot validation..."
          npm test

  quality:
    name: 🔍 Quality Checks
    needs: [determine_environment, cdk-checks] # Ensure CDK checks pass first
    # Reference to the quality checks workflow
    permissions:
      contents: read
      # work_item_traceability reads the tracker issue to verify the PR
      # backlink. A reusable workflow can only DOWNGRADE the caller's
      # grant, so without issues:read that job cannot enforce anything.
      issues: read
      pull-requests: read
    uses: CodySwannGT/lisa/.github/workflows/quality.yml@main
    with:
      node_version: '22.21.1'
      package_manager: 'npm'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
      # Only the configured tracker's credentials are used. tracker:
      # github needs none of these; jira/linear cannot verify the PR
      # backlink without them and report not-enforceable instead.
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_LOGIN: ${{ secrets.JIRA_LOGIN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
