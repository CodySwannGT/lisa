# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)

name: 🚀 Release and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'main'
        type: choice
        options:
          - main

# Prevent concurrent runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Environment setup
  determine_environment:
    name: 🌍 Determine Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      approval_environment: ${{ steps.approval.outputs.approval_environment }}
      require_approval: ${{ steps.approval.outputs.require_approval }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🔄 Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: 🚦 Resolve approval gate from .lisa.config.json
        id: approval
        run: |
          BRANCH="${{ steps.env.outputs.environment }}"
          CONFIG=".lisa.config.json"
          APPROVAL_ENV="$BRANCH"
          REQUIRE="false"
          if [ -f "$CONFIG" ] && jq empty "$CONFIG" 2>/dev/null; then
            # Friendly environment name for the branch: an explicit
            # github.environments[].branch match wins, then the
            # deploy.branches map, then the branch name itself.
            NAME=$(jq -r --arg b "$BRANCH" '[.github.environments // {} | to_entries[] | select(.value.branch == $b) | .key] | first // empty' "$CONFIG")
            if [ -z "$NAME" ]; then
              NAME=$(jq -r --arg b "$BRANCH" '[.deploy.branches // {} | to_entries[] | select(.value == $b) | .key] | first // empty' "$CONFIG")
            fi
            APPROVAL_ENV="${NAME:-$BRANCH}"
            REQUIRE=$(jq -r --arg e "$APPROVAL_ENV" '.github.environments[$e].require_approval // false' "$CONFIG")
          fi
          echo "approval_environment=$APPROVAL_ENV" >> $GITHUB_OUTPUT
          echo "require_approval=$REQUIRE" >> $GITHUB_OUTPUT

  # ── Pre-deploy gates ──────────────────────────────────────────────────────
  # Resolves `pre-deploy:<environment>` from the `gates` block of
  # .lisa.config.json and runs whatever is declared there, BEFORE the release.
  #
  # This is what makes a declaration like
  #
  #   "runtime-web-vulnerability": { "pre-deploy:production": "required" }
  #
  # mean something. A required gate that fails — or that resolves to no prover at
  # all, which is UNPROVABLE rather than passing — stops the workflow here, so
  # the release is never cut. A gate job running BESIDE the deploy would go red
  # after the tag and the artefacts had already shipped, which is a report.
  #
  # A project that declares nothing at this moment gets a green job that ran no
  # gates and says so, and the deploy behaves exactly as it did before.
  pre_deploy_gates:
    name: 🚦 Pre-Deploy Gates
    uses: CodySwannGT/lisa/.github/workflows/gates.yml@main
    needs: [determine_environment]
    with:
      moment: pre-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'npm'
    # No `secrets:` key: gates.yml declares none in its `workflow_call`, so
    # passing any grants everything to a callee that reads nothing (#3065).

  release:
    name: 📦 Release
    # Reference to the quality checks workflow
    uses: CodySwannGT/lisa/.github/workflows/release.yml@main
    needs: [determine_environment, pre_deploy_gates]
    permissions:
      contents: write
      pull-requests: read
    with:
      environment: ${{ needs.determine_environment.outputs.environment }}
      release_strategy: 'standard-version'
      skip_jobs: 'test:e2e,test:integration'
      require_approval: ${{ needs.determine_environment.outputs.require_approval == 'true' }}
      approval_environment: ${{ needs.determine_environment.outputs.approval_environment }}
      require_signatures: false
      generate_sbom: true
      override_blackout: true
      node_version: '22.21.1'
      package_manager: 'npm'
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  # ── Post-deploy gates ─────────────────────────────────────────────────────
  # Proves a property of what is now live. A red here does not un-ship the
  # release; it names the gate that does not hold so an operator can act on it,
  # which is the difference between a post-deploy gate and a post-deploy log.
  post_deploy_gates:
    name: 🚦 Post-Deploy Gates
    uses: CodySwannGT/lisa/.github/workflows/gates.yml@main
    needs: [determine_environment, release]
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    with:
      moment: post-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'npm'
    # No `secrets:` key: gates.yml declares none in its `workflow_call`, so
    # passing any grants everything to a callee that reads nothing (#3065).
# Trigger staging deployment after CDK trust fix
