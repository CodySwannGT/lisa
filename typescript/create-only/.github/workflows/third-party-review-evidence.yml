# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)
# -----------------------------------------------------------------------------
# Third-party review evidence — the RESPONSE arm (#3591)
# -----------------------------------------------------------------------------
# `review-evidence.yml` answers "can the gate SEE a review that never happened?"
# This one answers "and then what?".
#
# A third-party review app reports on the pull request head through a COMMIT
# STATUS or a CHECK RUN, and one app can move from the first to the second
# without notice (#4553). When it is throttled or declines, it never blocks: a
# status still reports `state: success`, and a check run concludes `neutral`,
# which GitHub counts as passing a required check. Only the words separate a
# review that ran from one that never started — a status's `description`, or
# the first line of a check run's summary. Measured over the last 30 merged pull
# requests in the repository this was written against: 24 of 30 merges passed a
# required review gate that reviewed nothing.
#
# WHY `status` AND `check_run`, AND NOT A POLLING LOOP. The verdict changes
# the moment the reviewer answers, and only then. A schedule that polled for it
# would burn billable minutes on every repository, every interval, to learn
# nothing on almost every run. This wakes on the event that carries the answer,
# reads it, decides, and exits. A check run fires no `status` event, so a
# workflow that woke on `status` alone stopped running entirely the day its
# reviewer switched (#4553). GitHub starts a `check_run` workflow only from the
# default branch's copy of this file, and never when the check suite was created
# by GitHub Actions or its head SHA is associated with GitHub Actions — so the
# reviewer's run wakes it and Actions' own jobs do not, and no check run on a
# head pushed with the Actions token wakes it either.
#
# WHY THE DEFAULT BRANCH IS CHECKED OUT, NEVER THE HEAD. `status` and
# `check_run` runs start in this repository's own context, for every pull
# request — a fork's included — with no approval prompt, and any app's check
# run starts one. Checking out the head would run that pull request's own code,
# and its own `.lisa.config.json`, with this repository's token and cache
# scope. The prover reads the head's evidence through the API by SHA, so it
# never needs the head's files: the commit to judge arrives as --sha.
#
# THE VERDICT IS PUBLISHED ON THE HEAD IT JUDGED (#4630). A `status` or
# `check_run` run belongs to the default branch's latest commit, so the job's
# own check run lands there — never on the pull request head it judged, where
# nobody reading the pull request would see it. The prover's verdict is saved
# as JSON instead of ending the job, and the publish step creates ONE check
# run on `EVIDENCE_SHA`: `🕵️ Third-party review evidence (<reviewer>)`, or
# without the reviewer on the manual path, concluding `success` for SATISFIED
# and SUBSTITUTED (the title says which) and `failure` for UNSATISFIED and for
# a pull-request read that failed. The job itself concludes `success` once the
# verdict is published, so default-branch commits stop collecting other pull
# requests' verdicts. It FAILS when the prover crashed or gave no verdict, or
# when GitHub refused the check run, so broken machinery still shows.
# Events caused by the Actions token start no workflow run, so the published
# check run never wakes this workflow again; neither does the job's own,
# which belongs to a suite GitHub Actions created.
#
# WHAT MAKES IT RED. Neither real third-party review evidence at the head, nor a
# posted adversarial-review substitute for that same head. A merge path that
# substitutes a local review leaves a marked comment behind, and this reads it.
#
# THREE NO-OPS THAT SAY SO. No reviewer configured, a commit that is nobody's
# pull request head, and a status or check run from an app nobody declared are
# all no-ops — and each PRINTS that it is one, and why it publishes nothing.
# A silent pass is the defect this exists to end, so it is not reproduced here.
# A failed or non-list pull-request read is UNREADABLE, not a no-op: the prover
# reports pull-requests-unreadable and exits 1 without reading more evidence.
#
# AND ONE DEFERRAL. A declared reviewer still `pending` has not answered yet:
# measured, a reviewer posts `Review queued` then `Review in progress` before
# the verdict, up to seven statuses on one head. Judging the first would report
# a finding on 100% of pull requests, and a guard that fires every time gets
# deleted rather than read. The settled status fires its own event; a check
# run wakes this only once it has `completed`. A deferred run publishes
# nothing: the answer's own event wakes the run that publishes it.
#
# THE TWO ARMS COVER DIFFERENT HALVES. This one wakes on the reviewer's answer
# and catches a reviewer that ANSWERED HOLLOW. `review-evidence.yml` runs on the
# pull-request event and catches a reviewer that NEVER ANSWERED, which produces
# no status or check run and therefore no event here. Neither replaces the
# other.
#
# NOTHING RE-REQUESTS A REVIEW. Re-requesting OVERWRITES the existing status
# rather than adding to it, so under a throttle it destroys a real review,
# one-way. Do not add one.

name: 🕵️ Third-Party Review Evidence

on:
  status:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to inspect'
        required: true
        type: string

# A reviewer's words arrive by two routes: a status's description needs
# `statuses: read` (the status rollup drops it entirely), and a check run's
# summary needs `checks` — `write`, which includes reading, because the
# verdict is published as a check run on the head it judged.
# `pull-requests: read` finds the head pull request and its comments.
permissions:
  contents: read
  statuses: read
  checks: write
  pull-requests: read

# One run per event, head and reviewer. The reviewer and the event are part of
# the key as well as the commit, so neither another app's check run nor a
# pending status settling on the same head can cancel the run that is judging
# the reviewer's answer.
concurrency:
  group: third-party-review-evidence-${{ github.event_name }}-${{ github.event.check_run.head_sha || github.event.sha || inputs.sha }}-${{ github.event.check_run.name || github.event.context }}
  cancel-in-progress: true

jobs:
  evidence:
    name: 🕵️ Was this head reviewed, or reviewed for?
    # A pending status is the reviewer saying it has started, which is not yet
    # an answer. Judging it would report a finding on every pull request, and a
    # guard that fires every time gets deleted rather than read. A check run
    # wakes this only once completed, and a manual run always proceeds.
    if: github.event_name != 'status' || github.event.state != 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, so the step that proves the verdict and the step that
    # publishes it read one commit and one reviewer.
    env:
      # The commit and the reviewer come from whichever event woke the
      # run: a check run's head and name, or a status's commit and context.
      EVIDENCE_SHA: ${{ github.event.check_run.head_sha || github.event.sha || inputs.sha }}
      # Empty on the manual path, where nothing woke the run and every
      # declared reviewer is evaluated.
      EVIDENCE_CONTEXT: ${{ github.event.check_run.name || github.event.context }}

    steps:
      # No `ref:`. This checks out the default branch on `status` and
      # `check_run`, never the pull request's head — see the header.
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ vars.NODE_VERSION || '24.21.0' }}

      # The verdict is saved, with the prover's exit code, rather than ending
      # the job: the next step publishes it on the head it judged.
      - name: 🕵️ Prove review evidence, or a posted substitute, at this head
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          script=scripts/check-third-party-review-evidence.mjs
          if [ ! -f "$script" ]; then
            echo "::error title=Review-evidence prover missing::$script does not exist, so no review evidence was read for this commit. An absent prover is a FAILURE, never a skip — a job that passes because it found nothing to run with is the same false green this guard exists to refuse."
            exit 1
          fi
          verdict="$RUNNER_TEMP/third-party-review-verdict.json"
          status=0
          if [ -n "${EVIDENCE_CONTEXT:-}" ]; then
            node "$script" --sha="$EVIDENCE_SHA" --context="$EVIDENCE_CONTEXT" --json >"$verdict" || status=$?
          else
            node "$script" --sha="$EVIDENCE_SHA" --json >"$verdict" || status=$?
          fi
          echo "prover=$script" >>"$GITHUB_OUTPUT"
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
          echo "exit_code=$status" >>"$GITHUB_OUTPUT"

      # Publishes the saved verdict as a check run on EVIDENCE_SHA, or nothing
      # — saying why — when there is no pull request head to show it on or the
      # run cannot change the answer. Not `continue-on-error`: a refused or
      # impossible publish fails the job and prints GitHub's refusal, and so
      # does a prover that crashed or saved no verdict.
      - name: 🕵️ Publish the verdict on the head it judged
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROVER: ${{ steps.prove.outputs.prover }}
          VERDICT: ${{ steps.prove.outputs.verdict }}
          PROVER_EXIT: ${{ steps.prove.outputs.exit_code }}
        run: |
          set -eu
          node "$PROVER" --publish="$VERDICT" --prover-exit="$PROVER_EXIT" --sha="$EVIDENCE_SHA" --context="${EVIDENCE_CONTEXT:-}"
