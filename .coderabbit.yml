# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# This file is an OVERLAY on the organisation's web configuration, not a
# replacement for it — that is what `inheritance: true` means. So it should
# carry only what is a fact about THIS repository. Anything that would be
# identical in every repo is an org-level preference and belongs in the web
# console, where it also applies to repos that never take a Lisa release.
#
# Removed on 2026-08-16 and moved to org web settings — all of it inert if the
# console never re-creates it, which is why only this class was moved:
#
#   - the `tools:` block: fifteen linters disabled for PHP, Go, Swift, Kotlin,
#     C++ and other languages Lisa does not ship. Losing it means CodeRabbit
#     runs a Go linter over a repo with no Go in it, which finds nothing.
#   - review cosmetics: `poem`, `sequence_diagrams`, `in_progress_fortune`,
#     `collapse_walkthrough`, `estimate_code_review_effort`. Losing any of them
#     makes a review wordier, nothing more.
#
# DELIBERATELY NOT MOVED, though they could live at org level: the settings
# below that GATE a merge. `pre_merge_checks` at `mode: error` fails a pull
# request outright, and `request_changes_workflow` is what lets CodeRabbit post
# a blocking CHANGES_REQUESTED. Moving those is only safe once the web console
# demonstrably carries them; move them first and the failure is silent — merges
# start passing a gate nobody notices has stopped running. That is the exact
# shape of defect this repository keeps finding, so the enforcement half stays
# here until someone can point at the console entry that replaces it.
early_access: true
inheritance: true
reviews:
  # Everything under `plugins/` except `plugins/src/` is GENERATED — one edit to
  # a source rule fans the same content out into four or more agent-surface
  # mirrors. Left reviewable, the fan-out consumes CodeRabbit's 100-file review
  # budget and starves the source of review: measured on one integration branch,
  # 71 of 114 changed files were mirrors and CodeRabbit reported SUCCESS with
  # "Review skipped: 114 files exceed the limit of 100" on a REQUIRED context.
  # The larger the change, the more certain it was to go unreviewed.
  #
  # Excluding them loses nothing a reviewer could have caught. `🧩 Plugin
  # artifacts match source` is a required check that proves every mirror is
  # derivable from `plugins/src/`, so a mirror is the output of a generator CI
  # has already verified. `plugins/lisa*` cannot match `plugins/src`, which is
  # why the pattern is written that way rather than as an exclude-then-reinclude
  # pair whose precedence would have to be reasoned about.
  #
  # This is a fact about THIS repository's layout, not an org-level preference,
  # so it belongs here and not in the web console.
  path_filters:
    - '!plugins/lisa*/**'
    - '!plugins/materialized-artifacts.json'
  # Enforcement, not preference. See the header before moving these.
  request_changes_workflow: true
  auto_review:
    drafts: true
  pre_merge_checks:
    docstrings:
      mode: error
    title:
      mode: error
    description:
      mode: error
knowledge_base:
  code_guidelines:
    # Repo-specific path: Lisa's agent-facing guidance lives under .claude/.
    filePatterns:
      - '**/.claude/**/*'
issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true
    # `labeling_instructions` is an ALLOWLIST: when it is present CodeRabbit
    # suggests only from this list. That is the whole point of it being here —
    # the classification labels below are genuinely useful, and the lifecycle
    # family (`status:*`) is the one that must never be written by a bot.
    #
    # Measured five times on 2026-08-15, the fastest at EIGHT SECONDS, and once
    # over an explicit `status:in-progress` a human had applied moments earlier.
    # `status:done` is a TERMINAL role: the work-item gate refuses to bind or
    # validate against a terminal item, so each of those issues blocked its own
    # pull request until somebody noticed and stripped the label by hand.
    #
    # The reason it cannot be fixed with a faster/slower threshold is that the
    # label comes from a classifier with no view of whether work happened. It is
    # not a near-miss on an issue eight seconds old; it is the opposite of true.
    #
    # `human-needed` is deliberately absent too. Whether a human must rule on
    # something is a human's call, and Lisa applies it itself through the
    # `[lisa-human-gate]` marker at filing time.
    #
    # This block is the reason the file still exists. It is an allowlist over
    # THIS repository's label taxonomy, so it cannot move to org settings.
    labeling_instructions:
      - label: 'type:Bug'
        instructions: 'Apply when the issue reports incorrect behaviour in shipped code.'
      - label: 'type:Task'
        instructions: 'Apply to a single unit of work that is not a defect and not a user-facing story.'
      - label: 'type:Story'
        instructions: 'Apply when the issue describes user-facing behaviour to build.'
      - label: 'type:Improvement'
        instructions: 'Apply when the issue refines something that already works.'
      - label: 'type:Epic'
        instructions: 'Apply when the issue is a parent tracking several child items.'
      - label: 'type:Sub-task'
        instructions: 'Apply when the issue is a child of a larger tracked item.'
      - label: 'points:1'
        instructions: 'Apply for a trivial change, roughly one file and no new tests.'
      - label: 'points:2'
        instructions: 'Apply for a small change confined to one module.'
      - label: 'points:3'
        instructions: 'Apply for a change spanning a few modules with new tests.'
      - label: 'points:5'
        instructions: 'Apply for a change spanning several subsystems or needing design.'
      - label: 'points:8'
        instructions: 'Apply for a large change that should probably be split.'
      - label: 'component:ci'
        instructions: 'Apply when the issue concerns GitHub Actions workflows or CI configuration.'
      - label: 'component:cli'
        instructions: 'Apply when the issue concerns the Lisa command-line surface under src/cli.'
      - label: 'component:docs'
        instructions: 'Apply when the issue concerns documentation outside the wiki.'
      - label: 'component:doctor'
        instructions: 'Apply when the issue concerns lisa doctor or its checks.'
      - label: 'component:plugins'
        instructions: 'Apply when the issue concerns plugins/, agent plugins, hooks, or their generated variants.'
      - label: 'component:skills'
        instructions: 'Apply when the issue concerns skills or commands.'
      - label: 'component:tests'
        instructions: 'Apply when the issue concerns the test suites or their harnesses.'
      - label: 'component:wiki'
        instructions: 'Apply when the issue concerns wiki/ content.'
      - label: 'component:wiki-cli'
        instructions: 'Apply when the issue concerns the wiki command-line surface.'
      - label: 'repo:lisa'
        instructions: 'Apply to every issue filed in this repository.'
      - label: 'self-hardening'
        instructions: "Apply when the issue fixes a defect in Lisa's own guards, gates, or enforcement."
