# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)
#
# Keeps this project on the current Lisa release (CodySwannGT/lisa#4325).
#
# Once a day it compares the installed @codyswann/lisa with npm latest. When a
# newer release exists it opens ONE pull request on a `lisa/update-<version>`
# branch: the dependency bump plus the template changes Lisa applies for that
# version. Older update pull requests are closed as superseded, and auto-merge
# is armed so the update lands as soon as every required check passes. Nothing
# skips a check.
#
# The logic lives in `scripts/lisa-self-update.mjs`, which Lisa refreshes on
# every apply, so this file only needs to call it.
#
# ## Requires a `PAT` secret
#
# A pull request opened with the built-in GITHUB_TOKEN never starts the
# pull request's own CI — GitHub prevents workflows triggering workflows — so
# required checks would never run and auto-merge would never fire. Store a
# token that can push branches and open pull requests as the `PAT` secret.
#
# ## Optional: a standing work item
#
# If this project requires every change to reference a work item, set the
# repository variable `LISA_UPDATE_WORK_ITEM` (for example `org/repo#123` or
# `PROJ-123` for a "Keep Lisa current" ticket). Update commits then carry it as
# a `Work-Item:` trailer.
#
# Change the cron to suit; disable the workflow to opt out.
name: 🔄 Lisa Update

on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lisa-update
  cancel-in-progress: false

jobs:
  update:
    name: 🔄 Open a Lisa update pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the PAT secret
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error title=Lisa Update needs a PAT secret::This workflow opens a pull request that must run your normal checks, and pull requests opened with the built-in token never start them. Add a token that can push branches and open pull requests as the repository secret PAT, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      # Use the Bun the project pins in `engines.bun`, so the lockfile is
      # written by the same Bun the project's own CI uses.
      - name: Read the pinned Bun version
        id: bun
        run: |
          version=$(node -p "const v=(require('./package.json').engines||{}).bun||''; /^\d+\.\d+\.\d+$/.test(v)?v:''")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.bun.outputs.version != ''
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Configure the commit author
        run: |
          git config user.name 'lisa-update[bot]'
          git config user.email 'lisa-update@users.noreply.github.com'
      - name: Open the update pull request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LISA_UPDATE_WORK_ITEM: ${{ vars.LISA_UPDATE_WORK_ITEM }}
          # Local commit hooks are not the gate here: the pull request's own
          # CI runs every required check on these commits.
          HUSKY: '0'
          LEFTHOOK: '0'
        run: node scripts/lisa-self-update.mjs
