# Seeded by Lisa on first setup — this file is YOURS.
# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)

name: Review policy
run-name: Lisa review policy PR ${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.pull_requests[0].number || 'activity' }}

on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_run:
    workflows: [Review policy activity]
    types: [requested]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to inspect
        required: true
        type: string
      sha:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: read

concurrency:
  group: lisa-review-policy-${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.pull_requests[0].number || format('source-{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) }}
  cancel-in-progress: true

jobs:
  verdict:
    name: Evaluate review policy
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout governing source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ vars.NODE_VERSION || '24.21.0' }}
      - name: Evaluate and publish review policy
        id: evaluate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          script=scripts/review-policy-event.mjs
          if [ ! -f "$script" ]; then
            script=all/copy-overwrite/scripts/review-policy-event.mjs
          fi
          result="$(node "$script")"
          printf '%s\n' "$result"
          jq -r '.checks[] | "receipt=PR \(.pr) head \(.head) check \(.check) \(.conclusion)"' \
            <<< "$result" >> "$GITHUB_OUTPUT"
      - name: Review policy result ${{ steps.evaluate.outputs.receipt }}
        if: steps.evaluate.outputs.receipt != ''
        run: echo 'Recorded the native review-policy check.'
