# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.
# -----------------------------------------------------------------------------
# GitHub Issue Creation Workflow
# -----------------------------------------------------------------------------
# ⚠️ WARNING: THIS FILE IS AUTO-GENERATED. DO NOT EDIT MANUALLY! ⚠️
# Any changes may be overwritten by the generation process.
# This workflow creates a GitHub issue when another workflow fails.
# It deduplicates: if an open issue with the same title already exists, it
# comments the new run URL on that issue instead of filing a duplicate.
#
# In `mode: misconfiguration` it files a `lisa-misconfiguration` issue that
# names exactly which variables/secrets are missing for the tracker the
# project declared in .lisa.config.json, instead of a failure issue.
#
# Example usage in another workflow:
# ```yaml
# create_github_issue_on_failure:
#   if: failure()
#   uses: ./.github/workflows/create-github-issue-on-failure.yml
#   with:
#     workflow_name: 'My Workflow'
#     failed_job: 'build_and_test'
# ```

name: 🚨 GitHub Issue on Workflow Failure

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so create-github-issue-on-failure.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
      workflow_name:
        required: true
        type: string
        description: 'Name of the workflow that failed'
      tracking_action:
        required: false
        type: string
        default: ''
        description: 'Combined tracker action: create, refresh, or close'
      tracking_marker:
        required: false
        type: string
        default: ''
        description: 'Stable combined tracker ownership marker'
      tracking_title:
        required: false
        type: string
        default: ''
        description: 'Combined tracker title'
      tracking_body:
        required: false
        type: string
        default: ''
        description: 'Combined tracker body'
      tracking_id:
        required: false
        type: string
        default: ''
        description: 'Provider identity when already known'
      tracking_findings:
        required: false
        type: string
        default: '[]'
        description: 'Exact combined nightly suite findings'
      failed_job:
        required: false
        type: string
        description: 'Name of the job that failed (optional)'
      mode:
        required: false
        type: string
        default: 'failure'
        description: "'failure' files a workflow-failure issue; 'misconfiguration' files a tracker-misconfiguration issue"
      misconfig_tracker:
        required: false
        type: string
        default: ''
        description: 'The tracker declared in .lisa.config.json (misconfiguration mode only)'
      misconfig_missing:
        required: false
        type: string
        default: ''
        description: 'Newline-separated list of missing variables/secrets (misconfiguration mode only)'
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string
      working_directory:
        description: 'Directory to run commands in (if not root)'
        required: false
        default: ''
        type: string
    secrets:
      PAT:
        required: false
        description: 'Personal Access Token (optional, falls back to GITHUB_TOKEN)'

# Concurrency is managed by the parent workflow that calls this one
# This avoids deadlocks between parent and child workflows

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: create-github-issue-on-failure.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  create_issue:
    name: 📝 Create GitHub Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔖 Create or Update Issue
        if: inputs.tracking_action == ''
        uses: actions/github-script@v8
        env:
          MISCONFIG_MISSING: ${{ inputs.misconfig_missing }}
        with:
          github-token: ${{ secrets.PAT || github.token }}
          script: |
            // Get repository and run information
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            // Get workflow information from inputs
            const workflowName = ${{ toJSON(inputs.workflow_name) }};
            const failedJob = ${{ toJSON(inputs.failed_job) }} || 'Unknown';
            const mode = ${{ toJSON(inputs.mode) }} || 'failure';
            const misconfigTracker = ${{ toJSON(inputs.misconfig_tracker) }};
            const misconfigMissing = (process.env.MISCONFIG_MISSING || '')
              .split('\n')
              .map(line => line.trim())
              .filter(Boolean);

            let title;
            let body;
            let labels;

            if (mode === 'misconfiguration') {
              // Deterministic title so repeated failures dedupe into one issue.
              title = `🚨 Lisa misconfiguration: CI failure tickets cannot reach tracker "${misconfigTracker}"`;
              labels = ['lisa-misconfiguration', 'automation'];
              body = `
            ## Tracker misconfiguration

            This project's \`.lisa.config.json\` says work items belong in **${misconfigTracker}**, but the automation that files CI failure tickets cannot reach ${misconfigTracker} from GitHub Actions. Until this is fixed, CI failures will be reported here instead of in ${misconfigTracker}.

            ### What is missing

            ${misconfigMissing.map(item => `- ${item}`).join('\n            ')}

            ### How to fix it

            Add the missing repository variables/secrets under **Settings → Secrets and variables → Actions** (or re-run the tracker setup: \`/lisa:setup:jira\`, \`/lisa:setup:linear\`). If a secret is already set on the repository, the calling workflow may not be passing it through — its \`secrets:\` block must map the token explicitly (see the claude-*-auto-fix caller templates).

            ### The failure that triggered this report

            - **Workflow**: ${workflowName}${failedJob !== 'Unknown' ? ` (job: **${failedJob}**)` : ''}
            - **Workflow Run**: [View Run Details](${runUrl})
            - **Commit**: ${context.sha}
            `;
            } else {
              // Create standardized issue title and body
              title = `🚨 Workflow Failure: ${workflowName}${failedJob !== 'Unknown' ? ` - ${failedJob}` : ''}`;
              labels = ['bug', 'automation', 'ci-failure'];
              body = `
            ## Workflow Failure

            The "${workflowName}" workflow has failed${failedJob !== 'Unknown' ? ` in job: **${failedJob}**` : ''}.

            ### Details
            - **Workflow Run**: [View Run Details](${runUrl})
            - **Commit**: ${context.sha}
            - **Commit Message**: ${context.payload.head_commit ? context.payload.head_commit.message : 'N/A'}
            - **Triggered by**: ${context.actor}
            - **Failed at**: ${new Date().toISOString()}

            Please investigate the workflow logs for more details on the failure.
            `;
            }

            // A verdict-publishing step must not be able to change the verdict.
            //
            // This job is the *reporting* half of whatever it reports on. If it
            // cannot publish, the correct outcome is a loudly-surfaced inability
            // to publish — never a failed job, which would turn a green check red
            // for a reason that has nothing to do with the code under test.
            //
            // The concrete trigger: repositories that migrated to another tracker
            // commonly DISABLE GitHub Issues. Every misconfiguration branch of the
            // dispatcher routes here regardless, because this is the report of last
            // resort — "your declared tracker is unreachable" has to land somewhere.
            // On an Issues-disabled repo that write 401/404/410s, and the report
            // meant to tell you the tracker is broken becomes a second broken thing.
            const publishFailure = (reason, err) => {
              const detail = err ? `${err.status ?? ""} ${err.message ?? err}`.trim() : "";
              core.warning(
                `Could not publish this report to GitHub Issues on ${owner}/${repo}: ${reason}` +
                  (detail ? ` (${detail})` : "") +
                  ". The report is reproduced in this job's summary. NOT failing the job — " +
                  "an unpublishable report is not a failed check."
              );
              core.summary
                .addHeading("Unpublished failure report", 2)
                .addRaw(
                  `This report could not be written to GitHub Issues on \`${owner}/${repo}\`: ${reason}` +
                    (detail ? ` (${detail})` : "") +
                    ". It is reproduced in full below so it is not lost.\n\n"
                )
                .addHeading(title, 3)
                .addRaw(body)
                .write();
            };

            // Ask before writing. `has_issues` is the same field `gh repo view
            // --json hasIssuesEnabled` reports, and checking it first turns an
            // exception into a diagnosis.
            let issuesEnabled = true;
            try {
              const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
              issuesEnabled = repoInfo.has_issues === true;
            } catch (err) {
              // Could not determine. Fall through and let the write attempt decide,
              // rather than suppressing a report on a repo that may be fine.
              console.log(`Could not read repository settings: ${err.message ?? err}`);
            }

            if (!issuesEnabled) {
              publishFailure("GitHub Issues are disabled on this repository");
              return;
            }

            try {
              // Dedupe: comment on an existing open issue with the same title
              // instead of filing a duplicate. Titles are deterministic per
              // workflow+job, so one persistent breakage stays one issue.
              const { data: search } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open in:title ${JSON.stringify(title)}`,
                per_page: 10,
              });
              const existing = search.items.find(issue => issue.title === title);

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Recurred: [new failing run](${runUrl}) at ${new Date().toISOString()} (commit ${context.sha}).`,
                });
                console.log(`Deduped into existing issue #${existing.number}: ${runUrl}`);
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels,
                });
                console.log(`Issue created for workflow failure: ${runUrl}`);
              }
            } catch (err) {
              // Catch-all for the same reason as the pre-check: a missing PAT
              // scope, a rate limit, an org policy, or Issues disabled between the
              // check and the write. None of those are a failure of the thing
              // being reported on.
              publishFailure("the GitHub Issues API rejected the write", err);
            }

      - name: 📌 Reconcile combined nightly E2E tracker
        if: inputs.tracking_action != ''
        env:
          TRACKING_DESTINATION: github
          TRACKING_ACTION: ${{ inputs.tracking_action }}
          TRACKING_MARKER: ${{ inputs.tracking_marker }}
          TRACKING_TITLE: ${{ inputs.tracking_title }}
          TRACKING_BODY: ${{ inputs.tracking_body }}
          TRACKING_ID: ${{ inputs.tracking_id }}
          PROVIDER_TOKEN: ${{ secrets.PAT || github.token }}
          LISA_CONFIG_PATH: .lisa.config.json
          NIGHTLY_E2E_FINDINGS: ${{ inputs.tracking_findings }}
        run: node scripts/nightly-e2e-provider-action.mjs
