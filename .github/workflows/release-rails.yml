# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: Release (Rails)

on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Check for skip conditions
        id: skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Skip if last commit is a version bump
          if echo "$COMMIT_MSG" | grep -q "^chore(release):"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip promotion merges (environment branch → main) only on main
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ENV_BRANCHES="dev|staging"

            # Message-based detection: merge commits
            # Pattern: "Merge branch 'staging' into main"
            if echo "$COMMIT_MSG" | grep -qiE "^Merge branch ['\"]?($ENV_BRANCHES)['\"]? into"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Pattern: "Merge pull request #123 from org/staging"
            if echo "$COMMIT_MSG" | grep -qiE "^Merge pull request.*from .*/($ENV_BRANCHES)$"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Git-based detection: squash/fast-forward promotions
            for ENV_BRANCH in dev staging; do
              git fetch origin "$ENV_BRANCH" 2>/dev/null || continue
              if git merge-base --is-ancestor HEAD "origin/$ENV_BRANCH" 2>/dev/null; then
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          package-manager-cache: false
          node-version: '22'

      - name: Configure Git
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and cut an environment-scoped tag
        id: version
        if: steps.skip.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Bump VERSION and write the changelog, but do NOT let
          # standard-version cut the tag. Tags are repo-global while the
          # version counter in VERSION is branch-local, so a single clean
          # `vX.Y.Z` namespace shared by dev, staging and main means a version
          # cut on one branch collides with the same version cut on another —
          # and a promote or sync-back carries it across. `--skip.tag` moves
          # tag naming to the block below, which scopes it per environment.
          npx standard-version@9 --skip.tag

          VERSION=$(cat VERSION)

          # Only production cuts a clean `vX.Y.Z`. Every other environment cuts
          # a PRE-RELEASE tag `vX.Y.Z-<branch>.<epoch>`, so each branch has its
          # own tag namespace and cross-branch collisions are impossible
          # regardless of promote or sync timing.
          #
          # The suffix lives ONLY on the git tag. VERSION stays clean on every
          # branch, so standard-version's next-version computation — which
          # reads VERSION — is never fed a prerelease string.
          #
          # `/` is legal in a git ref but not in the `vX.Y.Z-<label>.<n>` shape
          # semver expects, so the branch is flattened for the label.
          case "$BRANCH" in
            main | master | prod | production)
              TAG="v${VERSION}"
              ;;
            *)
              LABEL=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.-' '-')
              TAG="v${VERSION}-${LABEL}.$(date +%s)"
              ;;
          esac

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Refuse a collision in this job rather than letting `git push` fail
          # on a rejected ref, which reports as a raw non-fast-forward and says
          # nothing about what to do. Reachable only on a production branch now
          # that every other environment carries a timestamp.
          git fetch origin --tags --quiet || true
          EXISTING=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Tag $TAG already exists on a different commit ($EXISTING). This branch's version counter has fallen behind the repo's tags — align VERSION past the latest existing tag."
            exit 1
          fi

          # Annotated, so `git push --follow-tags` carries it.
          if [ -z "$EXISTING" ]; then
            git tag -a "$TAG" -m "chore(release): $TAG"
          fi

      - name: Push changes
        if: steps.skip.outputs.skip != 'true'
        run: |
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git push --follow-tags origin ${{ github.ref_name }}

      - name: Create GitHub Release
        if: steps.skip.outputs.skip != 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Idempotent: a rerun after a partial failure finds the release
          # already created for this tag — reuse it instead of dying, which
          # would fail the release job and SKIP the deploy that depends on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
