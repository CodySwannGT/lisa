# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: Release (Rails)

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so release-rails.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
    secrets:
      DEPLOY_KEY:
        required: true

permissions:
  contents: write

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: release-rails.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Check for skip conditions
        id: skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)

          # Skip if last commit is a version bump
          if echo "$COMMIT_MSG" | grep -q "^chore(release):"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip promotion merges (environment branch → main) only on main
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ENV_BRANCHES="dev|staging"

            # Message-based detection: merge commits
            # Pattern: "Merge branch 'staging' into main"
            if echo "$COMMIT_MSG" | grep -qiE "^Merge branch ['\"]?($ENV_BRANCHES)['\"]? into"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Pattern: "Merge pull request #123 from org/staging"
            if echo "$COMMIT_MSG" | grep -qiE "^Merge pull request.*from .*/($ENV_BRANCHES)$"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Git-based detection: squash/fast-forward promotions
            for ENV_BRANCH in dev staging; do
              git fetch origin "$ENV_BRANCH" 2>/dev/null || continue
              if git merge-base --is-ancestor HEAD "origin/$ENV_BRANCH" 2>/dev/null; then
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          package-manager-cache: false
          node-version: '24.21.0'

      - name: Configure Git
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push over the deploy key, which may bypass branch protection.
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Bump, tag and push the release atomically
        id: version
        if: steps.skip.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Two merges can land on BRANCH seconds apart, and each one starts a
          # run of this job (CodySwannGT/lisa#4748). A caller's `concurrency`
          # group serializes or cancels the runs, but a run that does go ahead
          # can still find BRANCH has moved past its push-event SHA.
          #
          # The release is built ONLY on that trigger commit, because it is
          # the commit the caller's pre-deploy gates checked, and the deploy
          # after this job ships whatever the release covers. Releasing a tip
          # that moved would publish commits no gate looked at. When BRANCH
          # has moved, this run stands down and the run for the newer commit
          # — whose own gates check it — releases instead.
          #
          # The release commit and its tag go up in ONE atomic push: both refs
          # land or neither does. A plain `git push --follow-tags` updates
          # each ref on its own, so a branch rejected as non-fast-forward
          # still let its tag through. That orphaned the tag off the branch
          # and wedged every later release.
          TRIGGER_SHA=$(git rev-parse HEAD)
          REMOTE_BRANCH="+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          # Production cuts a clean `vX.Y.Z`. Every other environment cuts a
          # PRE-RELEASE tag `vX.Y.Z-<branch>.<epoch>`. Tags are repo-global
          # while the version counter in VERSION is branch-local, so one
          # `vX.Y.Z` namespace shared by dev, staging and main means a version
          # cut on one branch collides with the same version cut on another,
          # and a promote or sync-back carries it across.
          #
          # The suffix lives ONLY on the git tag. VERSION stays clean on every
          # branch, so standard-version's next-version computation — which
          # reads VERSION — is never fed a prerelease string. `/` is legal in
          # a git ref but not in a semver label, so the branch is flattened.
          #
          # TAG_RE matches exactly this branch's namespace, so a release tag
          # cut on another branch is never mistaken for one of ours.
          LABEL=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.-' '-')
          case "$BRANCH" in
            main | master | prod | production)
              TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
              ;;
            *)
              TAG_RE="^v[0-9]+\.[0-9]+\.[0-9]+-${LABEL//./\\.}\.[0-9]+\$"
              ;;
          esac
          tag_for() {
            case "$BRANCH" in
              main | master | prod | production)
                echo "v$1"
                ;;
              *)
                echo "v$1-${LABEL}.$(date +%s)"
                ;;
            esac
          }

          # The oldest release of THIS branch that already contains the
          # trigger commit, as "<commit> <tag>", or nothing. Only the
          # first-parent line counts — this job's release commits are pushed
          # straight onto BRANCH, so they always sit on it — and only a tag in
          # this branch's namespace counts, so a staging release promoted into
          # main (merged or fast-forwarded) is never taken for main's own.
          covering_release() {
            local commit tag
            for commit in $(git rev-list --first-parent --ancestry-path --reverse --grep='^chore(release):' "$TRIGGER_SHA..origin/$BRANCH"); do
              tag=$(own_release_tag "$commit")
              if [ -n "$tag" ]; then
                echo "$commit $tag"
                return 0
              fi
            done
          }

          # The tag in this branch's namespace that points at commit $1, or
          # nothing when $1 is not one of this branch's releases.
          own_release_tag() {
            local tag
            for tag in $(git tag --points-at "$1" --list 'v*'); do
              if [[ "$tag" =~ $TAG_RE ]]; then
                echo "$tag"
                return 0
              fi
            done
          }

          # The first patch version at or after $1 whose `v` tag is unused.
          next_free_version() {
            IFS=. read -r major minor patch <<< "$1"
            while git rev-parse -q --verify "refs/tags/v${major}.${minor}.${patch}" >/dev/null; do
              patch=$((patch + 1))
            done
            echo "${major}.${minor}.${patch}"
          }

          # Bump VERSION and write the changelog on top of HEAD, but do NOT
          # let standard-version cut the tag: tag_for scopes tag names per
          # environment. Sets VERSION and TAG.
          bump() {
            local base
            base=$(git rev-parse HEAD)
            npx standard-version@9 --skip.tag
            VERSION=$(cat VERSION)
            TAG=$(tag_for "$VERSION")
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              return 0
            fi
            case "$TAG" in
              *-*)
                echo "::error::Tag $TAG already exists. Re-run this job to cut a fresh pre-release tag."
                exit 1
                ;;
            esac
            # The production tag is taken by another commit — typically one an
            # earlier, non-atomic push orphaned. Refusing would fail every
            # later run as well, because VERSION on BRANCH never moves past it.
            # Advance to the next free patch instead; the scheme is unchanged.
            VERSION=$(next_free_version "$VERSION")
            echo "::warning::Tag $TAG is already taken by another commit; releasing $VERSION instead."
            git reset --quiet --hard "$base"
            npx standard-version@9 --skip.tag --release-as "$VERSION"
            TAG=$(tag_for "$VERSION")
          }

          # BRANCH moved past the gated commit: stand down, publishing nothing.
          # A workflow_dispatch would not help — it checks out the same tip,
          # and the skip step skips it again — so the remedy is a merge.
          superseded() {
            echo "::error title=Release superseded::$BRANCH has moved on to $1, past $TRIGGER_SHA, the only commit this run's checks covered. Releasing from $1 would let the deploy after this job ship changes those checks never looked at, so this run published nothing: no release commit and no tag, and later releases are not blocked. The run for $1 checks it and releases everything up to it. If that run is skipped, because $1 is a promotion merge or a release commit, these changes are released by the next ordinary merge to $BRANCH: merge any ordinary change to $BRANCH to release it."
            exit 1
          }

          git fetch --quiet --force --tags origin "$REMOTE_BRANCH"
          TIP=$(git rev-parse "origin/$BRANCH")

          # A concurrent run already released this commit: a release of this
          # branch, on its own line, contains it. Defer to it instead of
          # cutting a second release. Its tag is still reported, so a rerun
          # after a partial failure can finish the GitHub release.
          #
          # Only while the tip is itself one of this branch's releases (that
          # one or a later, gated one): the deploy after this job checks out
          # the tip, so deferring under an ordinary merge that has not been
          # released would ship that merge ungated.
          COVERING=$(covering_release)
          if [ -n "$COVERING" ]; then
            if [ -z "$(own_release_tag "$TIP")" ]; then
              superseded "$TIP"
            fi
            echo "Commit $TRIGGER_SHA was already released by ${COVERING% *} (${COVERING#* }); nothing to release."
            echo "deferred=true" >> $GITHUB_OUTPUT
            echo "tag=${COVERING#* }" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! git merge-base --is-ancestor "$TRIGGER_SHA" "$TIP"; then
            echo "::error::Commit $TRIGGER_SHA is no longer on $BRANCH (the branch was rewritten), so this run has nothing safe to release."
            exit 1
          fi
          if [ "$TIP" != "$TRIGGER_SHA" ]; then
            superseded "$TIP"
          fi

          git reset --quiet --hard "$TRIGGER_SHA"
          bump
          git tag -a "$TAG" -m "chore(release): $TAG"

          if ! git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"; then
            # There is no retry: a retry could only rebuild on a tip no gate
            # checked. Re-read BRANCH to say what happened.
            if ! git fetch --quiet origin "$REMOTE_BRANCH"; then
              git tag -d "$TAG" >/dev/null
              echo "::error title=Release push failed::The push of release $TAG to $BRANCH reported a failure, and re-reading $BRANCH failed too, so this run could not tell whether the release landed, another merge moved $BRANCH, or the remote refused the push. See the git errors above. Re-running this job is safe: it reuses the release if it landed and releases this commit if it did not."
              exit 1
            fi
            TIP=$(git rev-parse "origin/$BRANCH")
            # The server took the push but its reply was lost: BRANCH now IS
            # this release commit, and (atomic) the tag came with it.
            if [ "$TIP" = "$(git rev-parse HEAD)" ] \
              && git fetch --quiet --force origin "+refs/tags/$TAG:refs/tags/$TAG" \
              && [ "$(git rev-parse "$TAG^{commit}")" = "$TIP" ]; then
              echo "::notice title=Release push confirmed::git reported the push of $TAG as failed, but $BRANCH and $TAG on the remote both point at this release commit ($TIP), so the release landed."
            else
              # Neither ref landed; the local tag goes too.
              git tag -d "$TAG" >/dev/null
              if [ "$TIP" != "$TRIGGER_SHA" ]; then
                superseded "$TIP"
              fi
              echo "::error title=Release push refused::The push of release $TAG to $BRANCH was refused by the remote, and $BRANCH has not moved, so this is not a race with another merge. Check the git error above: the deploy key, a branch ruleset or pre-receive hook, or the network. Nothing was published: no release commit and no tag."
              exit 1
            fi
          fi

          echo "deferred=false" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        # Every path that lets the version step succeed sets `tag`: a new
        # release, or a deferral to a release already tagged in this branch's
        # namespace. The check only keeps a step that someday forgets from
        # calling `gh release` with an empty name.
        if: steps.skip.outputs.skip != 'true' && steps.version.outputs.tag != '' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Idempotent: a rerun after a partial failure finds the release
          # already created for this tag — reuse it instead of dying, which
          # would fail the release job and SKIP the deploy that depends on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
