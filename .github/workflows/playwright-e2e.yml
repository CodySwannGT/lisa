---
# The Playwright suite, as its own reusable workflow.
#
# It used to run as three jobs inside `quality.yml`, which coupled the heaviest
# and flakiest suite in a project to the lint/typecheck/unit gate: one
# workflow, one concurrency group, one cadence. Consumers worked around that by
# calling `quality.yml` and passing `skip_jobs` listing the two dozen jobs they
# did NOT want — an inversion the seeded caller itself describes as "a KNOWN-BAD
# SHAPE, carried because it is currently the only one that works", and which
# goes stale silently: a job added to `quality.yml` is absent from every
# consumer's hand-maintained list and therefore RUNS on a nightly whose whole
# point is that it runs one suite. Measured while that caller was written, the
# first project to adopt the shape was already missing five keys.
#
# This is the shape the native suite already has: one workflow, one purpose, and
# an environment prepared before it rather than cleaned up after it.
#
# ## Sequencing note
#
# `quality.yml` still contains its own copy of these jobs. Removing them there
# is a breaking change for every already-installed caller that tracks `@main`,
# so it happens only after the consumers have migrated to this workflow — the
# same "ship the caller migration FIRST" rule the permission-scope baseline
# enforces. Until then a consumer runs the suite in exactly one of the two
# places, chosen by which workflow it calls.
name: 🎭 Playwright Web E2E

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version used for the suite.
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: Package manager used to install dependencies.
        required: false
        default: npm
        type: string
      working_directory:
        description: Directory to run in, when the project is not at the root.
        required: false
        default: ''
        type: string
      moment:
        description: >-
          The gate moment this workflow's cadence corresponds to. It is what
          makes a `.lisa.config.json` declaration readable from here: a gate
          declared at `pull-request` is invisible at a nightly moment and vice
          versa, so a nightly suite and a per-change suite cannot be switched on
          by the same line of config by accident.
        required: false
        default: continuous:development
        type: string
      playwright_setup_command:
        description: >-
          Shell command run before the web export, in the job that runs the
          suite. Bake the target environment in here — an Expo export reads
          EXPO_PUBLIC_* at BUILD time, so anything set afterwards is invisible
          to the running app.
        required: false
        default: ''
        type: string
      playwright_shards:
        description: >-
          Split Lisa's BUILT-IN invocation across N runners. Does not apply once
          the `e2e-browser` gate resolves to a task: Lisa cannot append
          `--shard` to a command whose shape it does not know, and the `--`
          passthrough differs between npm, yarn and bun. A declared gate runs on
          one runner; shard inside the project's own `test:e2e` script instead.
        required: false
        default: 2
        type: number
      cache_build:
        description: >-
          Cache the Expo web export. Leave false unless the cache key has been
          checked against this project's layout: a key that misses the project's
          source directories freezes, the export then serves stale transforms,
          and every source change silently tests old code. A green suite over
          the previous commit is the worst failure this workflow has.
        required: false
        default: false
        type: boolean
      concurrency_group:
        description: >-
          Cross-run mutex on whatever this suite shares with the OTHER suites
          that touch the same backend. Join the native suite to the same group
          when the two share test accounts or fixtures — the pair of them is
          what has to be mutually excluded, and a stagger between their crons is
          a courtesy rather than the mechanism: a run first waits for a hosted
          runner, and that wait has been measured in hours.

          Must be DISTINCT from a calling workflow's own top-level concurrency
          group. A shared group between a parent run and the child run it is
          waiting on deadlocks.
        required: false
        default: ''
        type: string
      prepare_environment:
        description: >-
          Environment name to prepare before the suite, forwarded to Lisa's
          `environment:*` facade as `--env=<name>`. Empty (the default) prepares
          nothing and leaves behaviour unchanged.

          Reset-before rather than cleanup-after: cleanup does not run when a
          runner dies, is cancelled, or is evicted, so the next run would start
          against whatever the last failure left behind. Measured on a live
          consumer, the browser suite's cleanup ran as an `if: always()` step
          AFTER the suite, which is exactly that shape.
        required: false
        default: ''
        type: string
      prepare_verbs:
        description: >-
          Compatibility input for existing callers. Every prepared environment
          requires both reset and reseed; a subset fails before either command
          runs. A project with no fixture data implements environment:reseed as
          an explicit verified no-op rather than omitting the lifecycle step.
        required: false
        default: reset,reseed
        type: string
      prepare_setup_command:
        description: >-
          Shell command run after dependencies are installed and BEFORE the
          facade verbs, in the same job.

          Exists because the target environment is not always a runtime
          argument. A project may materialise it as a build-time fact — copying
          a gitignored `.env.local`, exporting a profile — and its
          `environment:reset` then refuses unless that file agrees with
          `--env`. That refusal is correct: the underlying sweeper defaults to
          a real environment when the file is absent, so "no target named" must
          never be read as "the default one". Without this seam the job checks
          out, installs, and runs a verb that has no way to know what it is
          pointed at.

          The direct analogue of `playwright_setup_command`, and needed for the
          same reason.
        required: false
        default: ''
        type: string
      prepare_timeout_minutes:
        description: >-
          Ceiling for the preparation job. Tight on purpose: it gates the whole
          suite, so a wedged reset should surface as a fast, named failure
          rather than spending the suite's budget first.
        required: false
        default: 20
        type: number

# Workflow-level and minimal. A called workflow may only DOWNGRADE its caller's
# grant, so a scope requested here that a caller does not hold is a
# `startup_failure` for the caller's ENTIRE run, decided before any `if:` is
# evaluated.
permissions:
  contents: read

# Queue, never cancel. A suite that drives shared test accounts and mutates
# their server-side state leaves that state wrong when killed mid-run, and
# poisons the next run rather than just losing this one. Mirrors the native
# suite so the two are configured the same way — that symmetry is the point,
# since the pair of them is what has to be mutually excluded.
concurrency:
  group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('lisa-playwright-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # ─── Which Lisa ran this ─────────────────────────────────────────────────
  # A CONSUMER RUNS TWO LISAS AT ONCE. Its `package.json` pins
  # `@codyswann/lisa` at a version and that pinned copy governs the local
  # pre-push gate; its CI calls this reusable workflow at a floating ref and
  # THAT governs everything below. So a push-gate observation and a CI
  # observation are claims about different code at different versions, and
  # knowing the pin says nothing about what CI ran.
  #
  # The consequence that made this a job rather than a note: a floating ref
  # means CI behaviour changes with NO COMMIT IN THE CONSUMING REPOSITORY, so a
  # true, well-evidenced warning about gate behaviour can go stale with nothing
  # in either repository able to notice. One such warning circulated for a day
  # after the behaviour it described had been repaired upstream. Nothing was
  # wrong with it except elapsed time, and no artifact carried a version the
  # claim could have been checked against.
  #
  # ITS OWN JOB, NOT A STEP INSIDE A GATE. Every gate job below can be skipped
  # by a plan, fail early, or stand down; a stamp inside one is present exactly
  # when that gate ran. This job has no `needs` and no `if`, so the identity is
  # on the run whether the gates passed, failed, or were optional.
  #
  # REPORT ONLY. It cannot fail a run and is not a branch-protection context:
  # a stamp that could redden CI would be a new gate nobody declared, shipped
  # to a fleet where every project reports.
  lisa_identity:
    permissions:
      contents: read
    name: 🔖 Which Lisa Ran This
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔖 Report which Lisa is running
        # Resolved through the same three-candidate search every gate job
        # below uses, in the same order, deliberately: the point of the stamp
        # is to name the copy that will actually produce the verdicts, and a
        # different search order would name a different file.
        #
        # `|| true` and `set -uo pipefail` without `-e`: the registry this
        # resolves is whatever copy the project happens to have installed, and
        # an older one exits non-zero on a subcommand it has never heard of.
        # A reporter that failed on that would be a required-looking red on
        # every project mid-upgrade.
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -uo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then
            # The wrapper's identity is all this path can honestly claim. It
            # deliberately does NOT render the full stamp with `unknown` in
            # every field, because that reads like a stamp that resolved and
            # found nothing rather than one that could not be produced.
            echo "::warning title=Lisa identity unavailable::This project ships no gate registry, so nothing can name the enforcement bytes that produced the reports below. The workflow that ran them is ${WORKFLOW_REF}@${WORKFLOW_SHA}."
            exit 0
          fi
          node "$RESOLVER" identity --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

  prepare:
    name: 🧼 Prepare Environment
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.prepare_timeout_minutes }}
    # Always runs in a wired run; the WORK is gated per-step. A job that skips
    # itself when an input is unset concludes `skipped`, and the nightly health
    # gate reads that as `incomplete_run` — which would turn every green
    # nightly into a blocked one for every adopter not using this seam.
    steps:
      - name: 🈳 No environment preparation configured
        if: ${{ inputs.prepare_environment == '' }}
        run: |
          echo "prepare_environment is unset; this workflow prepares nothing."
          echo "The suite runs against whatever state the environment is already in."

      - name: 📥 Checkout repository
        if: ${{ inputs.prepare_environment != '' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        if: ${{ inputs.prepare_environment != '' && inputs.package_manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not `latest`. This job runs a DESTRUCTIVE verb, and a
          # toolchain that can change without a commit is a change nobody
          # reviewed on the one path where that matters most. Matches the pin
          # every other job in this repository's workflows already uses.
          bun-version: '1.3.8'

      - name: 🔧 Setup Node.js
        if: ${{ inputs.prepare_environment != '' }}
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 📦 Install dependencies
        if: ${{ inputs.prepare_environment != '' }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *)
              echo "::error title=Unknown package_manager::'$PACKAGE_MANAGER' is not one of npm, yarn, pnpm, bun."
              exit 1
              ;;
          esac

      - name: 🔧 Prepare setup command
        # Runs BEFORE the verbs, after the install — the point at which a
        # build-time environment selection can still be materialised.
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_setup_command != '' }}
        run: ${{ inputs.prepare_setup_command }}

      - name: 🧼 Prepare the environment
        if: ${{ inputs.prepare_environment != '' }}
        env:
          TARGET: ${{ inputs.prepare_environment }}
          VERBS: ${{ inputs.prepare_verbs }}
        run: |
          set -eu
          PREPARE=""
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-environment-prepare.mjs" \
            "scripts/lisa-environment-prepare.mjs" \
            "all/copy-overwrite/scripts/lisa-environment-prepare.mjs"; do
            if [ -f "$candidate" ]; then PREPARE="$candidate"; break; fi
          done
          # Unresolvable is a FAILURE, never a skip. The caller asked for a
          # prepared environment; reporting success without having prepared one
          # is indistinguishable from a healthy run.
          if [ -z "$PREPARE" ]; then
            echo "::error title=Preparation script missing::lisa-environment-prepare.mjs was not found. Install or update @codyswann/lisa, or clear prepare_environment."
            exit 1
          fi
          node "$PREPARE" --env="${TARGET}" --verbs="${VERBS}"

  playwright_e2e_setup:
    name: 🎭 Journey Shard Setup
    runs-on: ubuntu-latest
    # Pure shell arithmetic — no checkout, no API. Needs no token at all.
    permissions: {}
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - name: 🧮 Compute shard matrix
        id: matrix
        run: |
          TOTAL="${{ inputs.playwright_shards }}"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -le 1 ]; then
            echo 'shards=[1]' >> "$GITHUB_OUTPUT"
            echo "Playwright sharding disabled (single runner)"
          else
            SHARDS=$(seq 1 "$TOTAL" | jq -Rn '[inputs | tonumber]' | tr -d '\n ')
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
            echo "Playwright sharding enabled across $TOTAL runners: $SHARDS"
          fi

  playwright_e2e:
    permissions:
      contents: read
    name: 🎭 Browser Journeys
    needs: [prepare, playwright_e2e_setup]
    runs-on: ubuntu-latest
    # 30 min was tight for downstream projects whose backend cold-start
    # tail latency drives shard runtime above ~25 min under workers=4
    # parallel-shard load. 60 min gives headroom for transient
    # backend-side latency spikes without masking genuine test hangs
    # (Playwright's per-test timeout still bounds those at 90s × 3
    # retries). Raise back down once downstream projects address their
    # backend-side root causes.
    timeout-minutes: 60
    # Result-gated on the preparation, on the same allowlist the native
    # workflow uses. `failure` and `cancelled` fall through to "do not start":
    # a suite against an environment nobody prepared produces failures nobody
    # can attribute.
    if: ${{ contains(fromJSON('["success", "skipped"]'), needs.prepare.result) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.playwright_e2e_setup.outputs.shards) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for Playwright config
        id: check_playwright
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✅ Playwright config found"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Playwright config found"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # ─── e2e-browser gate: which job runs the suite ──────────────────────
      # The `e2e-browser` gate is resolved in TWO places, and this is the
      # subordinate one. The canonical façade block — `id: gate`, covered by
      # the byte-identical drift assertions in
      # tests/integration/quality-gate-facade.test.ts — lives on
      # `playwright_e2e_aggregate`, because that is the job whose `name:` is
      # the branch-protection context `🎭 Browser Journeys` and the façade
      # contract requires the gated job to be the one that RUNS the task.
      # This job cannot be that job: it is a matrix, and a matrix rewrites its
      # own context name with a `(<shard>)` suffix.
      #
      # So the two paths split by job rather than by step:
      #
      #   gate NOT declared  → this sharded matrix runs Lisa's built-in
      #                        `npx playwright test --shard=…`, uploads blobs,
      #                        and the aggregate merges them. Byte-for-byte
      #                        what every installed caller does today.
      #   gate declared run  → this matrix does nothing, and the aggregate
      #                        runs the project's own task on ONE runner.
      #                        Sharding becomes the project's business, inside
      #                        its own task; Lisa cannot split a command it
      #                        does not know the shape of.
      #   gate declared off  → neither runs, and `contextsFor` drops the
      #                        required context from the same declaration, so
      #                        the two can never disagree.
      #
      # `id` is deliberately NOT `gate`: that id is what the drift assertions
      # enumerate, and they refuse a matrix job. The BODY is identical to the
      # canonical block modulo the id, which
      # tests/integration/quality-gate-e2e-browser.test.ts asserts as text.
      - name: 🎛️ Resolve the e2e-browser gate
        id: e2e_gate
        env:
          GATE_ID: e2e-browser
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔧 Playwright setup
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false' && inputs.playwright_setup_command != ''
        run: ${{ inputs.playwright_setup_command }}
        working-directory: ${{ inputs.working_directory || '.' }}

      # The web-export build below assumes an Expo project (`expo export`).
      # Non-Expo web projects (e.g. Vite/Phaser) build + serve themselves via
      # the Playwright config's `webServer`, so `expo export` is both wrong
      # (no Metro/Expo config → "No platforms are configured to use the Metro
      # bundler") and unnecessary. Detect Expo and gate the export/cache steps
      # on it; non-Expo projects skip straight to the browser install + test run.
      - name: 🔍 Detect Expo project
        id: check_expo
        run: |
          if [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ] \
            || { [ -f "package.json" ] && grep -q '"expo"[[:space:]]*:' package.json; }; then
            echo "is_expo=true" >> $GITHUB_OUTPUT
            echo "✅ Expo project detected — will run \`expo export\`"
          else
            echo "is_expo=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Non-Expo project — skipping \`expo export\` (Playwright webServer self-builds)"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Fingerprint of the inputs the build below depends on. Deliberately
      # ungated: the cache steps interpolate this output, and a skipped step
      # yields an empty string, which would silently collapse the cache key to
      # a constant rather than fail. It costs ~10ms, so it always runs.
      #
      # This replaces `hashFiles('**/src/**', '**/app/**', ...)`. Those patterns
      # are unanchored, so they also matched `node_modules/**/src/**`: measured
      # on AcmeOrgA/frontend, the glob enumerated 116,353 paths and hashed
      # 26,955 files out of node_modules against 1,305 real source files. The
      # runner caps one hashFiles call at 120 seconds, and on a slow runner it
      # blew through that — failing the job in the cache's POST step, AFTER
      # every test had already passed. Playwright nightly run 31574583191 went
      # red exactly that way, with 73/73 specs green and zero test failures.
      #
      # git only tracks checked-in files, so gitignored node_modules can never
      # enter the key, and the walk is O(tracked files) — 0.012s on the same
      # repo. `ls-files -s` emits each file's mode and blob SHA, so the digest
      # stays content-addressed exactly as hashFiles was, and `hash-object`
      # keeps it portable across runner OSes (no sha256sum/shasum split).
      #
      # Pathspecs are relative to the working directory, which is what the
      # `**/`-prefixed globs were approximating — and gets it right for a
      # nested working_directory instead of hashing every package in a monorepo.
      #
      # app.config.{js,ts} are included here but were absent from the old glob,
      # even though 🔍 Detect Expo project treats them as Expo config: changing
      # one used to restore a stale export.
      - name: 🔑 Fingerprint build inputs
        id: build_fingerprint
        run: |
          set -euo pipefail
          fingerprint=$(git ls-files -s -- \
            'bun.lock' 'bun.lockb' 'package-lock.json' 'yarn.lock' \
            'src' 'app' 'components' 'features' \
            'app.json' 'app.config.js' 'app.config.ts' 'package.json' \
            'babel.config.js' 'babel.config.ts' \
            'metro.config.js' 'metro.config.ts' 'tsconfig.json' \
            | git hash-object --stdin)
          echo "hash=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Build input fingerprint: $fingerprint"
        working-directory: ${{ inputs.working_directory || '.' }}

      # Expo build cache — opt-in via `cache_build: true`.
      #
      # Cache invalidation contract:
      #   Key is the build-input fingerprint computed above: lockfiles → source
      #   directories → config files. Any change to a lockfile, to
      #   src/app/components/features source, or to Expo/Metro/Babel/TS config
      #   misses the cache and forces a rebuild.
      #   Runner OS is part of the key to prevent cross-OS cache reuse.
      # Cached paths:
      #   - dist/             Expo web export output (consumed by Playwright)
      #   - .expo/            Expo CLI metadata and bundler cache
      #   - node_modules/.cache  Metro/Babel bundler caches
      - name: 💾 Restore Expo build cache
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false' && steps.check_expo.outputs.is_expo == 'true' && inputs.cache_build == true
        id: expo_cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ inputs.working_directory || '.' }}/dist
            ${{ inputs.working_directory || '.' }}/.expo
            ${{ inputs.working_directory || '.' }}/node_modules/.cache
          key: ${{ runner.os }}-expo-build-${{ steps.build_fingerprint.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-expo-build-

      - name: 🌐 Build web export
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false' && steps.check_expo.outputs.is_expo == 'true' && (inputs.cache_build != true || steps.expo_cache.outputs.cache-hit != 'true')
        run: npx expo export --platform web
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Expo build cache hit — skipping expo export
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false' && steps.check_expo.outputs.is_expo == 'true' && inputs.cache_build == true && steps.expo_cache.outputs.cache-hit == 'true'
        run: echo "::notice::Expo build cache hit — skipped \`npx expo export --platform web\`"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🎭 Install Playwright browsers
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false'
        run: npx playwright install --with-deps
        working-directory: ${{ inputs.working_directory || '.' }}

      # Matrix runs always emit blob reports — unsharded or sharded. The
      # matrix adds a `(<shard>)` suffix to the check context (e.g.
      # `🎭 Browser Journeys (1)`), so these shard-level checks are
      # distinct from the aggregator's unsuffixed context. `--shard=1/1` is
      # a no-op split (runs every test) and keeps a single command shape
      # regardless of `playwright_shards` value.
      #
      # `line` is paired with `blob` so a shard that never finishes still says
      # what it was doing. `blob` writes its file only when the run ENDS and
      # prints nothing to the console meanwhile, so a shard killed by the job
      # timeout produces no artifact AND no console output — the aggregator has
      # nothing to merge and the log names no test. Observed on
      # acmeorgb/frontend-v2, where shard 2 hit the 60-minute timeout on
      # three consecutive nightlies having printed only "Running 136 tests using
      # 2 workers, shard 2 of 4"; the hang could not be attributed to a test at
      # all, in any run. `line` streams progress to the console without
      # displacing the blob artifact the aggregator needs, so the next timeout
      # is self-diagnosing.
      - name: 🎭 Run Playwright tests
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false'
        run: npx playwright test --shard=${{ matrix.shard }}/${{ inputs.playwright_shards }} --reporter=blob,line
        working-directory: ${{ inputs.working_directory || '.' }}

      # Every shard uploads its blob report. The aggregator (below) always
      # runs and merges these into a single HTML report, so consumers keep
      # the same downstream artifact name — `playwright-report-<run-id>`.
      - name: 📤 Upload Playwright blob
        if: steps.check_playwright.outputs.has_config == 'true' && steps.e2e_gate.outputs.configured == 'false' && always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ inputs.working_directory || '.' }}/blob-report
          retention-days: 14

      - name: 🎭 Playwright Tests Skipped (no config)
        if: steps.check_playwright.outputs.has_config != 'true' && steps.e2e_gate.outputs.configured == 'false'
        run: |
          echo "::warning::Playwright E2E tests skipped - no playwright.config.ts or playwright.config.js found"
          echo "To enable Playwright testing, add a Playwright configuration file to your project"

      # Says out loud that this matrix deliberately did nothing, so a shard
      # that ran no tests is never mistaken for one that ran and passed. The
      # WORK is not lost — it moved to `playwright_e2e_aggregate`, which is
      # the job whose conclusion the required context reads.
      - name: ⏭️ Shard idle — the e2e-browser gate owns this suite
        if: steps.e2e_gate.outputs.configured != 'false'
        run: |
          echo "::notice::gates.e2e-browser is declared (${{ steps.e2e_gate.outputs.configured }}); the sharded matrix is idle and 🎭 Browser Journeys owns the run."

  # Aggregator: downloads every shard's blob report, merges into a single
  # HTML report, and uploads it as `playwright-report-<run-id>`.
  #
  # This job is the canonical "🎭 Browser Journeys" check for required-
  # status-check rulesets. Matrix shards each add a `(<N>)` suffix to their
  # contexts (non-blocking); this job has no matrix, so its check context
  # is `<caller>/🎭 Browser Journeys` (unsuffixed) and satisfies the
  # ruleset regardless of shard count. Runs always so the unsuffixed check
  # is emitted even when `playwright_shards = 1`.
  #
  # It is ALSO the `e2e-browser` gate façade job, and for the same reason: the
  # façade contract requires the job that runs the project's declared task to
  # be the job whose `name:` is the branch-protection context, and to carry no
  # matrix (a matrix rewrites its own context name). See the split documented
  # on `playwright_e2e`'s resolve step. On the fallback path this job merges
  # shard blobs exactly as it does today; on the configured path the shards are
  # idle and this job builds and runs the suite itself.
  playwright_e2e_aggregate:
    permissions:
      contents: read
    name: 🎭 Browser Journeys
    needs: [prepare, playwright_e2e]
    runs-on: ubuntu-latest
    # Was 10, which was sized for "download blobs and merge them". On the
    # configured path this job runs the whole suite, so it needs the same
    # headroom the shard job has. The fallback path still finishes in minutes;
    # a timeout is a ceiling, not a reservation.
    timeout-minutes: 60
    # `always()` so shard blobs still merge when a shard failed — that report
    # is the only diagnosis anyone gets. But NOT when the preparation failed:
    # on the gate-configured path this job RUNS THE SUITE itself, so an
    # unconditional `always()` here would run it against exactly the state the
    # preparation could not establish.
    if: ${{ always() && contains(fromJSON('["success", "skipped"]'), needs.prepare.result) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔍 Check for Playwright config
        id: check_playwright
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✅ Playwright config found"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Playwright config found — aggregator will skip merge"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔧 Setup Node.js
        if: steps.check_playwright.outputs.has_config == 'true'
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: steps.check_playwright.outputs.has_config == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.check_playwright.outputs.has_config == 'true'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # WHAT `configured=false` PRESERVES HERE. Lisa's built-in Playwright path
      # is not one command, it is a sharded matrix plus this merge, and the
      # fallback keeps every step of it untouched. That is why the steps below
      # carry `configured == 'false'` rather than being deleted: a caller that
      # has never heard of the `gates` block runs exactly what it ran before.
      #
      # WHAT `configured=true` BUYS. The project names its own task and this
      # job runs it, on one runner, with the same web export and browsers the
      # shard job would have built. Sharding is not carried across, and that is
      # a real trade rather than an oversight — Lisa cannot append `--shard` to
      # a command whose shape it does not know, and appending it through
      # `<runner> run <task> -- …` differs between npm, yarn and bun. A project
      # that needs shards either shards inside its own task or leaves the gate
      # undeclared and keeps `playwright_shards`.
      #
      # WHAT `off` MEANS. Nothing runs, on either job, and `contextsFor` drops
      # `🎭 Browser Journeys` from the derived required-context list off the
      # same declaration. The job still EXISTS and still reports — an `off`
      # declaration must empty a job, never skip it, because a skipped required
      # status check reports SATISFIED on GitHub.
      - name: 🎛️ Resolve the e2e-browser gate
        id: gate
        env:
          GATE_ID: e2e-browser
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=playwright-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      # ─── configured path: build what the suite needs, then run the task ──
      # Deliberately a REPEAT of the shard job's preparation rather than a
      # `needs:` on it. A `needs:` parent that fails leaves its dependents
      # SKIPPED, and a skipped required check counts as satisfied — the same
      # reason the resolve block is repeated per job instead of being hoisted.
      - name: 🔧 Playwright setup
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true' && inputs.playwright_setup_command != ''
        run: ${{ inputs.playwright_setup_command }}
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Detect Expo project
        id: check_expo
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true'
        run: |
          if [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ] \
            || { [ -f "package.json" ] && grep -q '"expo"[[:space:]]*:' package.json; }; then
            echo "is_expo=true" >> $GITHUB_OUTPUT
            echo "✅ Expo project detected — will run \`expo export\`"
          else
            echo "is_expo=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Non-Expo project — skipping \`expo export\` (Playwright webServer self-builds)"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # No cache branch on this path, unlike the shard job. The cache key there
      # is a fingerprint of build inputs, and a stale key silently serves an
      # old export — measured downstream, and the reason acmeorgb/frontend-v2
      # pins `cache_build: false`. A gate the project just opted into should
      # not inherit that hazard on day one.
      - name: 🌐 Build web export
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true' && steps.check_expo.outputs.is_expo == 'true'
        run: npx expo export --platform web
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🎭 Install Playwright browsers
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true'
        run: npx playwright install --with-deps
        working-directory: ${{ inputs.working_directory || '.' }}

      # A declared gate whose suite is ABSENT must be loud. The registry's
      # `work` field for e2e-browser is "specs run", and a Playwright task with
      # no config exits 0 having run nothing — a green check indistinguishable
      # on the pull-request page from one that ran the suite. Omitting the
      # declaration is the auditable way to have no browser gate; declaring it
      # against nothing is not.
      - name: 🚨 e2e-browser is declared but there is no Playwright config
        if: steps.check_playwright.outputs.has_config != 'true' && steps.gate.outputs.configured == 'true'
        run: |
          echo "::error::gates.e2e-browser is declared, but this project has no playwright.config.ts or playwright.config.js. A browser gate with no suite reports green having run nothing. Remove the declaration or add the suite."
          exit 1

      - name: 🎭 Run the e2e-browser gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split, as on every other façade job.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Playwright report
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: ${{ inputs.working_directory || '.' }}/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: 📥 Download all shard blob reports
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'false'
        uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.working_directory || '.' }}/all-blob-reports
          pattern: playwright-blob-${{ github.run_id }}-shard-*
          merge-multiple: true

      - name: 🎭 Merge blob reports into HTML
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'false'
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
        working-directory: ${{ inputs.working_directory || '.' }}

      # Uploaded under the original unsharded artifact name so downstream
      # consumers (GitHub Actions artifact downloads, Playwright report
      # viewers) don't need to change when a repo opts into sharding.
      - name: 📤 Upload merged Playwright report
        if: steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: ${{ inputs.working_directory || '.' }}/playwright-report
          retention-days: 14

      - name: 🎭 Playwright aggregator skipped (no config)
        if: steps.check_playwright.outputs.has_config != 'true' && steps.gate.outputs.configured == 'false'
        run: |
          echo "::notice::Playwright aggregator skipped — no playwright.config.ts or playwright.config.js found"

      # The aggregator uses `always()` so the merged HTML report is produced
      # even when shards fail (report is useful for triage). BUT
      # `playwright merge-reports` succeeds as long as the blobs themselves
      # merge, regardless of whether the underlying tests passed — so without
      # this guard the aggregator's conclusion can mask failing shards and
      # satisfy required-status-check rulesets on a red PR.
      #
      # `needs.playwright_e2e.result` aggregates the matrix shards:
      #   success  → every shard passed
      #   skipped  → playwright_e2e was skipped (no Playwright config)
      #   failure  → at least one shard failed
      #   cancelled → at least one shard was cancelled
      #   abandoned → runner was lost before the shard completed
      #
      # Fail the aggregator on anything other than success/skipped so the
      # `🎭 Browser Journeys` check accurately reflects shard health.
      #
      # Guard on has_config: when there is no Playwright config, no shard tests
      # ran, so an abandoned/cancelled shard job is not a test failure signal.
      - name: 🚨 Fail if any Playwright shard failed
        if: ${{ always() && steps.check_playwright.outputs.has_config == 'true' && steps.gate.outputs.configured == 'false' && needs.playwright_e2e.result != 'success' && needs.playwright_e2e.result != 'skipped' }}
        run: |
          echo "::error::Playwright shard matrix result is '${{ needs.playwright_e2e.result }}' — at least one shard did not pass"
          exit 1

      # An `off` declaration empties this job — every step above is conditioned
      # away. Say so, so that a green check whose log is blank is legible as a
      # decision rather than as a run that produced no output. It proves
      # nothing and can fail nothing, which is what an `off` gate is; the
      # required context is dropped by `contextsFor` from the same declaration.
      - name: ⏭️ e2e-browser declared off
        if: steps.gate.outputs.configured == 'off'
        run: |
          echo "::notice::gates.e2e-browser is declared off — no browser suite ran, and this context is not a required check."
