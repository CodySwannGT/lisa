# Generated by lisa-setup-automations from .lisa.config.json.
# Edit the config and regenerate; hand edits are overwritten.
name: 🔁 Lisa build-intake

on:
  # schedule: disabled until the production path is proven once for one
  # real item. Enabling adds:  - cron: '0 7 * * *'
  workflow_dispatch:

# Never cancel in progress. A cancelled dispatch can leave a remote task that
# was accepted but whose identifier was never recorded — irreversible work with
# nothing to reconcile against, where a retry duplicates it.
concurrency:
  group: lisa-build-intake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch one build-intake cycle
    if: github.repository == 'CodySwannGT/lisa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISA_SECRETS_SURFACE: github-actions

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Assert first, install second: a misconfigured bootstrap should fail in
      # seconds rather than after a toolchain download.
      - name: Check the bootstrap credential is configured
        env:
          BWS_ACCESS_TOKEN_lisa: ${{ secrets.BWS_ACCESS_TOKEN_lisa }}
        run: |
          set -euo pipefail
          test -n "${BWS_ACCESS_TOKEN_lisa}" || {
            echo "BWS_ACCESS_TOKEN_lisa is not configured for this repository" >&2
            exit 1
          }

      - name: Prepare the toolchain and secrets
        env:
          BWS_ACCESS_TOKEN_lisa: ${{ secrets.BWS_ACCESS_TOKEN_lisa }}
        run: bash scripts/lisa-remote-env/setup.sh

      - name: Run one build-intake cycle
        env:
          BWS_ACCESS_TOKEN_lisa: ${{ secrets.BWS_ACCESS_TOKEN_lisa }}
        run: |
          set -euo pipefail
          runner=""
          for candidate in \
            ".claude/skills/lisa-remote-dispatch/scripts/dispatch.mjs" \
            ".agents/skills/lisa-remote-dispatch/scripts/dispatch.mjs" \
            ".codex/skills/lisa-remote-dispatch/scripts/dispatch.mjs" \
            "node_modules/@codyswann/lisa/plugins/lisa/skills/lisa-remote-dispatch/scripts/dispatch.mjs"; do
            if [ -f "$candidate" ]; then runner="$candidate"; break; fi
          done
          if [ -z "$runner" ]; then
            echo "cannot find lisa-remote-dispatch/scripts/dispatch.mjs" >&2
            echo "Checked the agent skill directories and node_modules." >&2
            echo "Lisa skills reach Claude and Codex as an installed plugin," >&2
            echo "so node_modules is the only copy a runner ever has." >&2
            exit 1
          fi
          node "$runner" \
            'executionEnv=claude-web ' \
            --skill lisa-github-build-intake

      # The dispatcher authenticates with a credential that rotates on use, so
      # the replacement must be persisted even when the dispatch itself failed.
      - name: Persist any credential rotation
        if: ${{ always() }}
        env:
          BWS_ACCESS_TOKEN_lisa: ${{ secrets.BWS_ACCESS_TOKEN_lisa }}
        run: |
          set -euo pipefail
          runner=""
          for candidate in \
            ".claude/skills/lisa-secrets-access/scripts/rotate-secret.mjs" \
            ".agents/skills/lisa-secrets-access/scripts/rotate-secret.mjs" \
            ".codex/skills/lisa-secrets-access/scripts/rotate-secret.mjs" \
            "node_modules/@codyswann/lisa/plugins/lisa/skills/lisa-secrets-access/scripts/rotate-secret.mjs"; do
            if [ -f "$candidate" ]; then runner="$candidate"; break; fi
          done
          if [ -z "$runner" ]; then
            echo "cannot find lisa-secrets-access/scripts/rotate-secret.mjs" >&2
            echo "Checked the agent skill directories and node_modules." >&2
            echo "Lisa skills reach Claude and Codex as an installed plugin," >&2
            echo "so node_modules is the only copy a runner ever has." >&2
            exit 1
          fi
          node "$runner" \
            leases
