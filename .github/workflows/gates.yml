---
# The declared gates at ONE moment, as a reusable workflow.
#
# ## Why this exists
#
# The registry has always been able to say that a project gates its production
# deploy on a dynamic security scan:
#
# ```json
# "runtime-web-vulnerability": { "pre-deploy:production": "required" }
# ```
#
# `lisa-gates.mjs validate` accepted it, `list --moment=pre-deploy:production`
# printed it, and NOTHING ANYWHERE EXECUTED IT. Three gates
# (`runtime-web-vulnerability`, `load-capacity`, `accessibility`) are legal ONLY
# in the `pre-deploy` / `post-deploy` / `continuous` families, and thirty-nine of
# the forty-one are legal at `pre-deploy` — so the missing executor was not a
# three-gate corner, it was every gate a project might want to hold a release on.
# That is precisely the shape the registry's own header refuses: "a declared
# guarantee that never runs", reached not through a typo'd moment (which is
# refused) but through a LEGAL moment with no runner.
#
# The runner already existed. `lisa-run-gates.mjs --moment=<moment>` resolves and
# executes whatever a moment declares, at any moment, and has done since the
# hooks were converted. What did not exist was a CALLER at a deploy or scheduled
# moment. This workflow is that caller, and it is deliberately moment-generic:
# `pre-deploy:production` before a release, `post-deploy:staging` after one, and
# `continuous:<env>` from a schedule are the same operation with a different
# argument, and giving each its own workflow would give each its own bugs.
#
# ## Running is not recording
#
# The registry has shipped an evidence envelope — `EVIDENCE_FIELDS` and a
# `readEvidence` reader that demotes stale or work-less evidence to `unknown` —
# since the `continuous` family was added, with NO producer anywhere. The reader
# existed and nothing wrote, so a `pre-deploy:production` gate that wanted a
# RECENT `continuous:staging` result had nothing to resolve against. A freshness
# requirement resolving against nothing reports satisfied while proving nothing,
# which is the failure this whole façade exists to refuse.
#
# So the runner is now asked to record (`--evidence=<file>`), the record is
# verified before this job ends, and it is published as a workflow artifact
# named `lisa-gate-evidence-<moment>-<job>-<attempt>`.
#
# The envelope is `lisa.gate-evidence/v1`, the schema shared with #3013's
# release verifier — two producers, ONE schema, because two evidence formats
# for one property is this repository's recurring defect. It answers three
# separate questions, and a reader that could only answer one of them would
# credit evidence about something else:
#
#   * `subject` — WHAT was observed. `tree` is the identity and `commit` is
#     evidentiary, because two commits legitimately share a tree after a rebase
#     and that is exactly when reuse is sound.
#   * `contract` — UNDER WHICH RULES. The moment, the digest of the RESOLVED
#     PLAN (not the config file: the plan captures `shippedAs` alias resolution,
#     which changes which command proved the gate), the registry version, and
#     `workflow_ref` / `workflow_sha` / `inputs_digest`. Those last three are
#     NOT redundant with the tree: consumers call this workflow at `@main`, so
#     its contents can change with no change to the caller's tree, and tree
#     identity alone would let an older, weaker workflow's evidence satisfy a
#     stricter one.
#   * `producer` — WHO ran it, including `reused_gates`, emitted empty from day
#     one. It exists to close circular reuse: a run that reuses evidence and
#     then emits its own envelope could be reused in turn, and the chain of
#     proof bottoms out on nothing. This runner never reuses, so the list is
#     empty by construction.
#
# Two readers, one written and one named:
#
#   * this workflow, immediately. A run that reported a verdict and recorded
#     NOTHING fails, because a missing record and a clean record must not look
#     the same. That is the only way the recorder itself is falsifiable.
#   * CodySwannGT/lisa#3013's release verifier, which reuses exact-tree quality
#     evidence. It keys on `contract.moment` and refuses to satisfy a
#     `pre-deploy:*` gate with a `pull-request` envelope regardless of tree
#     match, so the two producers never compete.
#
# `producer.caller_chain` records null here rather than a literal. The only
# truthful derivation is `postedCallerChains` over a completed run's check-run
# names, which needs API scope this workflow does not have — and a verifier
# reads a null chain as ineligible and reruns, which is the safe direction. A
# caller that CAN read them states the answer in
# `LISA_GATE_EVIDENCE_CALLER_CHAIN`.
#
# ## What this envelope is NOT
#
# It is an EMITTER's claims about its own run, and nothing here corroborates
# them against GitHub's own ledger of what the run posted. #3013's verifier
# refuses an envelope carrying no corroboration block for exactly that reason —
# an unjoined envelope is self-signed. These deploy-moment envelopes carry none,
# so nothing may consume one AS PROOF without an equivalent corroboration step
# first. Today nothing consumes them: they are a record for an operator and for
# this job's own falsifiability.
#
# `contract.inputs_digest` is likewise NOT comparable with the one #3013's
# pull-request producer emits. Both use the same canonicaliser, but that
# producer digests a CLASSIFIED SUBSET of its 22 inputs — `skip_jobs` differs
# between the pull-request and release paths on the same tree, and excluding it
# is what keeps every reuse attempt from dying on a mismatch that proves
# nothing. This workflow digests its whole input context, which is safe HERE
# because the seven inputs are stable across runs a reader would compare (the
# moment partition already separates the ones where `ref` differs). A consumer
# that ever compares digests ACROSS moments must classify first; it must not
# assume these two numbers mean the same thing.
#
# What is NOT built here is the cross-run consumer — a `pre-deploy` gate reading
# a prior `continuous` run's envelope — and the reason is mechanical rather than
# a matter of taste. Reading another run's artifact needs `actions: read`, and a
# reusable workflow's token can only be DOWNGRADED from its caller's, so this
# workflow cannot grant itself that scope: every consumer would have to widen
# its own caller first. That is a migration, and it belongs with the verifier in
# #3013 rather than ahead of it.
#
# ## Green here is a claim, so every exit code is routed deliberately
#
# The failure this workflow must never have is passing while nothing ran. A
# deploy gate that SKIPS when it cannot prove anything is worse than no gate: the
# release ships and the run is green, which is a lie told by a control installed
# to prevent exactly that. So:
#
#   * `0`  PROVED        — every required gate at this moment passed. Proceed.
#   * `1`  BLOCKED       — a required gate failed, or resolved to no prover and
#                          is therefore UNPROVABLE. Stop. This is the one the
#                          issue asks for: a gate declared `required` at a deploy
#                          moment with no executor FAILS, it does not skip.
#   * `78` NO_GATES      — the project has no gates block at all. It has not
#                          adopted the registry, so this workflow must not invent
#                          a verdict for it: proceed, exactly as before.
#   * `70` RUNNER_FAILED — the runner could not run. Nothing was proved. The
#                          hooks fall back to hardcoded steps here; a deploy has
#                          no hardcoded steps to fall back to, so this FAILS
#                          CLOSED rather than shipping on an unread config.
#   * anything else      — including a kill (137/143). Unknown is not proved.
#
# A missing resolver is the same judgement as `70`. A caller reaches this
# workflow only by writing a `uses:` line, which is an explicit request to be
# gated; answering that request with a silent pass would make the request
# unfalsifiable.
name: 🚦 Declared Gates

on:
  workflow_call:
    inputs:
      moment:
        description: >-
          Which moment's declarations to run, e.g. `pre-deploy:production`,
          `post-deploy:staging`, `continuous:development`. An unrecognised value
          is REFUSED by the runner rather than resolving to nothing: a moment is
          looked up as a key on each gate, so a typo would otherwise match
          nothing and report a clean run having executed zero gates.
        required: true
        type: string
      node_version:
        description: Node.js version used to run the gates.
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: Package manager used to install dependencies (npm, yarn, bun).
        required: false
        default: npm
        type: string
      working_directory:
        description: Directory to run in, when the project is not at the root.
        required: false
        default: ''
        type: string
      install_dependencies:
        description: >-
          Install the project's dependencies before running the gates. A gate's
          prover is a package script, so the default is yes. Turn it off only for
          a project whose deploy-moment provers are self-contained.
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: >-
          Budget for the whole gate run. Deploy-moment provers are the costly
          ones — a DAST scan and a load profile are minutes each — so this is
          generous by default and must be raised, never lowered, for a project
          whose provers exceed it. A killed run is reported as UNKNOWN and fails
          closed; it is not a pass.
        required: false
        default: 60
        type: number
      ref:
        description: >-
          Commit-ish to check out. Defaults to the caller's ref. A post-deploy
          run should pass the SAME ref the deploy shipped, or it proves a
          property of a tree that was never released.
        required: false
        default: ''
        type: string

# Reusable-workflow tokens can only be DOWNGRADED relative to the caller's
# grant, never escalated, so this floor is safe for every consumer. Nothing here
# writes to the repository or the API.
permissions:
  contents: read

jobs:
  gates:
    name: 🚦 Gates
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: 📥 Install dependencies
        if: inputs.install_dependencies
        working-directory: ${{ inputs.working_directory || '.' }}
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      # ─── The façade ───────────────────────────────────────────────────────
      # Three candidate paths, in the same order every other Lisa workflow
      # resolves them: the installed package first (the copy a consumer gets),
      # then the project's own `scripts/` copy, then the in-repo template (which
      # is how Lisa gates ITSELF — it ships the file rather than installing it).
      - name: 🚦 Run the gates declared at this moment
        id: gates
        working-directory: ${{ inputs.working_directory || '.' }}
        env:
          GATE_MOMENT: ${{ inputs.moment }}
          # The normalised inputs, digested into the envelope's `contract`. The
          # same workflow at the same sha proves DIFFERENT things when handed a
          # different `working_directory` or `install_dependencies`, so a
          # reader comparing workflow identity alone would credit a weaker run.
          # `toJSON(inputs)` is the whole context, defaults applied, so nothing
          # here has to be kept in step with the `workflow_call` block by hand.
          LISA_GATE_EVIDENCE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -uo pipefail

          RUNNER=""
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-run-gates.mjs" \
            "scripts/lisa-run-gates.mjs" \
            "all/copy-overwrite/scripts/lisa-run-gates.mjs"; do
            if [ -f "$candidate" ]; then RUNNER="$candidate"; break; fi
          done
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"

          if [ -z "$RUNNER" ]; then
            echo "::error title=Gate runner missing::No lisa-run-gates.mjs was found, so the gates declared at $GATE_MOMENT could not be run. Nothing was proved. This workflow fails closed rather than letting a deploy proceed on an unread configuration."
            exit 1
          fi

          # Outside the working tree, deliberately. The envelope is a record
          # ABOUT the tree, and writing it INTO the tree would make the next
          # gate at this moment measure a file this one created — a recorder
          # that perturbs its own subject. `RUNNER_TEMP` is set by GitHub; the
          # fallback keeps the step runnable outside Actions.
          EVIDENCE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/lisa-gate-evidence.json"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"

          echo "Running gates declared at $GATE_MOMENT with $RUNNER"
          # `|| STATUS=$?`, never a bare call followed by `$?`. GitHub runs a
          # `run:` block as `bash -e`, which aborts the step on the FIRST
          # nonzero command — so a bare call means the routing below is dead
          # code, reached only when the runner succeeds. Its worst consequence
          # is not the missing diagnosis: it is exit 78, NO_GATES, which means
          # "this project has no gates block". Under `-e` that aborts, and every
          # consumer that never adopted the registry gets a FAILED deploy from a
          # workflow whose entire promise is that it changes nothing for them.
          # `|| ...` is a tested condition, which `-e` exempts.
          STATUS=0
          node "$RUNNER" --moment="$GATE_MOMENT" --evidence="$EVIDENCE" \
            || STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          case "$STATUS" in
            0)
              echo "::notice title=Gates proved::Every gate declared required at $GATE_MOMENT passed."
              echo "✅ Gates at \`$GATE_MOMENT\`: every required gate passed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            78)
              # NO_GATES: this project has no gates block. It has not adopted the
              # registry, and inventing a verdict for it would change behaviour
              # for a project that declared nothing. Today's behaviour, preserved.
              echo "::notice title=No gates declared::This project has no gates block, so nothing was declared at $GATE_MOMENT and nothing was run. Behaviour is unchanged."
              echo "➖ Gates at \`$GATE_MOMENT\`: this project has no gates block; nothing ran." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            1)
              echo "::error title=Gate failed at $GATE_MOMENT::A gate declared required at $GATE_MOMENT was not proved. The runner named which one and why in the log above. Nothing downstream of this job runs."
              echo "🛑 Gates at \`$GATE_MOMENT\`: a required gate was not proved. See the job log for which gate and why." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            70)
              echo "::error title=Gate runner failed::The gate runner could not run at $GATE_MOMENT, so nothing was proved. A hook would fall back to its built-in steps here; a deploy has none, so this fails closed."
              echo "🛑 Gates at \`$GATE_MOMENT\`: the runner could not run. Nothing was proved." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              # Includes 137/143 — a killed run. An unknown answer is not a
              # proved one, and a budget overrun that read as a pass would be
              # the exact defect this subsystem exists to refuse.
              echo "::error title=Gate run ended unrecognisably::The gate runner exited $STATUS at $GATE_MOMENT, which is not one of its documented codes (0/1/70/78). 137 and 143 mean the run was KILLED, not that it failed a check. Either way nothing was proved, so this fails closed."
              echo "🛑 Gates at \`$GATE_MOMENT\`: the runner exited $STATUS. Nothing was proved." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      # ─── The record ───────────────────────────────────────────────────────
      # Running is not recording. Before this step existed, a deploy-moment run
      # executed its gates and left nothing behind, so a `pre-deploy:production`
      # gate that wanted a RECENT `continuous:staging` result had nothing to
      # resolve against — and a freshness requirement resolving against nothing
      # reports satisfied while proving nothing, which is the exact failure the
      # gate façade exists to refuse (CodySwannGT/lisa#3022).
      #
      # `always()`, because the run that most needs a record is the one that
      # failed. This step never turns a failed job green: it can only add a
      # failure, and the gate step's own exit code stands.
      - name: 🧾 Verify the run recorded what it proved
        id: evidence
        if: always()
        env:
          GATE_MOMENT: ${{ inputs.moment }}
          GATE_STATUS: ${{ steps.gates.outputs.status }}
          GATE_RUNNER: ${{ steps.gates.outputs.runner }}
          GATE_EVIDENCE: ${{ steps.gates.outputs.evidence }}
        run: |
          set -uo pipefail

          SLUG=$(printf '%s' "$GATE_MOMENT" | tr -c 'A-Za-z0-9._-' '-')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "recorded=false" >> "$GITHUB_OUTPUT"

          if [ -z "${GATE_RUNNER:-}" ]; then
            echo "::notice title=No evidence expected::The gate step never resolved a runner, so there is nothing to have recorded. That step has already failed this job."
            exit 0
          fi

          # A CONSUMER ON AN OLDER LISA IS NOT A DEFECT.
          #
          # This workflow is referenced as `@main`, so a repository picks up
          # this step the moment it is merged — while the runner it resolves
          # comes from its INSTALLED package, which may predate `--evidence`.
          # An older runner ignores the flag and writes nothing, and failing
          # that repository would turn a workflow whose promise is "records
          # more" into one that breaks every consumer that has not bumped.
          # Probed on the resolved file rather than assumed from a version.
          if ! grep -qF 'lisa.gate-evidence/v1' "$GATE_RUNNER"; then
            echo "::notice title=Runner too old to record evidence::$GATE_RUNNER predates gate-evidence recording, so this run proved its gates but recorded nothing. Update @codyswann/lisa to record what deploy-moment gates prove."
            echo "ℹ️ Gates at \`$GATE_MOMENT\`: this project's gate runner predates evidence recording; nothing was recorded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 0, 1 and 78 are the codes on which the runner REACHED a verdict, and
          # each one goes through the recorder. 70 and a kill mean it did not
          # get that far, and the gate step has already failed the job for it.
          case "${GATE_STATUS:-}" in
            0|1|78) ;;
            *)
              echo "::notice title=No verdict to record::The gate runner exited ${GATE_STATUS:-<none>} without reaching a verdict, so no envelope was expected."
              exit 0
              ;;
          esac

          if [ ! -f "$GATE_EVIDENCE" ]; then
            echo "::error title=Gates recorded nothing::The gate runner reported a verdict at $GATE_MOMENT (exit $GATE_STATUS) and wrote no evidence envelope. A missing record and a clean record must not look the same, so this fails rather than reporting all-clear."
            echo "🛑 Gates at \`$GATE_MOMENT\`: a verdict was reported and NOTHING was recorded." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Read with a real parser, never with grep. The envelope must bind to
          # THIS moment: an envelope left over from another run, or one naming a
          # different subject, is evidence of one thing read as evidence of
          # another — the failure the subject binding exists to prevent.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolve } from "node:path";
            import { pathToFileURL } from "node:url";
            const path = process.env.GATE_EVIDENCE;
            const moment = process.env.GATE_MOMENT;
            const doc = JSON.parse(readFileSync(path, "utf8"));
            if (doc.schema !== "lisa.gate-evidence/v1") {
              throw new Error(`schema is ${JSON.stringify(doc.schema)}, not "lisa.gate-evidence/v1"`);
            }
            if (doc.contract?.moment !== moment) {
              throw new Error(`envelope is about ${JSON.stringify(doc.contract?.moment)}, not ${JSON.stringify(moment)}`);
            }
            // An unrecognised verdict is REFUSED, not ignored — the same rule
            // the schema token gets, and for the same reason. A value one
            // producer adds would otherwise read as ABSENT to another, and
            // absent is the one thing that must never be mistaken for proved.
            // The vocabulary is imported from the runner that wrote the file
            // rather than restated here, so the two cannot drift apart; the
            // module has an invoked-as-script guard, so importing runs nothing.
            const { EVIDENCE_VERDICT } = await import(pathToFileURL(resolve(process.env.GATE_RUNNER)).href);
            const known = Object.values(EVIDENCE_VERDICT);
            if (!known.includes(doc.verdict)) {
              throw new Error(`verdict is ${JSON.stringify(doc.verdict)}, which is not one of: ${known.join(", ")}`);
            }
            const rows = Array.isArray(doc.gates) ? doc.gates : null;
            if (rows === null) throw new Error("envelope records no gates array");
            const tally = rows.reduce((counts, row) => ({ ...counts, [row.status]: (counts[row.status] ?? 0) + 1 }), {});
            const summary = Object.entries(tally).map(([status, count]) => `${count} ${status}`).join(", ");
            process.stdout.write(
              `🧾 Gates at \`${moment}\`: recorded ${rows.length} observation(s) — ${summary || "none"} — verdict \`${doc.verdict}\`, tree \`${doc.subject?.tree ?? "unknown"}\`, gates \`${doc.contract?.gates_digest ?? "unknown"}\`, observed at ${doc.observed_at}.\n`
            );
          ' >> "$GITHUB_STEP_SUMMARY" || {
            echo "::error title=Gate evidence unreadable::The envelope at $GATE_EVIDENCE could not be read as evidence about $GATE_MOMENT. An unreadable record is not a record, so this fails rather than reporting all-clear."
            exit 1
          }

          echo "recorded=true" >> "$GITHUB_OUTPUT"

      # Kept even for a failed run, and especially then: the envelope for a
      # BLOCKED moment is what tells a later reader that the property was
      # observed and found wanting, rather than never observed at all.
      - name: 📤 Publish the gate evidence envelope
        if: always() && steps.evidence.outputs.recorded == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: >-
            lisa-gate-evidence-${{ steps.evidence.outputs.slug }}-${{
            github.job }}-${{ github.run_attempt }}
          path: ${{ steps.gates.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90
