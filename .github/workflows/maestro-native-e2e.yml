# Maestro Native E2E — reusable workflow
#
# Native (iOS + Android) e2e suite on GitHub-hosted runners: an Android
# emulator on ubuntu-latest and an iOS simulator on macos-15. This is the
# self-hosted sibling of quality.yml's maestro_e2e job, which only supports
# Maestro Cloud and needs a paid mobile.dev account (MAESTRO_API_KEY). This
# workflow needs only EXPO_TOKEN: binaries are built by EAS with a dedicated
# e2e profile (default `dev-e2e` in the project's eas.json — typically a
# non-dev-client build against the dev backend, analytics capture disabled,
# and its own update channel so the app never pulls an OTA over the code
# under test).
#
# Cadence lives in the CALLER (schedule in a reusable workflow would fire in
# the Lisa repo, not the project). Projects get a thin caller template with a
# nightly cron + workflow_dispatch platform picker; see
# expo/create-only/.github/workflows/maestro-e2e.yml.
#
# Environment contract: forwarded to the flows as `-e` variables are (1)
# every key declared in the `maestro_env` input, (2) every key declared in
# the MAESTRO_SECRET_ENV secret (same KEY=VALUE format, for sensitive values
# like test-account passwords — GitHub masks each line in logs), and (3)
# every env var named MAESTRO_* after `setup_command` has run. Values must
# not contain whitespace. The platform app id inputs are forwarded as
# MAESTRO_APP_ID per platform (they may legitimately differ — e.g. `app_dev`
# on Android vs `app-dev` on iOS).
#
# Graceful degradation: when EXPO_TOKEN is not provisioned or the flows
# directory does not exist, every job skips with a warning instead of
# failing, so this workflow is safe to install fleet-wide before a project
# has wired its e2e harness.

name: 📱 Maestro Native E2E

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform(s) to run: all, android, or ios'
        required: false
        default: 'all'
        type: string
      eas_profile:
        description: 'EAS build profile for the e2e binaries (must exist in eas.json)'
        required: false
        default: 'dev-e2e'
        type: string
      flows_dir:
        description: 'Maestro flows directory'
        required: false
        default: '.maestro/flows'
        type: string
      android_app_id:
        description: 'Android application id, forwarded to flows as MAESTRO_APP_ID'
        required: false
        default: ''
        type: string
      ios_app_id:
        description: 'iOS bundle identifier, forwarded to flows as MAESTRO_APP_ID'
        required: false
        default: ''
        type: string
      android_exclude_tags:
        description: 'Comma-separated flow tags to exclude on Android'
        required: false
        default: 'ios-only'
        type: string
      ios_exclude_tags:
        description: 'Comma-separated flow tags to exclude on iOS'
        required: false
        default: 'android-only'
        type: string
      android_include_tags:
        description: 'Comma-separated flow tags to include on Android (empty = all flows)'
        required: false
        default: ''
        type: string
      ios_include_tags:
        description: 'Comma-separated flow tags to include on iOS (empty = all flows)'
        required: false
        default: ''
        type: string
      maestro_env:
        description: 'Newline-separated KEY=VALUE pairs exported before the run; MAESTRO_* keys are forwarded to flows'
        required: false
        default: ''
        type: string
      setup_command:
        description: 'Shell command run in each test job before maestro test (e.g. resolve dynamic seed data); export values for flows by appending MAESTRO_* lines to $GITHUB_ENV'
        required: false
        default: ''
        type: string
      flow_runner:
        description: 'Optional shell script path that runs Maestro flows and writes the supplied JUnit report/debug outputs'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js version for setup_command tooling'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'bun'
        type: string
      suite_timeout_minutes:
        description: 'Ceiling for EACH platform suite job (Android and iOS separately), not the whole workflow. Raise it when the flow count outgrows the default — a suite cancelled mid-run reports as a failure with no usable result.'
        required: false
        default: 90
        type: number
      maestro_version:
        description: 'Pin the Maestro CLI to an exact version (e.g. 2.7.0). Empty installs whatever get.maestro.mobile.dev currently serves. Deliberately empty by default — see the install step.'
        required: false
        default: ''
        type: string
      ios_driver_startup_timeout_ms:
        description: 'MAESTRO_DRIVER_STARTUP_TIMEOUT for the iOS XCUITest driver, in milliseconds. Bounds how long Maestro waits for the driver to bind its port before abandoning the whole suite.'
        required: false
        default: 240000
        type: number
    secrets:
      EXPO_TOKEN:
        description: 'Expo token for EAS builds. When absent, the whole suite skips with a warning.'
        required: false
      MAESTRO_SECRET_ENV:
        description: 'Newline-separated KEY=VALUE pairs of sensitive flow variables (e.g. test-account passwords), forwarded like maestro_env. GitHub masks each line in logs.'
        required: false

permissions:
  contents: read

jobs:
  preflight:
    name: 🔍 Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      run_android: ${{ steps.check.outputs.run_android }}
      run_ios: ${{ steps.check.outputs.run_ios }}
      platforms: ${{ steps.check.outputs.platforms }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔍 Check prerequisites and compute platform matrix
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          FLOWS_DIR: ${{ inputs.flows_dir }}
        run: |
          should_run=true
          if [[ -z "${EXPO_TOKEN// }" ]]; then
            echo "::warning::Maestro native e2e skipped - EXPO_TOKEN not configured"
            should_run=false
          fi
          if [[ ! -d "$FLOWS_DIR" ]]; then
            echo "::warning::Maestro native e2e skipped - flows directory '$FLOWS_DIR' not found"
            should_run=false
          fi
          case "$PLATFORM" in
            android) platforms='["android"]' ;;
            ios) platforms='["ios"]' ;;
            *) platforms='["android","ios"]' ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" && "$platforms" == *'"android"'* ]]; then
            echo "run_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_android=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$should_run" == "true" && "$platforms" == *'"ios"'* ]]; then
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 🏗️ EAS Build (${{ matrix.platform }})
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.preflight.outputs.platforms) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🥟 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: ${{ inputs.package_manager }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build with EAS (${{ inputs.eas_profile }} profile)
        # Deliberately NO `pre-build:eas` here: that script regenerates
        # .easignore from .gitignore, whose `google-services*.json` line then
        # excludes the committed google-services JSON from the EAS upload and
        # the Android build dies with MISSING_GOOGLE_SERVICES_JSON. The
        # committed .easignore is authoritative and is what the release
        # pipeline uses.
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ inputs.eas_profile }} \
            --non-interactive \
            --wait \
            --json > build.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [[ -z "$BUILD_URL" || "$BUILD_URL" == "null" ]]; then
            echo "::error::EAS build produced no artifact URL"
            jq '.' build.json
            exit 1
          fi
          if [[ "${{ matrix.platform }}" == "android" ]]; then
            curl -fsSL "$BUILD_URL" -o app-android.apk
          else
            # iOS simulator builds ship as a tarball containing the .app bundle
            curl -fsSL "$BUILD_URL" -o app-ios.tar.gz
          fi

      - name: 📤 Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            app-android.apk
            app-ios.tar.gz
          if-no-files-found: error
          retention-days: 3

  android:
    name: 🤖 Maestro Android
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # Caller-tunable, defaulting to 90 to match the iOS job: the 60 inherited
    # from frontend-v2's original workflow started timing out once its suite
    # grew (nightly 29322073759 — the Android leg was cancelled mid-suite at
    # exactly 60:00). Jobs end when the suite ends, so fast suites pay nothing
    # for the headroom, and a project whose suite outgrows 90 raises
    # suite_timeout_minutes rather than waiting on a Lisa release.
    timeout-minutes: ${{ inputs.suite_timeout_minutes }}
    # !cancelled(): `needs: build` is a matrix job, so one platform's build
    # failure marks the whole job failed and would skip BOTH test jobs. Run
    # whenever this platform's artifact might exist — if its own build leg
    # failed, the download-artifact step fails fast with a clear error.
    if: ${{ !cancelled() && needs.preflight.outputs.run_android == 'true' }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-android

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Install Maestro
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          # `maestro_version` is empty by default, which installs whatever
          # get.maestro.mobile.dev serves today. That is a deliberate choice,
          # not an oversight: pinning on a single bad night would be an
          # assumption dressed as a fix. The version REPORT step below is what
          # makes the pin decision answerable from history instead of from a
          # guess — and it prints the RESOLVED version, so a pin that fails to
          # take shows up as a wrong number rather than as a silent no-op.
          if [[ -n "$MAESTRO_VERSION_PIN" ]]; then
            export MAESTRO_VERSION="$MAESTRO_VERSION_PIN"
          fi
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 🔎 Report toolchain versions
        # To the JOB LOG and the step summary, never only to the debug
        # artifact. TunnlAI could not test "did Maestro 2.8.0 regress iOS
        # driver startup?" against its own history precisely because the
        # version existed nowhere but inside artifacts that had aged out.
        # A version you cannot read after the fact is a version you cannot
        # correlate with a failure.
        run: |
          MAESTRO_RESOLVED=$(maestro --version 2>&1 | tail -1)
          {
            echo "### 🤖 Android toolchain"
            echo ""
            echo "| tool | version |"
            echo "| --- | --- |"
            echo "| Maestro CLI | \`${MAESTRO_RESOLVED}\` |"
            echo "| Maestro pin requested | \`${MAESTRO_VERSION_PIN:-(unpinned)}\` |"
            echo "| Java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Node | \`$(node --version)\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}

      - name: 🔓 Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🧩 Apply maestro env
        # E2E_* names (not MAESTRO_*) so the multiline inputs never leak into
        # the MAESTRO_* scan in the assemble step below.
        env:
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: 🎯 Run setup command
        # Project-specific dynamic test data (e.g. resolving a seed entity id
        # from the dev backend). The command exports values for the flows by
        # appending MAESTRO_*=value lines to $GITHUB_ENV; a failure here fails
        # the run rather than letting flows interpolate empty values.
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}

      - name: 🧮 Assemble Maestro flags
        env:
          MAESTRO_APP_ID: ${{ inputs.android_app_id }}
          EXCLUDE_TAGS: ${{ inputs.android_exclude_tags }}
          INCLUDE_TAGS: ${{ inputs.android_include_tags }}
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          ARGS=""
          if [[ -n "$EXCLUDE_TAGS" ]]; then
            ARGS="--exclude-tags=$EXCLUDE_TAGS"
          fi
          if [[ -n "$INCLUDE_TAGS" ]]; then
            ARGS="$ARGS --include-tags=$INCLUDE_TAGS"
          fi
          KEYS=$(
            {
              printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | grep '=' | grep -v '^#' | cut -d= -f1
              env | grep -o '^MAESTRO_[A-Za-z0-9_]*'
            } | sort -u
          )
          for key in $KEYS; do
            [[ "$key" == "MAESTRO_E2E_ARGS" ]] && continue
            value="${!key}"
            [[ -z "$value" ]] && continue
            ARGS="$ARGS -e $key=$value"
          done
          echo "MAESTRO_E2E_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: 📱 Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOW_RUNNER: ${{ inputs.flow_runner }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # android-emulator-runner executes each script LINE as a separate
          # `sh -c` command, so backslash line-continuations do not survive —
          # a multi-line `maestro test ... \` runs bare and Maestro treats the
          # trailing `\` as a flow path ("Flow path does not exist"). Keep
          # each command on ONE line.
          script: |
            # android-emulator-runner can observe the AVD while it is still
            # offline, leaving Maestro's dadb connection bound to that stale
            # server state (mobile-dev-inc/Maestro#3451). Recreate adb only
            # after the action's boot wait has completed, then prove the
            # device is online before installing or starting Maestro.
            adb kill-server
            adb start-server
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install app-android.apk
            # Installing a large APK can outlast the emulator's screen timeout.
            # Reassert the awake/unlocked state immediately before Maestro;
            # otherwise every flow can fail its first assertion behind the
            # keyguard even though the app and selectors are healthy.
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # KEYCODE_MENU (82) opens the Pixel launcher's customization
            # popup once the keyguard is already dismissed. That popup can
            # consume every subsequent Maestro launchApp command and make all
            # flows fail their first assertion. HOME instead normalizes the
            # post-unlock surface and closes any boot-time launcher popup.
            adb shell input keyevent KEYCODE_HOME
            adb shell dumpsys power | grep -q 'mWakefulness=Awake'
            adb shell dumpsys window | grep -q 'isKeyguardShowing=false'
            if [ -n "$FLOW_RUNNER" ]; then bash "$FLOW_RUNNER" maestro-android-report.xml maestro-debug $MAESTRO_E2E_ARGS ${{ inputs.flows_dir }}; else maestro test $MAESTRO_E2E_ARGS --format junit --output maestro-android-report.xml --debug-output maestro-debug ${{ inputs.flows_dir }}; fi

      - name: 🔢 Count executed flows
        # The iOS job carries a byte-identical copy of this step (with the
        # platform swapped). Keep them in lockstep: the whole point is that a
        # downstream reader can compare the two arms of ONE run, which it
        # cannot do if the arms count differently. This file already duplicates
        # `Apply maestro env` and `Assemble Maestro flags` between the arms for
        # the same reason — a reusable workflow cannot call a composite action
        # that lives beside it, because the checkout in these jobs is the
        # CALLER's repository, not Lisa's.
        #
        # NOT `always()`: a suite CANCELLED by the job timeout has usually run
        # many flows and simply never got to write its report, and reporting
        # that as "executed 0" would libel a slow suite as a dead one.
        id: flows
        if: ${{ !cancelled() }}
        # See the run step's note: the default `run` shell has no pipefail,
        # and this step is tested by executing this exact text with pipefail
        # ON. Pin the shell so what CI runs and what the test proves are the
        # same program.
        shell: bash
        run: |
          REPORT="maestro-android-report.xml"
          if [[ -f "$REPORT" ]]; then
            REPORT_PRESENT=true
            # Count the `<testcase` elements the run actually wrote rather than
            # trusting the aggregate `tests="N"` attribute. The elements are
            # what happened; the attribute is what the writer claimed.
            # `{ grep ... || true; }` around each match: a report with no
            # matches is a legitimate READING — it is precisely the zero-flow
            # case — not an error. Under `pipefail` an unabsorbed grep miss
            # would abort this step before the assertion below ever got to
            # name what happened, and the job would exit 1 with the generic
            # message this whole change exists to replace.
            EXECUTED=$( { grep -o '<testcase' "$REPORT" || true; } | wc -l | tr -d ' ')
            FAILURES=$( { grep -m1 -o 'failures="[0-9]*"' "$REPORT" || true; } | tr -dc '0-9')
          else
            REPORT_PRESENT=false
            EXECUTED=0
            FAILURES=0
          fi
          EXECUTED=${EXECUTED:-0}
          FAILURES=${FAILURES:-0}
          {
            echo "platform=android"
            echo "report_present=$REPORT_PRESENT"
            echo "executed=$EXECUTED"
            echo "failures=$FAILURES"
          } | tee maestro-android-flowcount.txt >> "$GITHUB_OUTPUT"
          {
            echo "### 🤖 Android flows executed: **$EXECUTED** (failures: $FAILURES)"
            echo ""
            echo "JUnit report written: \`$REPORT_PRESENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Maestro JUnit report
        # Split out from the debug bundle below on purpose, and this is the
        # ONLY upload that may use `if-no-files-found: error`.
        #
        # Flipping the combined upload to `error` would have been a placebo for
        # the bug this step exists to catch: `error` fires only when NOTHING in
        # the path matched, and in the failure that motivated this
        # (TunnlAI/frontend run 31584986248) `maestro-debug/` existed and only
        # the report was missing — so the combined upload would still have gone
        # quietly green. A report-only path is what makes an absent report an
        # error instead of a 5 KB artifact nobody opens.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-report
          path: maestro-android-report.xml
          if-no-files-found: error
          retention-days: 7

      - name: 📤 Publish executed-flow count
        # The COUNT IS THE ARTIFACT NAME, deliberately. Two properties fall out
        # of that and neither is available any other way:
        #
        #  1. A downstream gate reads the count from the artifacts LIST — one
        #     cheap API call, no download. The Android debug bundle alone runs
        #     to ~40 MB; a merge gate that had to fetch it would never be
        #     installed on the pull-request path.
        #  2. The name outlives the bytes. Expired artifacts still appear in
        #     the list, so "how many flows did that arm run three months ago?"
        #     stays answerable after the payload is gone.
        #
        # A human reading the run page gets it for free: the artifact is
        # literally called `maestro-android-flowcount-0` on a night that tested
        # nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-flowcount-${{ steps.flows.outputs.executed }}
          path: maestro-android-flowcount.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🚨 Assert flows executed
        # The loud half. Without this a suite that ran zero flows and a suite
        # that ran every flow with twenty failures both exit 1 and are
        # indistinguishable in CI — which is how an entire arm can be switched
        # off for a week without anyone noticing.
        if: ${{ !cancelled() }}
        env:
          REPORT_PRESENT: ${{ steps.flows.outputs.report_present }}
          EXECUTED: ${{ steps.flows.outputs.executed }}
        shell: bash
        run: |
          if [[ "$REPORT_PRESENT" != "true" ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (android)::The Android arm TESTED NOTHING. maestro-android-report.xml was never written, so no flow reached its first assertion. This is NOT an ordinary flow failure — this run proved nothing about the app. Open the maestro-android-results artifact for why the runner never started a flow."
            exit 1
          fi
          if [[ "$EXECUTED" -eq 0 ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (android)::The Android arm TESTED NOTHING. maestro-android-report.xml records 0 executed flows. This is NOT an ordinary flow failure — this run proved nothing about the app."
            exit 1
          fi
          echo "✅ Android executed $EXECUTED flow(s)."

      - name: 📤 Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-results
          path: |
            maestro-android-report.xml
            maestro-debug
          # Maestro writes EVERY debug artifact under `maestro-debug/.maestro/`
          # — a hidden directory — so the screenshots, view-hierarchy dumps and
          # device logcat that name the cause of a failure all sit behind a dot.
          # upload-artifact skips hidden files by default, which silently
          # reduced this artifact to the junit XML alone: a failing run uploaded
          # one file and told you an element was missing without a single frame
          # showing what was on screen instead. Both native suites were
          # undiagnosable after the fact for exactly this reason.
          include-hidden-files: true
          # `ignore` is CORRECT here and must stay. This bundle is at its most
          # valuable on the runs where it is incomplete — a cancelled suite, a
          # job that died before Maestro started — and erroring on those turns
          # the one diagnostic upload into more noise on an already-failed job.
          # The absent-report hole this used to leave is closed above, by the
          # report-only upload (`if-no-files-found: error`) and the zero-flow
          # assertion. Do not "fix" this line; fixing it here would restore a
          # placebo and change nothing about what gets detected.
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: 🍎 Maestro iOS
    needs: [preflight, build]
    runs-on: macos-15
    # Same ceiling as the android job — see its comment for why it is an input.
    timeout-minutes: ${{ inputs.suite_timeout_minutes }}
    # !cancelled(): see the android job — don't let the other platform's
    # build failure skip this platform's tests.
    if: ${{ !cancelled() && needs.preflight.outputs.run_ios == 'true' }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-ios

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🧰 Install Maestro
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          # See the android job's copy for why this is unpinned by default.
          if [[ -n "$MAESTRO_VERSION_PIN" ]]; then
            export MAESTRO_VERSION="$MAESTRO_VERSION_PIN"
          fi
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 📱 Boot simulator and install app
        run: |
          mkdir -p ios-app && tar -xzf app-ios.tar.gz -C ios-app
          APP_PATH=$(find ios-app -maxdepth 2 -name "*.app" -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found in EAS artifact"
            find ios-app -maxdepth 3 -print
            exit 1
          fi
          # Boot the first available iPhone simulator on the runner's Xcode.
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.name | test("^iPhone"))][0].udid')
          if [[ -z "$UDID" || "$UDID" == "null" ]]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID" || true # already-booted is fine
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP_PATH"
          # Carried forward so the run step can recycle THIS simulator on a
          # driver-startup retry instead of re-deriving it and possibly
          # picking a different device mid-job.
          SIM_NAME=$(xcrun simctl list devices --json \
            | jq -r --arg u "$UDID" '[.devices[] | .[] | select(.udid==$u)][0].name')
          SIM_OS=$(xcrun simctl list devices --json \
            | jq -r --arg u "$UDID" '.devices | to_entries[] | select(.value[]?.udid==$u) | .key' | head -1)
          {
            echo "IOS_SIM_UDID=$UDID"
            echo "IOS_APP_PATH=$APP_PATH"
            echo "IOS_SIM_NAME=$SIM_NAME"
            echo "IOS_SIM_OS=$SIM_OS"
          } >> "$GITHUB_ENV"

      - name: 🔎 Report toolchain versions
        # To the JOB LOG, not only to the debug artifact — see the android
        # job's copy. The iOS arm additionally records Xcode and the simulator
        # OS because `macos-15` is an image GitHub re-rolls underneath us, and
        # a driver-startup failure that correlates with an image change is
        # indistinguishable from one that correlates with a CLI change unless
        # both numbers are on the record for every run.
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          MAESTRO_RESOLVED=$(maestro --version 2>&1 | tail -1)
          {
            echo "### 🍎 iOS toolchain"
            echo ""
            echo "| tool | version |"
            echo "| --- | --- |"
            echo "| Maestro CLI | \`${MAESTRO_RESOLVED}\` |"
            echo "| Maestro pin requested | \`${MAESTRO_VERSION_PIN:-(unpinned)}\` |"
            echo "| Xcode | \`$(xcodebuild -version 2>&1 | tr '\n' ' ')\` |"
            echo "| macOS | \`$(sw_vers -productVersion)\` |"
            echo "| Simulator | \`${IOS_SIM_NAME} / ${IOS_SIM_OS}\` |"
            echo "| Driver startup budget | \`${{ inputs.ios_driver_startup_timeout_ms }} ms\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🧩 Apply maestro env
        # See the android job — E2E_* names keep the multiline inputs out of
        # the MAESTRO_* scan.
        env:
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: 🎯 Run setup command
        # See the android job — the command appends MAESTRO_* lines to
        # $GITHUB_ENV and a failure fails the run.
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}

      - name: 🧮 Assemble Maestro flags
        env:
          MAESTRO_APP_ID: ${{ inputs.ios_app_id }}
          EXCLUDE_TAGS: ${{ inputs.ios_exclude_tags }}
          INCLUDE_TAGS: ${{ inputs.ios_include_tags }}
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          ARGS=""
          if [[ -n "$EXCLUDE_TAGS" ]]; then
            ARGS="--exclude-tags=$EXCLUDE_TAGS"
          fi
          if [[ -n "$INCLUDE_TAGS" ]]; then
            ARGS="$ARGS --include-tags=$INCLUDE_TAGS"
          fi
          KEYS=$(
            {
              printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | grep '=' | grep -v '^#' | cut -d= -f1
              env | grep -o '^MAESTRO_[A-Za-z0-9_]*'
            } | sort -u
          )
          for key in $KEYS; do
            [[ "$key" == "MAESTRO_E2E_ARGS" ]] && continue
            value="${!key}"
            [[ -z "$value" ]] && continue
            ARGS="$ARGS -e $key=$value"
          done
          echo "MAESTRO_E2E_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: 📱 Run Maestro flows on simulator
        env:
          FLOW_RUNNER: ${{ inputs.flow_runner }}
          # An EXPLICIT, caller-overridable budget for the XCUITest driver's
          # port bind. Leaving this unset does not mean "no opinion" — it means
          # the CLI's built-in 120 s applies by accident, and when it expired on
          # TunnlAI/frontend run 31584986248 the job discarded all 83 planned
          # flows without a single one starting. 240 s is chosen to be
          # unambiguously more than "the default was not enough" while still
          # being a small fraction of the suite ceiling, so a genuinely wedged
          # simulator still fails fast rather than burning the job timeout.
          #
          # Raising this is NOT a fix for a driver that never binds — it only
          # buys a slow one more room. The retry below is what covers a driver
          # that fails to come up at all.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: ${{ inputs.ios_driver_startup_timeout_ms }}
        # EXPLICIT `shell: bash` is load-bearing, not style. The default `run`
        # shell is `bash -e {0}` WITHOUT pipefail, and every suite invocation
        # below is piped into `tee` — so without this the exit status read
        # would be tee's (always 0) and a failed suite would report success.
        shell: bash
        run: |
          # MAESTRO_E2E_ARGS is a flag list that needs word splitting.
          # shellcheck disable=SC2086
          run_suite() {
            if [ -n "$FLOW_RUNNER" ]; then
              bash "$FLOW_RUNNER" maestro-ios-report.xml maestro-debug $MAESTRO_E2E_ARGS ${{ inputs.flows_dir }}
            else
              maestro test ${{ inputs.flows_dir }} \
                $MAESTRO_E2E_ARGS \
                --format junit \
                --output maestro-ios-report.xml \
                --debug-output maestro-debug
            fi
          }

          # Retry ONLY on driver startup, never on flow failures. A blanket
          # retry would double a four-hour suite every time one assertion
          # reds, and would also paper over the real regressions this suite
          # exists to find. The signature below is the exception Maestro
          # throws when the XCUITest runner never binds its port — the whole
          # suite is lost before flow 1, so re-running it costs nothing that
          # was not already lost.
          DRIVER_FAILURE='IOSDriverTimeoutException|iOS driver not ready in time'

          if run_suite 2>&1 | tee maestro-ios-run-1.log; then
            exit 0
          fi

          if ! grep -Eq "$DRIVER_FAILURE" maestro-ios-run-1.log; then
            echo "::notice::Suite failed on flow results, not on driver startup — not retrying."
            exit 1
          fi

          echo "::warning title=iOS driver failed to start::The XCUITest driver did not bind its port within ${MAESTRO_DRIVER_STARTUP_TIMEOUT}ms and NO flow executed. Recycling the simulator and retrying once."
          xcrun simctl shutdown "$IOS_SIM_UDID" || true
          xcrun simctl erase "$IOS_SIM_UDID" || true
          xcrun simctl boot "$IOS_SIM_UDID"
          xcrun simctl bootstatus "$IOS_SIM_UDID"
          xcrun simctl install "$IOS_SIM_UDID" "$IOS_APP_PATH"

          if run_suite 2>&1 | tee maestro-ios-run-2.log; then
            echo "::notice title=iOS driver recovered on retry::The first attempt lost the driver; the retry ran the suite. Treat repeated warnings of this kind as a real defect, not as noise — see the flow-count artifact for what each attempt actually ran."
            exit 0
          fi
          exit 1

      - name: 🔢 Count executed flows
        # Byte-identical to the android job's copy with the platform swapped —
        # see the comment there for why the duplication is deliberate and why
        # this is not `always()`.
        id: flows
        if: ${{ !cancelled() }}
        # See the run step's note: the default `run` shell has no pipefail,
        # and this step is tested by executing this exact text with pipefail
        # ON. Pin the shell so what CI runs and what the test proves are the
        # same program.
        shell: bash
        run: |
          REPORT="maestro-ios-report.xml"
          if [[ -f "$REPORT" ]]; then
            REPORT_PRESENT=true
            # `{ grep ... || true; }` around each match: a report with no
            # matches is a legitimate READING — it is precisely the zero-flow
            # case — not an error. Under `pipefail` an unabsorbed grep miss
            # would abort this step before the assertion below ever got to
            # name what happened, and the job would exit 1 with the generic
            # message this whole change exists to replace.
            EXECUTED=$( { grep -o '<testcase' "$REPORT" || true; } | wc -l | tr -d ' ')
            FAILURES=$( { grep -m1 -o 'failures="[0-9]*"' "$REPORT" || true; } | tr -dc '0-9')
          else
            REPORT_PRESENT=false
            EXECUTED=0
            FAILURES=0
          fi
          EXECUTED=${EXECUTED:-0}
          FAILURES=${FAILURES:-0}
          {
            echo "platform=ios"
            echo "report_present=$REPORT_PRESENT"
            echo "executed=$EXECUTED"
            echo "failures=$FAILURES"
          } | tee maestro-ios-flowcount.txt >> "$GITHUB_OUTPUT"
          {
            echo "### 🍎 iOS flows executed: **$EXECUTED** (failures: $FAILURES)"
            echo ""
            echo "JUnit report written: \`$REPORT_PRESENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Maestro JUnit report
        # See the android job's copy: report-only path, so an ABSENT report is
        # an error rather than a quiet 5 KB artifact.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-report
          path: maestro-ios-report.xml
          if-no-files-found: error
          retention-days: 7

      - name: 📤 Publish executed-flow count
        # The count is the artifact NAME on purpose — see the android copy.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-flowcount-${{ steps.flows.outputs.executed }}
          path: maestro-ios-flowcount.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🚨 Assert flows executed
        # The loud half — see the android copy.
        if: ${{ !cancelled() }}
        env:
          REPORT_PRESENT: ${{ steps.flows.outputs.report_present }}
          EXECUTED: ${{ steps.flows.outputs.executed }}
        shell: bash
        run: |
          if [[ "$REPORT_PRESENT" != "true" ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (ios)::The iOS arm TESTED NOTHING. maestro-ios-report.xml was never written, so no flow reached its first assertion. This is NOT an ordinary flow failure — this run proved nothing about the app. Open the maestro-ios-results artifact for why the runner never started a flow."
            exit 1
          fi
          if [[ "$EXECUTED" -eq 0 ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (ios)::The iOS arm TESTED NOTHING. maestro-ios-report.xml records 0 executed flows. This is NOT an ordinary flow failure — this run proved nothing about the app."
            exit 1
          fi
          echo "✅ iOS executed $EXECUTED flow(s)."

      - name: 📤 Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-results
          path: |
            maestro-ios-report.xml
            maestro-ios-run-1.log
            maestro-ios-run-2.log
            maestro-debug
          # See the Android upload above: `maestro-debug/.maestro/` is hidden,
          # and without this the artifact is the junit XML and nothing else.
          include-hidden-files: true
          # `ignore` is correct here and must stay — see the android copy for
          # why flipping it would be a placebo.
          if-no-files-found: ignore
          retention-days: 7
