# Maestro Native E2E — reusable workflow
#
# Native (iOS + Android) e2e suite on GitHub-hosted runners: an Android
# emulator on ubuntu-latest and an iOS simulator on macos-15. This is the
# self-hosted sibling of quality.yml's maestro_e2e job, which only supports
# Maestro Cloud and needs a paid mobile.dev account (MAESTRO_API_KEY). This
# workflow needs only EXPO_TOKEN: binaries are built by EAS with a dedicated
# e2e profile (default `dev-e2e` in the project's eas.json — typically a
# non-dev-client build against the dev backend, analytics capture disabled,
# and its own update channel so the app never pulls an OTA over the code
# under test).
#
# Cadence lives in the CALLER (schedule in a reusable workflow would fire in
# the Lisa repo, not the project). Projects get a thin caller template with a
# nightly cron + workflow_dispatch platform picker; see
# expo/create-only/.github/workflows/maestro-e2e.yml.
#
# Environment contract: forwarded to the flows as `-e` variables are (1)
# every key declared in the `maestro_env` input, (2) every key declared in
# the MAESTRO_SECRET_ENV secret (same KEY=VALUE format, for sensitive values
# like test-account passwords — GitHub masks each line in logs), (3) every
# MAESTRO_* pair the `pre_suite_command` exported, and (4) every env var named
# MAESTRO_* after `setup_command` has run. Values must not contain whitespace.
# The platform app id inputs are forwarded as MAESTRO_APP_ID per platform
# (they may legitimately differ — e.g. `app_dev` on Android vs `app-dev` on
# iOS).
#
# ── SUITES THAT SHARE AN ENVIRONMENT MUST SHARE A CONCURRENCY GROUP ──────────
#
# A portfolio rule, not per-project advice. If two suites drive one backend —
# typically this workflow and the Playwright suite running through quality.yml
# — pass BOTH of them the same `concurrency_group` string. They then queue
# one-behind-another instead of running at once against the same database, the
# same test accounts, and the same fixtures.
#
# KEY IT ON THE ENVIRONMENT, NEVER ON `github.ref`. `maestro-e2e-${{ github.ref
# }}` looks like exclusion and is not: two branches get two different groups
# while sharing one database, so a run on branch A and a run on branch B do not
# exclude each other at all. The thing being protected is the environment, so
# the environment is what the key must name — `e2e-shared-test-user-dev`, not a
# ref. A workflow that only ever targets one environment should use a CONSTANT.
#
# Staggered crons are not a substitute, and the reason is START time rather
# than run length. A stagger assumes both suites begin when their cron fires;
# they do not, because a run first waits for a hosted runner. In frontend-v2
# that wait has been measured at 2h24m (run 31557572592: created 02:39, started
# 05:03) and 6h55m (run 31574372761: created 07:32, started 14:27). Either
# exceeds a two-hour stagger by itself, so the suite scheduled FIRST can begin
# hours after the suite scheduled second, in an order nothing controls. A
# stagger is a courtesy; the group is the mechanism.
#
# Measure this from `started` to `updated`, never from `created` — the latter
# includes the queue wait and makes a run look far longer than it executes. The
# 6h55m-delayed run above executed for 18 minutes; a "209 minute" figure taken
# from created→updated on run 31557572592 was really a 65-minute suite behind a
# 144-minute queue.
#
# The group MUST differ from the calling workflow's own top-level group, or the
# parent run holds a slot while waiting on a child queued for that same slot.
#
# Cost of getting this right: GitHub keeps only ONE pending run per group, so a
# third run displaces the second rather than queueing behind it. With a
# multi-hour tail a run can disappear without a red, which reads as a flaky
# scheduler. That is the price of exclusion and it is the right trade — a
# displaced run tests nothing and stomps nothing, whereas two concurrent runs
# corrupt each other's fixtures and produce reds nobody can attribute.
#
# ── ORDERING THE TWO PLATFORM LEGS (`serialize_platform_legs`) ───────────────
#
# The concurrency group above is the WRONG tool for one specific problem, and
# reaching for it there costs a day. It excludes whole workflow CALLS from each
# other — this suite versus the Playwright suite. Inside one call, `android` and
# `ios` are sibling jobs with identical `needs` and no edge between them, so
# they always ran at the same time and a shared group changes nothing about it.
#
# That matters when both legs sign in as the SAME test persona. Two sign-ins
# against one account invalidate each other's session, and the loser is logged
# out mid-suite: it then asserts on an authenticated screen and finds the
# sign-in screen. The failure is indistinguishable from a product defect by
# inspection, and it moves between flows from night to night.
#
# Measured, not theorized. On acmeorgb/frontend-v2 the Maestro suite on
# `dev` was 1 success in 6 runs; run 31757559016 failed 2 of 38 Android flows on
# `id: ^(?:SIGNIN.INPUT_PHONE|TAB_BAR.S…` while the iOS leg passed — a sign-in
# screen where a tab bar was expected. On AcmeOrgD/frontend, flow failure rate
# was 33% while the legs overlapped and 16% after one leg finished, across two
# runs.
#
# `serialize_platform_legs: true` runs iOS to completion first, then Android.
# It is OFF by default, because a project whose legs use per-platform accounts
# gets its whole suite in the length of its slowest leg and should keep that.
#
# ORDERING, NOT GATING. A FAILING iOS leg still releases Android. Anything else
# would let a single flaky iOS flow delete the Android suite from the night and
# report the narrower result under the same green check — trading a contention
# bug for a coverage bug, which is the worse of the two.
#
# The mechanism is a `leg_order` job that Android depends on and that polls this
# run's own job list for the iOS job. It is indirect because `needs` cannot hold
# an expression: there is no way to write "depend on `ios` only when an input is
# set". The job's own comment records the three alternatives and why each was
# rejected. Consequences worth knowing:
#
#   • Reading the jobs API needs `actions: read`, and that scope must arrive as
#     the forwarded `LEG_ORDER_TOKEN` secret — NOT as a `permissions:` entry in
#     this file. A called workflow requesting a scope its caller never granted
#     is a `startup_failure` for the CALLER'S ENTIRE RUN, decided before the run
#     starts, so no `if:` and no unset input can contain it. That is the #2046
#     rule; this feature broke it once (#2566) and the job carries the full note.
#   • NO degraded path fails this job. A missing token, a 403, a flaky API, a
#     renamed iOS job — each warns loudly and lets Android start, which is the
#     behaviour every run had before this feature existed. Failing instead would
#     be worse than the contention: row 26 of the nightly gate turns any
#     non-success job into a `fail` verdict for the whole suite, blocking the
#     merge gate on a night when both legs were green.
#   • Opting IN costs an idle ubuntu-latest runner for as long as the iOS suite
#     takes, plus one held job slot. The default path does not pay it: with the
#     input unset the job runs no steps and ends in seconds. Wall clock is the
#     larger bill either way — the suite now takes iOS PLUS Android rather than
#     the slower of the two, which is the actual price of not sharing a persona.
#
# ── TWO SETUP SEAMS, AND WHICH ONE YOU WANT ──────────────────────────────────
#
# `pre_suite_command` — runs EXACTLY ONCE per workflow run, in its own job that
#   BOTH platform legs depend on, before either starts. Use it for anything
#   that mutates shared state or must happen once:
#     • data resets / fixture pruning / teardown sweeps (destructive)
#     • conditional seeding — "if no record exists, create one" (read-modify-write)
#     • leasing or claiming a shared environment
#     • deriving ONE value both platforms must agree on
#   Exports values to both legs via a job output — see "Exporting values" below.
#
# `setup_command` — runs in EACH platform job, and the two platform jobs run
#   CONCURRENTLY. It is therefore only safe for per-leg, idempotent, read-only
#   preparation: reading a value that already exists, computing something from
#   the checkout, per-platform tweaks. Unchanged and fully supported; nothing
#   about it moves.
#
#   If your `setup_command` writes, deletes, or conditionally creates ANYTHING
#   in a shared backend, it is in the wrong seam. It is running twice, at the
#   same time, on two runners. A "does X exist? if not, create it" script run
#   from both legs evaluates the question against the same pre-write state and
#   can create X twice — after which the two legs test against different
#   fixtures and disagree for reasons that have nothing to do with the app.
#
# ── Exporting values from the pre-suite job ──────────────────────────────────
#
# `$GITHUB_ENV` does NOT cross job boundaries, so the `setup_command` trick of
# appending MAESTRO_* lines to it cannot work for a command in a separate job.
# `pre_suite_command` instead appends `KEY=VALUE` lines to the file named by
# `$MAESTRO_PRE_SUITE_ENV` (same shape, different file). Those pairs are
# validated, published as a job output, and re-applied to `$GITHUB_ENV` inside
# each platform leg before `setup_command` runs — so flows read them exactly
# as if they had been set locally.
#
#   pre_suite_command: |
#     node scripts/maestro/reset-fixtures.mjs
#     echo "MAESTRO_SEED_PLAYER_ID=$(node scripts/maestro/resolve-seed.mjs)" \
#       >> "$MAESTRO_PRE_SUITE_ENV"
#
# Validation is an ALLOWLIST and fails closed: the key must match
# `MAESTRO_[A-Za-z0-9_]+`, must not be a reserved name, and the value must be
# non-empty and contain no whitespace (an unquoted `$MAESTRO_E2E_ARGS` is
# word-split by the shell downstream, so a value with a space becomes a stray
# argument Maestro reads as a flow path). Anything else fails the pre-suite job
# by name rather than interpolating a broken value into every flow.
#
# Do NOT export secrets this way. GitHub redacts secret values out of job
# outputs, so the pair would silently arrive empty. Sensitive flow variables
# belong in the MAESTRO_SECRET_ENV secret, which both legs read directly.
#
# ── When the pre-suite command fails ─────────────────────────────────────────
#
# FAIL CLOSED: no platform suite runs. The seam exists to establish known
# state, so a suite that runs after it failed is a suite running against
# unknown state — its greens prove nothing and its reds are unattributable.
# The platform legs allowlist the pre-suite job results they will start after
# (`success` and `skipped`); every other result, including any GitHub adds
# later, keeps them from starting.
#
# Note that the pre-suite JOB runs in every wired run whether or not a command
# was supplied — an unset `pre_suite_command` skips the job's STEPS, not the
# job. That is not a stylistic choice: see the job's own comment and the health
# gate paragraph below.
#
# Graceful degradation: when EXPO_TOKEN is not provisioned or the flows
# directory does not exist, every job skips with a warning instead of
# failing, so this workflow is safe to install fleet-wide before a project
# has wired its e2e harness.
#
# ...and how to turn that off once you HAVE wired it: `require_prerequisites:
# true` inverts warn-and-skip into a hard red. Leaving it false forever is a
# false-green generator — the run concludes `success` having tested nothing, so
# a deleted flows directory or an expired EXPO_TOKEN is indistinguishable from a
# passing suite to anything reading this workflow's conclusion. Adopters were
# hand-rolling their own preflight jobs to get this; use the input instead.
#
# What this workflow's SKIPS mean to the health gate: a skipped job does not
# redden the run that contains it, so `platform: android` (iOS job skipped) and
# an unwired preflight (every job skipped) both conclude `success`. The
# `nightly-e2e-health.yml` gate therefore reads the JOBS behind a `success` run,
# not just its conclusion — see truth-table row 26 and §2.4 of
# `docs/nightly-e2e-gate.md`. Renaming or removing the per-platform test jobs
# below is fine; making one of them conclude something other than `success`
# while the run stays green is what the gate is watching for.
#
# That rule binds EVERY job here, not only the platform ones, and it is why the
# pre-suite job below runs unconditionally in a wired run instead of skipping
# itself when no `pre_suite_command` is supplied. A job that skips whenever an
# optional input is unset would report `incomplete_run` — a blocked merge gate —
# on every adopter that does not use the seam. Before adding a job to this
# workflow, ask what it concludes in a run where the caller passed nothing.

name: 📱 Maestro Native E2E

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform(s) to run: all, android, or ios'
        required: false
        default: 'all'
        type: string
      eas_profile:
        description: 'EAS build profile for the e2e binaries (must exist in eas.json)'
        required: false
        default: 'dev-e2e'
        type: string
      reuse_build_by_fingerprint:
        description: >-
          Reuse a finished EAS build whose fingerprint matches this commit
          instead of starting a new cloud build. `eas fingerprint:generate`
          hashes the native inputs (native dependencies, app config, plugin
          set); a hit means an existing binary is byte-for-byte the app this
          commit would produce, so building it again buys nothing. On a
          fingerprint miss the workflow falls back to the latest FINISHED build
          for this profile and platform, and only starts a fresh build when
          both miss. Default false = always build, prior behavior preserved.
          Turn it on when EAS build quota is the binding constraint rather than
          build freshness: on Expo's Free plan the quota is what stops the
          suite from running at all, which is why every consumer that hit it
          forked this workflow. The cost of turning it on is that a suite can
          run against a binary built from an EARLIER commit whose native inputs
          hashed the same — which is exactly what the fingerprint asserts, but
          it is an assertion about NATIVE inputs only. JS-only changes do not
          move the fingerprint, so a project whose e2e profile embeds the JS
          bundle should leave this off or it will test stale JS.
        required: false
        default: false
        type: boolean
      diagnose_eas_quota_exhaustion:
        description: >-
          When a fresh EAS build fails, scan its stderr for Expo's Free-plan
          exhaustion message and re-emit it as a `::error::` naming the remedy.
          Without this the failure reads as a generic build error and the
          operator has to open the raw log to learn that nothing is wrong with
          the code. Default false = prior behavior preserved, because turning
          it on buffers the build's stderr to a file instead of streaming it
          live to the job log — worth knowing on a `--wait` build that runs for
          the better part of an hour. The buffered stderr is replayed in full
          before the step exits, so nothing is lost, only delayed.
        required: false
        default: false
        type: boolean
      flows_dir:
        description: 'Maestro flows directory'
        required: false
        default: '.maestro/flows'
        type: string
      android_app_id:
        description: 'Android application id, forwarded to flows as MAESTRO_APP_ID'
        required: false
        default: ''
        type: string
      ios_app_id:
        description: 'iOS bundle identifier, forwarded to flows as MAESTRO_APP_ID'
        required: false
        default: ''
        type: string
      android_exclude_tags:
        description: 'Comma-separated flow tags to exclude on Android'
        required: false
        default: 'ios-only'
        type: string
      ios_exclude_tags:
        description: 'Comma-separated flow tags to exclude on iOS'
        required: false
        default: 'android-only'
        type: string
      android_full_suite_exclude_tags:
        description: >-
          The exclude tags that constitute the FULL Android suite — this
          project's permanent platform partition plus anything quarantined
          long-term. A run whose `android_exclude_tags` equal this baseline
          records itself as `scope-full`; any other value is a slice and
          records `scope-filtered`. Compared as a SET, so order, surrounding
          whitespace and duplicates are all irrelevant. Defaults to the
          `android_exclude_tags` default so that a caller passing nothing
          describes a FULL suite instead of disqualifying itself.
        required: false
        default: 'ios-only'
        type: string
      ios_full_suite_exclude_tags:
        description: >-
          The exclude tags that constitute the FULL iOS suite. See
          `android_full_suite_exclude_tags`; same semantics, same set
          comparison, defaulted to the `ios_exclude_tags` default.
        required: false
        default: 'android-only'
        type: string
      android_include_tags:
        description: 'Comma-separated flow tags to include on Android (empty = all flows)'
        required: false
        default: ''
        type: string
      ios_include_tags:
        description: 'Comma-separated flow tags to include on iOS (empty = all flows)'
        required: false
        default: ''
        type: string
      maestro_env:
        description: 'Newline-separated KEY=VALUE pairs exported before the run; MAESTRO_* keys are forwarded to flows'
        required: false
        default: ''
        type: string
      pre_suite_command:
        description: >-
          Shell command run EXACTLY ONCE per workflow run, in its own job that
          BOTH platform legs depend on and that completes before either starts.
          This is the seam for anything that mutates shared state or must happen
          once: data resets, fixture pruning, conditional seeding, environment
          leasing, or deriving a single value both platforms must agree on.
          Export values for the platform legs by appending MAESTRO_*=value lines
          to the file named by $MAESTRO_PRE_SUITE_ENV ($GITHUB_ENV does not
          cross job boundaries). A failure here fails closed — no platform suite
          runs, because a suite whose known state was never established proves
          nothing. Contrast setup_command, which runs once per platform leg,
          concurrently, and is only safe for idempotent read-only preparation.
        required: false
        default: ''
        type: string
      pre_suite_install_dependencies:
        description: >-
          Install the project's dependencies in the pre-suite job before running
          pre_suite_command, using package_manager. The platform legs install
          nothing, so this defaults false to match: a command built from Node
          built-ins alone (the common case) does not pay for an install. Set it
          true when the command needs node_modules — e.g. a `bun run db:reset`
          that goes through the project's own tooling.
        required: false
        default: false
        type: boolean
      pre_suite_timeout_minutes:
        description: >-
          Ceiling for the pre-suite job. It gates the entire suite, so it is
          deliberately much tighter than suite_timeout_minutes — a wedged reset
          should surface as a fast, named failure rather than silently spending
          the suite's budget before a single flow runs.
        required: false
        default: 20
        type: number
      prepare_environment:
        description: >-
          Environment name to prepare before the suite, forwarded to Lisa's
          `environment:*` facade as `--env=<name>`. Empty (the default) means
          this workflow prepares nothing and behaves exactly as before.

          Setting it runs `environment:reset` then `environment:reseed` through
          `lisa-environment-prepare.mjs` in the pre-suite job, BEFORE either
          platform leg. Reset-before rather than cleanup-after: cleanup does not
          run when a runner dies, is cancelled, or is evicted, so the next run
          would start against whatever the last failure left behind.

          Both verbs are mandatory. A project with no fixture data still
          declares an explicit no-op `environment:reseed`; omitting a lifecycle
          step is not equivalent to invoking one that intentionally does no work.
        required: false
        default: ''
        type: string
      prepare_verbs:
        description: >-
          Compatibility input for existing callers. Every prepared environment
          requires both reset and reseed; a subset fails before either command
          runs. A project with no fixture data implements environment:reseed as
          an explicit verified no-op rather than omitting the lifecycle step.
          Ignored when prepare_environment is empty.
        required: false
        default: reset,reseed
        type: string
      prepare_between_legs:
        description: >-
          Prepare the environment a SECOND time after the iOS leg and before the
          Android leg. Defaults true because it is the correct default whenever
          the two legs share one environment: the first preparation is hours old
          by the time the second leg starts, and "clean up when you are done"
          cannot give leg two a clean start.

          Only ever acts when the legs are actually serialized and both are in
          the run — resetting between legs that run CONCURRENTLY would wipe the
          environment underneath a running suite. Ignored when
          prepare_environment is empty.
        required: false
        default: true
        type: boolean
      prepare_setup_command:
        description: >-
          Shell command run after dependencies are installed and BEFORE the
          facade verbs, in the same job.

          Exists because the target environment is not always a runtime
          argument. A project may materialise it as a build-time fact — copying
          a gitignored `.env.local`, exporting a profile — and its
          `environment:reset` then refuses unless that file agrees with
          `--env`. That refusal is correct: the underlying sweeper defaults to
          a real environment when the file is absent, so "no target named" must
          never be read as "the default one". Without this seam the job checks
          out, installs, and runs a verb that has no way to know what it is
          pointed at.

          The direct analogue of `playwright_setup_command`, and needed for the
          same reason.
        required: false
        default: ''
        type: string
      prepare_timeout_minutes:
        description: >-
          Ceiling for the between-legs preparation job. Tight on purpose: it
          gates the Android leg, so a wedged reset should surface as a fast,
          named failure rather than spending the suite's budget first.
        required: false
        default: 20
        type: number
      setup_command:
        description: >-
          Shell command run in EACH test job before maestro test (e.g. read a
          seed entity id that already exists); export values for flows by
          appending MAESTRO_* lines to $GITHUB_ENV. The Android and iOS jobs run
          CONCURRENTLY, so this command runs twice at the same time — it is only
          safe for per-leg, idempotent, read-only preparation. Anything that
          writes, deletes, or conditionally creates shared state belongs in
          pre_suite_command instead.
        required: false
        default: ''
        type: string
      flow_runner:
        description: >-
          Optional shell script path that runs Maestro flows and writes the
          supplied JUnit report/debug outputs.

          It is invoked as `<runner> <report-path> <debug-dir> <maestro args…>
          <target>`. The TARGET is the flows directory for a suite run and a
          single flow FILE when the iOS arm re-runs one failed flow in
          isolation, so a runner must pass the target through to Maestro rather
          than assuming it is a directory. The REPORT PATH likewise varies —
          an isolated re-run is written to its own report so the suite's
          original one stays intact as the record of what happened first.
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js version for pre_suite_command and setup_command tooling'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'bun'
        type: string
      require_prerequisites:
        description: >-
          Invert the warn-and-skip preflight into a hard failure. The default
          (false) is what makes this workflow safe to install fleet-wide before a
          project has wired its harness: a missing EXPO_TOKEN or flows directory
          warns and skips. But once a project HAS wired it — and especially once
          a nightly gate reads this workflow's conclusion — warn-and-skip is a
          false green: the run concludes `success` having tested nothing, and a
          deleted flows directory or an expired EXPO_TOKEN looks exactly like a
          passing suite. Adopters have been hand-rolling preflight jobs to get
          this behaviour; set it true instead.
        required: false
        default: false
        type: boolean
      lint_flow_app_id:
        description: >-
          Fail preflight when a Maestro flow would launch an EMPTY app id. The
          app id reaches flows as `-e MAESTRO_APP_ID=…`, so a flow that writes
          `appId: ${APP_ID}` — or omits `appId:` entirely — interpolates to
          nothing and Maestro reports a launch failure that names no cause. It
          reads as a broken app; it is a one-line config error. Two checks run:
          no file under the flows directory's Maestro root may reference
          `${APP_ID}`, and every flow file under the flows directory must
          declare `appId: ${MAESTRO_APP_ID}`. Default false = prior behavior
          preserved, because the second check is only correct for a project
          whose subflows live OUTSIDE the flows directory: `maestro test <dir>`
          recurses, so a `runFlow`-included subflow sitting inside it is a flow
          file that legitimately declares no appId and would fail this lint.
          Move those beside the flows directory rather than inside it, then
          turn this on.
        required: false
        default: false
        type: boolean
      suite_timeout_minutes:
        description: 'Ceiling for EACH platform suite job (Android and iOS separately), not the whole workflow. Raise it when the flow count outgrows the default — a suite cancelled mid-run reports as a failure with no usable result.'
        required: false
        default: 90
        type: number
      maestro_version:
        description: 'Pin the Maestro CLI to an exact version (e.g. 2.7.0). Empty installs whatever get.maestro.mobile.dev currently serves. Deliberately empty by default — see the install step.'
        required: false
        default: ''
        type: string
      ios_driver_startup_timeout_ms:
        description: 'MAESTRO_DRIVER_STARTUP_TIMEOUT for the iOS XCUITest driver, in milliseconds. Bounds how long Maestro waits for the driver to bind its port before abandoning the whole suite.'
        required: false
        default: 240000
        type: number
      android_emulator_cores:
        description: >-
          `hw.cpu.ncore` for the Android AVD. Default 2, which is
          `reactivecircus/android-emulator-runner`'s own default and therefore
          exactly what this workflow produced before this input existed.

          RAISE THIS WITH CARE. `ubuntu-latest` has 4 vCPUs, and the emulator
          shares them with the host processes driving it — adb, the Maestro
          CLI, and the runner agent itself. Setting 4 hands every core to the
          guest and starves the host, which makes the suite SLOWER, not
          faster. If a project genuinely needs more emulator capability the
          honest answer is a larger runner, not a bigger slice of this one.

          THIS IS NOT THE FIX FOR MAESTRO ANIMATION TIMEOUTS, and that is
          stated here because the resource theory is superficially convincing
          and has already cost one investigation. A run losing flows to
          repeated 5s `waitForAnimationsToComplete` timeouts is hitting an
          upstream Maestro behaviour: `tap` and `inputText` go through
          `UiAutomation.injectInputEvent(event, sync=true)`, whose
          two-argument overload forces `waitForAnimations=true` and blocks on
          `waitForAllWindowsDrawn` (mobile-dev-inc/maestro#2718). Thirty
          consecutive 5s timeouts in one three-minute flow is a STUCK
          animation, and no number of cores makes a never-completing
          animation complete. A CI-equivalent local reproduction with ample
          cores produced zero such failures against CI's ~26% incidence. The
          theory was tested and rejected — do not re-run it from here.
        required: false
        default: 2
        type: number
      android_emulator_ram_size:
        description: >-
          `hw.ramSize` for the Android AVD, in KB or MB with a `K` or `M`
          suffix (e.g. `4096M`). Empty by default, which is the action's own
          unset state: it writes no `hw.ramSize` line and the hardware profile
          decides. Same runner-capacity caveat as `android_emulator_cores` —
          RAM handed to the guest is RAM taken from the host running it.
        required: false
        default: ''
        type: string
      android_emulator_heap_size:
        description: >-
          `hw.heapSize` for the Android AVD, in MB with an `M` suffix (e.g.
          `512M`). This is the per-app Dalvik/ART heap ceiling, not the device
          RAM — raise it for an app that OOMs under test, not for general
          slowness. Empty by default, which is the action's own unset state.
        required: false
        default: ''
        type: string
      android_emulator_options:
        description: >-
          Command-line options passed to the emulator binary. Default
          `-no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          -no-boot-anim`, copied from the action's own default so a caller
          that sets nothing launches exactly the emulator it launched before
          this input existed.

          THIS REPLACES THE WHOLE STRING; it does not extend it. The action
          takes one options list and there is no merge, so a caller that
          passes `-gpu host` alone silently drops `-no-window` and the
          emulator tries to open a window on a headless runner and never
          boots. Copy the full default above and edit the flag you mean to
          change.
        required: false
        default: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
        type: string
      android_flow_retry_tag:
        description: >-
          Maestro tag that marks a flow as SAFE TO RE-RUN ON ITS OWN, enabling
          per-flow retry on the Android arm. Empty (the default) disables the
          feature entirely and preserves today's behaviour exactly.

          Retry is opt-in per flow because nothing can derive isolation
          safety. Flows inherit session state and some mutate shared data, and
          a flow that reads a record an earlier flow created is
          indistinguishable, from its source, from one that creates its own.
          Re-running a dependent flow alone manufactures a FALSE failure, which
          is worse than the flake it was meant to absorb — so a flow is retried
          only where the project has asserted it stands alone.

          Set this to the tag your project uses (e.g. `retryable`) and add that
          tag to the flows that carry their own sign-in preamble and own their
          own fixtures. Leave it empty and no flow is ever re-run.

          Deliberately a SEPARATE input from `ios_flow_retry_tag`, not one
          shared switch: a project may have proved isolation on one arm and not
          on the other, and one arm's evidence is not the other's. A project
          that wants both passes the same tag string to both inputs.
        required: false
        default: ''
        type: string
      android_flow_retry_attempts:
        description: >-
          Extra attempts granted to a single retry-eligible flow that failed,
          on top of its first run. Default 1.

          1 is not timidity, it is what the evidence supports: the faults this
          exists for are single-shot DEVICE-side transients — a uiautomator
          server that died mid-command
          (`maestro.android.DeviceServerDiedException`, raised during
          `eraseText`), and a stuck IME-insets animation that starved
          UiAutomator's `waitForIdle` until every backspace timed out at 10s.
          A fault that survives a fresh isolated re-run is not one of those.
          Raising this buys green for a flow that is genuinely sick, which is
          the failure mode of retry.
        required: false
        default: 1
        type: number
      android_flow_retry_rate_percent:
        description: >-
          Ceiling on the share of executed flows allowed to fail their first
          attempt before the run is failed OUTRIGHT and nothing is retried.
          Default 10.

          This is the honest cost of retry made visible. Retry hides
          flakiness — that is what it is for — so it needs a rate above which
          it refuses to help. 10 is derived from this arm's OWN measurement
          rather than copied across for symmetry: across six consecutive
          nightly runs the Android leg lost exactly ONE flow of thirty-nine
          each time (2.6%), a different flow every time, so 10 leaves close to
          four times the observed environmental loss. It is checked BEFORE any
          retry runs, so a breach costs no extra minutes.

          One measured leg sits just the wrong side of it, and that is a
          decision rather than an oversight: a leg that lost 4 of 39 (10.3%)
          breaches by a quarter of a point and is failed with NOTHING retried.
          Four times the steady-state loss in a single night is the
          degraded-arm signature this budget exists to catch, and retrying it
          would buy a green that hides whether the arm was sick or the failures
          were real. A project with evidence that its arm legitimately loses
          four flows a night raises this input — and that decision then lives,
          reviewable, in its caller instead of baked in here.

          The rate bounds one run. The cross-run signal — a flow that keeps
          needing a retry — comes from the ledger, which every run publishes as
          `maestro-android-retries-<count>`: the count is in the artifact NAME,
          so a reader compares nights from the artifacts list without opening
          anything.
        required: false
        default: 10
        type: number
      ios_flow_retry_tag:
        description: >-
          Maestro tag that marks a flow as SAFE TO RE-RUN ON ITS OWN, enabling
          per-flow retry on the iOS arm. Empty (the default) disables the
          feature entirely and preserves today's behaviour exactly.

          Retry is opt-in per flow because nothing can derive isolation
          safety. Flows inherit session state and some mutate shared data, and
          a flow that reads a record an earlier flow created is
          indistinguishable, from its source, from one that creates its own.
          Re-running a dependent flow alone manufactures a FALSE failure, which
          is worse than the flake it was meant to absorb — so a flow is retried
          only where the project has asserted it stands alone.

          Set this to the tag your project uses (e.g. `retryable`) and add that
          tag to the flows that carry their own sign-in preamble and own their
          own fixtures. Leave it empty and no flow is ever re-run.
        required: false
        default: ''
        type: string
      ios_flow_retry_attempts:
        description: >-
          Extra attempts granted to a single retry-eligible flow that failed,
          on top of its first run. Default 1.

          1 is not timidity, it is what the evidence supports: the faults this
          exists for are single-shot host and simulator transients — a
          CoreSimulator placeholder that never got promoted, a touch-up event
          the starved host never delivered — and a fault that survives a fresh
          isolated re-run is not one of them. Raising this buys green for a
          flow that is genuinely sick, which is the failure mode of retry.
        required: false
        default: 1
        type: number
      ios_flow_retry_rate_percent:
        description: >-
          Ceiling on the share of executed flows allowed to fail their first
          attempt before the run is failed OUTRIGHT and nothing is retried.
          Default 10.

          This is the honest cost of retry made visible. Retry hides
          flakiness — that is what it is for — so it needs a rate above which
          it refuses to help. 10% is set from measurement: the environmental
          losses this feature absorbs ran at 1 flow in 41 (2.4%), so 10 leaves
          four times that headroom while a suite losing 5 of 41 still reds. It
          is checked BEFORE any retry runs, so a breach costs no extra minutes.

          The rate bounds one run. The cross-run signal — a flow that keeps
          needing a retry — comes from the ledger, which every run publishes as
          `maestro-ios-retries-<count>`: the count is in the artifact NAME, so
          a reader compares nights from the artifacts list without opening
          anything.
        required: false
        default: 10
        type: number
      concurrency_group:
        description: >-
          Concurrency group serializing whole runs that share mutable external
          state. Pass the SAME string from every suite that drives one
          environment — typically this workflow and the Playwright suite calling
          quality.yml, which accepts an identically-named input — and they queue
          one-behind-another instead of stomping each other's fixtures and test
          accounts. Key it on the ENVIRONMENT (e.g. e2e-shared-test-user-dev),
          never on github.ref: two branches keyed by ref get two different
          groups while sharing one database, which is not exclusion. It MUST
          differ from the calling workflow's own concurrency group, or the
          parent run holds a slot while waiting on a child queued for the same
          slot. Default empty = no cross-run serialization (a unique group per
          run, prior behavior preserved).
        required: false
        default: ''
        type: string
      serialize_platform_legs:
        description: >-
          Run the iOS leg to completion BEFORE the Android leg starts, instead of
          running both at once. Set this when the two legs authenticate as the
          SAME test persona: concurrently they mutate one server-side session,
          and the loser gets logged out mid-suite and asserts against a sign-in
          screen where an authenticated screen was expected. That failure looks
          exactly like a product defect and is not one — see the "Ordering the
          two platform legs" section in this file's header for the measurements.
          `concurrency_group` does NOT do this: it serializes whole workflow
          CALLS against each other (Maestro vs Playwright), not leg against leg
          inside one call. Default false = both legs start together, prior
          behavior preserved byte for byte. A failing iOS leg never suppresses
          Android — ordering here is "after", never "only if it passed". The
          cost of turning it on is the suite taking iOS PLUS Android instead of
          the slower of the two, and one idle ubuntu-latest runner held for the
          length of the iOS suite; leave it off if your legs use per-platform
          accounts, because the concurrency is free coverage in that case.
        required: false
        default: false
        type: boolean
      serialize_timeout_minutes:
        description: >-
          Ceiling for the leg-ordering job, which only does anything when
          serialize_platform_legs is on. That job waits through the pre-suite
          job AND the whole iOS suite, so it must exceed
          pre_suite_timeout_minutes + suite_timeout_minutes — and it cannot be
          derived from them, because GitHub Actions expressions have no
          arithmetic operators at all. Raise it in lockstep if you raise either
          of those. Timing out here does not lose the Android leg: that job runs
          on `!cancelled()`, so a blown budget degrades to today's concurrent
          legs with a red job naming the cause.
        required: false
        default: 150
        type: number
    secrets:
      EXPO_TOKEN:
        description: 'Expo token for EAS builds. When absent, the whole suite skips with a warning.'
        required: false
      MAESTRO_SECRET_ENV:
        description: 'Newline-separated KEY=VALUE pairs of sensitive flow variables (e.g. test-account passwords), forwarded like maestro_env. GitHub masks each line in logs.'
        required: false
      LEG_ORDER_TOKEN:
        description: >-
          Token used ONLY by the leg-ordering job to read this run's own job
          list, and only when serialize_platform_legs is true. Pass the calling
          workflow's own secrets.GITHUB_TOKEN from a caller whose own
          `permissions:` block includes `actions: read` — a forwarded secret
          carries the
          CALLER's scopes, which is what lets this workflow read the jobs API
          without DECLARING a scope. Declaring one instead would be a
          `startup_failure` for the entire run of every caller granting less
          (#2046), which is why this is a secret and not a `permissions:` entry.
          Absent or unscoped, the ordering job reports the gap and lets the
          Android leg start — it never fails the run over it.
        required: false

# `actions: read` is what makes `serialize_platform_legs` capable of ordering
# anything at all. A called workflow's `permissions:` block is a CEILING that
# zeroes everything unlisted, so a caller granting the scope had it discarded at
# this boundary wherever it was declared — which is why the ordering job read
# the jobs API, got HTTP 403, and released the Android leg on every run in every
# repository since the feature shipped. `LEG_ORDER_TOKEN` was designed to route
# around #2046 by forwarding a secret rather than declaring a scope; that route
# does not exist while this block omits `actions`.
#
# Declared explicitly rather than by OMITTING the block, which was measured as
# the other way to make it work: a callee with no `permissions:` inherits the
# caller's grant, but a consumer whose repo default is `write` then hands this
# workflow nineteen write scopes including `contents`, `packages` and
# `securityEvents` — on a workflow that runs Maestro flows and third-party
# actions, with nothing in the diff to say so. Naming the two keeps the ceiling
# a ceiling.
#
# The cost of declaring it: a caller that has NOT granted `actions: read` now
# gets a `startup_failure` for its entire run, decided before any `if:` is
# evaluated, whether or not it opted into serialization. Every `@main` caller in
# the portfolio was confirmed to grant it before this landed — there is no
# version to pin away from, so the check had to be exhaustive rather than
# hopeful.
permissions:
  contents: read
  actions: read

# Cross-run serialization is opt-in via the `concurrency_group` input, and the
# default is deadlock-safe by construction: an unset input yields a group unique
# to this run, so no run ever waits on another and behavior is identical to
# having no concurrency at all. Only a caller that passes a shared string opts
# into queueing. Mirrors quality.yml so the two e2e suites are configured the
# same way — that symmetry is the point, since the pair of them is what has to
# be mutually excluded.
concurrency:
  group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('lisa-maestro-no-serialize-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 🔍 Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      run_android: ${{ steps.check.outputs.run_android }}
      run_ios: ${{ steps.check.outputs.run_ios }}
      platforms: ${{ steps.check.outputs.platforms }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔍 Check prerequisites and compute platform matrix
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          FLOWS_DIR: ${{ inputs.flows_dir }}
          REQUIRE_PREREQUISITES: ${{ inputs.require_prerequisites }}
        run: |
          should_run=true
          missing=()
          if [[ -z "${EXPO_TOKEN// }" ]]; then
            echo "::warning::Maestro native e2e skipped - EXPO_TOKEN not configured"
            missing+=("EXPO_TOKEN is not configured")
            should_run=false
          fi
          if [[ ! -d "$FLOWS_DIR" ]]; then
            echo "::warning::Maestro native e2e skipped - flows directory '$FLOWS_DIR' not found"
            missing+=("flows directory '$FLOWS_DIR' does not exist")
            should_run=false
          fi
          # The whole point of require_prerequisites: a suite that skips its way
          # to `success` is a false green, and anything reading this workflow's
          # conclusion (a nightly gate, a release check) cannot tell it apart
          # from a suite that ran. Fail here instead, while the cause is still
          # named.
          if [[ "$REQUIRE_PREREQUISITES" == "true" && ${#missing[@]} -gt 0 ]]; then
            for reason in "${missing[@]}"; do
              echo "::error title=Maestro native e2e prerequisites missing::$reason"
            done
            echo "require_prerequisites is true, so a skipped suite is a FAILURE rather than a green run that tested nothing." >&2
            exit 1
          fi
          case "$PLATFORM" in
            android) platforms='["android"]' ;;
            ios) platforms='["ios"]' ;;
            *) platforms='["android","ios"]' ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" && "$platforms" == *'"android"'* ]]; then
            echo "run_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_android=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$should_run" == "true" && "$platforms" == *'"ios"'* ]]; then
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Lint per-flow appId
        # Cheap here, expensive later. An empty interpolated appId does not
        # announce itself: Maestro reports a launch failure with no cause, the
        # whole suite reds on its first assertion, and the shape is
        # indistinguishable by inspection from the app failing to start. That
        # costs an EAS build and an emulator boot to discover. This costs a
        # grep, before either.
        #
        # Runs only when the prerequisites held — a skipped suite has nothing
        # to lint, and failing here would convert warn-and-skip into a red for
        # every unwired adopter, which is `require_prerequisites`' job and not
        # this one's.
        if: ${{ inputs.lint_flow_app_id && steps.check.outputs.should_run == 'true' }}
        env:
          FLOWS_DIR: ${{ inputs.flows_dir }}
        run: |
          set -euo pipefail
          # The `${APP_ID}` scan deliberately covers the Maestro ROOT, not just
          # the flows directory. The drift this catches is a shared subflow
          # naming the wrong variable while every flow beside it names the
          # right one — and a shared subflow lives outside the flows directory
          # by convention, so scanning only the flows directory would miss the
          # exact file that breaks the suite.
          APP_ID_SCAN_DIR="$(dirname "$FLOWS_DIR")"
          if [[ "$APP_ID_SCAN_DIR" == "." || -z "$APP_ID_SCAN_DIR" ]]; then
            APP_ID_SCAN_DIR="$FLOWS_DIR"
          fi

          # `--include` on BOTH scans, not just the second: an unfiltered
          # recursive grep also reads whatever screenshots and .ans dumps a
          # previous debug run left under the Maestro root, and grep reports
          # ZERO matches in a file it decides is binary — so an unfiltered
          # scan can pass by refusing to read the file that breaks the suite.
          bad=$(grep -rlE --include='*.yaml' --include='*.yml' '^[[:space:]]*appId:[[:space:]]*\$\{APP_ID\}' "$APP_ID_SCAN_DIR" || true)
          if [[ -n "$bad" ]]; then
            echo "::error title=Maestro flow uses the wrong app id variable::These files declare 'appId: \${APP_ID}', but this workflow forwards the app id as MAESTRO_APP_ID. \${APP_ID} interpolates to EMPTY and Maestro fails to launch with no cause named. Rename the variable to MAESTRO_APP_ID."
            echo "$bad" >&2
            exit 1
          fi

          missing=$(grep -rLE --include='*.yaml' --include='*.yml' '^[[:space:]]*appId:[[:space:]]*\$\{MAESTRO_APP_ID\}' "$FLOWS_DIR" || true)
          if [[ -n "$missing" ]]; then
            echo "::error title=Maestro flow declares no appId::These flow files do not declare 'appId: \${MAESTRO_APP_ID}'. A flow with no appId launches nothing and reports a failure that names no cause. If a listed file is a runFlow-included SUBFLOW rather than a flow, move it outside '$FLOWS_DIR' — maestro test recurses, so anything under that directory is executed as a flow."
            echo "$missing" >&2
            exit 1
          fi

          echo "✅ every flow under '$FLOWS_DIR' declares appId: \${MAESTRO_APP_ID}"

  build:
    name: 🏗️ EAS Build (${{ matrix.platform }})
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.preflight.outputs.platforms) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # No step in this job uses the git token: the work here is an EAS
          # build / a Maestro run / a caller-supplied setup command, none of
          # which push. Left at the default, the checkout writes an
          # unscoped credential into .git/config where every subsequent
          # step — including third-party actions and the caller's own
          # command — can read it and push as the workflow. A job that
          # genuinely needs the token should say so HERE rather than
          # inherit it silently.
          persist-credentials: false

      - name: 🥟 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      - name: 🧭 Check the build profile can produce a testable app
        # Runs BEFORE the EAS setup and the build, because both mistakes it
        # catches are free to detect now and cost a full native build to
        # discover later — and when they surface later they surface as flows
        # failing on unfamiliar screens, which reads as a product bug.
        #
        # Resolved from the installed package rather than a copy in the
        # project: the same file would otherwise be edited once downstream and
        # silently stop receiving fixes. Absent (a project on an older Lisa),
        # the check is skipped rather than failing the build over its own
        # rollout.
        env:
          # Through `env:`, never interpolated into the run body. A caller
          # supplies this, and `${{ }}` inside the script would make that value
          # workflow SOURCE rather than an argument — the same reason the
          # resolved gate command travels this way in quality.yml.
          EAS_PROFILE: ${{ inputs.eas_profile }}
        run: |
          set -euo pipefail
          GUARD="node_modules/@codyswann/lisa/scripts/lisa-assert-eas-profile.mjs"
          if [ ! -f "$GUARD" ]; then
            GUARD="scripts/lisa-assert-eas-profile.mjs"
          fi
          if [ ! -f "$GUARD" ]; then
            echo "::warning title=EAS profile unchecked::No lisa-assert-eas-profile.mjs found, so the build profile was not checked. Update @codyswann/lisa to get it."
            exit 0
          fi
          node "$GUARD" --profile="$EAS_PROFILE"

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          packager: ${{ inputs.package_manager }}
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build with EAS (${{ inputs.eas_profile }} profile)
        # Deliberately NO `pre-build:eas` here: that script regenerates
        # .easignore from .gitignore, whose `google-services*.json` line then
        # excludes the committed google-services JSON from the EAS upload and
        # the Android build dies with MISSING_GOOGLE_SERVICES_JSON. The
        # committed .easignore is authoritative and is what the release
        # pipeline uses.
        #
        # Every caller-supplied value arrives through `env:`, never through a
        # `${{ }}` expansion inside the script body. An expansion is
        # substituted into the script TEXT before bash parses it, which makes a
        # caller's `eas_profile` workflow SOURCE rather than an argument — the
        # same rule the profile guard above and the flows-dir handling below
        # already follow.
        env:
          EAS_PLATFORM: ${{ matrix.platform }}
          EAS_PROFILE: ${{ inputs.eas_profile }}
          REUSE_BY_FINGERPRINT: ${{ inputs.reuse_build_by_fingerprint }}
          DIAGNOSE_QUOTA: ${{ inputs.diagnose_eas_quota_exhaustion }}
        run: |
          set -euo pipefail
          platform="$EAS_PLATFORM"
          profile="$EAS_PROFILE"

          # `eas build:download` hands back either a file or an already
          # extracted .app directory, and the two arms downstream expect one
          # shape each: an .apk for Android, a tarball for iOS.
          stage_artifact() {
            src="$1"
            if [[ "$platform" == "android" ]]; then
              cp "$src" app-android.apk
              return
            fi
            if [[ -d "$src" ]]; then
              tar -czf app-ios.tar.gz -C "$(dirname "$src")" "$(basename "$src")"
            else
              cp "$src" app-ios.tar.gz
            fi
          }

          stage_download_json() {
            src="$(jq -r '.path // empty' download.json 2>/dev/null || true)"
            if [[ -n "$src" && -e "$src" ]]; then
              stage_artifact "$src"
              return 0
            fi
            return 1
          }

          reused=0

          if [[ "$REUSE_BY_FINGERPRINT" == "true" ]]; then
            # NO step of the reuse path may fail this job. Every branch below
            # falls through to the fresh build, which is what this workflow did
            # before the input existed — so a broken EAS CLI, a fingerprint the
            # account cannot compute, or a download that 404s degrades to
            # today's behavior instead of deleting the suite from the night.
            set +e
            fp_json="$(eas fingerprint:generate \
              --platform "$platform" \
              --build-profile "$profile" \
              --json \
              --non-interactive 2>fingerprint.err)"
            fp_status=$?
            set -e
            fingerprint="$(jq -r '.hash // .fingerprintHash // empty' <<<"${fp_json:-}" 2>/dev/null || true)"

            if [[ "$fp_status" -eq 0 && -n "$fingerprint" ]]; then
              echo "Fingerprint for $platform/$profile: $fingerprint"
              set +e
              eas build:download \
                --fingerprint "$fingerprint" \
                --platform "$platform" \
                --non-interactive \
                --json > download.json 2>download.err
              dl_status=$?
              set -e
              if [[ "$dl_status" -eq 0 ]] && stage_download_json; then
                reused=1
                echo "Reusing the finished EAS build matching this fingerprint; no new cloud build started."
              else
                echo "No reusable EAS artifact for fingerprint $fingerprint."
                cat download.err >&2 || true
              fi
            else
              echo "::warning title=EAS fingerprint unavailable::Could not compute a fingerprint for $platform/$profile, so build reuse was skipped and a fresh build will be started."
              cat fingerprint.err >&2 || true
            fi

            # Fallback, and a WEAKER guarantee than the fingerprint — this is
            # simply the newest finished binary for the profile, which may have
            # been built from different native inputs. It is the arm that keeps
            # a quota-bound project running at all, so it is deliberately kept,
            # but a project that needs the binary to match the commit should
            # read the reuse line in the job log rather than assume.
            if [[ "$reused" -eq 0 ]]; then
              echo "Looking up the latest finished $profile $platform EAS build."
              set +e
              if [[ "$platform" == "ios" ]]; then
                # `--simulator` matters: a finished iOS build for this profile
                # can be a device archive, which no simulator can install.
                eas build:list \
                  --platform ios \
                  --build-profile "$profile" \
                  --status finished \
                  --simulator \
                  --limit 1 \
                  --json \
                  --non-interactive > list.json 2>list.err
              else
                eas build:list \
                  --platform android \
                  --build-profile "$profile" \
                  --status finished \
                  --limit 1 \
                  --json \
                  --non-interactive > list.json 2>list.err
              fi
              list_status=$?
              set -e
              build_id="$(jq -r '.[0].id // empty' list.json 2>/dev/null || true)"
              if [[ "$list_status" -eq 0 && -n "$build_id" ]]; then
                set +e
                eas build:download \
                  --build-id "$build_id" \
                  --non-interactive \
                  --json > download.json 2>download.err
                dl_status=$?
                set -e
                if [[ "$dl_status" -eq 0 ]] && stage_download_json; then
                  reused=1
                  echo "Reusing finished EAS $profile build $build_id after a fingerprint miss."
                else
                  cat download.err >&2 || true
                fi
              else
                cat list.err >&2 || true
              fi
            fi
          fi

          if [[ "$reused" -eq 1 ]]; then
            exit 0
          fi

          if [[ "$DIAGNOSE_QUOTA" == "true" ]]; then
            set +e
            eas build \
              --platform "$platform" \
              --profile "$profile" \
              --non-interactive \
              --wait \
              --json > build.json 2>build.err
            build_status=$?
            set -e
            # Replayed in full, always — the diagnosis is an ADDITION to the
            # operator's evidence, never a filter on it.
            cat build.err >&2 || true
            if [[ "$build_status" -ne 0 ]]; then
              if grep -q "used its iOS builds from the Free plan" build.err; then
                echo "::error title=EAS build quota exhausted::Expo refused a new iOS cloud build because this account has used its Free-plan iOS builds for the month. Nothing is wrong with the code under test. Remedies, in order: set reuse_build_by_fingerprint: true so a matching finished build is reused instead of rebuilt; upgrade the Expo plan; or wait for the monthly quota reset and re-dispatch."
              fi
              exit "$build_status"
            fi
          else
            eas build \
              --platform "$platform" \
              --profile "$profile" \
              --non-interactive \
              --wait \
              --json > build.json
          fi

          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [[ -z "$BUILD_URL" || "$BUILD_URL" == "null" ]]; then
            echo "::error::EAS build produced no artifact URL"
            jq '.' build.json
            exit 1
          fi
          if [[ "$platform" == "android" ]]; then
            curl -fsSL "$BUILD_URL" -o app-android.apk
          else
            # iOS simulator builds ship as a tarball containing the .app bundle
            curl -fsSL "$BUILD_URL" -o app-ios.tar.gz
          fi

      - name: 📤 Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            app-android.apk
            app-ios.tar.gz
          if-no-files-found: error
          retention-days: 3

  pre_suite:
    name: 🧭 Pre-suite (once per run)
    # ONE job, no matrix, no per-platform fan-out — that is the entire point.
    # `setup_command` below runs inside each platform job, and those jobs are
    # siblings with no edge between them, so it executes TWICE, CONCURRENTLY.
    # That is fine for reading a value and catastrophic for writing one: a
    # read-modify-write ("does any record have X? if not, create it") evaluated
    # from two runners against the same pre-write state can seed twice, or seed
    # two different records, after which the two legs test different fixtures.
    # This job is the single-execution seam for that work.
    #
    # Placed AFTER the builds rather than beside them, deliberately. Running it
    # in parallel with `build` would be free in wall clock, but an EAS build can
    # take the better part of an hour — and "known state" established an hour
    # before the first flow is not known state. The cost is this job's own
    # duration; the benefit is that the reset/seed is as close to the suite as
    # the graph allows.
    needs: [preflight, build]
    # `!cancelled()`: `build` is a matrix job, so ONE platform's build failure
    # marks the whole job failed. Without this, an Android build failure would
    # skip the pre-suite job and the surviving iOS leg would then run against
    # state nobody established. Same rationale as the platform jobs below.
    #
    # DELIBERATELY NOT gated on `inputs.pre_suite_command != ''`, even though
    # that reads like the obvious guard. The nightly health gate's completeness
    # rule (row 26) treats ANY job in a `mode: "run"` suite that concludes
    # something other than `success` as `incomplete_run` — that is what stops a
    # platform-narrowed dispatch from clearing a merge gate for an arm that
    # never ran. A pre-suite job that SKIPS itself whenever the input is unset
    # would therefore turn every green nightly into a blocked one for every
    # adopter who does not use this seam — which is all of them on the day this
    # lands. So the JOB always runs in a wired run and the WORK is gated
    # per-step below; an unused seam costs a few seconds and concludes green.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.pre_suite_timeout_minutes }}
    outputs:
      # Space-separated KEY=VALUE pairs. `$GITHUB_ENV` is per-job, so a job
      # output is the only channel that reaches the platform legs.
      maestro_env: ${{ steps.capture.outputs.maestro_env }}
    steps:
      - name: 🈳 Nothing to establish before the suites
        # The visible half of the always-run decision above: a reader opening a
        # green job with every step skipped should not have to work out whether
        # something silently failed to fire.
        if: ${{ inputs.pre_suite_command == '' && inputs.prepare_environment == '' }}
        run: |
          echo "No pre_suite_command was supplied; nothing to establish before the suites."
          echo "See this workflow's header for which work belongs in this seam."

      - name: 📥 Checkout repository
        if: ${{ inputs.pre_suite_command != '' || inputs.prepare_environment != '' }}
        uses: actions/checkout@v6
        with:
          # Nothing downstream needs the git token — see the build job.
          persist-credentials: false

      - name: 🥟 Setup Bun
        if: ${{ ((inputs.pre_suite_command != '' && inputs.pre_suite_install_dependencies) || inputs.prepare_environment != '') && inputs.package_manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: 🔧 Setup Node.js
        if: ${{ inputs.pre_suite_command != '' || inputs.prepare_environment != '' }}
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 📦 Install dependencies
        # Opt-in for `pre_suite_command`: the platform legs install nothing, so
        # the default keeps this job's toolchain identical to theirs. A command
        # that needs node_modules asks for it rather than every adopter paying
        # an install.
        #
        # NOT opt-in for `prepare_environment`, which implies the install. A
        # reset goes through the project's own tooling and database client far
        # more often than not, and one that needed node_modules and did not get
        # them fails in a way that reads as a broken reset rather than a missing
        # install.
        if: ${{ (inputs.pre_suite_command != '' && inputs.pre_suite_install_dependencies) || inputs.prepare_environment != '' }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *)
              echo "::error title=Unknown package_manager::'$PACKAGE_MANAGER' is not one of npm, yarn, bun."
              exit 1
              ;;
          esac

      - name: 🔧 Prepare setup command
        # Runs BEFORE the verbs, after the install — the point at which a
        # build-time environment selection can still be materialised.
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_setup_command != '' }}
        run: ${{ inputs.prepare_setup_command }}

      - name: 🧼 Prepare the environment
        # Runs BEFORE pre_suite_command, deliberately. Preparation returns the
        # environment to a known state; a project's own command then layers
        # whatever else this suite needs on top. The other order would discard
        # the command's work.
        #
        # A failure here fails this job, and the platform legs refuse to start
        # unless this job's result is on their allowlist — so an environment
        # that could not be prepared stops the suite instead of colouring it.
        if: ${{ inputs.prepare_environment != '' }}
        env:
          TARGET: ${{ inputs.prepare_environment }}
          VERBS: ${{ inputs.prepare_verbs }}
        run: |
          set -eu
          PREPARE=""
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-environment-prepare.mjs" \
            "scripts/lisa-environment-prepare.mjs" \
            "all/copy-overwrite/scripts/lisa-environment-prepare.mjs"; do
            if [ -f "$candidate" ]; then PREPARE="$candidate"; break; fi
          done
          # Unresolvable is a FAILURE, never a skip. The caller asked for a
          # prepared environment; reporting success without having prepared one
          # is indistinguishable from a healthy run.
          if [ -z "$PREPARE" ]; then
            echo "::error title=Preparation script missing::lisa-environment-prepare.mjs was not found. Install or update @codyswann/lisa, or clear prepare_environment."
            exit 1
          fi
          node "$PREPARE" --env="${TARGET}" --verbs="${VERBS}"

      - name: 🧩 Apply maestro env
        # Same env the platform legs give `setup_command`, so a command can be
        # moved between the two seams without rewiring what it can read. E2E_*
        # names (not MAESTRO_*) keep the multiline inputs out of any MAESTRO_*
        # scan.
        if: ${{ inputs.pre_suite_command != '' }}
        env:
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: 🗂️ Open the pre-suite export file
        # The cross-job counterpart to $GITHUB_ENV. Created empty so the command
        # can append unconditionally, and named in $GITHUB_ENV so the command
        # reads it the same way it would read $GITHUB_ENV.
        if: ${{ inputs.pre_suite_command != '' }}
        run: |
          EXPORT_FILE="$RUNNER_TEMP/maestro-pre-suite-env"
          : > "$EXPORT_FILE"
          echo "MAESTRO_PRE_SUITE_ENV=$EXPORT_FILE" >> "$GITHUB_ENV"

      - name: 🧭 Run pre-suite command
        # A failure here fails this job, and the platform jobs below refuse to
        # start unless this job's result is on their allowlist. Fail closed is
        # the whole contract: the command's purpose is establishing known state,
        # so "it failed but test anyway" produces a suite whose greens prove
        # nothing and whose reds are unattributable.
        if: ${{ inputs.pre_suite_command != '' }}
        run: ${{ inputs.pre_suite_command }}

      - name: 📦 Capture pre-suite exports
        id: capture
        if: ${{ inputs.pre_suite_command != '' }}
        shell: bash
        run: |
          # ALLOWLIST, not denylist, and both lists are SOURCE CONSTANTS —
          # literals in this file, never read from an input or the environment,
          # so nothing a caller or a command sets can widen what is permitted to
          # cross the job boundary.
          KEY_ALLOWLIST='^MAESTRO_[A-Za-z0-9_]+$'
          RESERVED_KEYS='MAESTRO_E2E_ARGS MAESTRO_PRE_SUITE_ENV'

          PAIRS=""
          if [[ -n "${MAESTRO_PRE_SUITE_ENV:-}" && -f "$MAESTRO_PRE_SUITE_ENV" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "${line//[[:space:]]/}" || "$line" == \#* ]] && continue
              if [[ "$line" != *=* ]]; then
                echo "::error title=Invalid pre-suite export::'$line' is not KEY=VALUE. Append lines to \$MAESTRO_PRE_SUITE_ENV in the same shape you would append to \$GITHUB_ENV."
                exit 1
              fi
              key="${line%%=*}"
              value="${line#*=}"
              if [[ ! "$key" =~ $KEY_ALLOWLIST ]]; then
                echo "::error title=Pre-suite export key not allowed::'$key' does not match ${KEY_ALLOWLIST}. Only MAESTRO_* keys are forwarded to flows, so exporting anything else would be silently inert."
                exit 1
              fi
              for reserved in $RESERVED_KEYS; do
                if [[ "$key" == "$reserved" ]]; then
                  echo "::error title=Pre-suite export key is reserved::'$key' is owned by this workflow and cannot be set by pre_suite_command."
                  exit 1
                fi
              done
              if [[ -z "$value" ]]; then
                echo "::error title=Empty pre-suite export::'$key' was exported with an empty value. Flows would interpolate nothing and fail on a correct assertion; fail here instead, where the cause is named."
                exit 1
              fi
              if [[ "$value" =~ [[:space:]] ]]; then
                echo "::error title=Pre-suite export contains whitespace::'$key' has a value containing whitespace. The flag list is word-split unquoted downstream, so the tail would be read as a flow path and abort the whole suite before flow 1."
                exit 1
              fi
              PAIRS="$PAIRS $key=$value"
            done < "$MAESTRO_PRE_SUITE_ENV"
          fi
          PAIRS="${PAIRS# }"
          # Whitespace-free values (enforced above) make a space-separated
          # single-line output exact, and single-line keeps it clear of the
          # multiline-job-output edge cases.
          echo "maestro_env=$PAIRS" >> "$GITHUB_OUTPUT"
          if [[ -z "$PAIRS" ]]; then
            echo "Pre-suite command exported no variables."
          else
            echo "Pre-suite command exported: $(echo "$PAIRS" | tr ' ' '\n' | cut -d= -f1 | tr '\n' ' ')"
          fi

  leg_order:
    name: 🚦 Leg order (iOS → Android)
    # The Android leg depends on THIS job, and this job is what waits for the
    # iOS leg. The indirection is forced: `needs` cannot contain an expression,
    # so `android` cannot conditionally depend on `ios`. The three alternatives
    # were each worse:
    #
    #   • `needs: [ios]` on android outright — serializes EVERY adopter,
    #     including the ones with per-platform personas who are paying nothing
    #     for concurrency today.
    #   • a second, duplicated android job wired `needs: [ios]`, picked by `if`
    #     — 400 duplicated lines, and whichever copy is unused concludes
    #     `skipped` on every run, which the nightly health gate's row 26 reads
    #     as `incomplete_run` for every adopter (docs/nightly-e2e-gate.md §2.4).
    #   • job-level `concurrency` shared between the two legs — that is mutual
    #     exclusion with no ORDER, and the owner asked for iOS first.
    #
    # Runs beside `pre_suite`, not after it, so the default path pays nothing:
    # with the input unset this job does no work and concludes while `pre_suite`
    # is still running, and `android` was already waiting on `pre_suite` anyway.
    # Its start time is therefore unchanged.
    #
    # DELIBERATELY NOT gated on `inputs.serialize_platform_legs`, for the same
    # reason `pre_suite` is not gated on `pre_suite_command != ''`: a job that
    # skips itself whenever the input is unset turns every green nightly into a
    # blocked one for every adopter who does not use the seam. The JOB always
    # runs in a wired run and the WORK is gated per-step below.
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    # DELIBERATELY no `permissions:` block, and this is not a style choice — it
    # is the #2046 rule, which this job originally broke. A called workflow may
    # only DOWNGRADE the caller's grant: requesting a scope the caller never
    # held is a `startup_failure` for the ENTIRE run, not a skipped job, and it
    # is decided BEFORE the run starts — so `if:` never runs, and having
    # `serialize_platform_legs` unset does not save you. An `actions: read`
    # declared here would therefore have broken every caller granting less,
    # including on paths where this job does nothing. See the identical comment
    # on `quality.yml`'s work_item_traceability job, and the regression test in
    # tests/unit/hooks/work-item-wiring.test.ts; the counterpart guard for this
    # workflow is in tests/integration/maestro-leg-order.test.ts.
    #
    # The scope this job actually needs travels as a SECRET instead
    # (`LEG_ORDER_TOKEN`), because a secret carries the CALLER's token and its
    # scopes without this workflow declaring anything. Opting in stays entirely
    # self-service: no migration, no release sequencing, and no way for an
    # adopter who never opted in to be affected.
    #
    # Its own input rather than a sum of the two budgets it actually spans:
    # GitHub Actions expressions have NO arithmetic operators, so
    # `pre_suite_timeout_minutes + suite_timeout_minutes` is a syntax error, not
    # a value. tests/integration/maestro-leg-order.test.ts pins the default here
    # above the sum of those two defaults so the three cannot drift apart
    # silently.
    timeout-minutes: ${{ inputs.serialize_timeout_minutes }}
    steps:
      - name: 🚦 Wait for the iOS leg to finish
        # Three conditions, all required. Serialization is opt-in; and there is
        # nothing to order unless BOTH legs are actually in this run, so a
        # platform-narrowed dispatch falls straight through instead of waiting
        # for a job that will never exist.
        if: ${{ inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' }}
        env:
          # The CALLER's token, forwarded as a secret. `github.token` here would
          # be this workflow's own token, capped by the `contents: read` above
          # and therefore never able to read the jobs list — and widening that
          # cap is the escalation the job comment forbids. Empty when the caller
          # did not wire the secret, which the script reports and releases on
          # rather than failing.
          GH_TOKEN: ${{ secrets.LEG_ORDER_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Matched as a SUFFIX of the API's job name: a reusable workflow's
          # jobs are reported as `<caller job name> / <this job name>`, so an
          # equality test would never match. Pinned against `jobs.ios.name` by
          # tests/integration/maestro-leg-order.test.ts, because a renamed iOS
          # job with a stale constant here is a gate that waits for nothing.
          IOS_JOB_NAME: 🍎 Maestro iOS
          POLL_SECONDS: '20'
          # How long the iOS job may take to APPEAR in the job list. This job
          # starts beside `pre_suite`, and iOS does not exist as a queued job
          # until `pre_suite` concludes, so the discovery window has to cover
          # the whole pre-suite budget. The slack is added in the shell below
          # because GitHub Actions expressions have no arithmetic.
          PRE_SUITE_TIMEOUT_MINUTES: ${{ inputs.pre_suite_timeout_minutes }}
          # Must absorb pre_suite's RUNNER ACQUISITION as well as its budget —
          # this job only learns the iOS leg exists once pre_suite concludes,
          # and pre_suite cannot conclude before it gets a runner.
          DISCOVERY_SLACK_MINUTES: '15'
          MAX_PAGES: '10'
          # Consecutive transport failures tolerated before giving up. A 90
          # minute iOS suite is ~270 requests at this poll interval, so treating
          # a single 502 as fatal would make the ordering itself the flakiest
          # thing in the run.
          MAX_TRANSIENT: '5'
        run: |
          set -uo pipefail
          DISCOVERY_SECONDS=$(( (PRE_SUITE_TIMEOUT_MINUTES + DISCOVERY_SLACK_MINUTES) * 60 ))
          page_file="$(mktemp)"
          started=$SECONDS
          transient=0

          # EVERY degraded path lands here, and none of them fails the job.
          #
          # `leg_order` can only ever DELAY the Android leg. When it cannot tell
          # what the iOS leg is doing it has two options and both are bad:
          # release Android (the legs overlap for one night — exactly the
          # behaviour of every run before this feature existed) or fail (which
          # row 26 of the nightly gate turns into a `fail` verdict for the whole
          # suite, blocking the merge gate on a night when both legs were green
          # — see docs/nightly-e2e-gate.md). Releasing is strictly the smaller
          # harm, so the annotation is the alarm and the run stays green.
          #
          # What this must NEVER do is claim the iOS leg finished. It says the
          # ordering was skipped and why.
          release() {
            # Deliberately worded to share NO phrase with the success line
            # above it. These two messages are the only way a reader — or the
            # test suite — can tell "the legs were ordered" from "the ordering
            # was abandoned", so a substring common to both would blur exactly
            # the distinction that matters.
            echo "::warning title=Leg order could not order the legs::$1 The Android leg is starting anyway, so the two platform legs may overlap for this run — which is the behaviour serialize_platform_legs was turned on to avoid. No claim is made about the iOS suite's state; the ordering was skipped."
            exit 0
          }

          if [[ -z "${GH_TOKEN// }" ]]; then
            release "No LEG_ORDER_TOKEN secret was passed, so this run's job list cannot be read. In the calling workflow, forward its own secrets.GITHUB_TOKEN as the LEG_ORDER_TOKEN secret, and add 'actions: read' to that workflow's own permissions block. It has to be a forwarded secret rather than a permission declared in the reusable workflow: a called workflow requesting a scope its caller never granted is a startup_failure for the entire run."
          fi

          while true; do
            total=0
            pending=0
            page=1
            sweep_ok=true
            while true; do
              # Capture the status rather than relying on `-f`, so a permission
              # problem (permanent, and fixable only by the caller) is told
              # apart from a 502 (transient, and fixed by asking again).
              status="$(curl -sSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o "$page_file" \
                -w '%{http_code}' \
                "$API_URL/repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100&page=$page")" || status="000"
              case "$status" in
                200) ;;
                401|403|404)
                  release "The jobs API answered HTTP $status, which is a token problem and will not fix itself by retrying. The LEG_ORDER_TOKEN secret must carry 'actions: read' — grant that scope in the CALLING workflow's own permissions block, and forward that workflow's secrets.GITHUB_TOKEN as LEG_ORDER_TOKEN."
                  ;;
                *)
                  transient=$(( transient + 1 ))
                  if [[ "$transient" -ge "$MAX_TRANSIENT" ]]; then
                    release "The jobs API failed $transient times in a row (last: HTTP $status)."
                  fi
                  echo "Jobs API returned HTTP $status (transient $transient/$MAX_TRANSIENT); retrying."
                  sweep_ok=false
                  break
                  ;;
              esac
              matched="$(jq --arg name "$IOS_JOB_NAME" '[.jobs[]? | select(.name | endswith($name))] | length' "$page_file" 2>/dev/null)" || matched=""
              unfinished="$(jq --arg name "$IOS_JOB_NAME" '[.jobs[]? | select(.name | endswith($name)) | select(.status != "completed")] | length' "$page_file" 2>/dev/null)" || unfinished=""
              returned="$(jq '.jobs? // [] | length' "$page_file" 2>/dev/null)" || returned=""
              # A 200 carrying something that is not the expected JSON — an HTML
              # error page, a truncated body — must not be read as "no jobs".
              if [[ -z "$matched" || -z "$unfinished" || -z "$returned" ]]; then
                transient=$(( transient + 1 ))
                if [[ "$transient" -ge "$MAX_TRANSIENT" ]]; then
                  release "The jobs API returned $transient unparseable bodies in a row."
                fi
                echo "Jobs API body was not the expected JSON (transient $transient/$MAX_TRANSIENT); retrying."
                sweep_ok=false
                break
              fi
              total=$(( total + matched ))
              pending=$(( pending + unfinished ))
              if [[ "$returned" -lt 100 ]]; then
                break
              fi
              page=$(( page + 1 ))
              if [[ "$page" -gt "$MAX_PAGES" ]]; then
                release "This run has more than $MAX_PAGES pages of jobs, so the job list could not be read to the end."
              fi
            done
            if [[ "$sweep_ok" != "true" ]]; then
              sleep "$POLL_SECONDS"
              continue
            fi
            # A clean sweep resets the streak: MAX_TRANSIENT counts CONSECUTIVE
            # failures, so a flaky hour does not accumulate into a false verdict.
            transient=0
            # The absent case is NOT the done case. Zero matching jobs means
            # "iOS has not been created yet" or "the name constant is stale",
            # and neither of those is "iOS finished". Reporting the leg complete
            # here would be a guard that passes because it looked at nothing —
            # so this path releases with a warning that says exactly that,
            # rather than claiming a terminal iOS leg.
            if [[ "$total" -eq 0 ]]; then
              if [[ $(( SECONDS - started )) -ge "$DISCOVERY_SECONDS" ]]; then
                release "No job in this run has a name ending in '$IOS_JOB_NAME' after ${DISCOVERY_SECONDS}s. Either the iOS job was renamed without updating IOS_JOB_NAME in this workflow, or it never entered the run."
              fi
              echo "iOS leg not in the job list yet; waiting ($(( SECONDS - started ))s elapsed)."
              sleep "$POLL_SECONDS"
              continue
            fi
            if [[ "$pending" -eq 0 ]]; then
              # Terminal is terminal. A FAILED iOS leg releases Android exactly
              # like a passing one — the point of this job is that the two legs
              # never touch the persona at the same time, not that Android is
              # only worth running when iOS was green. Gating on conclusion
              # would let one flaky iOS flow silently halve the suite.
              #
              # This is the ONLY line that may claim the iOS leg finished, and
              # it is reachable only with at least one matching job, all of
              # them `completed`.
              echo "iOS leg finished ($total job(s), terminal). Releasing the Android leg."
              exit 0
            fi
            echo "iOS leg still running ($pending of $total job(s) not completed); waiting."
            sleep "$POLL_SECONDS"
          done

      - name: 🚦 Report the ordering decision
        env:
          SERIALIZE: ${{ inputs.serialize_platform_legs }}
          RUN_IOS: ${{ needs.preflight.outputs.run_ios }}
          RUN_ANDROID: ${{ needs.preflight.outputs.run_android }}
        run: |
          if [[ "$SERIALIZE" != "true" ]]; then
            echo "serialize_platform_legs is off — both platform legs start together (default behavior)."
          elif [[ "$RUN_IOS" != "true" || "$RUN_ANDROID" != "true" ]]; then
            echo "Only one platform leg is in this run (ios=$RUN_IOS android=$RUN_ANDROID) — nothing to order."
          else
            echo "iOS leg complete; the Android leg is released."
          fi

  inter_leg_prepare:
    name: 🧼 Prepare between legs
    # Its own job rather than extra steps on `leg_order`, and that is a
    # correctness requirement rather than tidiness. `android` deliberately runs
    # when `leg_order` FAILS, so that a broken serializer degrades to concurrent
    # legs instead of dropping the Android suite entirely. A reset placed in
    # that job would inherit the same fail-OPEN treatment, and a reset that
    # failed would be waved through exactly like an ordering hiccup — the one
    # outcome this whole subsystem exists to prevent.
    #
    # Sitting here instead, it is result-gated by `android` on the same
    # allowlist `pre_suite` uses: established state is a precondition for
    # testing, and mere ordering is not.
    needs: [preflight, build, leg_order]
    # Always runs in a wired run; the WORK is gated per-step. A job that skips
    # itself whenever an input is unset concludes `skipped`, which the nightly
    # health gate's completeness rule reads as `incomplete_run` — turning every
    # green nightly into a blocked one for every adopter not using this seam,
    # which is all of them on the day this lands.
    if: ${{ !cancelled() && needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.prepare_timeout_minutes }}
    steps:
      - name: 🈳 No between-legs preparation for this run
        if: ${{ !(inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true') }}
        env:
          TARGET: ${{ inputs.prepare_environment }}
          BETWEEN: ${{ inputs.prepare_between_legs }}
          SERIALIZE: ${{ inputs.serialize_platform_legs }}
          RUN_IOS: ${{ needs.preflight.outputs.run_ios }}
          RUN_ANDROID: ${{ needs.preflight.outputs.run_android }}
        run: |
          if [[ -z "$TARGET" ]]; then
            echo "prepare_environment is unset — this workflow prepares nothing."
          elif [[ "$BETWEEN" != "true" ]]; then
            echo "prepare_between_legs is off — the environment is prepared once, before both legs."
          elif [[ "$SERIALIZE" != "true" ]]; then
            echo "serialize_platform_legs is off, so the legs run CONCURRENTLY."
            echo "Preparing between them would wipe the environment underneath a running suite."
          else
            echo "Only one platform leg is in this run (ios=$RUN_IOS android=$RUN_ANDROID) — there is no 'between'."
          fi

      - name: 🛑 Refuse to prepare while the leg order is unknown
        # `leg_order` is what proves the iOS leg has FINISHED. If it did not
        # succeed — it failed, timed out, or could not read the jobs API — then
        # iOS may still be running, and a reset would empty the environment
        # underneath it. Refusing here fails closed and stops the Android leg,
        # which is the right answer: this is exactly the case where nobody can
        # say what state the environment is in.
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result != 'success' }}
        env:
          LEG_ORDER_RESULT: ${{ needs.leg_order.result }}
        run: |
          echo "::error title=Cannot prepare between legs::The ordering gate concluded '${LEG_ORDER_RESULT}', so this run cannot establish that the iOS leg has finished. Resetting now could wipe the environment underneath a running suite, and testing without resetting would run the Android leg against unknown state."
          exit 1

      - name: 📥 Checkout repository
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' }}
        uses: actions/checkout@v6
        with:
          # Nothing downstream needs the git token — see the build job.
          persist-credentials: false

      - name: 🥟 Setup Bun
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' && inputs.package_manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not `latest`. This job runs a DESTRUCTIVE verb, and a
          # toolchain that can change without a commit is a change nobody
          # reviewed on the one path where that matters most. Matches the pin
          # every other job in this repository's workflows already uses.
          bun-version: '1.3.8'

      - name: 🔧 Setup Node.js
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' }}
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 📦 Install dependencies
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            *)
              echo "::error title=Unknown package_manager::'$PACKAGE_MANAGER' is not one of npm, yarn, bun."
              exit 1
              ;;
          esac

      - name: 🔧 Prepare setup command
        # Runs BEFORE the verbs, after the install — the point at which a
        # build-time environment selection can still be materialised.
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' && inputs.prepare_setup_command != '' }}
        run: ${{ inputs.prepare_setup_command }}

      - name: 🧼 Prepare the environment for the Android leg
        if: ${{ inputs.prepare_environment != '' && inputs.prepare_between_legs && inputs.serialize_platform_legs && needs.preflight.outputs.run_ios == 'true' && needs.preflight.outputs.run_android == 'true' && needs.leg_order.result == 'success' }}
        env:
          TARGET: ${{ inputs.prepare_environment }}
          VERBS: ${{ inputs.prepare_verbs }}
        run: |
          set -eu
          PREPARE=""
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-environment-prepare.mjs" \
            "scripts/lisa-environment-prepare.mjs" \
            "all/copy-overwrite/scripts/lisa-environment-prepare.mjs"; do
            if [ -f "$candidate" ]; then PREPARE="$candidate"; break; fi
          done
          if [ -z "$PREPARE" ]; then
            echo "::error title=Preparation script missing::lisa-environment-prepare.mjs was not found. Install or update @codyswann/lisa, or clear prepare_environment."
            exit 1
          fi
          echo "The iOS leg is finished; preparing \"${TARGET}\" before the Android leg."
          node "$PREPARE" --env="${TARGET}" --verbs="${VERBS}"

  android:
    name: 🤖 Maestro Android
    # `leg_order` is in `needs` purely for the EDGE — it is what makes GitHub
    # hold this job until that one concludes, and `leg_order` is what waits for
    # the iOS leg when serialization is on. It deliberately appears in no `if`
    # clause below: the existing `!cancelled()` is what lets this job run when
    # `leg_order` fails or times out, so a broken serializer degrades to today's
    # concurrent behavior (loudly, with a red job) instead of dropping the
    # entire Android suite. Contrast `pre_suite`, which IS result-gated, because
    # established state is a precondition for testing and mere ordering is not.
    needs: [preflight, build, pre_suite, leg_order, inter_leg_prepare]
    runs-on: ubuntu-latest
    # Caller-tunable, defaulting to 90 to match the iOS job: the 60 inherited
    # from frontend-v2's original workflow started timing out once its suite
    # grew (nightly 29322073759 — the Android leg was cancelled mid-suite at
    # exactly 60:00). Jobs end when the suite ends, so fast suites pay nothing
    # for the headroom, and a project whose suite outgrows 90 raises
    # suite_timeout_minutes rather than waiting on a Lisa release.
    timeout-minutes: ${{ inputs.suite_timeout_minutes }}
    # !cancelled(): `needs: build` is a matrix job, so one platform's build
    # failure marks the whole job failed and would skip BOTH test jobs. Run
    # whenever this platform's artifact might exist — if its own build leg
    # failed, the download-artifact step fails fast with a clear error.
    #
    # The pre-suite clause is an ALLOWLIST of results this job will start
    # after, not a denylist of ones it won't: `success` (the job ran — with or
    # without a command) and `skipped` (the preflight said this project is not
    # wired, in which case run_android is false anyway; kept so the allowlist
    # stays correct if that guard ever changes). `failure`, `cancelled`, and
    # anything GitHub adds later all fall through to "do not start".
    # `!cancelled()` deliberately does NOT cover this — it is what lets a job
    # run despite a failed dependency, which is right for a build artifact and
    # wrong for established state.
    #
    # `inter_leg_prepare` is on the SAME allowlist and for the same reason. It
    # is not covered by `!cancelled()` either: a between-legs reset that failed
    # means this leg would run against unknown state, which is the one thing a
    # suite must never do quietly.
    if: ${{ !cancelled() && needs.preflight.outputs.run_android == 'true' && contains(fromJSON('["success", "skipped"]'), needs.pre_suite.result) && contains(fromJSON('["success", "skipped"]'), needs.inter_leg_prepare.result) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing downstream needs the git token — see the build job.
          persist-credentials: false

      - name: 📥 Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-android

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Install Maestro
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          # `maestro_version` is empty by default, which installs whatever
          # get.maestro.mobile.dev serves today. That is a deliberate choice,
          # not an oversight: pinning on a single bad night would be an
          # assumption dressed as a fix. The version REPORT step below is what
          # makes the pin decision answerable from history instead of from a
          # guess — and it prints the RESOLVED version, so a pin that fails to
          # take shows up as a wrong number rather than as a silent no-op.
          if [[ -n "$MAESTRO_VERSION_PIN" ]]; then
            export MAESTRO_VERSION="$MAESTRO_VERSION_PIN"
          fi
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 🔎 Report toolchain versions
        # To the JOB LOG and the step summary, never only to the debug
        # artifact. AcmeOrgD could not test "did Maestro 2.8.0 regress iOS
        # driver startup?" against its own history precisely because the
        # version existed nowhere but inside artifacts that had aged out.
        # A version you cannot read after the fact is a version you cannot
        # correlate with a failure.
        run: |
          MAESTRO_RESOLVED=$(maestro --version 2>&1 | tail -1)
          {
            echo "### 🤖 Android toolchain"
            echo ""
            echo "| tool | version |"
            echo "| --- | --- |"
            echo "| Maestro CLI | \`${MAESTRO_RESOLVED}\` |"
            echo "| Maestro pin requested | \`${MAESTRO_VERSION_PIN:-(unpinned)}\` |"
            echo "| Java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Node | \`$(node --version)\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}

      - name: 🔓 Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🧩 Apply maestro env
        # E2E_* names (not MAESTRO_*) so the multiline inputs never leak into
        # the MAESTRO_* scan in the assemble step below.
        env:
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: 🧭 Apply pre-suite env
        # $GITHUB_ENV is per-job, so the pre-suite command's exports arrive as a
        # job OUTPUT and are re-applied here. Placed before `setup_command` so a
        # per-leg command can read what the once-per-run command established.
        if: ${{ needs.pre_suite.result == 'success' && needs.pre_suite.outputs.maestro_env != '' }}
        env:
          PRE_SUITE_ENV: ${{ needs.pre_suite.outputs.maestro_env }}
        run: |
          # Unquoted on purpose: the pairs are space-separated and every value
          # was proven whitespace-free by the capture step that produced them.
          # shellcheck disable=SC2086
          for pair in $PRE_SUITE_ENV; do
            echo "$pair" >> "$GITHUB_ENV"
          done

      - name: 🎯 Run setup command
        # Project-specific, PER-LEG preparation (e.g. reading a seed entity id
        # that already exists). The command exports values for the flows by
        # appending MAESTRO_*=value lines to $GITHUB_ENV; a failure here fails
        # the run rather than letting flows interpolate empty values.
        #
        # This step runs in BOTH platform jobs, and those jobs run
        # concurrently — so this command executes twice, at the same time, on
        # two runners. Idempotent and read-only work only. Anything that
        # mutates shared state belongs in `pre_suite_command`.
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}

      - name: 🧮 Assemble Maestro flags
        env:
          MAESTRO_APP_ID: ${{ inputs.android_app_id }}
          EXCLUDE_TAGS: ${{ inputs.android_exclude_tags }}
          INCLUDE_TAGS: ${{ inputs.android_include_tags }}
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          ARGS=""
          if [[ -n "$EXCLUDE_TAGS" ]]; then
            ARGS="--exclude-tags=$EXCLUDE_TAGS"
          fi
          if [[ -n "$INCLUDE_TAGS" ]]; then
            ARGS="$ARGS --include-tags=$INCLUDE_TAGS"
          fi
          KEYS=$(
            {
              printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | grep '=' | grep -v '^#' | cut -d= -f1
              env | grep -o '^MAESTRO_[A-Za-z0-9_]*'
            } | sort -u
          )
          for key in $KEYS; do
            [[ "$key" == "MAESTRO_E2E_ARGS" ]] && continue
            value="${!key}"
            [[ -z "$value" ]] && continue
            ARGS="$ARGS -e $key=$value"
          done
          echo "MAESTRO_E2E_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: 🧾 Write the Android suite driver
        # WHY THE ANDROID SUITE RUNS FROM A FILE — this is the whole reason
        # per-flow retry could not simply be copied across from the iOS arm.
        #
        # `android-emulator-runner` splits `script:` on newlines and executes
        # each surviving line as its own `sh -c` (`parseScript` in
        # `src/script-parser.ts`, then `exec.exec('sh', ['-c', script])` in
        # `src/main.ts`). Retry needs shell state that outlives a single
        # command — a function to call twice, a failed-flow list, a loop
        # counter, a ledger being accumulated — and none of that crosses a
        # per-line `sh -c`. The two obvious alternatives are both worse:
        #
        #   * a LATER step, after the action: the emulator exists only for the
        #     duration of the action, so by the time a following step could
        #     read the JUnit report there is no device left to re-run anything
        #     on;
        #   * a SECOND invocation of the action: it boots and provisions a
        #     fresh AVD — minutes of setup to re-run one flow, on a device
        #     whose state is not the state the flow failed in.
        #
        # The seam that does work is the one the per-line rule leaves open: a
        # single line may INVOKE A FILE, and that file is one bash process
        # holding as much state as it likes. So the suite policy is written
        # here, as an ordinary multi-line `run:` step, and the action's script
        # calls it while the emulator is still up.
        #
        # This step takes no `${{ }}` expansion and needs no emulator: every
        # input reaches the driver as an environment variable on the action
        # step below. The driver is therefore the same bytes on every run,
        # which is what lets a test execute the real thing rather than a copy
        # of it.
        shell: bash
        run: |
          cat > maestro-android-suite.sh <<'MAESTRO_ANDROID_DRIVER'
          #!/usr/bin/env bash
          # Android suite driver. Written by the step above and invoked as ONE
          # line from `android-emulator-runner`'s `script:`, because per-flow
          # retry needs a process to live in. See that step for the reasoning.
          #
          # `-e` and `-o pipefail` are set HERE rather than inherited. The
          # action runs this through `sh -c`, and the suite invocation below is
          # piped into `tee` — so without pipefail the status read would be
          # tee's (always 0) and a failed suite would report success. This is
          # the same trap the iOS arm avoids with an explicit `shell: bash`.
          set -eo pipefail

          # MAESTRO_E2E_ARGS is a flag list that needs word splitting.
          # shellcheck disable=SC2086
          run_target() {
            if [ -n "$FLOW_RUNNER" ]; then
              bash "$FLOW_RUNNER" "$1" maestro-debug $MAESTRO_E2E_ARGS "$2"
            else
              maestro test "$2" \
                $MAESTRO_E2E_ARGS \
                --format junit \
                --output "$1" \
                --debug-output maestro-debug
            fi
          }

          run_suite() {
            run_target maestro-android-report.xml "$FLOWS_DIR"
          }

          # ------------------------------------------------------------------
          # Per-flow retry — state, helpers, and the policy that uses them.
          # Deliberately the same shape, names and semantics as the iOS arm's
          # copy, so the two read as one feature; the differences are the
          # report name, the platform label and the faults described below.
          #
          # WHAT THIS ARM LOST BEFORE IT HAD THIS, stated plainly so the next
          # reader does not have to rediscover it: Android carried no retry of
          # any kind, so one environmental fault in one flow of forty reddened
          # the whole leg. Measured on a consumer's nightly: SIX consecutive
          # runs, each failing exactly ONE flow, a DIFFERENT flow every time.
          # Every fix held and none regressed — which is a suite with no shock
          # absorber, not a suite full of defects.
          #
          # Two of those losses were diagnosed to the device, and neither has a
          # fix available in flow YAML:
          #
          #   * `maestro.android.DeviceServerDiedException` raised during
          #     `eraseText` — the uiautomator server died mid-command. Its
          #     JUnit `<failure>` element was BLANK.
          #   * A stuck IME-insets animation starved UiAutomator's
          #     `waitForIdle`: every backspace timed out at 10s and only 12 of
          #     16 were delivered before the flow was killed. The signature was
          #     25 `animations-not-complete` events on the two affected flows
          #     against 0-1 across the other thirty-nine.
          #
          # DO NOT gate this retry on the failure TEXT. The blank `<failure>`
          # above is the whole argument: there was no string to match. The
          # sibling arm has a measured case whose `<failure>` read, in its
          # entirety, `Unknown error`. A retry keyed on an error string would
          # be the same too-narrow regex this exists to replace. The report is
          # read for WHICH flows failed, never for why.
          # ------------------------------------------------------------------
          LEDGER="maestro-android-retries.txt"
          ROWS="maestro-android-retry-rows.txt"
          : > "$ROWS"
          RETRY_ENABLED=false
          if [ -n "$FLOW_RETRY_TAG" ]; then
            RETRY_ENABLED=true
          fi
          EXECUTED=0
          FAILED_COUNT=0
          SKIPPED_COUNT=0
          RETRIED=0
          RECOVERED=0
          UNRECOVERED=0
          BREACH=false

          # Count the `<testcase` elements a report actually contains. Same
          # reading as the flow-count step: the elements are what happened, the
          # `tests="N"` attribute is what the writer claimed.
          count_testcases() {
            { grep -o '<testcase' "$1" || true; } | wc -l | tr -d ' '
          }

          # The flow FILES that failed, one per line, deduped and sorted.
          #
          # Sorted on purpose, not as a tidiness habit: the ledger this feeds
          # is compared across nights and across arms, and Maestro's execution
          # order is not a stable key. A set that reorders itself must not read
          # as a different set.
          #
          # The split at EVERY `<testcase` is also load-bearing. A greedy match
          # over `<testcase .../>` swallows the self-closing slash and then
          # hunts for the next `</testcase>`, which merges a PASSING case into
          # the following failing one and reports the passing flow's name
          # against the failing flow's message. Splitting first means a record
          # can hold at most one case's body. `${record%%>*}` then trims the
          # record to its open tag before `file=` is read, so failure TEXT that
          # happens to contain `file="` cannot be mistaken for the attribute.
          failed_flow_files() {
            tr '\n' ' ' < "$1" \
              | awk '{ gsub(/<testcase/, "\n<testcase"); print }' \
              | while IFS= read -r record; do
                  case "$record" in
                    "<testcase"*) ;;
                    *) continue ;;
                  esac
                  case "$record" in
                    *"<failure"* | *"<error"*) ;;
                    *) continue ;;
                  esac
                  printf '%s\n' "${record%%>*}" \
                    | sed -n 's/.*file="\([^"]*\)".*/\1/p'
                done \
              | sed '/^$/d' \
              | LC_ALL=C sort -u
          }

          # Resolve a report's `file` attribute to a path on disk. The reported
          # path is repo-relative and exact in every report this workflow
          # produces; the flows-dir fallback keeps reports from older runners
          # readable. Mirrors the classifier's `resolveFlowPath`.
          resolve_flow_path() {
            if [ -f "$1" ]; then
              printf '%s\n' "$1"
              return 0
            fi
            if [ -n "$FLOWS_DIR" ] && [ -f "$FLOWS_DIR/$(basename "$1")" ]; then
              printf '%s\n' "$FLOWS_DIR/$(basename "$1")"
              return 0
            fi
            return 1
          }

          # Is this flow SAFE to re-run on its own?
          #
          # Nothing can derive that. A flow that reads a record an earlier flow
          # created looks exactly like one that creates its own, so no
          # inspection of the file can prove independence — and a wrong guess
          # here manufactures a false failure, which is worse than the flake it
          # was meant to absorb. So eligibility is DECLARED, per flow, by a
          # Maestro tag the project names in `android_flow_retry_tag`. Untagged
          # is never re-run. A project that configures no tag retries nothing
          # and behaves exactly as it does today. Silence produces the safe
          # answer, never the flattering one — the same asymmetry the flake
          # classifier is built on.
          #
          # Both `tags: [a, b]` and the block form are accepted, and only the
          # flow's Maestro header — everything before the first `---` — is read.
          flow_is_retryable() {
            if [ ! -f "$1" ]; then
              return 1
            fi
            awk -v want="$FLOW_RETRY_TAG" '
              /^---[[:space:]]*$/ { exit }
              /^tags:/ {
                intags = 1
                rest = $0
                sub(/^tags:[[:space:]]*/, "", rest)
                if (rest ~ /^\[/) {
                  gsub(/[][,]/, " ", rest)
                  n = split(rest, parts, /[[:space:]]+/)
                  for (i = 1; i <= n; i++) {
                    gsub(/["]/, "", parts[i])
                    if (parts[i] == want) { found = 1 }
                  }
                  intags = 0
                }
                next
              }
              intags == 1 && /^[[:space:]]*-[[:space:]]/ {
                v = $0
                sub(/^[[:space:]]*-[[:space:]]*/, "", v)
                gsub(/[[:space:]"]/, "", v)
                if (v == want) { found = 1 }
                next
              }
              intags == 1 && /^[^[:space:]#]/ { intags = 0 }
              END { exit(found ? 0 : 1) }
            ' "$1"
          }

          # The ledger is the point of this feature, not a by-product of it.
          # A retry that leaves no trace turns a flow failing 40% of the time
          # into a permanently green flow nobody ever looks at, and real
          # defects get found precisely because flakes fail loudly. EVERY run
          # writes this file — including a clean one, so "0 retries" is a
          # recorded reading rather than an absence.
          write_ledger() {
            RATE=0
            if [ "$EXECUTED" -gt 0 ]; then
              RATE=$(( FAILED_COUNT * 100 / EXECUTED ))
            fi
            {
              echo "platform=android"
              echo "retry_enabled=$RETRY_ENABLED"
              echo "retry_tag=$FLOW_RETRY_TAG"
              echo "retry_attempts_allowed=$FLOW_RETRY_ATTEMPTS"
              echo "retry_rate_threshold_percent=$FLOW_RETRY_RATE_PERCENT"
              echo "executed=$EXECUTED"
              echo "failed_first_attempt=$FAILED_COUNT"
              echo "retried=$RETRIED"
              echo "recovered=$RECOVERED"
              echo "unrecovered=$UNRECOVERED"
              echo "not_eligible=$SKIPPED_COUNT"
              echo "retry_rate_percent=$RATE"
              echo "rate_breach=$BREACH"
              LC_ALL=C sort "$ROWS"
            } > "$LEDGER"
            cat "$LEDGER"
          }

          record_row() {
            printf 'flow|%s|%s|%s\n' "$1" "$2" "$3" >> "$ROWS"
          }

          count_report_flows() {
            if [ -f maestro-android-report.xml ]; then
              count_testcases maestro-android-report.xml
            else
              echo 0
            fi
          }

          retry_failed_flows() {
            if [ -f maestro-android-report.xml ]; then
              EXECUTED=$(count_testcases maestro-android-report.xml)
              FAILED_LIST=$(failed_flow_files maestro-android-report.xml)
            else
              FAILED_LIST=""
            fi
            if [ -n "$FAILED_LIST" ]; then
              FAILED_COUNT=$(printf '%s\n' "$FAILED_LIST" | wc -l | tr -d ' ')
            fi

            if [ "$RETRY_ENABLED" != "true" ]; then
              SKIPPED_COUNT=$FAILED_COUNT
              echo "::notice::Per-flow retry is off (android_flow_retry_tag is empty) — $FAILED_COUNT failed flow(s) stand."
              write_ledger
              return 1
            fi

            if [ "$FAILED_COUNT" -eq 0 ]; then
              echo "::notice::The suite failed but its report names no failed flow — there is nothing to re-run."
              write_ledger
              return 1
            fi

            # The rate budget is checked BEFORE anything is re-run, and a
            # breach means nothing is re-run at all. Above the budget the arm
            # is degraded or the failures are real; either way, spending the
            # job's remaining minutes on retries buys a green that hides which
            # of the two it was.
            if [ "$EXECUTED" -gt 0 ] && [ "$(( FAILED_COUNT * 100 ))" -gt "$(( FLOW_RETRY_RATE_PERCENT * EXECUTED ))" ]; then
              BREACH=true
              SKIPPED_COUNT=$FAILED_COUNT
              while IFS= read -r reported; do
                if [ -n "$reported" ]; then
                  record_row "$reported" 1 over-budget
                fi
              done <<< "$FAILED_LIST"
              echo "::error title=Maestro retry budget exceeded (android)::$FAILED_COUNT of $EXECUTED flow(s) failed on the first attempt, above the ${FLOW_RETRY_RATE_PERCENT}% budget. NOTHING was retried. A rate this high is a degraded arm or a real regression, and retrying would spend the job's budget hiding which."
              write_ledger
              return 1
            fi

            ELIGIBLE_LIST=""
            SKIPPED_LIST=""
            while IFS= read -r reported; do
              if [ -z "$reported" ]; then
                continue
              fi
              resolved=$(resolve_flow_path "$reported" || true)
              if [ -n "$resolved" ] && flow_is_retryable "$resolved"; then
                ELIGIBLE_LIST=$(printf '%s\n%s' "$ELIGIBLE_LIST" "$resolved")
              else
                SKIPPED_LIST=$(printf '%s\n%s' "$SKIPPED_LIST" "$reported")
              fi
            done <<< "$FAILED_LIST"
            ELIGIBLE_LIST=$(printf '%s\n' "$ELIGIBLE_LIST" | sed '/^$/d' | LC_ALL=C sort -u)
            SKIPPED_LIST=$(printf '%s\n' "$SKIPPED_LIST" | sed '/^$/d' | LC_ALL=C sort -u)

            while IFS= read -r skipped; do
              if [ -n "$skipped" ]; then
                SKIPPED_COUNT=$(( SKIPPED_COUNT + 1 ))
                record_row "$skipped" 1 not-eligible
                echo "::notice::$skipped failed and carries no '$FLOW_RETRY_TAG' tag — not re-run. Tag it only if it is genuinely safe to run on its own."
              fi
            done <<< "$SKIPPED_LIST"

            while IFS= read -r flow; do
              if [ -z "$flow" ]; then
                continue
              fi
              attempt=0
              outcome=unrecovered
              while [ "$attempt" -lt "$FLOW_RETRY_ATTEMPTS" ]; do
                attempt=$(( attempt + 1 ))
                slug=$(printf '%s' "$flow" | tr -c 'A-Za-z0-9._-' '-')
                retry_report="maestro-android-retry-${slug}-${attempt}.xml"
                echo "::warning title=Maestro flow retried (android)::$flow failed and is being re-run on its own (attempt $(( attempt + 1 ))). A retry is a SYMPTOM. Read the maestro-android-retries artifact before treating this run as a clean green."
                if run_target "$retry_report" "$flow" 2>&1 | tee "maestro-android-retry-${slug}-${attempt}.log"; then
                  ran=0
                  if [ -f "$retry_report" ]; then
                    ran=$(count_testcases "$retry_report")
                  fi
                  if [ "$ran" -eq 0 ]; then
                    # A re-run that executed nothing exits 0. Trusting that
                    # status would turn every tag-filtered flow into a
                    # permanent false green — the same fail-open shape as a
                    # suite reporting success having tested nothing.
                    echo "::error title=Retry executed nothing (android)::The isolated re-run of $flow succeeded having executed 0 flows, so this run's tag filters exclude it. Counting it as NOT recovered: a zero-flow re-run proves nothing."
                    outcome=vacuous
                    break
                  fi
                  outcome=recovered
                  break
                fi
              done
              RETRIED=$(( RETRIED + 1 ))
              record_row "$flow" "$(( attempt + 1 ))" "$outcome"
              if [ "$outcome" = "recovered" ]; then
                RECOVERED=$(( RECOVERED + 1 ))
              else
                UNRECOVERED=$(( UNRECOVERED + 1 ))
              fi
            done <<< "$ELIGIBLE_LIST"

            write_ledger

            if [ "$FAILED_COUNT" -gt 0 ] && [ "$RECOVERED" -eq "$FAILED_COUNT" ]; then
              echo "::notice title=Android suite green only after per-flow retry::$RECOVERED of $EXECUTED flow(s) needed an isolated re-run. This is NOT the same result as a first-time green; a flow that keeps appearing here is a defect, not luck."
              return 0
            fi
            return 1
          }

          if run_suite 2>&1 | tee maestro-android-run-1.log; then
            EXECUTED=$(count_report_flows)
            write_ledger
            exit 0
          fi

          # There is no WHOLE-SUITE retry on this arm, and adding one would be
          # a different feature with a worse trade. The iOS arm re-runs its
          # suite for exactly one cause — an XCUITest driver that never bound
          # its port, losing every flow before the first assertion, so the
          # re-run costs nothing that was not already lost. Android has no
          # equivalent single point of total loss to key on: the action's own
          # script proves the device is online, awake and unlocked before
          # Maestro starts, and a suite that dies wholesale here writes no
          # report at all, which the zero-flow assertion already owns. A
          # blanket suite retry would instead double an hour-long run every
          # time one assertion reds.
          echo "::notice::Suite failed on flow results, not before the first flow — not retrying the whole suite."
          if retry_failed_flows; then
            exit 0
          fi
          exit 1
          MAESTRO_ANDROID_DRIVER

      - name: 🧹 Reclaim runner disk before the emulator
        # MUST stay immediately before `reactivecircus/android-emulator-runner`.
        # The emulator creates its userdata partition at launch, and a runner
        # too full to create it does not fail loudly: the emulator process dies
        # in ~0.2s with `FATAL | Not enough space to create userdata partition.`
        # and the action then polls a process that already exited for the whole
        # 600s boot timeout. The suite executes zero flows and the run reads as
        # a generic emulator boot timeout ten minutes later. Measuring here
        # turns that into a capacity failure named at the moment it is true.
        #
        # One verified occurrence had 6925.66 MB available against 7372.80 MB
        # required — a ~447 MB shortfall on a runner carrying gigabytes of
        # toolchains this job never touches.
        #
        # This is a preflight, not a replacement for the zero-flow and coverage
        # guards downstream. They stay the final net for every OTHER way setup
        # can fail; this step only removes the one cause that is silent.
        env:
          # 8 GiB, deliberately above the ~7.2 GiB an API 34 / pixel_6 AVD asks
          # for. The margin is the emulator's own working set — snapshot
          # writes, logcat, the installed APK — plus whatever Maestro records
          # while the suite runs, none of which the partition check that
          # produced the FATAL above counts.
          ANDROID_DISK_FLOOR_MB: '8192'
        run: |
          set -euo pipefail

          # The AVD lands in $HOME/.android/avd, so the filesystem that matters
          # is the one backing $HOME — not `/`, not the workspace, even though
          # on a GitHub-hosted ubuntu runner all three are the same device
          # today. Measure what the emulator will actually use. `df -Pm`
          # reports 1 MiB blocks, so the floor below is read in the same unit
          # the emulator's own FATAL prints.
          free_mb() {
            df -Pm "$HOME" | awk 'NR==2 { print $4 }'
          }

          BEFORE_MB=$(free_mb)
          echo "Free space for $HOME before cleanup: ${BEFORE_MB} MB"

          # An ALLOWLIST of preinstalled runner assets, not a sweep. Every entry
          # is a toolchain image baked into `ubuntu-latest` that this job
          # provably never invokes: it downloads a prebuilt APK, installs
          # Maestro, and drives an emulator. Nothing here compiles native code,
          # .NET, Haskell, Swift, or PowerShell.
          #
          # What is deliberately ABSENT matters more than what is present: the
          # checked-out workspace, everything earlier steps wrote (the suite
          # driver, the downloaded app artifact, generated reports), and inside
          # the Android SDK the `platform-tools` (adb), `emulator`,
          # `cmdline-tools` (the action's own sdkmanager/avdmanager) and
          # `system-images` (the API 34 image the emulator boots) directories.
          # Only `ndk` is reclaimed from the SDK. Extend this list only with
          # the same test: would this job still be byte-identical without it?
          for reclaim in \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL; do
            if [ -e "$reclaim" ]; then
              echo "Reclaiming $reclaim"
              # Never fatal on its own: a path that moved or is already gone is
              # not a reason to fail the suite. The floor check below is the
              # only thing that decides whether cleanup was ENOUGH.
              sudo rm -rf "$reclaim" || echo "::warning::Could not remove $reclaim — continuing to the capacity check."
            else
              echo "Skipping $reclaim (absent)"
            fi
          done

          AFTER_MB=$(free_mb)
          echo "Free space for $HOME after cleanup: ${AFTER_MB} MB (floor ${ANDROID_DISK_FLOOR_MB} MB)"
          {
            echo "### 🧹 Android runner disk"
            echo ""
            echo "| measurement | MB |"
            echo "| --- | --- |"
            echo "| free before cleanup | ${BEFORE_MB} |"
            echo "| free after cleanup | ${AFTER_MB} |"
            echo "| required floor | ${ANDROID_DISK_FLOOR_MB} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$AFTER_MB" -lt "$ANDROID_DISK_FLOOR_MB" ]; then
            echo "::error title=Runner too full for the Android emulator::Only ${AFTER_MB} MB free for $HOME after reclaiming unused runner assets, and the emulator needs ${ANDROID_DISK_FLOOR_MB} MB free to create its userdata partition. Failing before the emulator action instead of letting it die in 0.2s and poll a dead process for the full 600s boot timeout."
            exit 1
          fi

      - name: 📱 Run Maestro flows on emulator
        # The suite invocation lives in `maestro-android-suite.sh`, written by
        # the step above. That indirection is what carries per-flow retry onto
        # this arm at all — see that step for why a retry loop cannot live in
        # `script:` and cannot move to a later step.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FLOW_RUNNER: ${{ inputs.flow_runner }}
          # Passed through `env` rather than expanded into the script body.
          # A `${{ }}` expansion is substituted into the script TEXT before
          # bash parses it, so a caller wiring this reusable input to
          # event-controlled data (a branch or issue title) could inject shell
          # commands. As an env var the value is only ever data.
          FLOWS_DIR: ${{ inputs.flows_dir }}
          # Per-flow retry policy, read by the suite driver this step invokes.
          # Passed through `env` for the same reason FLOWS_DIR is, and it is
          # also the mechanism that makes the driver's bytes constant: nothing
          # about a caller's configuration is baked into the file.
          FLOW_RETRY_TAG: ${{ inputs.android_flow_retry_tag }}
          FLOW_RETRY_ATTEMPTS: ${{ inputs.android_flow_retry_attempts }}
          FLOW_RETRY_RATE_PERCENT: ${{ inputs.android_flow_retry_rate_percent }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Caller-reachable emulator capability. Every default below is a COPY
          # of the action's own default, not an empty passthrough, and that
          # distinction is the whole design: a `with:` key whose expression
          # resolves to the empty string OVERRIDES the action's default rather
          # than falling back to it. `cores: ''` would stop `hw.cpu.ncore=2`
          # being written at all, and `emulator-options: ''` would launch a
          # windowed, hardware-GPU emulator on a headless runner. Wiring these
          # to empty would therefore be a behaviour change disguised as a
          # no-op; copying the values makes a caller that passes nothing get
          # byte-identical emulator configuration to before.
          #
          # The cost of the copy is that these values are duplicated from the
          # action's own defaults, so they can drift from upstream and a
          # deliberate bump of the pinned SHA has to re-check them. That is the
          # better failure: the values are now visible and reviewable here
          # instead of living in another repository's action.yml where nobody
          # reads them.
          #
          # Read `android_emulator_cores`' description before raising it. It
          # is NOT the fix for Maestro animation timeouts, and `ubuntu-latest`
          # has only 4 vCPUs to share with the host.
          cores: ${{ inputs.android_emulator_cores }}
          ram-size: ${{ inputs.android_emulator_ram_size }}
          heap-size: ${{ inputs.android_emulator_heap_size }}
          emulator-options: ${{ inputs.android_emulator_options }}
          # android-emulator-runner executes each script LINE as a separate
          # `sh -c` command, so backslash line-continuations do not survive —
          # a multi-line `maestro test ... \` runs bare and Maestro treats the
          # trailing `\` as a flow path ("Flow path does not exist"). Keep
          # each command on ONE line. The suite is the last line and it is a
          # single line for exactly this reason: it invokes a FILE, which is
          # the one way multi-line shell (and therefore retry) can run here.
          script: |
            # android-emulator-runner can observe the AVD while it is still
            # offline, leaving Maestro's dadb connection bound to that stale
            # server state (mobile-dev-inc/Maestro#3451). Recreate adb only
            # after the action's boot wait has completed, then prove the
            # device is online before installing or starting Maestro.
            adb kill-server
            adb start-server
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install app-android.apk
            # Installing a large APK can outlast the emulator's screen timeout.
            # Reassert the awake/unlocked state immediately before Maestro;
            # otherwise every flow can fail its first assertion behind the
            # keyguard even though the app and selectors are healthy.
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # KEYCODE_MENU (82) opens the Pixel launcher's customization
            # popup once the keyguard is already dismissed. That popup can
            # consume every subsequent Maestro launchApp command and make all
            # flows fail their first assertion. HOME instead normalizes the
            # post-unlock surface and closes any boot-time launcher popup.
            adb shell input keyevent KEYCODE_HOME
            adb shell dumpsys power | grep -q 'mWakefulness=Awake'
            adb shell dumpsys window | grep -q 'isKeyguardShowing=false'
            bash maestro-android-suite.sh

      - name: 🔢 Count executed flows
        # The iOS job carries a byte-identical copy of this step (with the
        # platform swapped). Keep them in lockstep: the whole point is that a
        # downstream reader can compare the two arms of ONE run, which it
        # cannot do if the arms count differently. This file already duplicates
        # `Apply maestro env` and `Assemble Maestro flags` between the arms for
        # the same reason — a reusable workflow cannot call a composite action
        # that lives beside it, because the checkout in these jobs is the
        # CALLER's repository, not Lisa's.
        #
        # NOT `always()`: a suite CANCELLED by the job timeout has usually run
        # many flows and simply never got to write its report, and reporting
        # that as "executed 0" would libel a slow suite as a dead one.
        id: flows
        if: ${{ !cancelled() }}
        # See the run step's note: the default `run` shell has no pipefail,
        # and this step is tested by executing this exact text with pipefail
        # ON. Pin the shell so what CI runs and what the test proves are the
        # same program.
        shell: bash
        run: |
          REPORT="maestro-android-report.xml"
          if [[ -f "$REPORT" ]]; then
            REPORT_PRESENT=true
            # Count the `<testcase` elements the run actually wrote rather than
            # trusting the aggregate `tests="N"` attribute. The elements are
            # what happened; the attribute is what the writer claimed.
            # `{ grep ... || true; }` around each match: a report with no
            # matches is a legitimate READING — it is precisely the zero-flow
            # case — not an error. Under `pipefail` an unabsorbed grep miss
            # would abort this step before the assertion below ever got to
            # name what happened, and the job would exit 1 with the generic
            # message this whole change exists to replace.
            EXECUTED=$( { grep -o '<testcase' "$REPORT" || true; } | wc -l | tr -d ' ')
            FAILURES=$( { grep -m1 -o 'failures="[0-9]*"' "$REPORT" || true; } | tr -dc '0-9')
          else
            REPORT_PRESENT=false
            EXECUTED=0
            FAILURES=0
          fi
          EXECUTED=${EXECUTED:-0}
          FAILURES=${FAILURES:-0}
          {
            echo "platform=android"
            echo "report_present=$REPORT_PRESENT"
            echo "executed=$EXECUTED"
            echo "failures=$FAILURES"
          } | tee maestro-android-flowcount.txt >> "$GITHUB_OUTPUT"
          {
            echo "### 🤖 Android flows executed: **$EXECUTED** (failures: $FAILURES)"
            echo ""
            echo "JUnit report written: \`$REPORT_PRESENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Maestro JUnit report
        # Split out from the debug bundle below on purpose, and this is the
        # ONLY upload that may use `if-no-files-found: error`.
        #
        # Flipping the combined upload to `error` would have been a placebo for
        # the bug this step exists to catch: `error` fires only when NOTHING in
        # the path matched, and in the failure that motivated this
        # (AcmeOrgD/frontend run 31584986248) `maestro-debug/` existed and only
        # the report was missing — so the combined upload would still have gone
        # quietly green. A report-only path is what makes an absent report an
        # error instead of a 5 KB artifact nobody opens.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-report
          path: maestro-android-report.xml
          if-no-files-found: error
          retention-days: 7

      - name: 📤 Publish executed-flow count
        # The COUNT IS THE ARTIFACT NAME, deliberately. Two properties fall out
        # of that and neither is available any other way:
        #
        #  1. A downstream gate reads the count from the artifacts LIST — one
        #     cheap API call, no download. The Android debug bundle alone runs
        #     to ~40 MB; a merge gate that had to fetch it would never be
        #     installed on the pull-request path.
        #  2. The name outlives the bytes. Expired artifacts still appear in
        #     the list, so "how many flows did that arm run three months ago?"
        #     stays answerable after the payload is gone.
        #
        # A human reading the run page gets it for free: the artifact is
        # literally called `maestro-android-flowcount-0` on a night that tested
        # nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-flowcount-${{ steps.flows.outputs.executed }}
          path: maestro-android-flowcount.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🔎 Record the suite scope
        # The COUNT above answers "how much ran?". This answers "how much was it
        # ASKED to run?", and the two are not the same question. A count can be
        # low because the suite shrank; a scope of `filtered` is the run saying
        # it was handed a slice on purpose.
        #
        # Why it has to be recorded at all: the Actions REST API exposes NO
        # `inputs` field on a workflow run. Verified 2026-08-18 against
        # AcmeOrgD/frontend run 32120016803 — the run object carries
        # `display_title`, `event`, `head_branch` and no trace of what it was
        # dispatched with. A downstream gate therefore cannot read the filter; it
        # can only read what the run chose to write down. This is that.
        #
        # NOT gated on `steps.flows`: the scope is known from the inputs before a
        # single flow starts, and a run that dies mid-suite is exactly when a
        # reader most needs to know whether it was narrowed.
        # WHY THIS IS SHELL AND NOT AN EXPRESSION ON THE ARTIFACT NAME.
        # It used to be the latter, and the marker was wrong on every run ever
        # produced by this workflow. The predicate was `exclude_tags != ''`,
        # while THIS FILE's own defaults are `ios-only` / `android-only` — both
        # non-empty — so `scope-full` was unreachable unless a caller passed
        # `''` and thereby ran each platform's opposite-only flows. Row 36 of
        # `check-nightly-e2e-health.mjs` disqualifies a `filtered` run
        # unconditionally, so the nightly gate's Maestro arm could not reach
        # `pass` for anybody. A `${{ }}` string is also unrunnable, which is why
        # nothing caught it: there was no way to write a test that executed the
        # decision. Now there is, and `maestro-native-suite-scope.test.ts`
        # exercises both directions.
        #
        # The distinction being drawn is STRUCTURAL PARTITION versus RUN-TIME
        # SLICE. `ios-only` on the Android leg does not narrow the suite — the
        # union of the two legs IS the suite — whereas `--include-tags=smoke`
        # genuinely does. A caller declares its partition once, and only a
        # departure from that declaration counts as narrowing.
        #
        # Set comparison, not string comparison: `a,b` and `b,a` are the same
        # declaration. Comparing raw strings would let a caller reordering its
        # own tag list silently flip the marker back to `filtered`, which is
        # this same bug in a form that is harder to see.
        id: scope
        if: ${{ !cancelled() }}
        shell: bash
        env:
          INCLUDE_TAGS: ${{ inputs.android_include_tags }}
          EXCLUDE_TAGS: ${{ inputs.android_exclude_tags }}
          FULL_SUITE_EXCLUDE_TAGS: ${{ inputs.android_full_suite_exclude_tags }}
        run: |
          # Normalise a comma-separated tag list to a canonical set: split,
          # trim, drop empties, dedupe, sort, rejoin. `sed '/^$/d'` rather than
          # `grep -v` on purpose — grep exits 1 on no matches, which under
          # `bash -eo pipefail` would abort this step for the perfectly legal
          # case of an empty tag list.
          normalize() {
            printf '%s' "${1:-}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' \
              | LC_ALL=C sort -u \
              | paste -sd, -
          }
          baseline="$(normalize "$FULL_SUITE_EXCLUDE_TAGS")"
          excluded="$(normalize "$EXCLUDE_TAGS")"
          if [[ -n "$INCLUDE_TAGS" ]]; then
            # An include list is narrowing by construction: it names what to
            # run rather than what to leave out, so there is no baseline it
            # could equal.
            scope=filtered
          elif [[ "$excluded" == "$baseline" ]]; then
            scope=full
          else
            scope=filtered
          fi
          {
            echo "platform=android"
            echo "include_tags=$INCLUDE_TAGS"
            echo "exclude_tags=$EXCLUDE_TAGS"
            echo "full_suite_exclude_tags=$FULL_SUITE_EXCLUDE_TAGS"
            echo "scope=$scope"
          } > maestro-android-scope.txt
          cat maestro-android-scope.txt
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: 📤 Publish suite scope
        # Same trick as the flow count and for the same two reasons: the answer
        # is the artifact NAME, so a gate reads it from the artifacts list with
        # one call and no download, and the name outlives the retention window.
        #
        # `flows_dir` is deliberately NOT part of this: it names where the suite
        # LIVES, not a slice of it, and a repo that keeps its flows somewhere
        # other than the default is not running a narrowed suite.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-scope-${{ steps.scope.outputs.scope }}
          path: maestro-android-scope.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🚨 Assert flows executed
        # The loud half. Without this a suite that ran zero flows and a suite
        # that ran every flow with twenty failures both exit 1 and are
        # indistinguishable in CI — which is how an entire arm can be switched
        # off for a week without anyone noticing.
        if: ${{ !cancelled() }}
        env:
          REPORT_PRESENT: ${{ steps.flows.outputs.report_present }}
          EXECUTED: ${{ steps.flows.outputs.executed }}
        shell: bash
        run: |
          if [[ "$REPORT_PRESENT" != "true" ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (android)::The Android arm TESTED NOTHING. maestro-android-report.xml was never written, so no flow reached its first assertion. This is NOT an ordinary flow failure — this run proved nothing about the app. Open the maestro-android-results artifact for why the runner never started a flow."
            exit 1
          fi
          if [[ "$EXECUTED" -eq 0 ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (android)::The Android arm TESTED NOTHING. maestro-android-report.xml records 0 executed flows. This is NOT an ordinary flow failure — this run proved nothing about the app."
            exit 1
          fi
          echo "✅ Android executed $EXECUTED flow(s)."

      - name: 🚦 Enforce the per-flow retry budget
        # The loud half of per-flow retry, and the reason the feature is
        # allowed to exist at all.
        #
        # A retry that is invisible is a lie told once per night: a flow
        # failing 40% of the time goes green forever and nobody looks at it
        # again. Real defects get found because flakes fail LOUDLY, so every
        # retry this workflow performs is published three ways — an annotation
        # on the run, a table in the job summary, and an artifact whose NAME
        # carries the retry count so nights are comparable from the artifacts
        # list without opening anything.
        #
        # It is also an independent gate. The suite driver already exits
        # non-zero for the same conditions; this step re-derives the verdict
        # from the ledger on disk so neither one alone can turn a red arm
        # green. That is the same pairing the zero-flow detector uses — a
        # counting step and a separate assertion that shouts.
        #
        # Byte-identical to the iOS job's copy with the platform swapped, for
        # the reason the flow-count step gives: a reader compares the two arms
        # of ONE run, which they cannot do if the arms report differently.
        id: retry_budget
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LEDGER: maestro-android-retries.txt
        run: |
          if [[ ! -f "$LEDGER" ]]; then
            # The suite driver writes the ledger on every path it can reach. No
            # ledger means it never ran (a cancelled or crashed job, or an
            # emulator that never came up), and there is no reading to
            # enforce — the zero-flow assertion above owns that case.
            echo "retried=0" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "No $LEDGER — the suite step never reached a verdict; nothing to enforce."
            exit 0
          fi
          key() { { grep "^$1=" "$LEDGER" || true; } | tail -1 | cut -d= -f2-; }
          ENABLED=$(key retry_enabled)
          EXECUTED=$(key executed)
          FAILED=$(key failed_first_attempt)
          RETRIED=$(key retried)
          RECOVERED=$(key recovered)
          UNRECOVERED=$(key unrecovered)
          NOT_ELIGIBLE=$(key not_eligible)
          RATE=$(key retry_rate_percent)
          THRESHOLD=$(key retry_rate_threshold_percent)
          BREACH=$(key rate_breach)
          echo "retried=${RETRIED:-0}" >> "${GITHUB_OUTPUT:-/dev/null}"
          {
            echo "### 🤖 Android per-flow retry ledger"
            echo ""
            echo "| flow | attempts | outcome |"
            echo "| --- | --- | --- |"
            # Rows are written sorted by flow path, so this table is
            # byte-comparable between two runs that executed the same flows in
            # a different order.
            { grep '^flow|' "$LEDGER" || true; } \
              | awk -F'|' '{ printf "| `%s` | %s | %s |\n", $2, $3, $4 }'
            echo ""
            echo "Executed **$EXECUTED**; failed first attempt **$FAILED**; retried **$RETRIED**; recovered **$RECOVERED**."
            echo ""
            echo "First-attempt failure rate **${RATE}%**, budget **${THRESHOLD}%**. Per-flow retry enabled: \`$ENABLED\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [[ "${RETRIED:-0}" -gt 0 ]]; then
            echo "::warning title=Android flows needed a retry::$RETRIED flow(s) of $EXECUTED did not pass on their first attempt this run. Green after a retry is NOT green first time. A flow that appears in this ledger on consecutive nights is a defect — open maestro-android-retries-$RETRIED and compare."
          fi
          if [[ "$BREACH" == "true" ]]; then
            echo "::error title=Android retry budget exceeded::$FAILED of $EXECUTED flow(s) failed their first attempt (${RATE}%), above the ${THRESHOLD}% budget. Nothing was retried and this arm is FAILED. Retry is not the lever here — find out why the arm is losing flows."
            exit 1
          fi
          if [[ "${UNRECOVERED:-0}" -gt 0 ]]; then
            echo "::error title=Android flows failed after retry::${UNRECOVERED} flow(s) failed again when re-run on their own. An isolated re-run removes ordering and host contention as explanations, so this is the arm's most credible real-failure signal."
            exit 1
          fi
          if [[ "${NOT_ELIGIBLE:-0}" -gt 0 ]]; then
            echo "::error title=Android flows failed and were not retried::${NOT_ELIGIBLE} failed flow(s) are not marked safe to run in isolation, so they were not re-run. Their failures stand."
            exit 1
          fi
          echo "✅ Android retry budget respected (retried ${RETRIED:-0}, rate ${RATE}% of ${THRESHOLD}%)."

      - name: 📤 Publish the per-flow retry ledger
        # The RETRY COUNT IS THE ARTIFACT NAME, for the reason the flow-count
        # artifact gives: a reader — or a nightly health gate — reads the
        # number off the artifacts LIST, without downloading anything, and can
        # therefore compare tonight's retries against last night's. `ignore`
        # rather than `error` because a project that has not enabled the
        # feature legitimately produces no ledger on a cancelled job.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-retries-${{ steps.retry_budget.outputs.retried }}
          path: maestro-android-retries.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: 🔍 Classify Maestro failures (diagnostic, never gating)
        # Reads the JUnit report this arm just wrote and separates a sign-in
        # PREAMBLE loss — a flow that reds having tested NOTHING, on an
        # assertion naming a preamble gate rather than its own subject — from a
        # real product failure. Without it a reader scoring the run by flow name
        # counts every preamble loss as a regression; upstream, two consecutive
        # proof runs lost four flows each that way and one arm was written up as
        # a product regression that came back green with no code change.
        #
        # It carries a third column too, DEVICE: a flow that never exercised
        # the product because the harness fell over. That verdict is read off
        # the run's `--debug-output` tree and NEVER off the JUnit failure text,
        # because the two measured device deaths on this arm wrote a BLANK
        # `<failure>` and the sibling arm has one reading `Unknown error` — a
        # classifier keyed on that text would have caught neither while looking
        # correct throughout. It is REPORTING only: per-flow retry is keyed on
        # WHICH flow failed and must never take this as an input, or it becomes
        # the too-narrow regex the driver's own comment block rejects.
        #
        # NON-GATING BY CONSTRUCTION, and three independent things enforce it:
        # `continue-on-error` on the step, `|| true` absorbing the classifier's
        # status through the pipe, and a classifier that exits 0 on every
        # readable report. Any one alone would do; all three are here because
        # the failure is silent, and a diagnostic that can red a green run — or
        # green a red one — is worse than no diagnostic at all. The nightly
        # merge gate reads run HISTORY (`docs/nightly-e2e-gate.md`) and never
        # this output; keep it that way.
        #
        # A repo that has not yet picked up the Lisa-shipped script skips
        # quietly. This workflow is called by repos on their own update cadence,
        # so a hard failure here would break arms that are merely behind.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          MAESTRO_REPORT: maestro-android-report.xml
          MAESTRO_PLATFORM: android
          CLASSIFIER: scripts/classify-maestro-failures.mjs
          # Maestro's own debug tree — the same directory the suite's
          # `--debug-output` writes, and the only place a device death is
          # observable. See the android job's copy for why the report cannot
          # answer that question. Passing this to an OLDER classifier is safe:
          # unknown `--` flags are filtered out of its report list, so a repo
          # that has not picked up this version ignores it rather than failing.
          MAESTRO_DEBUG_DIR: maestro-debug
        run: |
          if [[ ! -f "$CLASSIFIER" ]]; then
            echo "No $CLASSIFIER in this repository — skipping flake classification."
            exit 0
          fi
          if [[ ! -f "$MAESTRO_REPORT" ]]; then
            echo "No $MAESTRO_REPORT to classify."
            exit 0
          fi
          # An absent debug tree is normal — a suite that died before Maestro
          # started never wrote one — and the classifier reads it as "no
          # evidence", which yields no device verdict rather than an error.
          node "$CLASSIFIER" --markdown --platform="$MAESTRO_PLATFORM" \
            --debug-output="$MAESTRO_DEBUG_DIR" "$MAESTRO_REPORT" \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit 0

      - name: 📤 Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-results
          path: |
            maestro-android-report.xml
            maestro-android-run-1.log
            maestro-android-retries.txt
            maestro-android-retry-*.xml
            maestro-android-retry-*.log
            maestro-debug
          # Maestro writes EVERY debug artifact under `maestro-debug/.maestro/`
          # — a hidden directory — so the screenshots, view-hierarchy dumps and
          # device logcat that name the cause of a failure all sit behind a dot.
          # upload-artifact skips hidden files by default, which silently
          # reduced this artifact to the junit XML alone: a failing run uploaded
          # one file and told you an element was missing without a single frame
          # showing what was on screen instead. Both native suites were
          # undiagnosable after the fact for exactly this reason.
          include-hidden-files: true
          # `ignore` is CORRECT here and must stay. This bundle is at its most
          # valuable on the runs where it is incomplete — a cancelled suite, a
          # job that died before Maestro started — and erroring on those turns
          # the one diagnostic upload into more noise on an already-failed job.
          # The absent-report hole this used to leave is closed above, by the
          # report-only upload (`if-no-files-found: error`) and the zero-flow
          # assertion. Do not "fix" this line; fixing it here would restore a
          # placebo and change nothing about what gets detected.
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: 🍎 Maestro iOS
    needs: [preflight, build, pre_suite]
    runs-on: macos-15
    # Same ceiling as the android job — see its comment for why it is an input.
    timeout-minutes: ${{ inputs.suite_timeout_minutes }}
    # !cancelled(): see the android job — don't let the other platform's
    # build failure skip this platform's tests. The pre-suite clause is the
    # same result ALLOWLIST as the android job; see its comment for why
    # `!cancelled()` alone would not fail closed on a failed pre-suite.
    if: ${{ !cancelled() && needs.preflight.outputs.run_ios == 'true' && contains(fromJSON('["success", "skipped"]'), needs.pre_suite.result) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing downstream needs the git token — see the build job.
          persist-credentials: false

      - name: 📥 Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-ios

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🧰 Install Maestro
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          # See the android job's copy for why this is unpinned by default.
          if [[ -n "$MAESTRO_VERSION_PIN" ]]; then
            export MAESTRO_VERSION="$MAESTRO_VERSION_PIN"
          fi
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 📱 Boot simulator and install app
        run: |
          mkdir -p ios-app && tar -xzf app-ios.tar.gz -C ios-app
          APP_PATH=$(find ios-app -maxdepth 2 -name "*.app" -print -quit)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found in EAS artifact"
            find ios-app -maxdepth 3 -print
            exit 1
          fi
          # Boot the first available iPhone simulator on the runner's Xcode.
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[] | .[] | select(.name | test("^iPhone"))][0].udid')
          if [[ -z "$UDID" || "$UDID" == "null" ]]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID" || true # already-booted is fine
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP_PATH"
          # Carried forward so the run step can recycle THIS simulator on a
          # driver-startup retry instead of re-deriving it and possibly
          # picking a different device mid-job.
          SIM_NAME=$(xcrun simctl list devices --json \
            | jq -r --arg u "$UDID" '[.devices[] | .[] | select(.udid==$u)][0].name')
          SIM_OS=$(xcrun simctl list devices --json \
            | jq -r --arg u "$UDID" '.devices | to_entries[] | select(.value[]?.udid==$u) | .key' | head -1)
          {
            echo "IOS_SIM_UDID=$UDID"
            echo "IOS_APP_PATH=$APP_PATH"
            echo "IOS_SIM_NAME=$SIM_NAME"
            echo "IOS_SIM_OS=$SIM_OS"
          } >> "$GITHUB_ENV"

      - name: 🔎 Report toolchain versions
        # To the JOB LOG, not only to the debug artifact — see the android
        # job's copy. The iOS arm additionally records Xcode and the simulator
        # OS because `macos-15` is an image GitHub re-rolls underneath us, and
        # a driver-startup failure that correlates with an image change is
        # indistinguishable from one that correlates with a CLI change unless
        # both numbers are on the record for every run.
        env:
          MAESTRO_VERSION_PIN: ${{ inputs.maestro_version }}
        run: |
          MAESTRO_RESOLVED=$(maestro --version 2>&1 | tail -1)
          {
            echo "### 🍎 iOS toolchain"
            echo ""
            echo "| tool | version |"
            echo "| --- | --- |"
            echo "| Maestro CLI | \`${MAESTRO_RESOLVED}\` |"
            echo "| Maestro pin requested | \`${MAESTRO_VERSION_PIN:-(unpinned)}\` |"
            echo "| Xcode | \`$(xcodebuild -version 2>&1 | tr '\n' ' ')\` |"
            echo "| macOS | \`$(sw_vers -productVersion)\` |"
            echo "| Simulator | \`${IOS_SIM_NAME} / ${IOS_SIM_OS}\` |"
            echo "| Driver startup budget | \`${{ inputs.ios_driver_startup_timeout_ms }} ms\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🧩 Apply maestro env
        # See the android job — E2E_* names keep the multiline inputs out of
        # the MAESTRO_* scan.
        env:
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* || "$line" != *=* ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: 🧭 Apply pre-suite env
        # See the android job's copy: $GITHUB_ENV is per-job, so the pre-suite
        # exports travel as a job output and are re-applied here, before
        # `setup_command`.
        if: ${{ needs.pre_suite.result == 'success' && needs.pre_suite.outputs.maestro_env != '' }}
        env:
          PRE_SUITE_ENV: ${{ needs.pre_suite.outputs.maestro_env }}
        run: |
          # Unquoted on purpose — see the android copy.
          # shellcheck disable=SC2086
          for pair in $PRE_SUITE_ENV; do
            echo "$pair" >> "$GITHUB_ENV"
          done

      - name: 🎯 Run setup command
        # See the android job — PER-LEG only, it runs concurrently in both
        # platform jobs, it appends MAESTRO_* lines to $GITHUB_ENV, and a
        # failure fails the run. Shared-state mutation belongs in
        # `pre_suite_command`.
        if: inputs.setup_command != ''
        run: ${{ inputs.setup_command }}

      - name: 🧮 Assemble Maestro flags
        env:
          MAESTRO_APP_ID: ${{ inputs.ios_app_id }}
          EXCLUDE_TAGS: ${{ inputs.ios_exclude_tags }}
          INCLUDE_TAGS: ${{ inputs.ios_include_tags }}
          E2E_ENV_INPUT: ${{ inputs.maestro_env }}
          E2E_SECRET_ENV_INPUT: ${{ secrets.MAESTRO_SECRET_ENV }}
        run: |
          ARGS=""
          if [[ -n "$EXCLUDE_TAGS" ]]; then
            ARGS="--exclude-tags=$EXCLUDE_TAGS"
          fi
          if [[ -n "$INCLUDE_TAGS" ]]; then
            ARGS="$ARGS --include-tags=$INCLUDE_TAGS"
          fi
          KEYS=$(
            {
              printf '%s\n%s\n' "$E2E_ENV_INPUT" "$E2E_SECRET_ENV_INPUT" | grep '=' | grep -v '^#' | cut -d= -f1
              env | grep -o '^MAESTRO_[A-Za-z0-9_]*'
            } | sort -u
          )
          for key in $KEYS; do
            [[ "$key" == "MAESTRO_E2E_ARGS" ]] && continue
            value="${!key}"
            [[ -z "$value" ]] && continue
            ARGS="$ARGS -e $key=$value"
          done
          echo "MAESTRO_E2E_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: 📱 Run Maestro flows on simulator
        env:
          FLOW_RUNNER: ${{ inputs.flow_runner }}
          # Passed through `env` rather than expanded into the script body.
          # A `${{ }}` expansion is substituted into the script TEXT before
          # bash parses it, so a caller wiring this reusable input to
          # event-controlled data (a branch or issue title) could inject shell
          # commands. As an env var the value is only ever data.
          FLOWS_DIR: ${{ inputs.flows_dir }}
          # An EXPLICIT, caller-overridable budget for the XCUITest driver's
          # port bind. Leaving this unset does not mean "no opinion" — it means
          # the CLI's built-in 120 s applies by accident, and when it expired on
          # AcmeOrgD/frontend run 31584986248 the job discarded all 83 planned
          # flows without a single one starting. 240 s is chosen to be
          # unambiguously more than "the default was not enough" while still
          # being a small fraction of the suite ceiling, so a genuinely wedged
          # simulator still fails fast rather than burning the job timeout.
          #
          # Raising this is NOT a fix for a driver that never binds — it only
          # buys a slow one more room. The retry below is what covers a driver
          # that fails to come up at all.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: ${{ inputs.ios_driver_startup_timeout_ms }}
          # Per-flow retry policy. Passed through `env` for the same reason
          # FLOWS_DIR is: a `${{ }}` expansion is substituted into the script
          # TEXT before bash parses it, so a caller wiring a reusable input to
          # event-controlled data could inject shell commands. As env vars
          # these values are only ever data.
          FLOW_RETRY_TAG: ${{ inputs.ios_flow_retry_tag }}
          FLOW_RETRY_ATTEMPTS: ${{ inputs.ios_flow_retry_attempts }}
          FLOW_RETRY_RATE_PERCENT: ${{ inputs.ios_flow_retry_rate_percent }}
        # EXPLICIT `shell: bash` is load-bearing, not style. The default `run`
        # shell is `bash -e {0}` WITHOUT pipefail, and every suite invocation
        # below is piped into `tee` — so without this the exit status read
        # would be tee's (always 0) and a failed suite would report success.
        shell: bash
        run: |
          # MAESTRO_E2E_ARGS is a flag list that needs word splitting.
          # shellcheck disable=SC2086
          run_target() {
            if [ -n "$FLOW_RUNNER" ]; then
              bash "$FLOW_RUNNER" "$1" maestro-debug $MAESTRO_E2E_ARGS "$2"
            else
              maestro test "$2" \
                $MAESTRO_E2E_ARGS \
                --format junit \
                --output "$1" \
                --debug-output maestro-debug
            fi
          }

          run_suite() {
            run_target maestro-ios-report.xml "$FLOWS_DIR"
          }

          # ------------------------------------------------------------------
          # Per-flow retry — state, helpers, and the policy that uses them.
          #
          # WHAT IS BROKEN TODAY, stated plainly so the next reader does not
          # have to rediscover it: the driver-startup retry below is the ONLY
          # retry this workflow has, it fires on one regex, and it re-runs the
          # WHOLE suite. Every flake that is not a driver-startup timeout —
          # every per-flow environmental fault — therefore reds the run with no
          # retry at all. Two measured examples, from nights where one arm was
          # fully green and the other lost exactly one flow of forty-one:
          #
          #   * `launchApp: clearState` failed having executed ZERO steps. On
          #     iOS `clearState` is uninstall+reinstall; the reinstall
          #     succeeded (`Success (End) : Install (New)`) but SpringBoard
          #     never promoted the placeholder, so the launch retried for 10s
          #     against `LaunchServicesDataMismatch` and then failed with
          #     `NotFound ("Application ... is unknown to FrontBoard")`.
          #   * An `assertNotVisible` failed because the touch-UP event was
          #     never delivered. The driver tapped the correct pixel; the
          #     simulator log shows `down` with no matching `up` and no
          #     touch-move evaluations, while the identical tap on the
          #     identical component 13s earlier received both. The host was
          #     starved: the pre-tap screenshot took 3,257ms against 132ms
          #     earlier, and simulator log volume had tripled to ~12,000
          #     lines/sec.
          #
          # Neither has a code fix. Neither matches DRIVER_FAILURE. Both cost a
          # whole suite re-run to clear by hand.
          #
          # DO NOT gate this retry on the failure TEXT. The first example's
          # JUnit `<failure>` element read, in its entirety, `Unknown error` —
          # the cause was only in `maestro-debug/.maestro/tests/<ts>/<flow>/`.
          # A retry keyed on an error string would be the same too-narrow regex
          # this exists to replace. The report is read for WHICH flows failed,
          # never for why.
          # ------------------------------------------------------------------
          LEDGER="maestro-ios-retries.txt"
          ROWS="maestro-ios-retry-rows.txt"
          : > "$ROWS"
          RETRY_ENABLED=false
          if [ -n "$FLOW_RETRY_TAG" ]; then
            RETRY_ENABLED=true
          fi
          EXECUTED=0
          FAILED_COUNT=0
          SKIPPED_COUNT=0
          RETRIED=0
          RECOVERED=0
          UNRECOVERED=0
          BREACH=false

          # Count the `<testcase` elements a report actually contains. Same
          # reading as the flow-count step: the elements are what happened, the
          # `tests="N"` attribute is what the writer claimed.
          count_testcases() {
            { grep -o '<testcase' "$1" || true; } | wc -l | tr -d ' '
          }

          # The flow FILES that failed, one per line, deduped and sorted.
          #
          # Sorted on purpose, not as a tidiness habit: the ledger this feeds
          # is compared across nights and across arms, and Maestro's execution
          # order is not a stable key. A set that reorders itself must not read
          # as a different set.
          #
          # The split at EVERY `<testcase` is also load-bearing. A greedy match
          # over `<testcase .../>` swallows the self-closing slash and then
          # hunts for the next `</testcase>`, which merges a PASSING case into
          # the following failing one and reports the passing flow's name
          # against the failing flow's message. Splitting first means a record
          # can hold at most one case's body. `${record%%>*}` then trims the
          # record to its open tag before `file=` is read, so failure TEXT that
          # happens to contain `file="` cannot be mistaken for the attribute.
          failed_flow_files() {
            tr '\n' ' ' < "$1" \
              | awk '{ gsub(/<testcase/, "\n<testcase"); print }' \
              | while IFS= read -r record; do
                  case "$record" in
                    "<testcase"*) ;;
                    *) continue ;;
                  esac
                  case "$record" in
                    *"<failure"* | *"<error"*) ;;
                    *) continue ;;
                  esac
                  printf '%s\n' "${record%%>*}" \
                    | sed -n 's/.*file="\([^"]*\)".*/\1/p'
                done \
              | sed '/^$/d' \
              | LC_ALL=C sort -u
          }

          # Resolve a report's `file` attribute to a path on disk. The reported
          # path is repo-relative and exact in every report this workflow
          # produces; the flows-dir fallback keeps reports from older runners
          # readable. Mirrors the classifier's `resolveFlowPath`.
          resolve_flow_path() {
            if [ -f "$1" ]; then
              printf '%s\n' "$1"
              return 0
            fi
            if [ -n "$FLOWS_DIR" ] && [ -f "$FLOWS_DIR/$(basename "$1")" ]; then
              printf '%s\n' "$FLOWS_DIR/$(basename "$1")"
              return 0
            fi
            return 1
          }

          # Is this flow SAFE to re-run on its own?
          #
          # Nothing can derive that. A flow that reads a record an earlier flow
          # created looks exactly like one that creates its own, so no
          # inspection of the file can prove independence — and a wrong guess
          # here manufactures a false failure, which is worse than the flake it
          # was meant to absorb. So eligibility is DECLARED, per flow, by a
          # Maestro tag the project names in `ios_flow_retry_tag`. Untagged is
          # never re-run. A project that configures no tag retries nothing and
          # behaves exactly as it does today. Silence produces the safe answer,
          # never the flattering one — the same asymmetry the flake classifier
          # is built on.
          #
          # Both `tags: [a, b]` and the block form are accepted, and only the
          # flow's Maestro header — everything before the first `---` — is read.
          flow_is_retryable() {
            if [ ! -f "$1" ]; then
              return 1
            fi
            awk -v want="$FLOW_RETRY_TAG" '
              /^---[[:space:]]*$/ { exit }
              /^tags:/ {
                intags = 1
                rest = $0
                sub(/^tags:[[:space:]]*/, "", rest)
                if (rest ~ /^\[/) {
                  gsub(/[][,]/, " ", rest)
                  n = split(rest, parts, /[[:space:]]+/)
                  for (i = 1; i <= n; i++) {
                    gsub(/["]/, "", parts[i])
                    if (parts[i] == want) { found = 1 }
                  }
                  intags = 0
                }
                next
              }
              intags == 1 && /^[[:space:]]*-[[:space:]]/ {
                v = $0
                sub(/^[[:space:]]*-[[:space:]]*/, "", v)
                gsub(/[[:space:]"]/, "", v)
                if (v == want) { found = 1 }
                next
              }
              intags == 1 && /^[^[:space:]#]/ { intags = 0 }
              END { exit(found ? 0 : 1) }
            ' "$1"
          }

          # The ledger is the point of this feature, not a by-product of it.
          # A retry that leaves no trace turns a flow failing 40% of the time
          # into a permanently green flow nobody ever looks at, and real
          # defects get found precisely because flakes fail loudly. EVERY run
          # writes this file — including a clean one, so "0 retries" is a
          # recorded reading rather than an absence.
          write_ledger() {
            RATE=0
            if [ "$EXECUTED" -gt 0 ]; then
              RATE=$(( FAILED_COUNT * 100 / EXECUTED ))
            fi
            {
              echo "platform=ios"
              echo "retry_enabled=$RETRY_ENABLED"
              echo "retry_tag=$FLOW_RETRY_TAG"
              echo "retry_attempts_allowed=$FLOW_RETRY_ATTEMPTS"
              echo "retry_rate_threshold_percent=$FLOW_RETRY_RATE_PERCENT"
              echo "executed=$EXECUTED"
              echo "failed_first_attempt=$FAILED_COUNT"
              echo "retried=$RETRIED"
              echo "recovered=$RECOVERED"
              echo "unrecovered=$UNRECOVERED"
              echo "not_eligible=$SKIPPED_COUNT"
              echo "retry_rate_percent=$RATE"
              echo "rate_breach=$BREACH"
              LC_ALL=C sort "$ROWS"
            } > "$LEDGER"
            cat "$LEDGER"
          }

          record_row() {
            printf 'flow|%s|%s|%s\n' "$1" "$2" "$3" >> "$ROWS"
          }

          count_report_flows() {
            if [ -f maestro-ios-report.xml ]; then
              count_testcases maestro-ios-report.xml
            else
              echo 0
            fi
          }

          retry_failed_flows() {
            if [ -f maestro-ios-report.xml ]; then
              EXECUTED=$(count_testcases maestro-ios-report.xml)
              FAILED_LIST=$(failed_flow_files maestro-ios-report.xml)
            else
              FAILED_LIST=""
            fi
            if [ -n "$FAILED_LIST" ]; then
              FAILED_COUNT=$(printf '%s\n' "$FAILED_LIST" | wc -l | tr -d ' ')
            fi

            if [ "$RETRY_ENABLED" != "true" ]; then
              SKIPPED_COUNT=$FAILED_COUNT
              echo "::notice::Per-flow retry is off (ios_flow_retry_tag is empty) — $FAILED_COUNT failed flow(s) stand."
              write_ledger
              return 1
            fi

            if [ "$FAILED_COUNT" -eq 0 ]; then
              echo "::notice::The suite failed but its report names no failed flow — there is nothing to re-run."
              write_ledger
              return 1
            fi

            # The rate budget is checked BEFORE anything is re-run, and a
            # breach means nothing is re-run at all. Above the budget the arm
            # is degraded or the failures are real; either way, spending the
            # job's remaining minutes on retries buys a green that hides which
            # of the two it was.
            if [ "$EXECUTED" -gt 0 ] && [ "$(( FAILED_COUNT * 100 ))" -gt "$(( FLOW_RETRY_RATE_PERCENT * EXECUTED ))" ]; then
              BREACH=true
              SKIPPED_COUNT=$FAILED_COUNT
              while IFS= read -r reported; do
                if [ -n "$reported" ]; then
                  record_row "$reported" 1 over-budget
                fi
              done <<< "$FAILED_LIST"
              echo "::error title=Maestro retry budget exceeded (ios)::$FAILED_COUNT of $EXECUTED flow(s) failed on the first attempt, above the ${FLOW_RETRY_RATE_PERCENT}% budget. NOTHING was retried. A rate this high is a degraded arm or a real regression, and retrying would spend the job's budget hiding which."
              write_ledger
              return 1
            fi

            ELIGIBLE_LIST=""
            SKIPPED_LIST=""
            while IFS= read -r reported; do
              if [ -z "$reported" ]; then
                continue
              fi
              resolved=$(resolve_flow_path "$reported" || true)
              if [ -n "$resolved" ] && flow_is_retryable "$resolved"; then
                ELIGIBLE_LIST=$(printf '%s\n%s' "$ELIGIBLE_LIST" "$resolved")
              else
                SKIPPED_LIST=$(printf '%s\n%s' "$SKIPPED_LIST" "$reported")
              fi
            done <<< "$FAILED_LIST"
            ELIGIBLE_LIST=$(printf '%s\n' "$ELIGIBLE_LIST" | sed '/^$/d' | LC_ALL=C sort -u)
            SKIPPED_LIST=$(printf '%s\n' "$SKIPPED_LIST" | sed '/^$/d' | LC_ALL=C sort -u)

            while IFS= read -r skipped; do
              if [ -n "$skipped" ]; then
                SKIPPED_COUNT=$(( SKIPPED_COUNT + 1 ))
                record_row "$skipped" 1 not-eligible
                echo "::notice::$skipped failed and carries no '$FLOW_RETRY_TAG' tag — not re-run. Tag it only if it is genuinely safe to run on its own."
              fi
            done <<< "$SKIPPED_LIST"

            while IFS= read -r flow; do
              if [ -z "$flow" ]; then
                continue
              fi
              attempt=0
              outcome=unrecovered
              while [ "$attempt" -lt "$FLOW_RETRY_ATTEMPTS" ]; do
                attempt=$(( attempt + 1 ))
                slug=$(printf '%s' "$flow" | tr -c 'A-Za-z0-9._-' '-')
                retry_report="maestro-ios-retry-${slug}-${attempt}.xml"
                echo "::warning title=Maestro flow retried (ios)::$flow failed and is being re-run on its own (attempt $(( attempt + 1 ))). A retry is a SYMPTOM. Read the maestro-ios-retries artifact before treating this run as a clean green."
                if run_target "$retry_report" "$flow" 2>&1 | tee "maestro-ios-retry-${slug}-${attempt}.log"; then
                  ran=0
                  if [ -f "$retry_report" ]; then
                    ran=$(count_testcases "$retry_report")
                  fi
                  if [ "$ran" -eq 0 ]; then
                    # A re-run that executed nothing exits 0. Trusting that
                    # status would turn every tag-filtered flow into a
                    # permanent false green — the same fail-open shape as a
                    # suite reporting success having tested nothing.
                    echo "::error title=Retry executed nothing (ios)::The isolated re-run of $flow succeeded having executed 0 flows, so this run's tag filters exclude it. Counting it as NOT recovered: a zero-flow re-run proves nothing."
                    outcome=vacuous
                    break
                  fi
                  outcome=recovered
                  break
                fi
              done
              RETRIED=$(( RETRIED + 1 ))
              record_row "$flow" "$(( attempt + 1 ))" "$outcome"
              if [ "$outcome" = "recovered" ]; then
                RECOVERED=$(( RECOVERED + 1 ))
              else
                UNRECOVERED=$(( UNRECOVERED + 1 ))
              fi
            done <<< "$ELIGIBLE_LIST"

            write_ledger

            if [ "$FAILED_COUNT" -gt 0 ] && [ "$RECOVERED" -eq "$FAILED_COUNT" ]; then
              echo "::notice title=iOS suite green only after per-flow retry::$RECOVERED of $EXECUTED flow(s) needed an isolated re-run. This is NOT the same result as a first-time green; a flow that keeps appearing here is a defect, not luck."
              return 0
            fi
            return 1
          }

          # Retry the WHOLE SUITE only on driver startup. A blanket suite retry
          # would double a four-hour run every time one assertion reds. The
          # signature below is the exception Maestro throws when the XCUITest
          # runner never binds its port — the whole suite is lost before flow 1,
          # so re-running it costs nothing that was not already lost.
          DRIVER_FAILURE='IOSDriverTimeoutException|iOS driver not ready in time'

          if run_suite 2>&1 | tee maestro-ios-run-1.log; then
            EXECUTED=$(count_report_flows)
            write_ledger
            exit 0
          fi

          if grep -Eq "$DRIVER_FAILURE" maestro-ios-run-1.log; then
            echo "::warning title=iOS driver failed to start::The XCUITest driver did not bind its port within ${MAESTRO_DRIVER_STARTUP_TIMEOUT}ms and NO flow executed. Recycling the simulator and retrying once."
            xcrun simctl shutdown "$IOS_SIM_UDID" || true
            xcrun simctl erase "$IOS_SIM_UDID" || true
            xcrun simctl boot "$IOS_SIM_UDID"
            xcrun simctl bootstatus "$IOS_SIM_UDID"
            xcrun simctl install "$IOS_SIM_UDID" "$IOS_APP_PATH"

            if run_suite 2>&1 | tee maestro-ios-run-2.log; then
              echo "::notice title=iOS driver recovered on retry::The first attempt lost the driver; the retry ran the suite. Treat repeated warnings of this kind as a real defect, not as noise — see the flow-count artifact for what each attempt actually ran."
              EXECUTED=$(count_report_flows)
              write_ledger
              exit 0
            fi
            exit 1
          fi

          # Not a driver-startup loss, so the suite ran and individual flows
          # reported. Do not re-run the suite; re-run the failed flows.
          echo "::notice::Suite failed on flow results, not on driver startup — not retrying the whole suite."
          if retry_failed_flows; then
            exit 0
          fi
          exit 1
      - name: 🔢 Count executed flows
        # Byte-identical to the android job's copy with the platform swapped —
        # see the comment there for why the duplication is deliberate and why
        # this is not `always()`.
        id: flows
        if: ${{ !cancelled() }}
        # See the run step's note: the default `run` shell has no pipefail,
        # and this step is tested by executing this exact text with pipefail
        # ON. Pin the shell so what CI runs and what the test proves are the
        # same program.
        shell: bash
        run: |
          REPORT="maestro-ios-report.xml"
          if [[ -f "$REPORT" ]]; then
            REPORT_PRESENT=true
            # `{ grep ... || true; }` around each match: a report with no
            # matches is a legitimate READING — it is precisely the zero-flow
            # case — not an error. Under `pipefail` an unabsorbed grep miss
            # would abort this step before the assertion below ever got to
            # name what happened, and the job would exit 1 with the generic
            # message this whole change exists to replace.
            EXECUTED=$( { grep -o '<testcase' "$REPORT" || true; } | wc -l | tr -d ' ')
            FAILURES=$( { grep -m1 -o 'failures="[0-9]*"' "$REPORT" || true; } | tr -dc '0-9')
          else
            REPORT_PRESENT=false
            EXECUTED=0
            FAILURES=0
          fi
          EXECUTED=${EXECUTED:-0}
          FAILURES=${FAILURES:-0}
          {
            echo "platform=ios"
            echo "report_present=$REPORT_PRESENT"
            echo "executed=$EXECUTED"
            echo "failures=$FAILURES"
          } | tee maestro-ios-flowcount.txt >> "$GITHUB_OUTPUT"
          {
            echo "### 🍎 iOS flows executed: **$EXECUTED** (failures: $FAILURES)"
            echo ""
            echo "JUnit report written: \`$REPORT_PRESENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Maestro JUnit report
        # See the android job's copy: report-only path, so an ABSENT report is
        # an error rather than a quiet 5 KB artifact.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-report
          path: maestro-ios-report.xml
          if-no-files-found: error
          retention-days: 7

      - name: 📤 Publish executed-flow count
        # The count is the artifact NAME on purpose — see the android copy.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-flowcount-${{ steps.flows.outputs.executed }}
          path: maestro-ios-flowcount.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🔎 Record the suite scope
        # See the android copy for why a run has to write its own inputs down,
        # and for why the full-vs-filtered decision lives in shell rather than
        # in an expression on the artifact name.
        id: scope
        if: ${{ !cancelled() }}
        shell: bash
        env:
          INCLUDE_TAGS: ${{ inputs.ios_include_tags }}
          EXCLUDE_TAGS: ${{ inputs.ios_exclude_tags }}
          FULL_SUITE_EXCLUDE_TAGS: ${{ inputs.ios_full_suite_exclude_tags }}
        run: |
          # Normalise a comma-separated tag list to a canonical set: split,
          # trim, drop empties, dedupe, sort, rejoin. `sed '/^$/d'` rather than
          # `grep -v` on purpose — grep exits 1 on no matches, which under
          # `bash -eo pipefail` would abort this step for the perfectly legal
          # case of an empty tag list.
          normalize() {
            printf '%s' "${1:-}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' \
              | LC_ALL=C sort -u \
              | paste -sd, -
          }
          baseline="$(normalize "$FULL_SUITE_EXCLUDE_TAGS")"
          excluded="$(normalize "$EXCLUDE_TAGS")"
          if [[ -n "$INCLUDE_TAGS" ]]; then
            # An include list is narrowing by construction: it names what to
            # run rather than what to leave out, so there is no baseline it
            # could equal.
            scope=filtered
          elif [[ "$excluded" == "$baseline" ]]; then
            scope=full
          else
            scope=filtered
          fi
          {
            echo "platform=ios"
            echo "include_tags=$INCLUDE_TAGS"
            echo "exclude_tags=$EXCLUDE_TAGS"
            echo "full_suite_exclude_tags=$FULL_SUITE_EXCLUDE_TAGS"
            echo "scope=$scope"
          } > maestro-ios-scope.txt
          cat maestro-ios-scope.txt
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: 📤 Publish suite scope
        # The scope is the artifact NAME — see the android copy.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-scope-${{ steps.scope.outputs.scope }}
          path: maestro-ios-scope.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🚨 Assert flows executed
        # The loud half — see the android copy.
        if: ${{ !cancelled() }}
        env:
          REPORT_PRESENT: ${{ steps.flows.outputs.report_present }}
          EXECUTED: ${{ steps.flows.outputs.executed }}
        shell: bash
        run: |
          if [[ "$REPORT_PRESENT" != "true" ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (ios)::The iOS arm TESTED NOTHING. maestro-ios-report.xml was never written, so no flow reached its first assertion. This is NOT an ordinary flow failure — this run proved nothing about the app. Open the maestro-ios-results artifact for why the runner never started a flow."
            exit 1
          fi
          if [[ "$EXECUTED" -eq 0 ]]; then
            echo "::error title=ZERO FLOWS EXECUTED (ios)::The iOS arm TESTED NOTHING. maestro-ios-report.xml records 0 executed flows. This is NOT an ordinary flow failure — this run proved nothing about the app."
            exit 1
          fi
          echo "✅ iOS executed $EXECUTED flow(s)."

      - name: 🚦 Enforce the per-flow retry budget
        # The loud half of per-flow retry, and the reason the feature is
        # allowed to exist at all.
        #
        # A retry that is invisible is a lie told once per night: a flow
        # failing 40% of the time goes green forever and nobody looks at it
        # again. Real defects get found because flakes fail LOUDLY, so every
        # retry this workflow performs is published three ways — an annotation
        # on the run, a table in the job summary, and an artifact whose NAME
        # carries the retry count so nights are comparable from the artifacts
        # list without opening anything.
        #
        # It is also an independent gate. The run step already exits non-zero
        # for the same conditions; this step re-derives the verdict from the
        # ledger on disk so neither one alone can turn a red arm green. That is
        # the same pairing the zero-flow detector uses — a counting step and a
        # separate assertion that shouts.
        id: retry_budget
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LEDGER: maestro-ios-retries.txt
        run: |
          if [[ ! -f "$LEDGER" ]]; then
            # The suite step writes the ledger on every path it can reach. No
            # ledger means it never ran (a cancelled or crashed job), and there
            # is no reading to enforce — the zero-flow assertion above owns
            # that case.
            echo "retried=0" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "No $LEDGER — the suite step never reached a verdict; nothing to enforce."
            exit 0
          fi
          key() { { grep "^$1=" "$LEDGER" || true; } | tail -1 | cut -d= -f2-; }
          ENABLED=$(key retry_enabled)
          EXECUTED=$(key executed)
          FAILED=$(key failed_first_attempt)
          RETRIED=$(key retried)
          RECOVERED=$(key recovered)
          UNRECOVERED=$(key unrecovered)
          NOT_ELIGIBLE=$(key not_eligible)
          RATE=$(key retry_rate_percent)
          THRESHOLD=$(key retry_rate_threshold_percent)
          BREACH=$(key rate_breach)
          echo "retried=${RETRIED:-0}" >> "${GITHUB_OUTPUT:-/dev/null}"
          {
            echo "### 🍎 iOS per-flow retry ledger"
            echo ""
            echo "| flow | attempts | outcome |"
            echo "| --- | --- | --- |"
            # Rows are written sorted by flow path, so this table is
            # byte-comparable between two runs that executed the same flows in
            # a different order.
            { grep '^flow|' "$LEDGER" || true; } \
              | awk -F'|' '{ printf "| `%s` | %s | %s |\n", $2, $3, $4 }'
            echo ""
            echo "Executed **$EXECUTED**; failed first attempt **$FAILED**; retried **$RETRIED**; recovered **$RECOVERED**."
            echo ""
            echo "First-attempt failure rate **${RATE}%**, budget **${THRESHOLD}%**. Per-flow retry enabled: \`$ENABLED\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [[ "${RETRIED:-0}" -gt 0 ]]; then
            echo "::warning title=iOS flows needed a retry::$RETRIED flow(s) of $EXECUTED did not pass on their first attempt this run. Green after a retry is NOT green first time. A flow that appears in this ledger on consecutive nights is a defect — open maestro-ios-retries-$RETRIED and compare."
          fi
          if [[ "$BREACH" == "true" ]]; then
            echo "::error title=iOS retry budget exceeded::$FAILED of $EXECUTED flow(s) failed their first attempt (${RATE}%), above the ${THRESHOLD}% budget. Nothing was retried and this arm is FAILED. Retry is not the lever here — find out why the arm is losing flows."
            exit 1
          fi
          if [[ "${UNRECOVERED:-0}" -gt 0 ]]; then
            echo "::error title=iOS flows failed after retry::${UNRECOVERED} flow(s) failed again when re-run on their own. An isolated re-run removes ordering and host contention as explanations, so this is the arm's most credible real-failure signal."
            exit 1
          fi
          if [[ "${NOT_ELIGIBLE:-0}" -gt 0 ]]; then
            echo "::error title=iOS flows failed and were not retried::${NOT_ELIGIBLE} failed flow(s) are not marked safe to run in isolation, so they were not re-run. Their failures stand."
            exit 1
          fi
          echo "✅ iOS retry budget respected (retried ${RETRIED:-0}, rate ${RATE}% of ${THRESHOLD}%)."

      - name: 📤 Publish the per-flow retry ledger
        # The RETRY COUNT IS THE ARTIFACT NAME, for the reason the flow-count
        # artifact gives: a reader — or a nightly health gate — reads the
        # number off the artifacts LIST, without downloading anything, and can
        # therefore compare tonight's retries against last night's. `ignore`
        # rather than `error` because a project that has not enabled the
        # feature legitimately produces no ledger on a cancelled job.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-retries-${{ steps.retry_budget.outputs.retried }}
          path: maestro-ios-retries.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: 🔍 Classify Maestro failures (diagnostic, never gating)
        # Byte-identical to the android job's copy with the platform swapped,
        # for the reason the flow-count step gives: a reader compares the two
        # arms of ONE run, which they cannot do if the arms report differently.
        # See that copy for why this step cannot fail the job.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          MAESTRO_REPORT: maestro-ios-report.xml
          MAESTRO_PLATFORM: ios
          CLASSIFIER: scripts/classify-maestro-failures.mjs
          # Maestro's own debug tree — the same directory the suite's
          # `--debug-output` writes, and the only place a device death is
          # observable. See the android job's copy for why the report cannot
          # answer that question. Passing this to an OLDER classifier is safe:
          # unknown `--` flags are filtered out of its report list, so a repo
          # that has not picked up this version ignores it rather than failing.
          MAESTRO_DEBUG_DIR: maestro-debug
        run: |
          if [[ ! -f "$CLASSIFIER" ]]; then
            echo "No $CLASSIFIER in this repository — skipping flake classification."
            exit 0
          fi
          if [[ ! -f "$MAESTRO_REPORT" ]]; then
            echo "No $MAESTRO_REPORT to classify."
            exit 0
          fi
          # An absent debug tree is normal — a suite that died before Maestro
          # started never wrote one — and the classifier reads it as "no
          # evidence", which yields no device verdict rather than an error.
          node "$CLASSIFIER" --markdown --platform="$MAESTRO_PLATFORM" \
            --debug-output="$MAESTRO_DEBUG_DIR" "$MAESTRO_REPORT" \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit 0

      - name: 📤 Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-results
          path: |
            maestro-ios-report.xml
            maestro-ios-run-1.log
            maestro-ios-run-2.log
            maestro-ios-retries.txt
            maestro-ios-retry-*.xml
            maestro-ios-retry-*.log
            maestro-debug
          # See the Android upload above: `maestro-debug/.maestro/` is hidden,
          # and without this the artifact is the junit XML and nothing else.
          include-hidden-files: true
          # `ignore` is correct here and must stay — see the android copy for
          # why flipping it would be a placebo.
          if-no-files-found: ignore
          retention-days: 7
