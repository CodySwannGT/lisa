# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: 🔍 CI Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Quality Checks
    permissions:
      contents: read
      # The work_item_traceability job reads the tracker issue to verify the
      # PR backlink. A reusable workflow can only DOWNGRADE the caller's grant,
      # so without issues:read here that job cannot enforce anything.
      issues: read
      pull-requests: read
    uses: ./.github/workflows/quality.yml
    with:
      node_version: '24.21.0'
      package_manager: 'bun'
      skip_jobs: ''
      # Split the unit suite across parallel legs (#4598). quality.yml merges
      # shard coverage and checks thresholds once in the aggregate job, so the
      # required check `🔍 Quality Checks / 🧪 Run Unit Tests` keeps its name.
      # 7 legs, not 4: at 4 the unit path (plan start to aggregate end) took
      # 10m11s on run 42443161832 against an 8-minute target. The slowest leg
      # spent ~6m45s in tests and ~3.5 min of the path is fixed overhead
      # (runner pickup, setup, aggregate merge), so 7 is the smallest count
      # whose estimated path stays under 8 minutes.
      unit_test_shards: 7
    secrets: inherit
  bin_smoke:
    name: Lisa CLI bin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '24.21.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build
      - name: Execute and name GitHub evidence upload regression
        run: >-
          node dist/cli/lisa-test-run.js --profile lisa --adapter vitest -- ./node_modules/.bin/vitest run
          tests/unit/strategies/github-evidence-upload.test.ts --reporter=verbose
      - name: Execute and name current PR base regressions
        run: >-
          node dist/cli/lisa-test-run.js --profile lisa --adapter vitest -- ./node_modules/.bin/vitest run
          tests/unit/scripts/absent-required-checks-by-branch.test.ts
          tests/unit/scripts/pr-base-snapshot.test.ts --reporter=verbose
      - name: Execute and name late registration and reviewer wake-up regressions
        run: >-
          node dist/cli/lisa-test-run.js --profile lisa --adapter vitest -- ./node_modules/.bin/vitest run
          tests/unit/scripts/registration-deferred.test.ts
          tests/unit/scripts/review-evidence-wakeup.test.ts
          tests/integration/registration-deferred-cli.test.ts --reporter=verbose
      - name: Verify built Lisa CLI
        env:
          LISA_SKIP_UPDATE_CHECK: '1'
        run: |
          test "$(node -p "require('./package.json').bin.lisa")" = "dist/index.js"
          node dist/index.js --version
          node dist/index.js --help | grep -q "setup-project"
          node dist/index.js --help | grep -q "setup-wiki"
      - name: Verify real released-package safety-net retirement
        run: node scripts/verify-native-safety-net-retirement.mjs --out "${{ runner.temp }}/lisa-safety-net-retirement"
      - name: Retain safety-net upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lisa-safety-net-retirement
          path: ${{ runner.temp }}/lisa-safety-net-retirement
          if-no-files-found: error
  windows_preflight:
    name: Windows lint-staged preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '24.21.0'
      - name: Verify native Windows tool resolution
        run: node --test tests/platform/lint-staged-preflight.test.mjs
      - name: Verify Windows gate process containment
        run: node --test tests/platform/process-tree-runner.test.mjs
