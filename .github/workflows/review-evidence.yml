# -----------------------------------------------------------------------------
# Review evidence — Lisa's own copy of the VACUITY arm it ships (#2928)
# -----------------------------------------------------------------------------
# The consumer seed lives at typescript/create-only/.github/workflows/review-evidence.yml.
# This is the same workflow pointed at Lisa itself, and it is here because Lisa
# was the repository the defect was measured on.
#
# RE-MEASURED 2026-08-25 over the last 40 merged pull requests (#3221), reading
# the `CodeRabbit` commit status on each PR's HEAD SHA. Every one reported
# `state: success`:
#
#   Review skipped: manual review required for this OSS repository   29 of 40
#   Review rate limited                                              10 of 40
#   Review completed                                                  1 of 40   <- #3185
#
# The earlier 25-PR reading (9 / 14 / 2) is superseded; the shape did not change
# and the sample did. The single reviewed PR is the negative control that keeps
# this from being a guard that refuses everything.
#
# THE 29 ARE NOT A BLIP. `Review skipped: manual review required for this OSS
# repository` is a STANDING entitlement state, not a transient one, and it is
# not set anywhere in this tree: `.coderabbit.yml` never sets
# `reviews.auto_review.enabled: false`, and it does set `auto_review.drafts:
# true`, which only makes sense with automatic review ON. The bot's own comment
# reports `Plan: Pro Plus` while saying the free OSS reviews are exhausted. That
# is a CodeRabbit-side plan/entitlement setting for a PUBLIC repository, and the
# action that clears it is a human one in CodeRabbit's console or billing — it
# cannot be fixed from this repository.
#
# AND THE MANUAL TRIGGER DOES NOT SUBSTITUTE FOR IT. Measured on #3220: an
# explicit `@coderabbitai review` was acknowledged by the bot, went
# `pending — "Review in progress"` at 17:09:08Z, and settled at
# `success — "Review rate limited"` two seconds later with ZERO reviews on the
# pull request. So a workflow that posted `@coderabbitai review` on every PR
# would not obtain a review; it would MINT ANOTHER HOLLOW GREEN each time — the
# exact artefact this job exists to detect. Do not add one.
#
# WHY THE JOB WAITS BEFORE JUDGING. Every pull request carries several
# `CodeRabbit` statuses on the SAME head SHA before the settled one — measured
# `Review queued` -> `Review in progress` -> the verdict, up to SEVEN statuses on
# #3220. Both intermediate strings are in the guard's `no_work` vocabulary, so a
# run that judged the first status it saw would report a finding on 100% of pull
# requests, and a guard that fires every time gets deleted rather than read.
# `--settle-timeout` (300s) and `--settle-interval` (15s) are what make the
# verdict the settled one. Do not "simplify" the wait away.
#
# AND 300s IS MARGINAL, MEASURED (#3801, 2026-09-06). Until #3716 an expired
# wait was published as `absent`, indistinguishable from a check that genuinely
# never reported, so the window had never been evaluated against data — the only
# evidence for it was ONE run that stopped nine seconds early. It has now been
# read over the 158 runs of this workflow between 2026-09-04T10:22Z and
# 2026-09-05T23:27Z, every one of them after the #3716 fix merged
# (2026-09-04T09:56:32Z) and therefore able to publish `undetermined`:
#
#   WAIVED              123      REVIEWED             13
#   UNDETERMINED         18      UNREVIEWED            3
#   CARRIED UNREVIEWED    1                          ---
#                                total               158
#
# So the wait EXPIRES ON 18 OF 158 RUNS (11.4%). The denominator is every run,
# not a filtered one: all 158 reached a completed gate step, none was cancelled
# mid-wait, and on none of the 158 heads did `CodeRabbit` fail to post a terminal
# status eventually. There is no "we stopped looking" bucket hiding in it.
#
# HOW LATE, in seconds between the 300s deadline and the FIRST terminal
# `CodeRabbit` status on the same head, all 18 of them:
#
#   16  34  46  52  58  83  102  131  132  141  172  203  257  273  296  329
#   348  478                       min 16 · median 141 · max 478
#
# NEITHER CLUSTERED NOR LONG-TAILED, and the distinction decides the remedy. One
# of the 18 lands inside thirty seconds and six land beyond four minutes, so the
# misses are spread broadly — but they are BOUNDED: the longest settle in the
# whole 158 is 778s from the start of the wait, and nothing failed to settle at
# all. A long tail would mean waiting buys a shrinking share and something other
# than waiting is needed. A bounded spread means a wider window converts almost
# all of them, which is what these numbers say.
#
# THE NINE-SECOND ANECDOTE IS THE OUTLIER, NOT THE TYPE. It is shorter than every
# one of the 18 gaps above. A window sized on it would have caught none of them.
# Four further runs settled inside the LAST SIXTY SECONDS of the current window
# (244s, 263s, 287s, 291s) and passed only just.
#
# WHAT A WIDER WINDOW WOULD BUY, against the 18 as denominator:
#
#   420s   7/18 (39%)      510s  12/18 (67%)      660s  17/18 (94%)
#   480s  11/18 (61%)      600s  15/18 (83%)      780s  18/18 (100%)
#
# FOUR OF THE 18 ARE NOT REVIEWS. They settle to `Review rate limited`, which
# this gate WAIVES — widening turns those from a red into a `neutral`, removing a
# false red without obtaining a review, and they are counted separately above for
# that reason. The other 14 settle to `Review approved` or `Review completed`.
#
# THE COST IS PAID ONLY WHERE IT ALREADY FAILED. The loop exits the moment the
# check settles, so a longer ceiling costs nothing on the 140 runs that settle
# early; raising it to 480s spends 2,227 extra job-seconds across these 158 runs
# and to 600s spends 2,896 — against 18 red runs each of which costs a full
# re-run of this job plus somebody deciding whether the red meant anything.
#
# HEADROOM IS SMALLER THAN IT LOOKS. `timeout-minutes: 10` is the whole job —
# checkout, setup, the wait, the verdict, the publish — so anything past roughly
# 510s needs the job ceiling raised in the same change.
#
# THE SAMPLE IS NOT CENSORED BY THE WINDOW, and that is why the tail can be read
# off it. The gaps come from `CodeRabbit` commit-status timestamps, which the
# reviewer writes whether or not this gate is still polling; a wider window does
# not move them. The one shape that WOULD censor it — a head whose check never
# settles, an unbounded gap — occurs zero times in 158. What the sample IS
# conditioned on: one repository, one reviewer vendor, and 37 hours of an
# unusually concurrent period, which biases the reviewer's queueing latency
# UPWARD. A window sized here is therefore generous rather than short; re-measure
# on a quiet week before treating this tail as the steady state.
#
# Reproduce with `gh api repos/CodySwannGT/lisa/actions/workflows/review-evidence.yml/runs`
# for the run list, `.../actions/runs/<id>/jobs` for each gate step's start and
# duration, `.../commits/<head_sha>/check-runs` for the published verdict title,
# and `.../commits/<head_sha>/statuses` for when `CodeRabbit` actually settled.
# `gh api --paginate` emits one array PER PAGE; page explicitly.
#
# THIS TICKET DELIBERATELY DID NOT MOVE THE NUMBER. #3801 asked only for the
# distribution, because picking 420 or 600 from the single nine-second
# observation is the move #3716 declined when it refused to fix a false red by
# raising a threshold. The distribution now exists and it recommends WIDENING —
# 480s inside the current job ceiling, or 600s with `timeout-minutes` raised —
# and that change belongs to whoever files it, with these numbers as its
# justification.
#
# Before #2928 nothing invoked the rule that detects any of this. A guard Lisa
# ships but does not run on itself is a guard nobody has seen bite.
#
# One difference from the seed: Lisa mirrors only two of its eleven
# copy-overwrite scripts under `scripts/`, so the in-repo template is a
# legitimate SECOND ADDRESS for the same file rather than a bypass — exactly the
# resolution the `🔒 Skipped Required Checks` job in quality.yml already does.
# When neither path resolves, the step FAILS and names what is missing.
#
# ENFORCING, as of the owner's ruling on CodySwannGT/lisa#3221, and the ruling
# is what makes enforcing safe today: `--require-review-evidence` fails this job
# unless the declared review check either RAN (`Review completed`) or said in its
# own words that it could not (`Review rate limited`, `Review skipped: manual
# review required for this OSS repository`). Those two are WAIVED — reported
# loudly every time, never blocking — because both trace to one free-OSS
# entitlement that no pull request author can act on, and a gate that reddens
# every PR on a vendor billing state is a worse gate than the one it replaces.
#
# So NOTHING BLOCKS TODAY: of the last 40 merged pull requests, 39 waive and one
# (#3185) satisfies. The point is what happens next — the moment the entitlement
# is fixed, `Review completed` becomes the norm and any review that RUNS AND
# OBJECTS blocks, with no code change and no second decision. That is the design
# target, not an accident of the current numbers.
#
# THE 39 IS WHY THE RENDERING CHANGED (#3639, 2026-09-03). That number sat in
# this comment and changed nothing. A waiver covering 39 of 40 merges is the
# DEFAULT path, and until #3639 the default path rendered exactly like the
# success path: this job exited 0 whether the gate was satisfied or waived, so
# `gh pr checks` printed `pass` for a pull request nothing had read. The waiver
# was loud in a log and silent at the only layer a merge decision consults —
# the same indistinguishability this guard exists to remove, reproduced on the
# guard's own green.
#
# The decision taken, recorded here beside the rationale it modifies: THE
# WAIVER STAYS AND ITS REASON STANDS — a pull request author cannot fix a
# vendor's billing state, and a gate that reddened every pull request on it
# would be worse than the one being criticised. What changed is only how it
# RENDERS. The verdict is republished as its own check run, `🕵️ Review
# evidence verdict`, whose conclusion is `success` for reviewed, `neutral` for
# WAIVED, `failure` for unsatisfied. `neutral` blocks nothing and buckets as
# `skipping` in `gh pr checks`, so a waiver can no longer print what a
# satisfied gate prints. Decided by the repository owner on #3639, on the
# evidence in that issue: four distinct vacuous states in one afternoon, and
# seven pull requests (#3632, #3633, #3634, #3636, #3637, #3647 and the release
# they shipped in) merged unreviewed under a green pair of checks.
#
# AND A PULL REQUEST SPEAKS FOR ONE COMMIT ONLY (#3658). Everything above judges
# this pull request's HEAD, which is the one commit a batch integration pull
# request does not speak for: its head carries the MERGES of every constituent
# and none of their review statuses. MEASURED 2026-09-03 on one queue drain —
# four constituents based on a batching branch each reported `Review skipped:
# reviews are disabled for this base branch`, each one's own run of this workflow
# went red, and every one of those reds landed on a branch outside the rulesets'
# ref conditions, so nothing was watching. The integration pull request that
# carried all four into the default branch was the one place a ruleset applied,
# and it read only itself. `--require-review-evidence` now also enumerates what
# this pull request CARRIES — through its merge commits, never through a branch
# NAME, because a name is an allowlist the convention can rename its way out of
# — reads each constituent at its OWN head, and renders a batch carrying an
# unreviewed constituent `neutral` instead of `success`. Capped at `neutral`
# deliberately: the constituents' own runs already reached the failing verdict
# where their diffs live, and reddening the batch too would fail an author for a
# diff they did not write. Failing to READ the batch renders `neutral` as well —
# an unread batch is not a reviewed one. An ordinary pull request has no merge
# commits, enumerates an empty batch, and is untouched.
#
# AND THE RATE IS NOW EMITTED, not commented. `--waive-rate-sample=40` samples
# recently merged pull requests and prints the tally in the job summary and in
# the verdict title, so the 39-of-40 shape is re-measured on every waived run
# instead of being a number somebody once wrote down. It is best-effort: a
# failed sample costs one sentence, never the verdict.
#
# `--fail-on-vacuous` is a DIFFERENT switch and is still not passed. It means
# "fail on a check that did no work", which is precisely the case the ruling
# waives; sharing one flag between opposite policies is how a gate ends up doing
# the thing its name forbids.
#
# THREE STATES, NEVER TWO. `absent` is not `waived`: nothing said it could not
# review, so nothing accounts for the silence. That distinction is load-bearing
# rather than pedantic — measured on #3221, 40 of 40 MERGE COMMITS carry no
# `CodeRabbit` status at all, so a gate keyed on the wrong commit reads absent
# every single time, and an absent-means-waived gate would pass forever while
# reporting nothing.
#
# STILL NOT A REQUIRED CONTEXT. This job is absent from
# `.github/required-checks.json`, so a red run here is visible and does not yet
# block a merge. Promoting it is gated by
# `scripts/check-required-check-promotions.mjs` and needs the live ruleset
# edited in an admin console — a human action, tracked on #3221.

name: 🕵️ Review Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to inspect'
        required: true
        type: string

# `actions: read` is what `gh pr checks` needs — it resolves the rollup through
# `checkSuite.workflowRun`, and without it `gh` exits non-zero with EMPTY
# STDOUT, which reads as a content problem and never says "permission".
# `checks: read` + `statuses: read` serve the guard's permission-light fallback;
# a legacy commit status like CodeRabbit's is the only route carrying a
# description at all.
permissions:
  contents: read
  actions: read
  # `checks: write` is what the verdict-publishing step needs, and it is the
  # smallest grant that reaches the layer the defect lives on: a check run is
  # the only artefact that can carry a `neutral` conclusion, and `neutral` is
  # the only rendering that is neither a pass nor a failure. A commit status
  # has no such state, so a waiver posted that way would be a `pass` again.
  checks: write
  statuses: read
  pull-requests: read

concurrency:
  group: review-evidence-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  vacuity:
    # DECLARATIVE, NOT A QUESTION (#3917). This was `🕵️ Did the required review
    # checks do any work?`, and an unsatisfied verdict exits non-zero, so the
    # row rendered `Did the required review checks do any work?  fail`. A yes/no
    # question answered `fail` composes to "NO" — the row asserted that the
    # review checks did no work at exactly the moment the verdict below said
    # `UNDETERMINED — ... is NOT reporting that nobody reviewed`. MEASURED: a
    # reader who was hunting this class of defect read the row, believed the
    # negative, and ranked "the review genuinely did no work" first among the
    # explanations. A question-shaped name cannot safely carry more than two
    # outcomes, and the settle-timeout gives this gate a third.
    #
    # AND THE OBVIOUS REPLACEMENT WOULD BE A NEW FALSE CLAIM. `Required review
    # checks did work` reads true on a failure but FALSE on a pass: this job
    # exits 0 for a SATISFIED gate and for a WAIVED one alike, and the waiver
    # covers 39 of the last 40 merged pull requests, so the pass path would
    # assert work on the very pull requests nothing reviewed. That is the same
    # defect one square over. The name therefore describes the GATE and asserts
    # nothing about the review; the verdict itself is published next door as
    # `🕵️ Review evidence verdict`, which is where the three-valued answer
    # belongs and already renders correctly.
    #
    # Only the name changed. Severity, exit codes, the wait, and the verdict
    # vocabulary are all untouched — see `tests/unit/scripts/review-evidence-check-name.test.ts`,
    # which asserts both that this row cannot compose into a false negative and
    # that a genuinely unreviewed pull request is still a failure.
    name: 🕵️ Review evidence gate
    runs-on: ubuntu-latest
    # The guard waits for the declared checks to settle before judging them, and
    # its default ceiling is five minutes. This leaves room for the wait plus
    # the run.
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ vars.NODE_VERSION || '22.21.1' }}

      - name: 🕵️ Refuse a required check that reviewed nothing
        id: review_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          # Absent on a `pull_request` run, where the guard reads the event
          # payload instead; set only for the manual dispatch path.
          VACUITY_PR: ${{ inputs.pr }}
        run: |
          set -eu
          script=scripts/check-skipped-required-checks.mjs
          upstream=typescript/copy-overwrite/scripts/check-skipped-required-checks.mjs
          if [ ! -f "$script" ] && [ -f "$upstream" ]; then
            echo "Using the in-repo template at $upstream; no installed copy under scripts/."
            script="$upstream"
          fi
          if [ ! -f "$script" ]; then
            echo "::error title=Vacuity prover missing::scripts/check-skipped-required-checks.mjs does not exist, so no required check was read on this pull request. An absent prover is a FAILURE, never a skip — a job that passes because it found nothing to run with is the same false green this guard exists to refuse."
            exit 1
          fi
          if [ ! -f .github/required-checks.json ]; then
            echo "::error title=Required-checks declaration missing::.github/required-checks.json does not exist, so nothing names which checks are supposed to carry review evidence."
            exit 1
          fi
          if [ -n "${VACUITY_PR:-}" ]; then
            node "$script" --vacuity --require-review-evidence --waive-rate-sample=40 --pr="$VACUITY_PR"
          else
            node "$script" --vacuity --require-review-evidence --waive-rate-sample=40
          fi

      # ---------------------------------------------------------------------
      # The point of #3639: render the verdict where a merge decision reads it.
      # ---------------------------------------------------------------------
      # The job above exits 0 for a SATISFIED gate and 0 for a WAIVED one, so
      # `gh pr checks` printed `pass` for a pull request nothing had read,
      # character for character what it prints for a reviewed one. The waiver
      # was honest in the run log and invisible at the only layer anybody
      # consults before pressing merge; measured on this repository, 39 of the
      # last 40 merged pull requests took that path, so the disguise was the
      # DEFAULT rendering rather than an edge case.
      #
      # This step republishes the same verdict as its own check run, whose
      # conclusion the guard chose: `success` reviewed, `neutral` WAIVED,
      # `failure` unsatisfied. `gh pr checks` buckets NEUTRAL as `skipping`, so
      # a waiver stops looking like a pass without acquiring the power to block
      # — the waiver's rationale is untouched, because a pull request author
      # still cannot fix a vendor's billing state.
      #
      # `continue-on-error` and `if: always()`: this is RENDERING, downstream of
      # a verdict already reached and already exited on. A fork pull request
      # gets a read-only token and cannot write a check run at all, and losing
      # the rendering there must not invert the verdict above it.
      - name: 🕵️ Publish the review verdict where a merge decision reads it
        if: always() && steps.review_evidence.outputs.review_evidence_conclusion != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Empty on the `workflow_dispatch` path, where there is no
          # `pull_request` payload to read a head SHA from. The step resolves it
          # from the dispatched number instead, so it needs the number too.
          VACUITY_PR: ${{ inputs.pr }}
          VERDICT_CONCLUSION: ${{ steps.review_evidence.outputs.review_evidence_conclusion }}
          VERDICT_TITLE: ${{ steps.review_evidence.outputs.review_evidence_title }}
        run: |
          set -eu
          if [ -z "${HEAD_SHA:-}" ]; then
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${VACUITY_PR}" --jq .head.sha)"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            --method POST \
            --field name='🕵️ Review evidence verdict' \
            --field head_sha="$HEAD_SHA" \
            --field status=completed \
            --field conclusion="$VERDICT_CONCLUSION" \
            --field output[title]="$VERDICT_TITLE" \
            --field output[summary]="$VERDICT_TITLE

          Published by the \`🕵️ Review Evidence\` workflow. A \`neutral\` conclusion here means WAIVED: a declared review check said in its own words that it could not review, this pull request is UNREVIEWED, and merging it is a decision taken on that basis. It is deliberately not a failure — a pull request author cannot fix a vendor entitlement — and deliberately not a pass." \
            > /dev/null
