# -----------------------------------------------------------------------------
# Review evidence — Lisa's own copy of the VACUITY arm it ships (#2928)
# -----------------------------------------------------------------------------
# The consumer seed lives at typescript/create-only/.github/workflows/review-evidence.yml.
# This is the same workflow pointed at Lisa itself, and it is here because Lisa
# was the repository the defect was measured on.
#
# RE-MEASURED 2026-08-25 over the last 40 merged pull requests (#3221), reading
# the `CodeRabbit` commit status on each PR's HEAD SHA. Every one reported
# `state: success`:
#
#   Review skipped: manual review required for this OSS repository   29 of 40
#   Review rate limited                                              10 of 40
#   Review completed                                                  1 of 40   <- #3185
#
# The earlier 25-PR reading (9 / 14 / 2) is superseded; the shape did not change
# and the sample did. The single reviewed PR is the negative control that keeps
# this from being a guard that refuses everything.
#
# THE 29 ARE NOT A BLIP. `Review skipped: manual review required for this OSS
# repository` is a STANDING entitlement state, not a transient one, and it is
# not set anywhere in this tree: `.coderabbit.yml` never sets
# `reviews.auto_review.enabled: false`, and it does set `auto_review.drafts:
# true`, which only makes sense with automatic review ON. The bot's own comment
# reports `Plan: Pro Plus` while saying the free OSS reviews are exhausted. That
# is a CodeRabbit-side plan/entitlement setting for a PUBLIC repository, and the
# action that clears it is a human one in CodeRabbit's console or billing — it
# cannot be fixed from this repository.
#
# AND THE MANUAL TRIGGER DOES NOT SUBSTITUTE FOR IT. Measured on #3220: an
# explicit `@coderabbitai review` was acknowledged by the bot, went
# `pending — "Review in progress"` at 17:09:08Z, and settled at
# `success — "Review rate limited"` two seconds later with ZERO reviews on the
# pull request. So a workflow that posted `@coderabbitai review` on every PR
# would not obtain a review; it would MINT ANOTHER HOLLOW GREEN each time — the
# exact artefact this job exists to detect. Do not add one.
#
# WHY THE JOB WAITS BEFORE JUDGING. Every pull request carries several
# `CodeRabbit` statuses on the SAME head SHA before the settled one — measured
# `Review queued` -> `Review in progress` -> the verdict, up to SEVEN statuses on
# #3220. Both intermediate strings are in the guard's `no_work` vocabulary, so a
# run that judged the first status it saw would report a finding on 100% of pull
# requests, and a guard that fires every time gets deleted rather than read.
# `--settle-timeout` (300s) and `--settle-interval` (15s) are what make the
# verdict the settled one. Do not "simplify" the wait away.
#
# Before #2928 nothing invoked the rule that detects any of this. A guard Lisa
# ships but does not run on itself is a guard nobody has seen bite.
#
# One difference from the seed: Lisa mirrors only two of its eleven
# copy-overwrite scripts under `scripts/`, so the in-repo template is a
# legitimate SECOND ADDRESS for the same file rather than a bypass — exactly the
# resolution the `🔒 Skipped Required Checks` job in quality.yml already does.
# When neither path resolves, the step FAILS and names what is missing.
#
# REPORT-ONLY, deliberately. `--fail-on-vacuous` is available and is not passed:
# whether a rate-limited review bot should block a merge is a governance call an
# owner makes, and this workflow's job is to make the fact visible, not to make
# it for them. It can still go red when it inspected NOTHING — that is a refusal,
# not a finding, and the `vacuity_*` token in the report says which is which.
#
# Two things anyone reconsidering that should know. First, the flip is an EXIT
# CODE and nothing else: the finding, the `::warning` annotation and the job
# summary are emitted identically with and without the flag, so report-only and
# enforcing differ in what they do to the build, never in what an operator sees.
# Second, this job is NOT in `.github/required-checks.json`, so passing the flag
# alone turns it red without blocking anything — converting a hollow green into
# a real merge block also needs the context promoted, which is gated by
# `scripts/check-required-check-promotions.mjs`. #3221 tracks that decision.

name: 🕵️ Review Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to inspect'
        required: true
        type: string

# `actions: read` is what `gh pr checks` needs — it resolves the rollup through
# `checkSuite.workflowRun`, and without it `gh` exits non-zero with EMPTY
# STDOUT, which reads as a content problem and never says "permission".
# `checks: read` + `statuses: read` serve the guard's permission-light fallback;
# a legacy commit status like CodeRabbit's is the only route carrying a
# description at all.
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: review-evidence-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  vacuity:
    name: 🕵️ Did the required review checks do any work?
    runs-on: ubuntu-latest
    # The guard waits for the declared checks to settle before judging them, and
    # its default ceiling is five minutes. This leaves room for the wait plus
    # the run.
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ vars.NODE_VERSION || '22.21.1' }}

      - name: 🕵️ Refuse a required check that reviewed nothing
        env:
          GH_TOKEN: ${{ github.token }}
          # Absent on a `pull_request` run, where the guard reads the event
          # payload instead; set only for the manual dispatch path.
          VACUITY_PR: ${{ inputs.pr }}
        run: |
          set -eu
          script=scripts/check-skipped-required-checks.mjs
          upstream=typescript/copy-overwrite/scripts/check-skipped-required-checks.mjs
          if [ ! -f "$script" ] && [ -f "$upstream" ]; then
            echo "Using the in-repo template at $upstream; no installed copy under scripts/."
            script="$upstream"
          fi
          if [ ! -f "$script" ]; then
            echo "::error title=Vacuity prover missing::scripts/check-skipped-required-checks.mjs does not exist, so no required check was read on this pull request. An absent prover is a FAILURE, never a skip — a job that passes because it found nothing to run with is the same false green this guard exists to refuse."
            exit 1
          fi
          if [ ! -f .github/required-checks.json ]; then
            echo "::error title=Required-checks declaration missing::.github/required-checks.json does not exist, so nothing names which checks are supposed to carry review evidence."
            exit 1
          fi
          if [ -n "${VACUITY_PR:-}" ]; then
            node "$script" --vacuity --pr="$VACUITY_PR"
          else
            node "$script" --vacuity
          fi
