name: 🧩 Plugins Sync

# Guards against editing the generated plugin artifacts (plugins/lisa,
# plugins/lisa-*) directly. They are built from plugins/src by
# `bun run build:plugins`, which does `rm -rf plugins/lisa && cp -r plugins/src`,
# so an artifact-only edit is silently discarded on the next build. This check
# rebuilds from source and asserts the committed artifacts match.
#
# NOTE: This workflow is repo-specific to the Lisa monorepo and is NOT a Lisa
# template — do not move it under plugins/src or the create-only template sets.
# For the same reason its context is NOT in typescript/github-rulesets/
# quality-checks.json (host projects have no plugins-sync.yml and would wait
# forever on a check that never reports — the #2476 defect). It is added to
# THIS repository's ruleset only, via `github.rulesets.addRequiredChecks` in
# .lisa.config.json.
#
# ⚠️ DO NOT ADD A `paths:` FILTER (#2485). `🧩 Plugin artifacts match source` is
# a REQUIRED status check on `main`. A workflow filtered out by `paths` does not
# run at all, so its context never reports — GitHub then shows "Expected —
# Waiting for status to be reported" and the pull request can never merge.
# Measured, not assumed: PR #2496 touched only .github/workflows/
# maestro-native-e2e.yml and a test file, and reported no plugins-sync context
# whatsoever. The job is deterministic, offline, and finishes in ~25s, so it
# runs on every pull request instead.

on:
  pull_request:
  workflow_dispatch:

jobs:
  plugins-sync:
    name: 🧩 Plugin artifacts match source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the commit-message gate below validates every commit
          # the pull request adds, and the default shallow clone does not
          # contain the base commit, so `commitlint --from <base>` fails in
          # `getHistoryCommits` before it lints anything. It failed loudly
          # rather than passing vacuously, which is the correct direction — but
          # it is exactly the sort of thing a check verified only locally will
          # get wrong, since a local clone always has the history.
          fetch-depth: 0
          # Nothing after checkout touches the remote: `bun install` resolves
          # from the lockfile, the checks are offline, and commitlint reads the
          # history `fetch-depth: 0` already fetched. So the token has no reason
          # to outlive the checkout step, and leaving it in .git/config lends
          # authenticated push access to every command that follows.
          persist-credentials: false
      - name: '🍞 Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # #2548 committed literal `<<<<<<< HEAD` blocks into six generated parity
      # SKILL.md files and the sync check below still passed, because it
      # compares the generated copies against plugins/src and BOTH sides were
      # broken identically. So the marker gate runs first, and here rather than
      # only in .husky/pre-push.local: a cloud agent or a hookless clone pushes
      # without ever running the local hook, and this job is a required context
      # on every pull request.
      - name: Check for leftover merge-conflict markers
        run: bun run check:conflict-markers
      # #2702 shipped two expo templates pinned at @v2.345.1, a Lisa version
      # that predates the reusable they call. A consumer receiving one gets a
      # workflow that cannot LOAD: GitHub runs zero jobs, so there is no test
      # output and nothing reads as red. One of them never succeeded once in
      # three scheduled runs across two repos and stayed byte-identical to the
      # broken template, because a workflow that never runs gives nobody a
      # reason to touch it. Deliberately NOT in the shared gate registry: this
      # repo is the only one that carries caller templates, and the gate's
      # refusal to pass an empty scan would fail every consumer's commit.
      - name: Check caller-template workflow refs resolve
        # The templates pin immutable tags (Appendix A5), so this gate needs the
        # tag objects locally to verify them. It refuses to pass a reference it
        # could not resolve, so a missing tag fails the job loudly instead of
        # reporting a clean scan — which is the whole point of the gate and not
        # something to paper over with `|| true`.
        run: |
          git fetch --tags --quiet --no-recurse-submodules
          bun run check:template-workflow-refs
      # #2714: Lisa decides a consumer's tree from two manifests nobody ever
      # compared — the delivery lanes and the `deletions.json` files. A path in
      # both is created and then destroyed in one `apply`, because deletions run
      # after every lane and are unconditional. 52 released tags carried at
      # least one, including one in `all/` — active for every project — that
      # survived 32 consecutive releases. Each was caught by hand, later, by
      # someone who noticed a file that would not stay put. Like the gate above
      # it, this belongs here rather than in the shared registry: only this repo
      # carries lane directories, and the gate's refusal to pass an empty scan
      # would fail every consumer's commit.
      - name: Check no path is both delivered and deleted
        run: bun run check:delivery-deletion-conflicts
      # #2960: consumers reference the reusable workflow at `@main` but
      # version-pin the package, so every consumer runs TODAY'S workflow
      # against an OLDER package. #2951 proved the cost — a prover moved
      # directories 72 minutes after a release, the workflow followed it in the
      # same commit, and the `conflict-residue` gate failed closed fleet-wide
      # on clean trees. Lisa could not have caught it by running the step: it is
      # the one repository where the host-relative candidate resolves, so its
      # own run found the prover in its checkout no matter what the package
      # contained. Only a released tarball answers the question, so this step
      # reads three of them.
      #
      # Unlike its neighbours this one needs the npm registry. It refuses to
      # pass a scan it could not perform — a registry it cannot reach is exit 2,
      # not a quiet green — which is the same stance every gate in this job
      # takes and the reason they are trustworthy.
      - name: Check workflow package paths exist in released packages
        run: bun run check:workflow-package-paths
      # #3050: the step above asks whether a PACKAGE path survives a release.
      # It states its own boundary — host-relative candidates "do not count and
      # are never extracted" — and this is that excluded arm. A reusable body
      # reaches a consumer at `@main` on their next run; the caller-tree script
      # it invokes reaches them only when somebody applies, and for a
      # create-only artifact never at all. Nothing measured the gap, and the
      # gap is silent: the step skips, so it posts no context, and an ABSENT
      # required context is not a red one. Like its neighbours this belongs
      # here rather than in the shared registry — only this repo carries both
      # halves, and the gate's refusal to pass an empty scan would fail every
      # consumer's commit.
      - name: Check two-channel delivery couplings
        run: bun run check:two-channel-couplings
      - name: Check plugin artifacts are in sync with plugins/src
        run: bun run check:plugins
      - name: Check rules eager/reference pairing
        run: bun run check:rules-pairing
      # #3090: a shell pipeline's exit status is its LAST stage's, so a gate
      # piped into `tail`/`head`/`tee` reports the pager's success and a FAILED
      # gate is recorded as passing. It is not hypothetical here — the
      # `security-floors.yml` step discarded every failure `--strict` exists to
      # raise, and `duplicate-versions.yml` discarded the exit 2 that says the
      # scan could not be performed at all. Like its neighbours, the sweep
      # refuses to pass an inspection it did not perform: it prints how many
      # pipelines it parsed and exits 2 at zero, because an empty scan and a
      # clean tree otherwise print the same tick.
      - name: Check no gate is read through a pipe
        run: bun run check:pipeline-status-reads
      # #3081: a multi-step text transform guarded by comparing its finished
      # output to its input passes as soon as ANY ONE step lands, so the other
      # N−1 can silently stop matching. #2980 deleted the line a fixture's first
      # rewrite anchored on; the second still matched, the guard stayed green,
      # and the fixture built a module referencing an identifier it never
      # imported — surfacing as a module-resolution error inside a test about
      # repository layout. Like its neighbours, the sweep refuses to pass an
      # inspection it did not perform: it prints how many transforms it parsed
      # and exits 2 at zero.
      - name: Check no multi-step transform is guarded only whole-output
        run: bun run check:whole-output-guards
      # #3190: a shell guard cannot be mutation-tested — #3111 established that
      # Stryker cannot instrument shell at all — so its driving test is the only
      # bite evidence it can have, and nine guards had a driving test whose every
      # case exercised the ALLOW path. Replace one with `exit 0` and its suite
      # still passed, which reads as covered and is not. This step re-runs the
      # suites that can execute a shipped `.sh` with a tracer attached and names
      # any guard the run never saw refuse. It costs a second vitest pass, and
      # that is the price of the population being what RAN rather than a written
      # roster — a written one is what went stale in #2847. Like its neighbours
      # it refuses to pass an inspection it did not perform: it prints how many
      # guards it observed and exits 2 at zero.
      - name: Check every driven shell guard was seen refusing
        run: bun run check:shell-guard-refusals
      # `Check canonical project learnings budget` used to live here, and this
      # is where #2932's defect was: the `learnings_budget` skip token reaches
      # `quality.yml` and `quality-rails.yml`, and could not reach this step —
      # one of fifteen inside `🧩 Plugin artifacts match source`, a REQUIRED
      # context on this repository's ruleset. So the property stayed enforced
      # here no matter what a project declared, and any gate governing only the
      # two reachable jobs would have been the same defect one layer up: a
      # declaration satisfied in one workflow and ignored in another.
      #
      # It moved into the gated `📚 Learnings Budget` job, which now checks BOTH
      # the shipped template (what this step checked) and this repository's own
      # ledger, under one declaration. Nothing was dropped — `bun run
      # check:learnings-budget` with no argument covers both surfaces as of
      # #2932, and that job's context is required on this repository's ruleset
      # in the same change, so the property lost no enforcement in moving.

      # Below: CI arms for gates that were enforced ONLY by a local git hook.
      #
      # A hook is forgeable by whoever runs it. Shell expansion makes the set of
      # ways to write `--no-verify` unbounded — `flag=--no-verify; git commit
      # "$flag"` already defeats the text matcher — so widening that matcher is
      # an arms race lost by definition. What is bounded, and what actually
      # matters, is the set of guarantees with no server-side arm: those are the
      # ones a bypass silently costs you. Everything else is re-run here anyway,
      # so skipping a hook buys a red pull request, not a bad merge.
      #
      # These two close that gap. A cloud agent, a hookless clone, or anyone
      # past the matcher still meets them, because the runner is not theirs.
      - name: Check generated artifacts match their sources
        # Was pre-commit only. `check-derived-artifacts.mjs --staged` inspects
        # the index, so it is structurally unable to run here — nothing is
        # staged in CI and it would report clean having examined no files.
        # `check:artifacts` re-derives from the tree instead, which is the same
        # question asked in a way that has an answer at this moment.
        run: bun run check:artifacts

      - name: Check commit messages follow the convention
        if: github.event_name == 'pull_request'
        # Was commit-msg only. Validates every commit the pull request adds,
        # not just the tip: a bypassed hook leaves a malformed message in the
        # middle of a branch that a tip-only check would never see.
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      # NOT added here, deliberately: upstream plugin parity
      # (`plugin-parity-drift.mjs`, `plugin-routing-validate.mjs`). Both read
      # the installed plugin cache at `~/.claude/plugins/cache`, which does not
      # exist on a runner — so a CI arm would compare against nothing and report
      # green having proved nothing. That is the exact defect this block exists
      # to prevent, and a known-uncovered gate is safer than a vacuous one.
      # Covering it needs the cache provisioned in CI first.
