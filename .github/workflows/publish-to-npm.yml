# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

# Reusable workflow for publishing to npm with OIDC trusted publishing
# This workflow is not callable directly - it must be called from another workflow
#
# Usage:
#   publish:
#     uses: ./.github/workflows/publish-to-npm.yml
#     needs: [release]
#     with:
#       tag: ${{ needs.release.outputs.tag }}
#       version: ${{ needs.release.outputs.version }}
#       node_version: '22.x'
#       package_manager: 'bun'

name: Publish to npm

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to publish from'
        required: true
        type: string
      version:
        description: 'Version to publish'
        required: true
        type: string
      release_commit:
        description: 'Immutable release commit that the tag and package must bind to'
        required: true
        type: string
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '20.x'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string

# Required permissions for OIDC publishing
permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Job-level so every step below reads these from the environment instead of
    # having them substituted into its script. A `${{ }}` expression is
    # substituted by Actions BEFORE the shell parses the script, so an
    # interpolated value is shell SOURCE TEXT rather than an argument - and
    # `tag`, `version` and `package_manager` are all free-text `type: string`
    # inputs that reach `git checkout`, `npm version` and a bare command name.
    # Paired with the shape gates in Validate inputs below (#3717).
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      PACKAGE_MANAGER: ${{ inputs.package_manager }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Tag input is empty - cannot publish without a version tag"
            echo "This usually means the version job was skipped (e.g., promotion merge detected)"
            exit 1
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Version input is empty - cannot publish without a version"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Release commit input must be a full 40-hex SHA"
            exit 1
          fi
          # Shape gates, so a value carrying shell metacharacters is refused
          # before it reaches `git checkout`, `npm version`, or a command name.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag input is not a valid version tag"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version input is not a valid semantic version"
            exit 1
          fi
          case "$PACKAGE_MANAGER" in
            npm|yarn|pnpm|bun) ;;
            *)
              echo "::error::Unsupported package manager: must be npm, yarn, pnpm or bun"
              exit 1
              ;;
          esac
          echo "✅ Inputs validated: tag=$RELEASE_TAG, version=$RELEASE_VERSION, release_commit=$RELEASE_COMMIT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for tag to be available
        run: |
          echo "Waiting for tag $RELEASE_TAG to be available..."
          for i in {1..30}; do
            git fetch --tags
            if git tag --list | grep -qx "$RELEASE_TAG"; then
              echo "Tag $RELEASE_TAG is now available"
              git checkout "$RELEASE_TAG"
              break
            fi
            echo "Attempt $i/30: Tag not found yet, waiting 10 seconds..."
            sleep 10
          done

          # Final check
          if [ "$(git describe --exact-match --tags 2>/dev/null)" != "$RELEASE_TAG" ]; then
            echo "Error: Tag $RELEASE_TAG is still not available after 5 minutes"
            exit 1
          fi

      - name: Validate checked-out release identity
        run: |
          node scripts/check-release-package-identity.mjs checkout \
            --release-commit "$RELEASE_COMMIT" \
            --tag "$RELEASE_TAG"

      - name: Setup bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        # npm 12 requires a newer Node release than this project currently pins.
        run: npm install -g npm@11.7.0

      - name: Get OIDC Token for npm
        id: npm-oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://registry.npmjs.org');
            core.setOutput('npm-token', token);
            core.setSecret(token);

      - name: Configure npm with OIDC Token
        env:
          # Interpolating a token into the script would put the credential
          # itself into shell source, where a stray metacharacter changes what
          # the line does. It is registered as a secret above, so it is masked
          # in logs either way — this is about the shell, not the log.
          NPM_OIDC_TOKEN: ${{ steps.npm-oidc.outputs.npm-token }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_OIDC_TOKEN" >> ~/.npmrc
          npm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      - name: Update package version
        run: |
          # Update package.json to match the release version
          VERSION="$RELEASE_VERSION"
          if [ -n "$VERSION" ]; then
            echo "Updating package.json to version $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Stamp immutable release identity
        run: |
          npm pkg set lisaReleaseCommit="$RELEASE_COMMIT"
          npm pkg set gitHead="$RELEASE_COMMIT"
          # The tag, not the commit, is what a consumer gets pinned at. The two
          # fields above record what this package was BUILT from and are
          # provenance only; a history rewrite orphans that commit while the
          # tag ref is carried forward, and a caller pinned at an orphaned
          # commit stops loading its workflow without ever reporting a failure.
          npm pkg set lisaReleaseTag="$RELEASE_TAG"

      - name: Build package
        run: |
          "$PACKAGE_MANAGER" run build

      - name: Pack and validate release candidate
        id: release_package
        run: |
          pack_destination="$RUNNER_TEMP/lisa-release-package"
          node scripts/check-release-package-identity.mjs pack \
            --version "$RELEASE_VERSION" \
            --release-commit "$RELEASE_COMMIT" \
            --tag "$RELEASE_TAG" \
            --pack-destination "$pack_destination"

      - name: Publish to npm with OIDC
        env:
          RELEASE_TARBALL: ${{ steps.release_package.outputs.tarball }}
        run: npm publish "$RELEASE_TARBALL" --access public --provenance
        # npm publish is required for OIDC provenance - bun publish doesn't support --provenance yet
        # Configure trusted publisher at: https://www.npmjs.com/package/<package-name>/access

      # The publish command exiting zero is not the same fact as the version
      # being installable, and CodySwannGT/lisa#3684 is the gap between them:
      # v4.33.7 was tagged, GitHub-released and provenance-attested while
      # registry.npmjs.org returned 404 for it, and nothing noticed for a day.
      #
      # Asks the EXACT-VERSION endpoint, never dist-tags.latest. `latest` lags a
      # successful publish by several minutes (CodySwannGT/lisa#3685), so
      # verifying against it would report a false miss for a publish that landed
      # — and a check that cries wolf is a check somebody deletes.
      #
      # Blocks on "could not ask the registry" as well as on "the registry says
      # no". Nothing was proved in either case, and reporting success for an
      # input never examined is the defect one layer up.
      - name: Verify the publish reached the registry
        run: |
          package_name="$(node -p "require('./package.json').name")"
          node scripts/check-npm-publish-landed.mjs \
            --package "$package_name" \
            --version "$RELEASE_VERSION"

      - name: Notify on success
        run: echo "Successfully published and verified version $RELEASE_VERSION on npm with provenance"
