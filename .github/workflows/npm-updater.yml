# Opt-in reusable producer. Host repositories own triggers and committed selection.
name: Selected npm update

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        type: string
        default: ''
      npm-version:
        description: Exact supported npm version matching the host declaration
        type: string
        default: '11.21.0'
        required: false
      cancel_issue:
        description: Explicit stale prepublication proposal issue to cancel
        type: string
        default: ''
        required: false
      cancel_proposal_key:
        description: Exact original proposal key for the manual cancellation
        type: string
        default: ''
        required: false
      cancel_expected_main:
        description: Exact current main commit authorizing the replacement
        type: string
        default: ''
        required: false

permissions: {}
concurrency:
  group: lisa-npm-${{ github.repository }}
  cancel-in-progress: false

env:
  NPM_VERSION: ${{ inputs.npm-version }}

jobs:
  workflow_contract:
    name: 🔖 Workflow Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert workflow contract
        env:
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: npm-updater.yml
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."
  prepare:
    needs: workflow_contract
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.prepare.outputs.status }}
    steps:
      - &phase-path
        name: Select this job's native private phase directory
        run: echo "PHASE=$RUNNER_TEMP/lisa-npm-phase" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - name: Install only the supported script-free controller dependencies
        run: |
          case "$NPM_VERSION" in 10.9.9|11.21.0) ;; *) exit 1 ;; esac
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - id: prepare
        run: |
          node scripts/lisa-npm-updater.mjs prepare "$GITHUB_WORKSPACE" "$PHASE"
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.env.PHASE+"/prepare.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"status="+value.status+"\n")'
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.status == 'prepared'
        with:
          name: npm-prepared
          path: ${{ env.PHASE }}/*.json
          if-no-files-found: error
          retention-days: 1

  allocate:
    needs: prepare
    if: needs.prepare.outputs.status == 'prepared'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write
      attestations: write
    steps:
      - *phase-path
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - run: |
          case "$NPM_VERSION" in 10.9.9|11.21.0) ;; *) exit 1 ;; esac
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - &pinned-gh
        name: Install the official Linux GH bytes declared by the trusted host
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/lisa-gh.XXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          curl --fail --location --silent --show-error --max-time 60 --max-filesize 150000000 https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz --output "$directory/archive.tar.gz"
          tar -xzOf "$directory/archive.tar.gz" gh_2.96.0_linux_amd64/bin/gh > "$directory/gh"
          node -e 'const fs=require("fs"),crypto=require("crypto"),p=JSON.parse(fs.readFileSync(".lisa.config.json")).automationProvenance; if(p.ghExecutable!=="/usr/local/bin/gh" || !/^[a-f0-9]{64}$/.test(p.ghSha256) || crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex")!==p.ghSha256)throw Error("official Linux GH identity differs from committed policy")' "$directory/gh"
          sudo install -m 755 -- "$directory/gh" /usr/local/bin/gh
      - uses: actions/download-artifact@v8
        with:
          name: npm-prepared
          path: ${{ env.PHASE }}
      - run: chmod 700 "$PHASE" && chmod 600 "$PHASE"/*.json
      - id: cancel_prepare
        name: Authenticate the explicit stale cancellation intent
        if: inputs.cancel_issue != '' || inputs.cancel_proposal_key != '' || inputs.cancel_expected_main != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANCEL_ISSUE: ${{ inputs.cancel_issue }}
          CANCEL_PROPOSAL_KEY: ${{ inputs.cancel_proposal_key }}
          CANCEL_EXPECTED_MAIN: ${{ inputs.cancel_expected_main }}
        run: |
          node scripts/lisa-npm-updater.mjs cancel-prepare "$GITHUB_WORKSPACE" "$PHASE"
          node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(process.env.PHASE+"/cancellation-state.json")); if(!["fresh","recorded"].includes(v.mode))throw Error("cancellation mode differs"); fs.appendFileSync(process.env.GITHUB_OUTPUT,"mode="+v.mode+"\n")'
      - id: cancel_authority
        if: steps.cancel_prepare.outputs.mode == 'fresh'
        name: Select the separate fixed cancellation subject
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"),p=process.env.PHASE; fs.appendFileSync(process.env.GITHUB_OUTPUT,"digest=sha256:"+crypto.createHash("sha256").update(fs.readFileSync(p+"/cancellation.json")).digest("hex")+"\n")'
      - id: cancel_attest
        if: steps.cancel_prepare.outputs.mode == 'fresh'
        uses: actions/attest@v4.2.2
        with:
          subject-name: cancellation.json
          subject-digest: ${{ steps.cancel_authority.outputs.digest }}
          predicate-type: https://lisa.dev/attestations/npm-cancellation/v1
          predicate-path: ${{ env.PHASE }}/cancellation.json
          push-to-registry: false
          create-storage-record: false
      - name: Persist the authenticated cancellation before fresh allocation
        if: inputs.cancel_issue != '' || inputs.cancel_proposal_key != '' || inputs.cancel_expected_main != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANCEL_ISSUE: ${{ inputs.cancel_issue }}
          CANCEL_PROPOSAL_KEY: ${{ inputs.cancel_proposal_key }}
          CANCEL_EXPECTED_MAIN: ${{ inputs.cancel_expected_main }}
          BUNDLE: ${{ steps.cancel_attest.outputs.bundle-path }}
          MODE: ${{ steps.cancel_prepare.outputs.mode }}
        run: |
          case "$MODE" in
            fresh) install -m 600 -- "$BUNDLE" "$PHASE/cancellation-bundle.json" ;;
            recorded) test -f "$PHASE/cancellation-bundle.json" ;;
            *) exit 1 ;;
          esac
          node scripts/lisa-npm-updater.mjs cancel-checkpoint "$GITHUB_WORKSPACE" "$PHASE"
      - name: Allocate or recover the exact canonical leaf
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lisa-npm-updater.mjs allocate "$GITHUB_WORKSPACE" "$PHASE"
      - id: authority
        name: Select the fixed current signing role
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto"),p=process.env.PHASE; const mode=JSON.parse(fs.readFileSync(p+"/authorization.json")).mode; if(!["origin","recovery"].includes(mode))throw Error("outstanding update requires resolution"); const name=mode==="origin"?"descriptor":"recovery"; const digest=crypto.createHash("sha256").update(fs.readFileSync(p+"/"+name+".json")).digest("hex"); fs.appendFileSync(process.env.GITHUB_OUTPUT,"mode="+mode+"\nsubject="+name+".json\ndigest=sha256:"+digest+"\n")'
      - id: attest
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ steps.authority.outputs.subject }}
          subject-digest: ${{ steps.authority.outputs.digest }}
          predicate-type: https://lisa.dev/attestations/npm-${{ steps.authority.outputs.mode == 'origin' && 'proposal' || 'recovery' }}/v1
          predicate-path: ${{ env.PHASE }}/${{ steps.authority.outputs.subject }}
          push-to-registry: false
          create-storage-record: false
      - name: Transport the actual distinct bundle and persist the checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          MODE: ${{ steps.authority.outputs.mode }}
        run: |
          case "$MODE" in origin) name=bundle.json ;; recovery) name=recovery-bundle.json ;; *) exit 1 ;; esac
          install -m 600 -- "$BUNDLE" "$PHASE/$name"
          node scripts/lisa-npm-updater.mjs checkpoint "$GITHUB_WORKSPACE" "$PHASE"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-authorized
          path: ${{ env.PHASE }}/*.json
          if-no-files-found: error
          retention-days: 1

  gate:
    needs: allocate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      issues: read
      attestations: read
    steps:
      - *phase-path
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - run: |
          case "$NPM_VERSION" in 10.9.9|11.21.0) ;; *) exit 1 ;; esac
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: npm-authorized
          path: ${{ env.PHASE }}
      - *pinned-gh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.8'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4.11'
          bundler: '2.4.10'
          bundler-cache: false
      - name: Install the original pinned history-scanner executable
        run: |
          file="$RUNNER_TEMP/lisa-gitleaks.tar.gz"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $file" | sha256sum --check --strict
          tar -xzOf "$file" gitleaks > "$RUNNER_TEMP/gitleaks"
          chmod 755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          rm -- "$file"
      - run: chmod 700 "$PHASE" && chmod 600 "$PHASE"/*.json
      - name: Run original ordinary hooks on the disposable credential-free gate runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lisa-npm-updater.mjs gate "$GITHUB_WORKSPACE" "$PHASE"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-gated
          path: ${{ env.PHASE }}/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      attestations: read
    steps:
      - *phase-path
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - run: |
          case "$NPM_VERSION" in 10.9.9|11.21.0) ;; *) exit 1 ;; esac
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: npm-gated
          path: ${{ env.PHASE }}
      - *pinned-gh
      - run: chmod 700 "$PHASE" && chmod 600 "$PHASE"/*.json
      - name: Publish the exact gated object and canonical PR declaration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lisa-npm-updater.mjs publish "$GITHUB_WORKSPACE" "$PHASE"
      - name: Record honest pending review
        run: echo 'Publication requires genuine current-head checks, human approval and runtime verification before closure.' >> "$GITHUB_STEP_SUMMARY"
