# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.
# -----------------------------------------------------------------------------
# Config-Driven Issue Creation Workflow
# -----------------------------------------------------------------------------
# ⚠️ WARNING: THIS FILE IS AUTO-GENERATED. DO NOT EDIT MANUALLY! ⚠️
# Any changes may be overwritten by the generation process.
#
# This is a dispatcher workflow that routes workflow failures to the issue
# tracker the project has *declared* in `.lisa.config.json` (`tracker`:
# jira | github | linear). Credentials are used to VALIDATE the declared
# destination, never to silently pick one:
#
# 1. `tracker: jira`   → requires JIRA_BASE_URL / JIRA_USER_EMAIL /
#    JIRA_PROJECT_KEY vars + JIRA_API_TOKEN secret.
# 2. `tracker: linear` → requires `linear.teamKey` in .lisa.config.json +
#    LINEAR_API_KEY secret.
# 3. `tracker: github` → always available.
# 4. No .lisa.config.json / no `tracker` key (pre-config repos) → legacy
#    credential cascade: Jira if fully configured, else GitHub Issues.
#
# If the declared tracker's credentials are NOT reachable from this workflow,
# the failure is NOT silently rerouted. Instead a single deduplicated GitHub
# issue labeled `lisa-misconfiguration` is filed naming exactly which
# variables/secrets are missing, with the original failure details attached.
# Note: a secret can be "missing" here either because it is unset on the
# repository or because a caller workflow did not pass it through its
# `secrets:` mapping — the two are indistinguishable from inside a
# reusable workflow.
#
# Sentry was removed from the dispatch cascade: CI failures are work items
# for the configured tracker, not runtime telemetry. See
# create-sentry-issue-on-failure.yml (deprecated) for the old leg.
#
# Example usage in another workflow:
# ```yaml
# create_issue_on_failure:
#   if: failure()
#   uses: ./.github/workflows/create-issue-on-failure.yml
#   with:
#     workflow_name: 'My Workflow'
#     failed_job: 'build_and_test'
#   secrets:
#     JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
#     LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
#     PAT: ${{ secrets.PAT }}
# ```

name: 📌 Create Issue on Failure (Auto-Dispatch)

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so create-issue-on-failure.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
      workflow_name:
        required: true
        type: string
        description: 'Name of the workflow that failed'
      failed_job:
        required: false
        type: string
        description: 'Name of the job that failed (optional)'
      issue_type:
        required: false
        type: string
        default: 'Bug'
        description: 'Type of issue to create (Bug, Task, etc.)'
      environment:
        required: false
        type: string
        default: 'production'
        description: 'Environment where the failure occurred'
      level:
        required: false
        type: string
        default: 'error'
        description: 'Severity level (debug, info, warning, error, fatal)'
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string
      working_directory:
        description: 'Directory to run commands in (if not root)'
        required: false
        default: ''
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
        description: 'Deprecated — Sentry is no longer a dispatch destination. Kept so legacy callers do not break.'
      JIRA_API_TOKEN:
        required: false
        description: 'Jira API token (if using Jira)'
      LINEAR_API_KEY:
        required: false
        description: 'Linear API key (if using Linear)'
      PAT:
        required: false
        description: 'Personal Access Token (if using GitHub Issues)'

# Concurrency is managed by the parent workflow that calls this one
# This avoids deadlocks between parent and child workflows

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: create-issue-on-failure.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  # Dispatch job reads the declared tracker from .lisa.config.json and
  # validates that the credentials for that tracker are reachable.
  dispatch:
    name: 🧭 Determine Issue Tracking System
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      use_jira: ${{ steps.check.outputs.jira }}
      use_github: ${{ steps.check.outputs.github }}
      use_linear: ${{ steps.check.outputs.linear }}
      mode: ${{ steps.check.outputs.mode }}
      tracker: ${{ steps.check.outputs.tracker }}
      linear_team_key: ${{ steps.check.outputs.linear_team_key }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🔍 Read declared tracker and validate credentials
        id: check
        env:
          HAS_JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL != '' }}
          HAS_JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL != '' }}
          HAS_JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY != '' }}
          HAS_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN != '' }}
          HAS_LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY != '' }}
        run: |
          # Intent comes from .lisa.config.json; credentials only validate it.
          TRACKER=""
          LINEAR_TEAM_KEY=""
          CONFIG_PARSE_ERROR=""
          if [ -f .lisa.config.json ]; then
            # A malformed config must route to misconfiguration reporting,
            # not kill this fail-fast step before outputs are written.
            if jq -e . .lisa.config.json > /dev/null 2>&1; then
              TRACKER=$(jq -r '.tracker // empty' .lisa.config.json)
              LINEAR_TEAM_KEY=$(jq -r '.linear.teamKey // empty' .lisa.config.json)
            else
              CONFIG_PARSE_ERROR=$(jq . .lisa.config.json 2>&1 >/dev/null | head -1)
            fi
          fi

          JIRA="false"
          GITHUB_ROUTE="false"
          LINEAR="false"
          MODE="failure"
          MISSING=""

          if [ -n "$CONFIG_PARSE_ERROR" ]; then
            MODE="misconfiguration"
            GITHUB_ROUTE="true"
            TRACKER="unparseable"
            MISSING=".lisa.config.json is not valid JSON and could not be read: ${CONFIG_PARSE_ERROR}"
            echo "✗ .lisa.config.json is not valid JSON"
            {
              echo "jira=$JIRA"
              echo "github=$GITHUB_ROUTE"
              echo "linear=$LINEAR"
              echo "mode=$MODE"
              echo "tracker=$TRACKER"
              echo "linear_team_key="
              echo "missing<<MISSING_EOF"
              echo "$MISSING"
              echo "MISSING_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jira_missing() {
            local out=""
            [ "$HAS_JIRA_BASE_URL" = "true" ] || out="${out}repository variable JIRA_BASE_URL\n"
            [ "$HAS_JIRA_USER_EMAIL" = "true" ] || out="${out}repository variable JIRA_USER_EMAIL\n"
            [ "$HAS_JIRA_PROJECT_KEY" = "true" ] || out="${out}repository variable JIRA_PROJECT_KEY\n"
            [ "$HAS_JIRA_API_TOKEN" = "true" ] || out="${out}secret JIRA_API_TOKEN (unset, or not passed through by the calling workflow's secrets mapping)\n"
            printf '%b' "$out"
          }

          linear_missing() {
            local out=""
            [ -n "$LINEAR_TEAM_KEY" ] || out="${out}'linear.teamKey' in .lisa.config.json\n"
            [ "$HAS_LINEAR_API_KEY" = "true" ] || out="${out}secret LINEAR_API_KEY (unset, or not passed through by the calling workflow's secrets mapping)\n"
            printf '%b' "$out"
          }

          case "$TRACKER" in
            jira)
              MISSING=$(jira_missing)
              if [ -z "$MISSING" ]; then
                JIRA="true"
                echo "✓ Tracker declared as Jira and credentials are reachable"
              else
                MODE="misconfiguration"
                GITHUB_ROUTE="true"
                echo "✗ Tracker declared as Jira but credentials are missing"
              fi
              ;;
            linear)
              MISSING=$(linear_missing)
              if [ -z "$MISSING" ]; then
                LINEAR="true"
                echo "✓ Tracker declared as Linear and credentials are reachable"
              else
                MODE="misconfiguration"
                GITHUB_ROUTE="true"
                echo "✗ Tracker declared as Linear but credentials are missing"
              fi
              ;;
            github)
              GITHUB_ROUTE="true"
              echo "✓ Tracker declared as GitHub Issues"
              ;;
            "")
              # Pre-config repo: legacy credential cascade (Jira, else GitHub).
              if [ -z "$(jira_missing)" ]; then
                JIRA="true"
                echo "✓ No tracker declared; Jira credentials found (legacy cascade)"
              else
                GITHUB_ROUTE="true"
                echo "✓ No tracker declared; using GitHub Issues (legacy cascade)"
              fi
              ;;
            *)
              MODE="misconfiguration"
              GITHUB_ROUTE="true"
              MISSING="'.tracker' in .lisa.config.json is \"${TRACKER}\", which is not a supported value (jira | github | linear)"
              echo "✗ Unknown tracker value: ${TRACKER}"
              ;;
          esac

          {
            echo "jira=$JIRA"
            echo "github=$GITHUB_ROUTE"
            echo "linear=$LINEAR"
            echo "mode=$MODE"
            echo "tracker=${TRACKER:-none}"
            echo "linear_team_key=$LINEAR_TEAM_KEY"
            echo "missing<<MISSING_EOF"
            echo "$MISSING"
            echo "MISSING_EOF"
          } >> "$GITHUB_OUTPUT"

  # Create Jira issue (declared tracker, credentials validated)
  create_jira_issue:
    name: 📌 Create Jira Issue
    needs: [dispatch]
    if: ${{ needs.dispatch.outputs.use_jira == 'true' }}
    uses: ./.github/workflows/create-jira-issue-on-failure.yml
    with:
      workflow_name: ${{ inputs.workflow_name }}
      failed_job: ${{ inputs.failed_job }}
      issue_type: ${{ inputs.issue_type }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      node_version: ${{ inputs.node_version }}
      package_manager: ${{ inputs.package_manager }}
      working_directory: ${{ inputs.working_directory }}
    secrets:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  # Create Linear issue (declared tracker, credentials validated)
  create_linear_issue:
    name: 📌 Create Linear Issue
    needs: [dispatch]
    if: ${{ needs.dispatch.outputs.use_linear == 'true' }}
    uses: ./.github/workflows/create-linear-issue-on-failure.yml
    with:
      workflow_name: ${{ inputs.workflow_name }}
      failed_job: ${{ inputs.failed_job }}
      team_key: ${{ needs.dispatch.outputs.linear_team_key }}
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

  # Create GitHub issue (declared tracker, legacy fallback, or loud
  # misconfiguration report when the declared tracker is unreachable)
  create_github_issue:
    name: 📌 Create GitHub Issue
    needs: [dispatch]
    if: ${{ needs.dispatch.outputs.use_github == 'true' }}
    uses: ./.github/workflows/create-github-issue-on-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow_name: ${{ inputs.workflow_name }}
      failed_job: ${{ inputs.failed_job }}
      mode: ${{ needs.dispatch.outputs.mode }}
      misconfig_tracker: ${{ needs.dispatch.outputs.tracker }}
      misconfig_missing: ${{ needs.dispatch.outputs.missing }}
      node_version: ${{ inputs.node_version }}
      package_manager: ${{ inputs.package_manager }}
      working_directory: ${{ inputs.working_directory }}
    secrets:
      PAT: ${{ secrets.PAT }}
