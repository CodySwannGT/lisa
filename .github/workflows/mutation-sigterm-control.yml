name: 🔬 Mutation SIGTERM control

# The faithful control for CodySwannGT/lisa#2991 — the SIGTERM that kills the
# mutation gate's weakened run on hosted CI, whose sender is still unidentified.
#
# ## Why this exists as a workflow and not as a local run
#
# Everything already measured on this failure was measured on macOS: the
# `maxBuffer` overflow reproduced there at the real scale, at the predicted
# moment, and returned ENOBUFS with `status: 1` — the wrong number. The failure
# was observed on `ubuntu-latest`. Whether Node's overflow kill lands before or
# after Stryker's own exit is a race, and it may draw differently there.
#
# So this is not a fifth guess. Four plausible stories have already been wrong
# or unproven on this failure, and a fifth is worth less than the measurement.
# `ubuntu-latest` is the only platform whose answer counts, which is why the
# control lives in a workflow.
#
# ## Read the artifact, not just the log
#
# `lisa-mutation.mjs` keeps only a 256 KiB tail of a Stryker transcript, which
# would discard an early resource warning — and an early resource warning is
# exactly what a runner-side reaper leaves behind. This uploads each arm's
# UNTRUNCATED capture, so the first lines survive.
#
# ## Dispatch only
#
# Five whole-list Stryker runs — three baseline draws at ~6.8 min each, plus two
# concurrency-pressure arms at 8 and 16 workers which are slower per mutant
# because the box is contended by design. No pull request should pay for them,
# and nothing here is a gate: the control asserts that the measurement is valid,
# never which draw came back.
#
# The pressure arms exist because five captures of Stryker's own log showed
# twelve expected lines and nothing else — and a process reaped by the kernel
# writes nothing to its own stdout. Reading the same log harder cannot settle
# it, so this job reads the KERNEL log and samples memory during the run.
#
# NOTE: repo-specific to the Lisa monorepo, NOT a Lisa template — do not move it
# under plugins/src or the create-only template sets.

on:
  workflow_dispatch:

concurrency:
  group: mutation-sigterm-control-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sigterm_control:
    name: 🔬 Weakened arm, five draws
    # Forks have neither the runner minutes nor the reason.
    if: github.repository == 'CodySwannGT/lisa'
    runs-on: ubuntu-latest
    # Every arm carries its own 20-minute child deadline, so the in-test bound
    # stays the binding constraint and an overrun is reported BY THE CASE —
    # naming the arm — rather than as an anonymous job cancellation. 90 clears
    # three of them with room for install and build; measured at 7.6 min each
    # on run 32724710956.
    timeout-minutes: 150
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '22.21.1'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # The suite runs against dist/, so a stale or absent build measures the
      # wrong tree.
      - name: 🏗️ Build
        run: bun run build

      # Recorded before the arms run, because a draw is a property of the
      # machine as much as of the code and this is a machine nobody here can
      # inspect afterwards.
      - name: 🧾 Record the runner
        run: |
          uname -a
          node -e 'console.log("node", process.version)'
          nproc
          free -m || true
          df -h /

      # Sampled DURING the run, not only before it. A pressure spike that
      # resolves before the job ends is invisible to a before/after reading, and
      # a spike is exactly what a reap would follow.
      - name: 📈 Sample memory in the background
        run: |
          ( while true; do
              printf '%s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/ {printf "used=%s free=%s avail=%s\n", $3, $4, $7}'
              sleep 5
            done ) > "${{ github.workspace }}/memory-samples.txt" 2>&1 &
          echo "$!" > /tmp/sampler.pid

      - name: 🔬 Run every arm
        env:
          LISA_MUTATION_SIGTERM_CONTROL: '1'
          LISA_MUTATION_SIGTERM_PRESSURE: '1'
          LISA_SIGTERM_CONTROL_OUT: ${{ github.workspace }}/sigterm-control
        run: bun run test tests/integration/mutation-sigterm-control.test.ts

      - name: 📈 Stop the sampler
        if: always()
        run: kill "$(cat /tmp/sampler.pid)" 2>/dev/null || true

      # The instrument that would actually name it. A process reaped by the
      # kernel writes NOTHING to its own stdout, which is why five captures of
      # Stryker's log could not settle this. The kernel says so instead.
      - name: 🔎 Sweep the kernel log for OOM kills
        if: always()
        run: |
          mkdir -p "${{ github.workspace }}/sigterm-control"
          out="${{ github.workspace }}/sigterm-control/kernel-oom.txt"
          {
            echo "=== dmesg, filtered ==="
            sudo dmesg -T 2>/dev/null |
              grep -iE "killed process|out of memory|oom-kill|oom_reaper|Memory cgroup" ||
              echo "(no OOM-killer entries in dmesg)"
            echo
            echo "=== /var/log/syslog, filtered ==="
            sudo grep -iE "killed process|out of memory|oom-kill|oom_reaper" \
              /var/log/syslog 2>/dev/null ||
              echo "(no OOM-killer entries in syslog, or syslog unreadable)"
            echo
            echo "=== memory low-water mark from the sampler ==="
            sort -t= -k3 -n "${{ github.workspace }}/memory-samples.txt" 2>/dev/null |
              head -5 ||
              echo "(no samples)"
            echo
            echo "=== final memory ==="
            free -m
          } | tee "$out"

      - name: 📈 Keep the memory samples
        if: always()
        run: cp "${{ github.workspace }}/memory-samples.txt" "${{ github.workspace }}/sigterm-control/" 2>/dev/null || true

      - name: 📤 Upload the untruncated captures
        # `always()`: a killed arm is the interesting outcome, and its capture
        # is the only place the kill leaves a trace.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-sigterm-control
          path: sigterm-control/
          if-no-files-found: warn
          retention-days: 30
