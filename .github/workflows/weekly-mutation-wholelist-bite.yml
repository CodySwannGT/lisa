name: 📅 Whole-list mutation bite

# Runs the whole-list arm of the mutation gate's bite test — the case that
# `tests/integration/mutation-gate-bite.test.ts` skips on the pull-request path.
#
# ## Why it is here and not on the PR path
#
# Measured on run 32632558547: that one case cost 2,531,359 ms of a 2,533,560 ms
# integration job — 99.9% of it — while all 68 other integration files together
# totalled roughly 2 seconds. At 42.6 min the integration job was the critical
# path of the whole pipeline; the next slowest job in it was 7.3 min.
#
# The gate that actually guards pull requests is diff-only and runs in 7.3 min,
# so the case cost ~6x the gate it proves. Its per-PR replacements are the
# single-guard block in the same file (23 s, and it uses the same committed
# configuration) and tests/integration/mutation-gate-diff-bite.test.ts (8 s).
#
# ## This workflow is the reason the deferral is a deferral
#
# A gate nothing runs is not deferred, it is deleted. If this file stops setting
# LISA_WHOLE_LIST_MUTATION_BITE, stops naming that test file, or disappears,
# tests/unit/config/wholelist-mutation-bite-scheduled.test.ts goes red.
#
# ## Temporary
#
# CodySwannGT/lisa#2966 defers the case; CodySwannGT/lisa#2944 owns the cause —
# this gate ran in 1m13s three days before the samples above. When #2944 lands
# the case belongs back on the PR path and this workflow should go with it.
#
# NOTE: repo-specific to the Lisa monorepo, NOT a Lisa template — do not move it
# under plugins/src or the create-only template sets. Deliberately separate from
# ci.yml/quality.yml, which are Lisa-managed generated files.

on:
  schedule:
    # WEEKLY, Sundays 08:10 UTC. Offset off the hour so it does not start
    # alongside the other scheduled jobs and contend for runners with them.
    #
    # Weekly rather than nightly by owner ruling. The quantity this case
    # uniquely measures is aggregate floor calibration — whether the committed
    # floor still sits where losing a major guard's suites crosses it — and that
    # drifts over WEEKS. The file's own history is the evidence: the margin was
    # eroded twice, both times by suites improving over a span of days. Asking
    # nightly polls seven times more often than the answer moves, for a job that
    # costs an hour of runner time each ask.
    - cron: '10 8 * * 0'
  # Deliberately NO `pull_request:` trigger, not even a path-filtered one on the
  # bite test and the config it reads. A path filter would put a ~50-minute job
  # back on exactly the pull requests that touch this machinery, which is the
  # cost this change exists to remove, and it would make the deferral
  # conditional in a way `LISA_WHOLE_LIST_MUTATION_BITE` is meant to make
  # legible. Dispatch it by hand on such a change; the per-PR conformance case
  # in the same file is what catches the stale-roster failure mode in the
  # meantime.
  workflow_dispatch:

# Never cancel a run in progress on the schedule; a superseded weekly run is a
# WEEK with no evidence, which is the whole point of not cancelling it.
concurrency:
  group: wholelist-mutation-bite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  whole_list_bite:
    name: 📅 Whole-list gate bite
    # Forks have neither the runner minutes nor the reason.
    if: github.repository == 'CodySwannGT/lisa'
    runs-on: ubuntu-latest
    # The case runs the full committed gate TWICE, now as two separately
    # budgeted cases. The in-test deadlines must stay the binding constraint, so
    # that an overrun is reported BY THE CASE — naming which pass — rather than
    # by an anonymous job cancellation. Those deadlines total 120 min
    # (INTACT_DEADLINE_MS 100 + WEAKENED_DEADLINE_MS 20), so this has to clear
    # that with room for setup and teardown.
    #
    # `timeout-minutes` is a resource limit, not a quality threshold: raising it
    # weakens no assertion. It is the in-test deadlines that decide, and they
    # are sized in tests/integration/mutation-gate-bite.test.ts against measured
    # samples.
    timeout-minutes: 180
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '22.21.1'

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # The suite runs against dist/, so a stale or absent build measures the
      # wrong tree. `pretest` covers this, but only when dist/configs is
      # missing — an explicit build is one line and removes the conditional.
      - name: 🏗️ Build
        run: bun run build

      - name: 🧬 Run the whole-list bite case
        env:
          LISA_WHOLE_LIST_MUTATION_BITE: '1'
        run: bun run test tests/integration/mutation-gate-bite.test.ts

  # A scheduled run nobody reads is the same as no scheduled run, and at weekly
  # cadence a missed one costs a week. A red run files an issue.
  create_issue_on_failure:
    if: ${{ failure() && github.repository == 'CodySwannGT/lisa' }}
    needs: whole_list_bite
    uses: ./.github/workflows/create-github-issue-on-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow_name: 'Whole-list mutation bite'
      failed_job: 'whole_list_bite'
      package_manager: 'bun'
