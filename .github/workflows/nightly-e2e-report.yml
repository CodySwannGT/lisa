# Nightly E2E Report — reusable workflow (the REPORTING half of the gate)
#
# ## Why this is a separate workflow from the gate
#
# `nightly-e2e-health.yml` is a REQUIRED status check. It runs on every pull
# request, it reads Actions run history, and it never writes anything — which is
# what makes it safe to require. This workflow is its opposite number: it runs on
# a schedule, it writes, and NOTHING it does can block a pull request.
#
# Keeping them apart is the whole design, not tidiness. Filing an issue is
# REPORTING, not verdict. If issue creation lived inside the gate, a GitHub
# Issues API that was down, throttled or newly forbidden would turn a perfectly
# green nightly into a red required check on every open pull request — an outage
# in a notification channel becoming an outage in the merge queue. The gate's
# reusable workflow does not even request `issues:` scope, so it could not file
# an issue if its code tried.
#
# ## What it maintains
#
# Exactly ONE open tracking issue per suite, refreshed on each red night and
# closed automatically when a full green run lands. Never one issue per red
# night: a reporter that files every morning produces a backlog nobody triages
# and makes the suite's real state illegible from the issue list. The issue is a
# STATE MIRROR of one suite.
#
# Closing is the dangerous direction, because it announces that a suite is
# healthy. It is gated on the run being COMPLETE — the same row-26 judgement the
# merge gate uses, asked again here rather than re-derived. A run that skipped an
# arm (a platform-filtered dispatch, an absent prerequisite) neither closes an
# issue nor files a false all-clear; the issue simply stays as it was. That is
# acmeorga's trap closed: *one spec reporting success would close the tracking
# issue while the failures that opened it went unrun.*
#
# ## Concurrency lives HERE, not in the caller
#
# The filing job runs in a non-cancelling, repository-wide concurrency group, so
# two overlapping nightly reports serialise instead of racing. Two reports racing
# would both read "no open issue for this suite" and both file one. It is
# declared in this reusable workflow rather than left to the caller template
# precisely so an adopter cannot forget it — a forgotten concurrency group
# produces duplicates, and duplicates are what "one issue per suite" exists to
# prevent. (The GATE caller uses a per-PR CANCELLING group, correctly: it is a
# stateless read with no shared state, so a superseded evaluation is pure waste.)
#
# Idempotence is the belt to that suspenders: filing looks the suite up by an
# identity marker in the issue body, so even a report that somehow ran twice
# refreshes the issue the first one filed.
#
# ## Exit code — publishing is best effort, and cannot redden this job
#
# The tracking issue is a CONVENIENCE; the verdict is the product. So the guard
# writes the verdict to `$GITHUB_STEP_SUMMARY` FIRST, then attempts to publish,
# then absorbs whatever publishing did into a `::warning::`. Three outcomes:
#
#   1. No verdict could be resolved at all (config, schema, unreadable history)
#      → the job FAILS. "We could not check" must never render as "it is fine".
#   2. Verdict resolved, publishing failed → `::warning::`, job SUCCEEDS. This is
#      the case that used to be red: a repository that switched GitHub Issues off
#      took HTTP 410 on `POST /repos/{o}/{r}/issues` after three attempts and the
#      whole nightly report died with it, reporting a dead publisher as a dead
#      reporter. A report channel must not die because its optional publishing
#      destination is unavailable.
#   3. The SUITE itself is red → the job FAILS, with one `::error::` per suite.
#
# Case 3 is what makes case 2 safe. Absorb publishing failures without it and
# this job has no failing path left, so its green would mean nothing — which is
# exactly why `continue-on-error:` on the calling job is the wrong fix and is
# documented as such in the caller template.
#
# NOTE the asymmetry with the GATE half: this job's result now tracks the suite,
# but it is still NOT a status check and must never be made one. Filing lives
# here so an Issues outage can never reach a required check; that guarantee is
# about which WORKFLOW writes, not about this job's exit code.

name: 🌙 Nightly E2E Report

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so nightly-e2e-report.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
      suites:
        description: >-
          REQUIRED. The same JSON array the gate reads, validated against the
          same schema. Keep it identical to the gate caller's, or the issues will
          describe a different set of suites than the one blocking merges.
        required: true
        type: string
      branch:
        description: >-
          REQUIRED. The branch whose nightly verdict is being reported — the same
          branch the gate is armed on.
        required: true
        type: string
      freshness_hours:
        description: 'Default freshness window, matching the gate.'
        required: false
        default: 36
        type: number
      issue_label:
        description: >-
          The label every tracking issue carries. It is also how this job FINDS
          the issue it already owns, so changing it orphans the open ones — file
          them under the new label and close the old by hand, once.
        required: false
        default: 'nightly-e2e'
        type: string
      gate_context:
        description: >-
          The status-check context the GATE publishes, used to measure whether
          it is actually a required check on `branch`. GitHub composes a
          reusable workflow's check as `<caller job name> / <called job name>`,
          and the default is what Lisa's shipped `nightly-e2e-health.yml`
          template produces. Change it only if you renamed either half, or if
          you are still running a local reimplementation that publishes a
          different string. A context that is the configured one plus (or minus)
          a ` / `-separated job suffix also counts as this gate.
        required: false
        default: '🌙 Nightly E2E Health / 🌙 Gate'
        type: string
      bypass_label:
        description: >-
          The audited-bypass label, quoted in the issue body's waiver
          instructions. KEEP IT IDENTICAL to the gate caller's `bypass_label`,
          or the issue will tell people to apply a label the gate does not read.
          Only ever rendered when the gate is actually required — a waiver
          recipe printed for a check nothing depends on is how an audited
          escape hatch gets spent on a merge that was never blocked. Since guard
          contract 1.7.0 its EXISTENCE is measured too (§10.9): where the gate is
          required and this label is not in the repository, the report names it
          as a defect in the job summary, in a run annotation and at the top of
          every tracking issue — because a documented escape hatch that is not
          there routes people onto the unaudited admin merge. Nothing creates the
          label; the report says which one command does.
        required: false
        default: 'nightly-e2e-bypass'
        type: string
      pin_issues:
        description: >-
          OPT-IN. Pin each tracking issue while its suite is red and unpin it on
          green. Off by default because pinning writes to a repository-wide
          surface with only THREE slots that this workflow does not otherwise
          touch — an adopter should choose to spend one. Past the limit the pin
          is reported as a warning and the tracking issue is still filed and
          refreshed correctly; a full pin board never fails this job.
        required: false
        default: false
        type: boolean
      guard_script:
        description: >-
          Path to the Lisa-shipped guard inside the CALLER repository. Ships via
          copy-overwrite; run `lisa apply` if it is missing.
        required: false
        default: 'scripts/check-nightly-e2e-health.mjs'
        type: string
      expected_contract_major:
        description: >-
          Major version of the guard contract this workflow revision speaks. A
          mismatch fails closed rather than reporting under a contract neither
          half agrees on.
        required: false
        default: 1
        type: number
      node_version:
        description: 'Node.js version used to run the guard.'
        required: false
        default: '22.21.1'
        type: string
      api_max_attempts:
        description: 'Bounded retries for a throttled or unreachable API.'
        required: false
        default: 3
        type: number
      api_max_pages:
        description: "Page cap when listing a run's jobs, and when listing open tracking issues."
        required: false
        default: 5
        type: number
      api_retry_max_seconds:
        description: 'Ceiling on any single rate-limit backoff wait.'
        required: false
        default: 60
        type: number
      timeout_minutes:
        description: 'Ceiling for the reporting job.'
        required: false
        default: 10
        type: number

# A called workflow's `permissions:` is a CEILING, not a request. `issues: write`
# is the one scope this half has that the gate half deliberately does not — and
# it is why they are two files. Nothing here needs `contents: write`.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: nightly-e2e-report.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  report:
    name: 🌙 Report
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # NON-CANCELLING, and repository-wide rather than per-ref. Two reports
    # racing would both read "no open issue for this suite" and both file one;
    # `cancel-in-progress: true` would instead kill a report half way through
    # updating an issue set. Neither is acceptable for a job that writes, so the
    # second run WAITS. Not keyed on `github.ref` on purpose: two runs on
    # different refs still write to the same issues.
    concurrency:
      group: lisa-nightly-e2e-report-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔒 Assert the guard is present and contract-compatible
        env:
          GUARD: ${{ inputs.guard_script }}
          EXPECTED_MAJOR: ${{ inputs.expected_contract_major }}
        run: |
          set -euo pipefail
          if [[ ! -f "$GUARD" ]]; then
            echo "::error title=Nightly E2E reporter is not installed::'$GUARD' does not exist in this repository. It ships from Lisa via copy-overwrite — run \`lisa apply\` (or set the guard_script input)."
            exit 1
          fi
          version="$(node "$GUARD" --contract-version)"
          major="${version%%.*}"
          echo "guard contract version: $version (expected major $EXPECTED_MAJOR)"
          if [[ "$major" != "$EXPECTED_MAJOR" ]]; then
            echo "::error title=Nightly E2E contract mismatch::The reusable workflow speaks contract major $EXPECTED_MAJOR but '$GUARD' is $version. Re-pin the caller to a matching Lisa tag, or run \`lisa apply\` at that tag."
            exit 1
          fi

      - name: 🌙 File, refresh and close the tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NIGHTLY_SUITES: ${{ inputs.suites }}
          NIGHTLY_BRANCH: ${{ inputs.branch }}
          NIGHTLY_FRESHNESS_HOURS: ${{ inputs.freshness_hours }}
          NIGHTLY_ISSUE_LABEL: ${{ inputs.issue_label }}
          NIGHTLY_GATE_CONTEXT: ${{ inputs.gate_context }}
          NIGHTLY_BYPASS_LABEL: ${{ inputs.bypass_label }}
          NIGHTLY_PIN_ISSUES: ${{ inputs.pin_issues }}
          NIGHTLY_API_MAX_ATTEMPTS: ${{ inputs.api_max_attempts }}
          NIGHTLY_API_MAX_PAGES: ${{ inputs.api_max_pages }}
          NIGHTLY_API_RETRY_MAX_SECONDS: ${{ inputs.api_retry_max_seconds }}
        run: node "${{ inputs.guard_script }}" --report-issues
