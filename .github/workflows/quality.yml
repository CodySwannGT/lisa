              exit 1
              ;;
            *)
              echo "::error title=gates.unproven is invalid::gates.unproven is \"$RESPONSE\", which is not one of warn, fail. An unrecognised response is refused rather than read as permission to report success."
              exit 1
              ;;
          esac
        working-directory: ${{ inputs.working_directory || '.' }}

  state_classification:
    permissions:
      contents: read
    name: 🧬 State Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Anti-drift gate for the reset/seed contract (reset-seed-coverage rule):
    # compares the runtime inventory of persistent state against the project's
    # state contract and FAILS CLOSED on any entity nobody classified, and on
    # any fixture-owned entity nothing sweeps. That second case is the failure
    # this exists for — a flow that creates uniquely-marked records and deletes
    # them only on its happy path leaks on every failure in between, silently,
    # until a count or uniqueness assertion breaks months later.
    #
    # Deliberately NOT "new entities are cleared by default": that erases
    # unrelated non-production data the first time a change adds an entity, and
    # a migrations diff cannot model renames, multiple schemas, generated
    # entities, views, partitions, row-level ownership, or any state that is not
    # a row. Subtraction runs here only as a staleness detector.
    #
    # Auto-enabled by the presence of the Lisa-managed script; a repo with no
    # state contract reports `not-adopted` rather than silently passing a gate
    # it never wired. The script is dependency-free, so no install step.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',state_classification,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"state_classification":"skip"')) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above. Resolved before the script probe and unconditionally,
      # for the reason given on 🧭 E2E Route Coverage.
      - name: 🎛️ Resolve the state-classification gate
        id: gate
        env:
          GATE_ID: state-classification
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for state classification script
        id: check_script
        run: |
          if [ -f "scripts/check-state-classification.mjs" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Only on the declared path. Lisa's own prover is dependency-free, which
      # is why this job never installed anything; a task the project named may
      # not be, and running it against a tree with no node_modules fails for a
      # reason that has nothing to do with the property.
      - name: 🍞 Setup Bun
        if: steps.gate.outputs.configured == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.configured == 'true'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧬 Run the state-classification gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
          STATE_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧬 Require every persistent entity to carry a reset policy
        # FALLBACK — unchanged behaviour for a project with no `gates` block,
        # and for one whose block does not name this gate.
        if: steps.check_script.outputs.exists == 'true' && steps.gate.outputs.configured == 'false'
        env:
          STATE_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/check-state-classification.mjs
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate-aware since `state-classification` gave the property a name: the
      # declaration is consulted BEFORE the job concludes it has nothing to do.
      - name: ⏭️ Skip state classification (no check-state-classification.mjs script)
        if: steps.check_script.outputs.exists == 'false' && steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          JOB_CONTEXT: 🧬 State Classification
          EXECUTOR: scripts/check-state-classification.mjs
        run: |
          # THE FAMILY'S ONE CONTROL. This body is byte-identical in all six
          # presence-gated jobs and carries no per-job adoption input: what
          # varies is the two env values above, and what DECIDES is the single
          # `gates.unproven` key read below. `bdd_coverage` hand-rolled its own
          # three-state input for the same decision; six more of those is six
          # more adoption operations, so this family reads one setting.
          #
          # Read inline rather than through the installed resolver on purpose.
          # This workflow is referenced @main while the resolver comes from
          # whatever @codyswann/lisa version the project installed, so calling a
          # new subcommand would exit non-zero on every consumer that has not
          # bumped — reddening a fleet over a verb, which is the exact failure
          # mode the default below exists to prevent.
          #
          # ABSENT means `warn`, so a project that declares nothing keeps
          # today's behaviour and no version bump can turn it red. An
          # UNRECOGNISED value is refused, not defaulted: a denylist fails open
          # on exactly the value nobody anticipated.
          set -euo pipefail
          RESPONSE=warn
          if [ -f .lisa.config.json ]; then
            RESPONSE=$(node -e 'let v;try{v=(JSON.parse(require("node:fs").readFileSync(".lisa.config.json","utf8")).gates||{}).unproven}catch(e){v=undefined};process.stdout.write(v===undefined?"warn":String(v))')
          fi
          MESSAGE="$GATE_ID is UNPROVEN at $GATE_MOMENT: $JOB_CONTEXT found no $EXECUTOR and no gates.$GATE_ID declaration, so it proved nothing. This job's name is a branch-protection context on some rulesets, and a required context that passes because it found nothing is worse than no gate. Two remedies: declare gates.$GATE_ID at $GATE_MOMENT in .lisa.config.json - including \"off\", which makes the absence a decision rather than an inference - or run 'lisa apply' to install the shipped $EXECUTOR."
          case "$RESPONSE" in
            warn)
              echo "::warning title=$GATE_ID unproven::$MESSAGE"
              ;;
            fail)
              echo "::error title=$GATE_ID unproven::$MESSAGE"
              exit 1
              ;;
            *)
              echo "::error title=gates.unproven is invalid::gates.unproven is \"$RESPONSE\", which is not one of warn, fail. An unrecognised response is refused rather than read as permission to report success."
              exit 1
              ;;
          esac
        working-directory: ${{ inputs.working_directory || '.' }}

  bdd_coverage:
    permissions:
      contents: read
    name: 🧾 BDD Behavior Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ONE ADOPTION CONTROL: the `behavior-contract` gate declaration, at
    # `required`, `optional`, or `off`.
    #
    # This job used to answer to `bdd_mode`, a private three-state input carried
    # in the caller's ci.yml, running alongside the registry every other quality
    # job answers to. Two controls for one question, and the losing one lost in
    # silence. Its middle state, `bootstrap`, was a time-boxed grace period with
    # a named owner and a hard expiry — which is `optional` plus paperwork, and
    # it hid red rather than showing it. The owner retired the state and the
    # axis with it; the input is refused below rather than read.
    #
    #   required -> runs, and the context is a merge condition.
    #   optional -> runs, and a red here is visible without blocking. This is
    #               what a project adopting the contract declares while the
    #               contract is not clean yet: the same visibility `bootstrap`
    #               offered, with no expiry to forget and no grading that turns
    #               a defect amber.
    #   off      -> stands down, and says so in the settings file, which is a
    #               decision someone can read.
    #
    # UNDECLARED IS NOT `off`, and it is not `optional` either — it stands the
    # job down with a warning. This job deliberately does NOT copy the
    # presence-gated fallback the e2e_coverage and state_classification jobs
    # use, where an undeclared gate falls back to running the shipped script.
    # The prover here ships to every project on the stack, so falling back would
    # enforce a behavior contract on every consumer that never adopted one. The
    # gate is governed when it is declared, and not before.
    #
    # A required context is never auto-skipped: GitHub counts a skipped required
    # check as passing, so the job always runs and stands down INSIDE itself.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',bdd_coverage,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"bdd_coverage":"skip"')) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the non-regression checks read the base revision of
          # bdd/ to prove that coverage the repo already accepted is still
          # there and that new behavior arrived mapped or waived.
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      # Refused, not ignored. A caller still passing `bdd_mode` believes it is
      # configuring something; leaving the value to decide nothing would make
      # the settings it lives in a lie, which is the failure the collapse was
      # done to remove. Failing this job — rather than rejecting the input at
      # the workflow boundary — keeps the caller's workflow file valid and puts
      # the red exactly where the remedy is.
      - name: 🛑 Refuse the retired bdd_mode input
        if: inputs.bdd_mode != ''
        env:
          BDD_MODE: ${{ inputs.bdd_mode }}
        run: |
          set -euo pipefail
          echo "::error title=bdd_mode is retired::The '$BDD_MODE' adoption state no longer exists. 'bootstrap' in particular was a time-boxed grace period that hid red; it is 'optional' plus paperwork. Delete 'bdd_mode' from this caller's ci.yml and declare gates.behavior-contract in .lisa.config.json at 'required', 'optional', or 'off' — that declaration is now the only control over whether this property is governed."
          exit 1

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the behavior-contract gate
        id: gate
        env:
          GATE_ID: behavior-contract
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — byte-identical to the same step on every other façade
        # job, and it never fails the job. See the 🧹 Lint job for the full
        # rationale; the two env values below come from the resolve step's
        # outputs, so this block cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🍞 Setup Bun
        if: steps.gate.outputs.configured == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.configured == 'true'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # The non-regression checks are the whole of what protects coverage the
      # repo already accepted, and every one of them needs a base revision. A
      # run without one used to skip them in silence — a gate reporting a
      # property it never evaluated — so the prover now FAILS without a base.
      # That makes resolving one non-optional rather than best-effort: the PR
      # base when there is a pull request, otherwise the fork point from the
      # default branch. A dispatch on the default branch itself resolves to
      # HEAD, which compares a tree against itself and honestly finds no
      # regression, rather than skipping the question.
      - name: 🧭 Resolve the base revision
        id: bdd_base
        if: steps.gate.outputs.configured == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ] && [ -n "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::warning title=BDD base revision::No base revision could be resolved. The gate fails rather than claiming nothing regressed."
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: 🧾 Run the behavior-contract gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
          # Base revision for the non-regression + deletion checks.
          BDD_BASE_SHA: ${{ steps.bdd_base.outputs.sha }}
          # Joins the standard command envelope to this run's CI log.
          BDD_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BDD_ENVIRONMENT: ${{ github.repository }}@${{ github.ref_name }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      # Two steps, not one branching step, because they are two different
      # facts. `off` is a decision someone recorded; undeclared is an absence
      # nobody decided, and an operator scanning the log has to be able to tell
      # them apart without reading a shell conditional.
      - name: ⏭️ Stand down (behavior-contract is not declared)
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=behavior-contract is undeclared::$GATE_ID is UNDECLARED at $GATE_MOMENT, so this job proved nothing. This job's name is a branch-protection context on some rulesets, and a required context that passes because it found nothing is worse than no gate. Declare gates.$GATE_ID at $GATE_MOMENT in .lisa.config.json - including \"off\", which makes the absence a decision rather than an inference."

      - name: ⏭️ Stand down (behavior-contract is off)
        if: steps.gate.outputs.configured == 'off'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::notice title=behavior-contract is off::$GATE_ID is declared off at $GATE_MOMENT. Nothing was proved, and that is a decision recorded in .lisa.config.json."

      - name: 📋 Report the declaration
        # THE LEVEL, not `configured`. This step used to be handed
        # `steps.gate.outputs.configured` under the name `GATE_LEVEL` — a
        # boolean where a level was expected, so `GATE_LEVEL: true` is what a
        # live run printed and the `required`/`optional` arms below were
        # unreachable text describing a distinction the workflow did not make.
        # The resolve step now emits the declared level, which is what makes
        # them arms rather than documentation.
        #
        # BOTH outputs, joined, because the level alone does not say whether
        # this job is what proves the gate. A declaration that hands the
        # property to something else — an `await:` on an external signal —
        # carries a level and still leaves `configured` false here, and an arm
        # keyed on the level alone would announce a gate this job stood down
        # from as enforcing. The joined value keeps the two questions separate:
        # the level says how strong the declaration is, `configured` says
        # whether this job answered it.
        if: always()
        env:
          GATE_LEVEL: ${{ steps.gate.outputs.level }}
          GATE_CONFIGURED: ${{ steps.gate.outputs.configured }}
