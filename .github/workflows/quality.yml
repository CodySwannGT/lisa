          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for test:unit script
        id: check_script
        run: |
          if [ -f "package.json" ]; then
            if grep -q '"test:unit"' package.json; then
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Service containers and coverage env are ENVIRONMENT, not tooling, and
      # a project that named its own `test-correctness` task still needs its
      # database up. They stay keyed off the `test:unit` script rather than the
      # gate because Lisa force-ships that script into every host package.json,
      # so a configured project has it too — and because the exact condition
      # string is asserted in tests/integration/quality-workflow.test.ts. The
      # residual gap (a configured project that deleted `test:unit` gets no
      # service containers) needs that assertion relaxed in the same change.
      - name: 🧰 Start coverage service containers
        if: steps.check_script.outputs.exists == 'true' && inputs.coverage_services != ''
        env:
          COVERAGE_SERVICES: ${{ inputs.coverage_services }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const spec = JSON.parse(process.env.COVERAGE_SERVICES || "[]");
          const services = Array.isArray(spec)
            ? spec
            : Object.entries(spec).map(([name, value]) => ({ name, ...value }));
          const quote = value => `'${String(value).replace(/'/g, `'\\''`)}'`;
          const lines = ["set -euo pipefail"];
          const validateName = name => {
            if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$/.test(name)) {
              throw new Error(`Invalid coverage service name: ${name}`);
            }
          };
          for (const [index, service] of services.entries()) {
            if (!service || typeof service !== "object") {
              throw new Error(`coverage_services[${index}] must be an object`);
            }
            if (!service.image || typeof service.image !== "string") {
              throw new Error(`coverage_services[${index}].image is required`);
            }
            const name = service.name || `lisa-coverage-service-${index + 1}`;
            validateName(name);
            lines.push(`docker rm -f ${quote(name)} >/dev/null 2>&1 || true`);
            const args = ["run", "--detach", "--name", name];
            for (const [key, value] of Object.entries(service.env || {})) {
              args.push("--env", `${key}=${value}`);
            }
            for (const port of service.ports || []) {
              args.push("--publish", port);
            }
            if (service.options !== undefined && !Array.isArray(service.options)) {
              throw new Error(`coverage_services[${index}].options must be an array of docker flags`);
            }
            if (Array.isArray(service.options)) {
              args.push(...service.options);
            }
            lines.push(
              `docker ${args.map(quote).join(" ")} ${quote(service.image)}`
            );
            const timeout = Math.trunc(Number(service.healthTimeoutSeconds ?? 60));
            lines.push(`if docker inspect --format='{{if .Config.Healthcheck}}yes{{end}}' ${quote(name)} | grep -q yes; then`);
            lines.push(`  deadline=$((SECONDS + ${Number.isFinite(timeout) ? Math.max(1, timeout) : 60}))`);
            lines.push("  until [ \"$(docker inspect --format='{{.State.Health.Status}}' " + quote(name) + ")\" = healthy ]; do");
            lines.push("    if [ \"$SECONDS\" -ge \"$deadline\" ]; then docker logs " + quote(name) + "; exit 1; fi");
            lines.push("    sleep 2");
            lines.push("  done");
            lines.push("fi");
          }
          fs.writeFileSync("/tmp/lisa-start-coverage-services.sh", `${lines.join("\n")}\n`);
          NODE
          bash /tmp/lisa-start-coverage-services.sh

      - name: 🧪 Apply coverage environment
        if: steps.check_script.outputs.exists == 'true' && inputs.coverage_env != ''
        env:
          COVERAGE_ENV: ${{ inputs.coverage_env }}
        run: |
          node <<'NODE'
          const { randomUUID } = require("node:crypto");
          const fs = require("node:fs");
          const env = JSON.parse(process.env.COVERAGE_ENV || "{}");
          if (!env || Array.isArray(env) || typeof env !== "object") {
            throw new Error("coverage_env must be a JSON object");
          }
          const lines = [];
          for (const [key, value] of Object.entries(env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {
              throw new Error(`Invalid coverage_env key: ${key}`);
            }
            const delimiter = `LISA_COVERAGE_ENV_${randomUUID().replace(/-/g, "")}`;
            lines.push(`${key}<<${delimiter}`);
            lines.push(typeof value === "object" && value !== null ? JSON.stringify(value) : String(value));
            lines.push(delimiter);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: 🧪 Run the test-correctness gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Run unit tests with coverage
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.check_script.outputs.exists == 'true' && steps.gate.outputs.configured == 'false'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm run test:cov
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn test:cov
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun run test:cov
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip unit tests (no test:unit script)
        if: steps.check_script.outputs.exists == 'false' && steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          JOB_CONTEXT: 🧪 Run Unit Tests
          EXECUTOR: test:unit script
        run: |
          # THE FAMILY'S ONE CONTROL. This body is byte-identical in all six
          # presence-gated jobs and carries no per-job adoption input: what
          # varies is the two env values above, and what DECIDES is the single
          # `gates.unproven` key read below. `bdd_coverage` hand-rolled its own
          # three-state input for the same decision; six more of those is six
          # more adoption operations, so this family reads one setting.
          #
          # Read inline rather than through the installed resolver on purpose.
          # This workflow is referenced @main while the resolver comes from
          # whatever @codyswann/lisa version the project installed, so calling a
          # new subcommand would exit non-zero on every consumer that has not
          # bumped — reddening a fleet over a verb, which is the exact failure
          # mode the default below exists to prevent.
          #
          # ABSENT means `warn`, so a project that declares nothing keeps
          # today's behaviour and no version bump can turn it red. An
          # UNRECOGNISED value is refused, not defaulted: a denylist fails open
          # on exactly the value nobody anticipated.
          set -euo pipefail
          RESPONSE=warn
          if [ -f .lisa.config.json ]; then
            RESPONSE=$(node -e 'let v;try{v=(JSON.parse(require("node:fs").readFileSync(".lisa.config.json","utf8")).gates||{}).unproven}catch(e){v=undefined};process.stdout.write(v===undefined?"warn":String(v))')
          fi
          MESSAGE="$GATE_ID is UNPROVEN at $GATE_MOMENT: $JOB_CONTEXT found no $EXECUTOR and no gates.$GATE_ID declaration, so it proved nothing. This job's name is a branch-protection context on some rulesets, and a required context that passes because it found nothing is worse than no gate. Two remedies: declare gates.$GATE_ID at $GATE_MOMENT in .lisa.config.json - including \"off\", which makes the absence a decision rather than an inference - or run 'lisa apply' to install the shipped $EXECUTOR."
          case "$RESPONSE" in
            warn)
              echo "::warning title=$GATE_ID unproven::$MESSAGE"
              ;;
            fail)
              echo "::error title=$GATE_ID unproven::$MESSAGE"
              exit 1
              ;;
            *)
              echo "::error title=gates.unproven is invalid::gates.unproven is \"$RESPONSE\", which is not one of warn, fail. An unrecognised response is refused rather than read as permission to report success."
              exit 1
              ;;
          esac
        working-directory: ${{ inputs.working_directory || '.' }}

  test_mutation:
    permissions:
      contents: read
    name: 🧬 Mutation Testing Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',test:mutation,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"test_mutation":"skip"')) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history so the gate can diff changed files against the PR base.
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 🔍 Check for test:mutation script
        id: check_script
        run: |
          if [ -f "package.json" ] && grep -q '"test:mutation"' package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # UNCONDITIONAL, and that is the whole point of this ordering. It used to
      # carry `if: steps.check_script.outputs.exists == 'true'`, which made the
      # declaration unreadable in exactly the case it exists for. With no
      # `test:mutation` script the resolve step never ran, so `configured` was
      # the EMPTY STRING — not `'false'` — and `'' == 'false'` is false, so the
      # fallback did not run either. Both proving steps sat out and the ⏭️
      # notice below reported the job green. A project declaring
      # `test-meaningfulness` as `required` with its own runner got a green
      # required-shaped context that never read the declaration naming it.
      #
      # The install ordering that comment defended is preserved by moving the
      # install BELOW instead: a project with neither the script nor a declared
      # task still never installs. And the premise that resolving first "cannot
      # work" was wrong — the resolver is looked up along three paths, two of
      # which (`scripts/lisa-gates.mjs`, `all/copy-overwrite/scripts/lisa-gates.mjs`)
      # are tracked files present before any install, and the block emits
      # `configured=false` and exits 0 when none of the three is found.
      - name: 🎛️ Resolve the test-meaningfulness gate
        id: gate
        env:
          GATE_ID: test-meaningfulness
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
