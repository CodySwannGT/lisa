    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',test:e2e,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for test:e2e script
        id: check_script
        run: |
          if [ -f "package.json" ]; then
            if grep -q '"test:e2e"' package.json; then
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for Playwright config
        id: check_playwright
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # A `test:e2e` script that drives Playwright needs the browser binaries.
      # Without this the run dies with "Looks like Playwright was just installed
      # … run npx playwright install". Gated on a Playwright config so non-
      # Playwright e2e suites (Cypress, etc.) don't pay for an unused install.
      - name: 🎭 Install Playwright browsers
        if: steps.check_script.outputs.exists == 'true' && steps.check_playwright.outputs.has_config == 'true'
        run: npx playwright install --with-deps
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧪 Run E2E tests
        if: steps.check_script.outputs.exists == 'true'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm run test:e2e
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn test:e2e
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun run test:e2e
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip E2E tests (no test:e2e script)
        if: steps.check_script.outputs.exists == 'false'
        run: echo "Skipping E2E tests - test:e2e script not found in package.json"

  maestro_e2e:
    permissions:
      contents: read
    name: 📱 Maestro Cloud E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',maestro_e2e,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔍 Check for Maestro API key
        id: check_maestro
        run: |
          if [[ -z "${MAESTRO_API_KEY// }" ]]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ MAESTRO_API_KEY is not configured"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ MAESTRO_API_KEY is available"
          fi
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}

      - name: 🔍 Check for project ID
        id: check_project_id
        if: steps.check_maestro.outputs.has_token == 'true'
        run: |
          PROJECT_ID="${{ inputs.maestro_project_id }}"
          if [[ -z "$PROJECT_ID" ]]; then
            echo "has_project_id=false" >> $GITHUB_OUTPUT
            echo "⚠️ maestro_project_id input not provided"
          else
            echo "has_project_id=true" >> $GITHUB_OUTPUT
            echo "✅ Project ID configured"
          fi

      - name: 🔍 Check for app file
        id: check_app_file
        if: steps.check_maestro.outputs.has_token == 'true' && steps.check_project_id.outputs.has_project_id == 'true'
        run: |
          APP_FILE="${{ inputs.maestro_app_file }}"
          if [[ -z "$APP_FILE" ]]; then
            echo "has_app_file=false" >> $GITHUB_OUTPUT
            echo "⚠️ maestro_app_file input not provided"
          elif [[ -f "$APP_FILE" ]]; then
            echo "has_app_file=true" >> $GITHUB_OUTPUT
            echo "✅ App file found: $APP_FILE"
          else
            echo "has_app_file=false" >> $GITHUB_OUTPUT
            echo "⚠️ App file not found at: $APP_FILE"
          fi

      - name: 📱 Run Maestro Cloud tests
        if: steps.check_maestro.outputs.has_token == 'true' && steps.check_project_id.outputs.has_project_id == 'true' && steps.check_app_file.outputs.has_app_file == 'true'
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ inputs.maestro_project_id }}
          app-file: ${{ inputs.maestro_app_file }}
          workspace: ${{ inputs.maestro_workspace }}
          include-tags: ${{ inputs.maestro_include_tags }}

      - name: 📱 Maestro Tests Skipped (no API key)
        if: steps.check_maestro.outputs.has_token != 'true'
        run: |
          echo "::warning::Maestro Cloud E2E tests skipped - MAESTRO_API_KEY not configured"
          echo "To enable Maestro Cloud testing, add MAESTRO_API_KEY to your repository secrets"

      - name: 📱 Maestro Tests Skipped (no project ID)
        if: steps.check_maestro.outputs.has_token == 'true' && steps.check_project_id.outputs.has_project_id != 'true'
        run: |
          echo "::warning::Maestro Cloud E2E tests skipped - maestro_project_id not provided"
          echo "To run Maestro tests, provide the maestro_project_id input with your Maestro Cloud project ID"

      - name: 📱 Maestro Tests Skipped (no app file)
        if: steps.check_maestro.outputs.has_token == 'true' && steps.check_project_id.outputs.has_project_id == 'true' && steps.check_app_file.outputs.has_app_file != 'true'
        run: |
          echo "::warning::Maestro Cloud E2E tests skipped - no app file provided"
          echo "To run Maestro tests, provide the maestro_app_file input with the path to your app binary"

  # Emits a JSON array consumed by playwright_e2e's matrix strategy.
  # When playwright_shards <= 1 the array is [1] (explicit single-runner mode).
  # When playwright_shards >= 2 the array is [1,2,...,N] and the test command
  # passes --shard=i/N so tests split across N parallel runners.
  playwright_e2e_setup:
    name: 🎭 Playwright Shard Setup
    runs-on: ubuntu-latest
    # Pure shell arithmetic — no checkout, no API. Needs no token at all.
    permissions: {}
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',playwright_e2e,') }}
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - name: 🧮 Compute shard matrix
        id: matrix
        run: |
          TOTAL="${{ inputs.playwright_shards }}"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -le 1 ]; then
            echo 'shards=[1]' >> "$GITHUB_OUTPUT"
            echo "Playwright sharding disabled (single runner)"
          else
            SHARDS=$(seq 1 "$TOTAL" | jq -Rn '[inputs | tonumber]' | tr -d '\n ')
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
            echo "Playwright sharding enabled across $TOTAL runners: $SHARDS"
          fi

  playwright_e2e:
    permissions:
      contents: read
    name: 🎭 Playwright E2E Tests
    needs: playwright_e2e_setup
    runs-on: ubuntu-latest
    # 30 min was tight for downstream projects whose backend cold-start
    # tail latency drives shard runtime above ~25 min under workers=4
    # parallel-shard load. 60 min gives headroom for transient
    # backend-side latency spikes without masking genuine test hangs
    # (Playwright's per-test timeout still bounds those at 90s × 3
    # retries). Raise back down once downstream projects address their
    # backend-side root causes.
    timeout-minutes: 60
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',playwright_e2e,') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.playwright_e2e_setup.outputs.shards) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for Playwright config
        id: check_playwright
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✅ Playwright config found"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Playwright config found"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔧 Playwright setup
        if: steps.check_playwright.outputs.has_config == 'true' && inputs.playwright_setup_command != ''
        run: ${{ inputs.playwright_setup_command }}
        working-directory: ${{ inputs.working_directory || '.' }}

      # The web-export build below assumes an Expo project (`expo export`).
      # Non-Expo web projects (e.g. Vite/Phaser) build + serve themselves via
      # the Playwright config's `webServer`, so `expo export` is both wrong
      # (no Metro/Expo config → "No platforms are configured to use the Metro
      # bundler") and unnecessary. Detect Expo and gate the export/cache steps
      # on it; non-Expo projects skip straight to the browser install + test run.
      - name: 🔍 Detect Expo project
        id: check_expo
        run: |
          if [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ] \
            || { [ -f "package.json" ] && grep -q '"expo"[[:space:]]*:' package.json; }; then
            echo "is_expo=true" >> $GITHUB_OUTPUT
            echo "✅ Expo project detected — will run \`expo export\`"
          else
            echo "is_expo=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Non-Expo project — skipping \`expo export\` (Playwright webServer self-builds)"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Fingerprint of the inputs the build below depends on. Deliberately
      # ungated: the cache steps interpolate this output, and a skipped step
      # yields an empty string, which would silently collapse the cache key to
      # a constant rather than fail. It costs ~10ms, so it always runs.
      #
      # This replaces `hashFiles('**/src/**', '**/app/**', ...)`. Those patterns
      # are unanchored, so they also matched `node_modules/**/src/**`: measured
      # on AcmeOrgA/frontend, the glob enumerated 116,353 paths and hashed
      # 26,955 files out of node_modules against 1,305 real source files. The
      # runner caps one hashFiles call at 120 seconds, and on a slow runner it
      # blew through that — failing the job in the cache's POST step, AFTER
      # every test had already passed. Playwright nightly run 31574583191 went
      # red exactly that way, with 73/73 specs green and zero test failures.
      #
      # git only tracks checked-in files, so gitignored node_modules can never
      # enter the key, and the walk is O(tracked files) — 0.012s on the same
      # repo. `ls-files -s` emits each file's mode and blob SHA, so the digest
      # stays content-addressed exactly as hashFiles was, and `hash-object`
      # keeps it portable across runner OSes (no sha256sum/shasum split).
      #
      # Pathspecs are relative to the working directory, which is what the
      # `**/`-prefixed globs were approximating — and gets it right for a
      # nested working_directory instead of hashing every package in a monorepo.
      #
      # app.config.{js,ts} are included here but were absent from the old glob,
      # even though 🔍 Detect Expo project treats them as Expo config: changing
      # one used to restore a stale export.
      - name: 🔑 Fingerprint build inputs
        id: build_fingerprint
        run: |
          set -euo pipefail
          fingerprint=$(git ls-files -s -- \
            'bun.lock' 'bun.lockb' 'package-lock.json' 'yarn.lock' \
            'src' 'app' 'components' 'features' \
            'app.json' 'app.config.js' 'app.config.ts' 'package.json' \
            'babel.config.js' 'babel.config.ts' \
            'metro.config.js' 'metro.config.ts' 'tsconfig.json' \
            | git hash-object --stdin)
          echo "hash=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Build input fingerprint: $fingerprint"
        working-directory: ${{ inputs.working_directory || '.' }}

      # Expo build cache — opt-in via `cache_build: true`.
      #
      # Cache invalidation contract:
      #   Key is the build-input fingerprint computed above: lockfiles → source
      #   directories → config files. Any change to a lockfile, to
      #   src/app/components/features source, or to Expo/Metro/Babel/TS config
      #   misses the cache and forces a rebuild.
      #   Runner OS is part of the key to prevent cross-OS cache reuse.
      # Cached paths:
      #   - dist/             Expo web export output (consumed by Playwright)
      #   - .expo/            Expo CLI metadata and bundler cache
      #   - node_modules/.cache  Metro/Babel bundler caches
      - name: 💾 Restore Expo build cache
        if: steps.check_playwright.outputs.has_config == 'true' && steps.check_expo.outputs.is_expo == 'true' && inputs.cache_build == true
        id: expo_cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ inputs.working_directory || '.' }}/dist
            ${{ inputs.working_directory || '.' }}/.expo
            ${{ inputs.working_directory || '.' }}/node_modules/.cache
          key: ${{ runner.os }}-expo-build-${{ steps.build_fingerprint.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-expo-build-

      - name: 🌐 Build web export
        if: steps.check_playwright.outputs.has_config == 'true' && steps.check_expo.outputs.is_expo == 'true' && (inputs.cache_build != true || steps.expo_cache.outputs.cache-hit != 'true')
        run: npx expo export --platform web
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Expo build cache hit — skipping expo export
        if: steps.check_playwright.outputs.has_config == 'true' && steps.check_expo.outputs.is_expo == 'true' && inputs.cache_build == true && steps.expo_cache.outputs.cache-hit == 'true'
        run: echo "::notice::Expo build cache hit — skipped \`npx expo export --platform web\`"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🎭 Install Playwright browsers
        if: steps.check_playwright.outputs.has_config == 'true'
        run: npx playwright install --with-deps
        working-directory: ${{ inputs.working_directory || '.' }}

      # Matrix runs always emit blob reports — unsharded or sharded. The
      # matrix adds a `(<shard>)` suffix to the check context (e.g.
      # `🎭 Playwright E2E Tests (1)`), so these shard-level checks are
      # distinct from the aggregator's unsuffixed context. `--shard=1/1` is
      # a no-op split (runs every test) and keeps a single command shape
      # regardless of `playwright_shards` value.
      #
      # `line` is paired with `blob` so a shard that never finishes still says
      # what it was doing. `blob` writes its file only when the run ENDS and
      # prints nothing to the console meanwhile, so a shard killed by the job
      # timeout produces no artifact AND no console output — the aggregator has
      # nothing to merge and the log names no test. Observed on
      # acmeorgb/frontend-v2, where shard 2 hit the 60-minute timeout on
      # three consecutive nightlies having printed only "Running 136 tests using
      # 2 workers, shard 2 of 4"; the hang could not be attributed to a test at
      # all, in any run. `line` streams progress to the console without
      # displacing the blob artifact the aggregator needs, so the next timeout
      # is self-diagnosing.
      - name: 🎭 Run Playwright tests
        if: steps.check_playwright.outputs.has_config == 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/${{ inputs.playwright_shards }} --reporter=blob,line
        working-directory: ${{ inputs.working_directory || '.' }}

      # Every shard uploads its blob report. The aggregator (below) always
      # runs and merges these into a single HTML report, so consumers keep
      # the same downstream artifact name — `playwright-report-<run-id>`.
      - name: 📤 Upload Playwright blob
        if: steps.check_playwright.outputs.has_config == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ inputs.working_directory || '.' }}/blob-report
          retention-days: 14

      - name: 🎭 Playwright Tests Skipped (no config)
        if: steps.check_playwright.outputs.has_config != 'true'
        run: |
          echo "::warning::Playwright E2E tests skipped - no playwright.config.ts or playwright.config.js found"
          echo "To enable Playwright testing, add a Playwright configuration file to your project"

  # Aggregator: downloads every shard's blob report, merges into a single
  # HTML report, and uploads it as `playwright-report-<run-id>`.
  #
  # This job is the canonical "🎭 Playwright E2E Tests" check for required-
  # status-check rulesets. Matrix shards each add a `(<N>)` suffix to their
  # contexts (non-blocking); this job has no matrix, so its check context
  # is `<caller>/🎭 Playwright E2E Tests` (unsuffixed) and satisfies the
  # ruleset regardless of shard count. Runs always so the unsuffixed check
  # is emitted even when `playwright_shards = 1`.
  playwright_e2e_aggregate:
    permissions:
      contents: read
    name: 🎭 Playwright E2E Tests
    needs: playwright_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() && !contains(format(',{0},', inputs.skip_jobs), ',playwright_e2e,') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔍 Check for Playwright config
        id: check_playwright
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✅ Playwright config found"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Playwright config found — aggregator will skip merge"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔧 Setup Node.js
        if: steps.check_playwright.outputs.has_config == 'true'
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: steps.check_playwright.outputs.has_config == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.check_playwright.outputs.has_config == 'true'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📥 Download all shard blob reports
        if: steps.check_playwright.outputs.has_config == 'true'
        uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.working_directory || '.' }}/all-blob-reports
          pattern: playwright-blob-${{ github.run_id }}-shard-*
          merge-multiple: true

      - name: 🎭 Merge blob reports into HTML
        if: steps.check_playwright.outputs.has_config == 'true'
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
        working-directory: ${{ inputs.working_directory || '.' }}

      # Uploaded under the original unsharded artifact name so downstream
      # consumers (GitHub Actions artifact downloads, Playwright report
      # viewers) don't need to change when a repo opts into sharding.
      - name: 📤 Upload merged Playwright report
        if: steps.check_playwright.outputs.has_config == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: ${{ inputs.working_directory || '.' }}/playwright-report
          retention-days: 14

      - name: 🎭 Playwright aggregator skipped (no config)
        if: steps.check_playwright.outputs.has_config != 'true'
        run: |
          echo "::notice::Playwright aggregator skipped — no playwright.config.ts or playwright.config.js found"

      # The aggregator uses `always()` so the merged HTML report is produced
      # even when shards fail (report is useful for triage). BUT
      # `playwright merge-reports` succeeds as long as the blobs themselves
      # merge, regardless of whether the underlying tests passed — so without
      # this guard the aggregator's conclusion can mask failing shards and
      # satisfy required-status-check rulesets on a red PR.
      #
      # `needs.playwright_e2e.result` aggregates the matrix shards:
      #   success  → every shard passed
      #   skipped  → playwright_e2e was skipped (no config / skip_jobs)
      #   failure  → at least one shard failed
      #   cancelled → at least one shard was cancelled
      #   abandoned → runner was lost before the shard completed
      #
      # Fail the aggregator on anything other than success/skipped so the
      # `🎭 Playwright E2E Tests` check accurately reflects shard health.
      #
      # Guard on has_config: when there is no Playwright config, no shard tests
      # ran, so an abandoned/cancelled shard job is not a test failure signal.
      - name: 🚨 Fail if any Playwright shard failed
        if: ${{ always() && steps.check_playwright.outputs.has_config == 'true' && needs.playwright_e2e.result != 'success' && needs.playwright_e2e.result != 'skipped' }}
        run: |
          echo "::error::Playwright shard matrix result is '${{ needs.playwright_e2e.result }}' — at least one shard did not pass"
          exit 1

  format:
    permissions:
      contents: read
    name: 📐 Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',format,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the format-conformance gate
        id: gate
        env:
          GATE_ID: format-conformance
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          if (hit && hit.level === "off") return process.stdout.write("configured=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write("configured=false\n");
          const runner = (require("./.lisa.config.json").gates || {}).runner || process.env.FALLBACK_RUNNER;
          const plain = value => /^[A-Za-z0-9:._@\/= -]+$/.test(value);
          if (!plain(task) || !plain(runner)) { console.error(`::error::gates.${id} resolves to "${runner} ${task}", which is not a plain command.`); process.exit(1); }
          process.stdout.write(`configured=true\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📐 Run the format-conformance gate
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📐 Check formatting
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.gate.outputs.configured == 'false'
        run: ${{ inputs.package_manager }} run format:check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

  build:
    permissions:
      contents: read
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',build,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the build-integrity gate
        id: gate
        env:
          GATE_ID: build-integrity
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          if (hit && hit.level === "off") return process.stdout.write("configured=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write("configured=false\n");
          const runner = (require("./.lisa.config.json").gates || {}).runner || process.env.FALLBACK_RUNNER;
          const plain = value => /^[A-Za-z0-9:._@\/= -]+$/.test(value);
          if (!plain(task) || !plain(runner)) { console.error(`::error::gates.${id} resolves to "${runner} ${task}", which is not a plain command.`); process.exit(1); }
          process.stdout.write(`configured=true\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      # Same build-input fingerprint the playwright_e2e job uses, and for the
      # same reason — the `**/src/**`-style globs this replaces walked
      # node_modules and could exceed the runner's 120s hashFiles cap. See the
      # 🔑 Fingerprint build inputs step in playwright_e2e for the measurements.
      - name: 🔑 Fingerprint build inputs
        id: build_fingerprint
        run: |
          set -euo pipefail
          fingerprint=$(git ls-files -s -- \
            'bun.lock' 'bun.lockb' 'package-lock.json' 'yarn.lock' \
            'src' 'app' 'components' 'features' \
            'app.json' 'app.config.js' 'app.config.ts' 'package.json' \
            'babel.config.js' 'babel.config.ts' \
            'metro.config.js' 'metro.config.ts' 'tsconfig.json' \
            | git hash-object --stdin)
          echo "hash=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Build input fingerprint: $fingerprint"
        working-directory: ${{ inputs.working_directory || '.' }}

      # Build output cache — opt-in via `cache_build: true`.
      #
      # Cache invalidation contract (same as playwright_e2e):
      #   Key is the build-input fingerprint above: lockfiles →
      #   src/app/components/features sources → Expo/Metro/Babel/TS configs.
      #   Any change forces a rebuild.
      # Cached paths cover common build output directories (dist, build,
      # .next, out) plus bundler caches. Default false = unchanged behavior.
      - name: 💾 Restore build cache
        if: inputs.cache_build == true
        id: build_cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ inputs.working_directory || '.' }}/dist
            ${{ inputs.working_directory || '.' }}/build
            ${{ inputs.working_directory || '.' }}/.next
            ${{ inputs.working_directory || '.' }}/out
            ${{ inputs.working_directory || '.' }}/.expo
            ${{ inputs.working_directory || '.' }}/node_modules/.cache
          key: ${{ runner.os }}-build-${{ steps.build_fingerprint.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-build-

      # Both build steps carry the same cache-hit guard. The parentheses are
      # load-bearing: GitHub Actions binds `&&` tighter than `||`, so without
      # them `A || B && C` would parse as `A || (B && C)` and the configured
      # gate would run on a cache hit.
      - name: 🏗️ Run the build-integrity gate
        # Both build steps carry the same cache-hit guard. The parentheses are
        # load-bearing: GitHub Actions binds `&&` tighter than `||`, so without
        # them `A || B && C` would parse as `A || (B && C)` and this step would
        # run on a cache hit.
        if: ${{ (inputs.cache_build != true || steps.build_cache.outputs.cache-hit != 'true') && steps.gate.outputs.configured == 'true' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🏗️ Build project
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: ${{ (inputs.cache_build != true || steps.build_cache.outputs.cache-hit != 'true') && steps.gate.outputs.configured == 'false' }}
        run: ${{ inputs.package_manager }} run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Build cache hit — skipping build
        if: inputs.cache_build == true && steps.build_cache.outputs.cache-hit == 'true'
        run: echo "::notice::Build cache hit — skipped \`${{ inputs.package_manager }} run build\`"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: build-output-${{ github.run_id }}
          path: |
            dist
            build
            .next
            out
          # `.next` is hidden, so without this a Next.js project's build output
          # is dropped from the artifact — and because the other three paths do
          # not exist there either, `if-no-files-found: ignore` turns that into
          # a silent no-op rather than a warning.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Skipped required checks (#2426)
  # ---------------------------------------------------------------------------
  # GitHub counts a SKIPPED required status check as SATISFIED. A job named in
  # `skip_jobs` still reports a green checkmark against its required context
  # having run zero steps in zero seconds, so that merge gate can never be red
  # and therefore can never block anything. Measured twice in this portfolio:
  # acmeorgd (TUN-402) and gemini, whose ruleset required
  # `🔍 Quality Checks / 🎭 Playwright E2E Tests` while its ci.yml skipped it.
  #
  # Lisa shipped the guard, the npm scripts and the seeded declaration, but no
  # workflow ran it — so adopters had to wire it by hand and none did. This job
  # is that wiring.
  #
  # OFFLINE arm on purpose. The `:remote` arm reads the live ruleset over the
  # network with `gh`, and the enforced pull-request path may not depend on
  # network or auth: a flaky gate gets skipped, and a skipped gate is the exact
  # false-green class this check exists to refuse. Two snapshots in one repo
  # cannot see a ruleset edited in the admin console, so the remote arm runs on
  # a schedule instead — `.github/workflows/required-checks-drift.yml`, shipped
  # create-only beside this workflow's caller.
  #
  # Both `[ ! -f ]` guards below are load-bearing, and they are why this cannot
  # redden a repository for a reason unrelated to skipped checks: a project
  # without the script (non-TypeScript stacks, anything not yet re-applied) or
  # without the declaration reports a notice and passes. What it will not do is
  # read nothing and call that a clean bill of health — it says which piece is
  # missing.
  #
  # A SEEDED repository is the dangerous case, and it is handled inside the
  # guard (#2476). `required_contexts` is a CACHE of a live ruleset fetch, and
  # Lisa's seed ships it EMPTY and unstamped because Lisa cannot know what your
  # ruleset requires — an earlier seed shipped a guess that was measured wrong
  # in this fleet, claiming one context was required that no ruleset required
  # and omitting six that were. Until `ruleset.baseline_fetched_at` is stamped,
  # the guard prints NOT CHECKED and suppresses every rule that reads the
  # cache. It never prints a ✅ it cannot support. Refusal is exit 1 except
  # under the seed's `"enforcement": "warn"`, which keeps a fresh install loud
  # rather than red.
  # Gate-config validity. `lisa-gates.mjs validate` catches an unknown gate id,
  # a moment a gate cannot legally run at, and a malformed level — each with a
  # did-you-mean. It has always existed and, until this job, nothing ever ran
  # it: its only callers were prose lines inside lisa-doctor SKILL.md files, so
  # a typo'd gate id resolved to nothing and read as a working declaration.
  # That is `declared-but-uncallable` applied to config validation itself.
  #
  # DELIBERATELY NOT A GATE, and deliberately not skippable via `skip_jobs`.
  # A project that could declare this `off` — or name it in `skip_jobs` — could
  # switch off validation OF ITS OWN gate declarations, which is the circularity
  # that manufactures vacuous greens in the first place. Everything else in this
  # workflow answers to the config; this is the one job that judges it.
  gate_config_validity:
    permissions:
      contents: read
    name: 🧭 Gate Config Validity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧭 Validate the gates block
        run: |
          set -euo pipefail
          # Resolution order prefers the PACKAGE copy over the in-repo one.
          # The same file ships inside @codyswann/lisa, so a consumer already
          # has it under node_modules whether or not it was copied in; reading
          # it from there is one versioned copy instead of a per-repo fork that
          # silently stops receiving fixes. The in-repo path stays first-class
          # only until the copies are retired, and the third entry is Lisa
          # validating itself, where node_modules holds no copy of Lisa.
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" \
            "scripts/lisa-gates.mjs" \
            "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done

          if [ -z "${RESOLVER:-}" ]; then
            # A project with no gates block has nothing to validate and is not
            # yet on this template. One WITH a gates block and no resolver is a
            # different thing entirely: its declarations govern the required
            # contexts and nothing can check them, so that fails rather than
            # passing quietly.
            if [ -f .lisa.config.json ] && node -e 'process.exit(Object.keys((require("./.lisa.config.json").gates)||{}).length ? 0 : 1)'; then
              echo "::error::.lisa.config.json declares a gates block but no lisa-gates.mjs could be found to validate it. Run \`lisa apply\` so the resolver is installed."
              exit 1
            fi
            echo "No gates resolver and no gates block — project not yet on the gate registry; nothing to validate."
            exit 0
          fi

          echo "Validating .lisa.config.json gates via $RESOLVER"
          node "$RESOLVER" validate
        working-directory: ${{ inputs.working_directory || '.' }}

  skipped_required_checks:
    permissions:
      contents: read
    name: 🔒 Skipped Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',skipped_required_checks,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔒 Refuse a skip that silences a required check
        run: |
          if [ ! -f scripts/check-skipped-required-checks.mjs ]; then
            echo "scripts/check-skipped-required-checks.mjs not present — project not yet on this template; skipping."
            exit 0
          fi
          if [ ! -f .github/required-checks.json ]; then
            echo "No .github/required-checks.json — this guard rests on a reviewed snapshot that cannot be derived from the repository. Lisa ships a seed; run \`lisa apply\` to get it. Skipping."
            exit 0
          fi
          node scripts/check-skipped-required-checks.mjs

  # Threshold ratchet: quality thresholds may tighten, never weaken. Compares
  # every watched gate file (coverage/e2e/eslint thresholds, stryker break,
  # k6 bounds, audit-ignore lists) against the PR's merge-base with the same
  # deterministic comparator the agent-time hooks and pre-commit run. This is
  # the non-bypassable layer: agent hooks can be absent (headless runtimes) and
  # local git hooks can be uninstalled, but nothing weakened lands in a PR.
  # Human-approved exceptions live in .lisa.config.json (thresholdRatchet.allow)
  # and are honored only once merged into the base branch.
  threshold_ratchet:
    permissions:
      contents: read
    name: 📐 Threshold Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',threshold_ratchet,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # fetch-depth 0 brings all branches, so the base ref is available
          # without a credentialed fetch later in the job.
          fetch-depth: 0
          persist-credentials: false

      - name: 📐 Compare thresholds against merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Not a pull request — nothing to ratchet against."
            exit 0
          fi
          if [ ! -f scripts/check-threshold-ratchet.mjs ]; then
            echo "scripts/check-threshold-ratchet.mjs not present — project not yet on the ratchet template; skipping."
            exit 0
          fi
          if ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            echo "Base ref origin/$BASE_REF is not available in this checkout — cannot evaluate the ratchet."
            exit 1
          fi
          # The head branch NAME, so the ratchet can tell a promotion between
          # deploy-chain branches from an ordinary PR (#2531). Passed only when
          # the branch resolves in this checkout — a fork PR's head ref does
          # not, and an unresolvable head must leave the gate strict, never
          # relax it. Omitting the flag is the pre-#2531 behavior exactly.
          if git rev-parse --verify "origin/$HEAD_REF" >/dev/null 2>&1; then
            node scripts/check-threshold-ratchet.mjs \
              --base "origin/$BASE_REF" --head "origin/$HEAD_REF"
          else
            node scripts/check-threshold-ratchet.mjs --base "origin/$BASE_REF"
          fi

  # ---------------------------------------------------------------------------
  # Server-side backstop for work-item traceability (#1978, fleet rollout #2046)
  # ---------------------------------------------------------------------------
  # The client-side gates (commit-msg `validate-commit`, pre-push
  # `validate-push`) are fail-safe but locally bypassable: an agent owns its
  # `.git`, so it can repoint `refs/remotes/origin/HEAD` to empty the
  # branch-authored range and launder commits carrying a missing, mixed, or
  # closed-issue Work-Item trailer past the hook (#1956's security review).
  # `validate-pr` recomputes `rev-list base..head` from SHAs in the GitHub event
  # payload, with no exclusion logic and without ever reading a symref, so
  # nothing in the pusher's repository can shrink the range. An EMPTY range is a
  # failure, not a pass.
  #
  # This job lived only in Lisa's own ci.yml until #2046; every host repo had
  # the bypassable client-side half and no backstop, which is the configuration
  # #1978 called "not a gate" — and host repos are exactly where agents run
  # unattended.
  #
  # Inherits the validator's exemptions: merge commits and
  # `chore(release): x.y.z [skip ci]` subjects skip validation entirely.
  work_item_traceability:
    name: 🔗 Work-Item Traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on pull_request: the range and the PR number both come
    # from the event payload. Other events report success.
    if: ${{ github.event_name == 'pull_request' && !contains(format(',{0},', inputs.skip_jobs), ',work_item_traceability,') }}
    # DELIBERATELY no `permissions:` block. This job needs pull-requests:read
    # (`gh pr view`) and issues:read (`gh issue view`), but a called workflow
    # may only DOWNGRADE the caller's grant: requesting a scope the caller never
    # held is a startup_failure for the ENTIRE run, not a skipped job (#2046,
    # #2566). These workflows are consumed @main by repos whose ci.yml is
    # create-only, so an escalation here would break every one of them —
    # including on push paths where this job does not even run. Inheriting the
    # caller's token instead keeps the blast radius inside this job.
    #
    # "Inherits the caller's grant" is only true because this workflow declares
    # NO workflow-level `permissions:` block. A workflow-level block is not a
    # floor — it is a CEILING that also zeroes every scope it omits, for every
    # job that declares none of its own. This workflow used to carry
    # `permissions: contents: read` at the top, and that silently capped this
    # job at contents+metadata no matter what the caller granted. Each job now
    # carries its own copy of that floor instead; this one, and only this one,
    # is left blank on purpose. Do not reintroduce a workflow-level block.
    #
    # Corrects the record from #2476, which claimed this was measured working on
    # a consumer granting all three scopes. It was not: on 2026-08-14 two
    # consumers granting contents/issues/pull-requests read both received
    # `Contents: read, Metadata: read` and nothing else. The earlier red result
    # was read as a genuine missing trailer when it was this scope gap.
    #
    # The readiness probe below FAILS when a scope is missing — it used to exit 0
    # with a warning, which reported success for a gate that had verified
    # nothing. That strictness is correct and must stay; the bug was the
    # plumbing, not the refusal.

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # `rev-list base..head` needs both endpoints and everything between
          # them. A shallow clone would make the range error out or silently
          # under-report, which would void the gate. fetch-depth: 0 also brings
          # every branch down as refs/remotes/origin/*, which the next step uses.
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR head itself, not the default synthetic
          # refs/pull/N/merge: that ref does not exist while the PR has
          # conflicts, and it can lag head.sha immediately after a push. Either
          # would redden this job for a reason unrelated to traceability.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        # Lisa's BUILT-IN validator needs no dependencies — it is plain node,
        # which is why this job never installed before. The install is here for
        # the OTHER path: a project that names its own traceability task runs
        # that task's own tooling, and `<runner> <task>` cannot execute a script
        # whose dependencies are absent. Every other façade job installs first,
        # and this one now matches them.
        #
        # It does NOT make an otherwise-unreadable declaration readable. The
        # resolver comes from the installed package OR the project's copied
        # scripts/lisa-gates.mjs, and installing only affects the first —
        # measured on this workflow's first run of this job (2026-08-18):
        # neither path exists in Lisa's own repository, so this job and the
        # fifteen older façade jobs alike resolved `configured=false` and ran
        # their fallbacks. That is a SEPARATE defect from #2680, recorded in
        # docs/design/gates-and-policy.md; do not read this install as its fix.
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # WHY THIS JOB WAS CONVERTED (#2680). Its `if:` keyed on `skip_jobs` and
      # nothing else, so `gates.traceability` governed the LOCAL runner
      # (lisa-run-gates, `moments: PR_ONLY`) and governed nothing here.
      # Declaring the gate `off` still produced a red check; declaring it
      # `required` changed nothing, because the job already ran on every pull
      # request. One key meant two different things on two surfaces, and
      # nothing anywhere said so — a declaration that reads as a decision taken
      # and governs nothing.
      #
      # The JOB'S OWN condition is deliberately left keyed on `skip_jobs`.
      # A required status context that runs zero steps reports SATISFIED on
      # GitHub, so `off` has to empty the job rather than skip it; dropping the
      # context is `contextsFor`'s job, from the same declaration.
      #
      # `optional` needs no branch here, and that is the whole point of the
      # level: it resolves exactly like `required` and the job still fails on a
      # missing trailer, but `contextsFor` emits a required context only for
      # `required`, so the red check blocks nothing. Making the step swallow
      # its own exit code instead would be a continue-on-error green, which is
      # the defect this façade exists to prevent.
      - name: 🎛️ Resolve the traceability gate
        id: gate
        env:
          GATE_ID: traceability
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          if (hit && hit.level === "off") return process.stdout.write("configured=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write("configured=false\n");
          const runner = (require("./.lisa.config.json").gates || {}).runner || process.env.FALLBACK_RUNNER;
          const plain = value => /^[A-Za-z0-9:._@\/= -]+$/.test(value);
          if (!plain(task) || !plain(runner)) { console.error(`::error::gates.${id} resolves to "${runner} ${task}", which is not a plain command.`); process.exit(1); }
          process.stdout.write(`configured=true\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔗 Resolve the branch-authored commit range
        id: range
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Default to the payload's base.sha. Prefer the base branch's CURRENT
          # tip when it descends from it: a PR that merge-synced the base branch
          # carries the base's own commits (whose trailers reference other, often
          # closed, work items) inside base.sha..head, and those are not
          # branch-authored. Starting the range at the tip drops them by plain
          # set subtraction — no exclusion logic, nothing for a pusher to steer.
          # The tip is whatever CI fetched from GitHub, NOT the agent-repointable
          # local origin/HEAD symref that #1956's bypass abused.
          base="$PR_BASE_SHA"
          tip="$(git rev-parse -q --verify "refs/remotes/origin/${PR_BASE_REF}" || true)"
          # The ancestry check keeps this monotonic: if the base branch was
          # rewritten or the ref is missing, fall back to base.sha rather than
          # widening the exclusion to an unrelated history.
          if [ -n "$tip" ] && git merge-base --is-ancestor "$base" "$tip"; then
