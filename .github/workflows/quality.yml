      contents: read
    name: 🧪 Run Integration Tests
    runs-on: ubuntu-latest
    # 60 rather than 30, derived from measurement, not rounded to fit.
    #
    # Seven same-day baseline runs of this job measured 19.9, 20.1, 20.2, 23.4,
    # 24.9, 25.4 and 26.5 minutes: mean 22.9, sd 2.8, so mean+3sd is 31.4. The
    # old 30-minute ceiling therefore sat INSIDE the job's own upper tail - it
    # was cancelling healthy runs and reporting the cancellation as a failed
    # gate, which is a measurement being destroyed rather than a gate biting.
    #
    # 60 is this workflow's own budget for the same class of work: the job's
    # dominant cost is Stryker, and `test_mutation` above already allows 60
    # minutes for a mutation run. It is 2.3x the worst measured run here, which
    # also leaves room for a per-case budget strictly beneath it (see
    # GATE_RUN_BUDGET_MS in tests/integration/mutation-gate-bite.test.ts) so the
    # test reports WHICH case overran instead of the job dying anonymously.
