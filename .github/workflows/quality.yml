      # about here (#3021). `configured` cannot answer this question: it is
      # `false` both when the gate is undeclared and when a declaration resolves
      # to no runnable task, and those two need opposite treatment — the first
      # must stand the job down, the second must still reach the built-in.
      #
      # A gate absent from `list --include-off` is absent from the declaration.
      # `--include-off` is what makes an explicit `off` count as a DECLARATION
      # rather than as an absence; reading it the other way would make saying no
      # and saying nothing indistinguishable, which is exactly how `off` stopped
      # working the last time these states were collapsed to two.
      #
      # A separate step rather than a fourth state inside the resolve block:
      # that block is byte-identical across every façade job by construction and
      # pinned as such, so a per-job state there would be drift.
      - name: 🔎 Check whether coverage-adequacy is declared at this moment
        id: declaration
        if: steps.gates_declared.outputs.declared == 'true'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID;
          const declared = JSON.parse(raw || "[]").some(gate => gate.id === id);
