      # `SAST` was wrong on the property as well as on the vendor: the job's
      # verdict is a server-side quality gate spanning reliability,
      # maintainability, duplication and coverage as well as security, so a
      # duplication regression used to redden a check whose name claimed
      # static security analysis. The gate id it now posts under is the one
      # the registry already had for it.
      #
      # This job could not carry a façade until the rename above. `contextsFor()`
      # derives `🔍 Quality Checks / <gate.label>`, and while the job posted a
      # different string, declaring the gate `required` derived a context nothing
      # ever posts and blocked the pull request forever. Adding the façade first
      # would not have fixed that; it would have armed it.
      - name: 🎛️ Resolve the static-security gate
        id: gate
        env:
          GATE_ID: static-security
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
