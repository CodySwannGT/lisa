    # `timeout-minutes` is a resource limit, not a quality threshold: raising it
    # moves no coverage floor and relaxes no assertion. It is also not an answer
    # to why this job went from ~1 minute to ~25 - that regression is tracked
    # separately and is not fixed by giving it more room.
