          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔒 Run the dependency-vulnerability gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📋 Load audit exclusions
        # FALLBACK ONLY — the exclusion list and the audit invocation below are
        # npm/yarn/bun `audit` specifics. A project declaring its own
        # `dependency-vulnerability` task has said what proves the property, and
        # may well use a scanner with no notion of a GHSA exclusion file.
        if: steps.gate.outputs.configured == 'false'
        id: audit_exclusions
        shell: bash
        run: |
          # Disable -e so jq exiting non-zero (e.g. on an empty/missing
          # `.exclusions` array under `set -e`) does not abort the step.
          # An exclusion file that doesn't parse should yield zero
          # exclusions, not a failed build.
          set +e
          GHSA_IDS=""
          CVE_IDS=""
          for config_file in audit.ignore.config.json audit.ignore.local.json; do
            if [ ! -f "$config_file" ]; then continue; fi
            FILE_IDS=$(jq -r '.exclusions[]?.id // empty' "$config_file" 2>/dev/null)
            [ -n "$FILE_IDS" ] && GHSA_IDS="$GHSA_IDS $FILE_IDS"
            FILE_CVES=$(jq -r '.exclusions[]? | select(.cve != null) | .cve' "$config_file" 2>/dev/null)
            [ -n "$FILE_CVES" ] && CVE_IDS="$CVE_IDS $FILE_CVES"
          done
          GHSA_IDS=$(echo "$GHSA_IDS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          CVE_IDS=$(echo "$CVE_IDS" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "ghsa_ids=$GHSA_IDS" >> "$GITHUB_OUTPUT"
          echo "cve_ids=$CVE_IDS" >> "$GITHUB_OUTPUT"
          echo "Loaded GHSA exclusions: $GHSA_IDS"
          echo "Loaded CVE exclusions: $CVE_IDS"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔒 Run security audit
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.gate.outputs.configured == 'false'
        run: |
          GHSA_IDS="${{ steps.audit_exclusions.outputs.ghsa_ids }}"
          CVE_IDS="${{ steps.audit_exclusions.outputs.cve_ids }}"

          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            # Build jq exclusion filter for npm audit GHSA IDs
            NPM_EXCLUDE_FILTER=""
            for _id in $GHSA_IDS; do
              if [ -n "$NPM_EXCLUDE_FILTER" ]; then
                NPM_EXCLUDE_FILTER="$NPM_EXCLUDE_FILTER or . == \"$_id\""
              else
                NPM_EXCLUDE_FILTER=". == \"$_id\""
              fi
            done

            AUDIT_JSON=$(npm audit --production --json 2>/dev/null || true)
            if [ -n "$NPM_EXCLUDE_FILTER" ]; then
              UNFIXED_HIGH=$(echo "$AUDIT_JSON" | jq "[.vulnerabilities | to_entries[] | select(.value.severity == \"high\" or .value.severity == \"critical\") | .value.via[] | select(type == \"object\") | .url | ltrimstr(\"https://github.com/advisories/\")] | unique | map(select($NPM_EXCLUDE_FILTER | not)) | length")
            else
              UNFIXED_HIGH=$(echo "$AUDIT_JSON" | jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .value.via[] | select(type == "object") | .url | ltrimstr("https://github.com/advisories/")] | unique | length')
            fi
            if [ "$UNFIXED_HIGH" -gt 0 ]; then
              echo "::warning::Found high or critical vulnerabilities (after excluding known false positives)"
              npm audit --production --audit-level=high || true
              exit 1
            fi
            echo "::notice::No high or critical vulnerabilities found (excluding known false positives)"
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            # Build jq filter for GHSA IDs
            GHSA_FILTER=""
            for _id in $GHSA_IDS; do
              if [ -n "$GHSA_FILTER" ]; then
                GHSA_FILTER="$GHSA_FILTER or .data.advisory.github_advisory_id == \"$_id\""
              else
                GHSA_FILTER=".data.advisory.github_advisory_id == \"$_id\""
              fi
            done

            # Build jq filter for CVE IDs
            CVE_FILTER=""
            for _cve in $CVE_IDS; do
              if [ -n "$CVE_FILTER" ]; then
                CVE_FILTER="$CVE_FILTER or . == \"$_cve\""
              else
                CVE_FILTER=". == \"$_cve\""
              fi
            done

            # Combine GHSA and CVE filters
            COMBINED_FILTER=""
            if [ -n "$GHSA_FILTER" ] && [ -n "$CVE_FILTER" ]; then
              COMBINED_FILTER="($GHSA_FILTER or (.data.advisory.cves | any($CVE_FILTER)))"
            elif [ -n "$GHSA_FILTER" ]; then
              COMBINED_FILTER="($GHSA_FILTER)"
            elif [ -n "$CVE_FILTER" ]; then
              COMBINED_FILTER="((.data.advisory.cves | any($CVE_FILTER)))"
            fi

            if [ -n "$COMBINED_FILTER" ]; then
              yarn audit --groups dependencies --json | jq -r "select(.type == \"auditAdvisory\") | select(.data.advisory.severity == \"high\" or .data.advisory.severity == \"critical\") | select(($COMBINED_FILTER) | not) | .data.advisory" > high_vulns.json
            else
              yarn audit --groups dependencies --json | jq -r 'select(.type == "auditAdvisory") | select(.data.advisory.severity == "high" or .data.advisory.severity == "critical") | .data.advisory' > high_vulns.json
            fi

            if [ -s high_vulns.json ]; then
              echo "::error::Found high or critical vulnerabilities:"
              cat high_vulns.json
              exit 1
            else
              echo "::notice::No high or critical vulnerabilities found (excluding known false positives)"
            fi
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            GHSA_IDS_JSON=$(printf '%s\n' $GHSA_IDS | jq -R . | jq -s 'map(select(length > 0))')
            CVE_IDS_JSON=$(printf '%s\n' $CVE_IDS | jq -R . | jq -s 'map(select(length > 0))')
            # `--production` scopes the audit to production dependencies, matching
            # every other audit path: the pre-push hook's bun branch
            # (`bun audit --production`, which documents this same rationale), and
            # both this workflow's own npm branch (`npm audit --production`) and
            # yarn branch (`yarn audit --groups dependencies`). Without it, bun
            # alone audited devDependencies too, so this gate failed on dev-only
            # build-tool advisories that never ship (e.g. audiosprite -> underscore/
            # minimist) while the identical local hook passed — a confusing
            # local/CI split. Dev-dependency / supply-chain coverage is owned by
            # the dedicated Snyk step (`--all-projects`), not this ship-scope gate.
            # bun honours `--production` even though `bun audit --help` omits it.
            AUDIT_OUTPUT="$(mktemp)"
            bun audit --production --json > "$AUDIT_OUTPUT" 2>/dev/null || true
            if [ ! -s "$AUDIT_OUTPUT" ]; then
              AUDIT_JSON="{}"
            elif jq empty "$AUDIT_OUTPUT" >/dev/null 2>&1; then
              AUDIT_JSON=$(cat "$AUDIT_OUTPUT")
            else
              # Bun can return gzip-compressed JSON on stdout while still
              # reporting a parse error on stderr. Normalize that transport
              # shape before applying Lisa's advisory allowlist.
              DECOMPRESSED_AUDIT_OUTPUT="$(mktemp)"
              gzip -dc "$AUDIT_OUTPUT" > "$DECOMPRESSED_AUDIT_OUTPUT" 2>/dev/null || true
              if jq empty "$DECOMPRESSED_AUDIT_OUTPUT" >/dev/null 2>&1; then
                AUDIT_JSON=$(cat "$DECOMPRESSED_AUDIT_OUTPUT")
              else
                AUDIT_JSON=$(cat "$AUDIT_OUTPUT")
              fi
              rm -f "$DECOMPRESSED_AUDIT_OUTPUT"
            fi
            rm -f "$AUDIT_OUTPUT"

            BUN_HIGH_VULNS=$(echo "$AUDIT_JSON" | jq \
              --argjson ghsa_ids "$GHSA_IDS_JSON" \
              --argjson cve_ids "$CVE_IDS_JSON" \
              '[
                to_entries[]
                | .key as $package
                | (.value // [])[]?
                | select(.severity == "high" or .severity == "critical")
                | . + {
                    package: $package,
                    ghsa_id: (.url // "" | split("/") | last),
                    advisory_id: (.id // "" | tostring),
                    cves: ([.cve?, .cves[]?] | map(select(. != null and . != "")))
                  }
                | select(
                    (
                      ([.ghsa_id, .advisory_id] | map(select(. != "")) | any(.[]; . as $id | $ghsa_ids | index($id)))
                      or (.cves | any(.[]; . as $cve | $cve_ids | index($cve)))
                    )
                    | not
                  )
              ]')
            UNFIXED_HIGH=$(echo "$BUN_HIGH_VULNS" | jq 'length')

            if [ "$UNFIXED_HIGH" -gt 0 ]; then
              echo "::error::Found high or critical vulnerabilities (after excluding known false positives):"
              echo "$BUN_HIGH_VULNS" | jq .
              exit 1
            fi
            echo "::notice::No high or critical vulnerabilities found (excluding known false positives)"
          else
            echo "Unsupported package manager: ${{ inputs.package_manager }}"
            exit 1
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

  sonarcloud:
    permissions:
      contents: read
    name: 🔍 Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',sonarcloud,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"sonarcloud":"skip"')) }}
