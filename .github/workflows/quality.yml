        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Run type check
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.gate.outputs.configured == 'false'
        run: ${{ inputs.package_manager }} run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

  # A `test` job running bare `npm test` used to sit here (#2485). It was
  # deleted, not made required, for two reasons:
  #
  #   1. It was pure duplication. `🧪 Run Unit Tests` runs `test:cov` and
  #      `🧪 Run Integration Tests` runs `test:integration` over the same
  #      suites WITH coverage, and both are required contexts. Lisa force-ships
  #      the `test:unit` script into every host package.json, so no project
  #      lost its only test execution when the bare job went away.
  #   2. It was a confusable-pair hazard. `🧪 Run Tests`, `🧪 Run Unit Tests`,
  #      and `🧪 Run Integration Tests` are three near-identical names, and the
  #      one that did NOT block was the one whose failure read most alarmingly
  #      — "Run Tests failed" reasonably reads as the required test gate. It
  #      merged red on #2456 and #2461 with nobody noticing.
  #
  # The `test` skip token went with it. Removing it changes no other token's
  # semantics: every gate here matches with the sentinel-comma idiom
  # (`,test,`), which is exact-byte, so `test:unit` / `test:integration` /
  # `test:e2e` were never affected by it and are not affected by its absence.
  # A caller still passing `skip_jobs: 'test'` is inert rather than broken.

  verification_coverage:
    permissions:
      contents: read
    name: ✅ Verification Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Per-change verification (UAT) gate: a feat/fix must ship a verification
    # (e2e) spec, unless labeled verification-exempt. Inert unless a project type
    # opts in via verify_enforced, and only meaningful on pull_request (needs the
    # base/head SHAs to diff). When skipped, GitHub reports success.
    if: ${{ inputs.verify_enforced && github.event_name == 'pull_request' }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}
      # PRECONDITION FIRST, and it is a file read rather than an install.
      #
      # This job has never installed dependencies — it runs plain `node` against
      # a shipped script. Resolving a gate needs the Lisa package, so a naive
      # façade would add an unconditional install to a job that had none, on
      # every pull request in the fleet. Reading `.lisa.config.json` for a
      # `gates` block costs nothing and answers the only question that matters:
      # a project that declares no gates can never resolve one, so it goes
      # straight to the fallback and this job stays exactly as cheap as before.
      - name: 🔎 Check whether this project declares any gates
        id: gates_declared
        run: |
          set -euo pipefail
          if [ -f ".lisa.config.json" ] && node -e 'const c = require("./.lisa.config.json"); process.exit(c.gates && Object.keys(c.gates).length ? 0 : 1)' 2>/dev/null; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🍞 Setup Bun
        if: steps.gates_declared.outputs.declared == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gates_declared.outputs.declared == 'true'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the coverage-adequacy gate
        id: gate
        if: steps.gates_declared.outputs.declared == 'true'
        env:
          GATE_ID: coverage-adequacy
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          if (hit && hit.level === "off") return process.stdout.write("configured=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write("configured=false\n");
          const runner = (require("./.lisa.config.json").gates || {}).runner || process.env.FALLBACK_RUNNER;
          const plain = value => /^[A-Za-z0-9:._@\/= -]+$/.test(value);
          if (!plain(task) || !plain(runner)) { console.error(`::error::gates.${id} resolves to "${runner} ${task}", which is not a plain command.`); process.exit(1); }
          process.stdout.write(`configured=true\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ✅ Run the coverage-adequacy gate
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFY_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ✅ Require a verification (e2e) spec delta on feat/fix
        # FALLBACK — unchanged behavior for a project with no `gates` block, and
        # for one whose block does not name this gate.
        if: steps.gates_declared.outputs.declared == 'false' || steps.gate.outputs.configured == 'false'
        run: node scripts/check-verification-coverage.mjs
        working-directory: ${{ inputs.working_directory || '.' }}
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFY_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  e2e_coverage:
    permissions:
      contents: read
    name: 🧭 E2E Route Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Aggregate e2e surface-coverage gate: % of expo-router routes reached by
    # at least one Playwright spec / Maestro flow, thresholds from
    # e2e.thresholds.json (default 80% per runner). Auto-enabled by the
    # presence of the Lisa-managed script (expo projects); a no-op elsewhere.
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',e2e_coverage,') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔍 Check for e2e coverage script
        id: check_script
        run: |
          if [ -f "scripts/check-e2e-coverage.mjs" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🍞 Setup Bun
        if: steps.check_script.outputs.exists == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.check_script.outputs.exists == 'true'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧭 Require e2e route/screen coverage thresholds
        if: steps.check_script.outputs.exists == 'true'
        run: node scripts/check-e2e-coverage.mjs
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip e2e coverage (no check-e2e-coverage.mjs script)
        if: steps.check_script.outputs.exists == 'false'
        run: echo "Skipping e2e route coverage - scripts/check-e2e-coverage.mjs not found"

  state_classification:
    permissions:
      contents: read
    name: 🧬 State Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Anti-drift gate for the reset/seed contract (reset-seed-coverage rule):
    # compares the runtime inventory of persistent state against the project's
    # state contract and FAILS CLOSED on any entity nobody classified, and on
    # any fixture-owned entity nothing sweeps. That second case is the failure
    # this exists for — a flow that creates uniquely-marked records and deletes
    # them only on its happy path leaks on every failure in between, silently,
    # until a count or uniqueness assertion breaks months later.
    #
    # Deliberately NOT "new entities are cleared by default": that erases
    # unrelated non-production data the first time a change adds an entity, and
    # a migrations diff cannot model renames, multiple schemas, generated
    # entities, views, partitions, row-level ownership, or any state that is not
    # a row. Subtraction runs here only as a staleness detector.
    #
    # Auto-enabled by the presence of the Lisa-managed script; a repo with no
    # state contract reports `not-adopted` rather than silently passing a gate
    # it never wired. The script is dependency-free, so no install step.
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',state_classification,') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔍 Check for state classification script
        id: check_script
        run: |
          if [ -f "scripts/check-state-classification.mjs" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧬 Require every persistent entity to carry a reset policy
        if: steps.check_script.outputs.exists == 'true'
        env:
          STATE_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/check-state-classification.mjs
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip state classification (no check-state-classification.mjs script)
        if: steps.check_script.outputs.exists == 'false'
        run: echo "Skipping state classification - scripts/check-state-classification.mjs not found"

  bdd_coverage:
    permissions:
      contents: read
    name: 🧾 BDD Behavior Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # THREE-STATE ADOPTION. The state comes from `bdd_mode`, passed by the
    # caller's ci.yml — never inferred from what happens to be on disk, because
    # inference is how a required check comes to pass by finding nothing.
    #
    #   not-adopted -> this job does not run at all, and the context is NOT in
    #                  any ruleset. Nothing is required, so nothing is faked.
    #   bootstrap   -> runs as a VISIBLE, NON-BLOCKING check. Not a required
    #                  context, so a red here cannot block a merge, but it
    #                  carries a named owner and a hard expiry and turns red
    #                  when that expiry passes.
    #   enforced    -> runs, and ABSENCE FAILS CLOSED: no script, no config,
    #                  zero scenarios, zero mappings, a platform below its
    #                  committed floor, coverage given back, new behavior
    #                  nobody mapped or waived, a deleted scenario, or no base
    #                  revision to compare against are all failures, never
    #                  skips. Only here is the context added to the ruleset,
    #                  and adding it and flipping bdd_mode is ONE adoption
    #                  operation.
    #
    # The permitted values are an ALLOWLIST held as source constants in the
    # gate. An unrecognized `bdd_mode` exits nonzero instead of falling through
    # to the permissive default, because a denylist fails OPEN on exactly the
    # value nobody anticipated.
    #
    # A required context is never auto-skipped (GitHub counts a skipped
    # required check as passing) — see the e2e_coverage and state_classification
    # jobs above for the presence-gated pattern this deliberately does NOT copy
    # in enforced mode.
    if: ${{ inputs.bdd_mode != 'not-adopted' && !contains(format(',{0},', inputs.skip_jobs), ',bdd_coverage,') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the non-regression checks read the base revision of
          # bdd/ to prove that coverage the repo already accepted is still
          # there and that new behavior arrived mapped or waived.
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔎 Resolve BDD gate presence
        id: bdd_script
        env:
          BDD_MODE: ${{ inputs.bdd_mode }}
        run: |
          if [ -f "scripts/check-bdd-coverage.mjs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if [ "$BDD_MODE" = "enforced" ]; then
            echo "::error title=BDD gate missing::bdd_mode is 'enforced' but scripts/check-bdd-coverage.mjs does not exist. In enforced mode the gate's absence is a FAILURE, never a skip — a required context that passes because it found nothing is worse than no gate. Run 'lisa apply' to install the Lisa-managed script, or set bdd_mode to 'bootstrap'."
            exit 1
          fi
          echo "::warning title=BDD gate missing::bdd_mode is '$BDD_MODE' but scripts/check-bdd-coverage.mjs does not exist. This is non-blocking in bootstrap."
        working-directory: ${{ inputs.working_directory || '.' }}

      # The non-regression checks are the whole of what protects coverage the
      # repo already accepted, and every one of them needs a base revision. A
      # run without one used to skip them in silence — a gate reporting a
      # property it never evaluated — so enforced mode now FAILS without a
      # base. That makes resolving one non-optional rather than best-effort:
      # the PR base when there is a pull request, otherwise the fork point
      # from the default branch. A dispatch on the default branch itself
      # resolves to HEAD, which compares a tree against itself and honestly
      # finds no regression, rather than skipping the question.
      - name: 🧭 Resolve the base revision
        id: bdd_base
        if: steps.bdd_script.outputs.exists == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ] && [ -n "$DEFAULT_BRANCH" ]; then
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::warning title=BDD base revision::No base revision could be resolved. In enforced mode the gate fails rather than claiming nothing regressed."
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: 🧾 Evaluate the BDD behavior contract
        if: steps.bdd_script.outputs.exists == 'true'
        run: node scripts/check-bdd-coverage.mjs
        working-directory: ${{ inputs.working_directory || '.' }}
        env:
          BDD_MODE: ${{ inputs.bdd_mode }}
          # Base revision for the non-regression + deletion checks. Enforced
          # mode requires it; bootstrap runs without one silently, because it
          # is non-blocking by construction.
          BDD_BASE_SHA: ${{ steps.bdd_base.outputs.sha }}
          # Labels authorize giving coverage back — a retirement or a waiver
          # over an obligation that used to be mapped. They are
          # maintainer-applied, so an author cannot reduce the contract and
          # authorize the reduction in the same pull request.
          BDD_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Joins the standard command envelope to this run's CI log.
          BDD_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          BDD_ENVIRONMENT: ${{ github.repository }}@${{ github.ref_name }}

      - name: 📋 Report the adoption state
        if: always()
        env:
          BDD_MODE: ${{ inputs.bdd_mode }}
        run: |
          {
            echo "### 🧾 BDD behavior contract — \`$BDD_MODE\`"
            echo
            case "$BDD_MODE" in
              bootstrap)
                echo "This check is **visible but non-blocking**. It must NOT be a required ruleset context in this state."
                echo "It carries a named owner and a hard expiry in \`bdd/coverage-map.json\`; it turns red when that expiry passes."
                ;;
              enforced)
                echo "This check is **enforcing**. Absence fails: missing script, missing or malformed config, zero scenarios, zero mappings, floor regression, or a deleted scenario."
                echo "Required ruleset context: \`🔍 Quality Checks / 🧾 BDD Behavior Contract\`."
                ;;
            esac
            echo
            echo "Traceability coverage is not execution coverage and is not a pass rate — see \`docs/e2e-bdd-coverage.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  learnings_budget:
    permissions:
      contents: read
    name: 📚 Learnings Budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Hard budget gate for the project learnings surface (per-entry length cap,
    # entry count, and token ceiling). The ledger lives cold in .lisa/ and
    # reaches agents only through the contract's bounded projection — this gate
    # keeps the document contract-valid and the projection serveable, and fails
    # the build when the file grows past budget. The check reads the learnings
    # file resolved from .lisa.config.json; a project that has never recorded a
    # learning has no file and passes silently.
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',learnings_budget,') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      # Host projects: pinned for reproducibility — the gate must not change
      # behavior under unchanged host commits. Bump deliberately when the
      # learnings contract changes. (Publishing npm and pushing this @main
      # workflow are the same trust domain; the pin buys determinism, not a
      # trust boundary.) The pin must be >= 2.243.0: earlier CLIs lack the
      # relocated .lisa/ resolver or this subcommand, and pre-2.237.0 CLIs
      # self-skip in non-interactive environments with exit 0, silently voiding
      # the gate — which is why the marker grep below asserts the check ran.
      #
      # Lisa's own source repo: check against ITS OWN source contract instead of
      # a previously-published pin. The pin necessarily lags by at least one
      # release, so a commit that changes the budget and migrates the ledger in
      # the same breath would be judged by the OLD budget — exactly the skew that
      # failed the #2001 deploy (ledger already at 11577 for the derived 12000
      # budget, pin still enforcing the flat 4000). Detection is content-based
      # (not a repo-name match) so forks of the Lisa source behave identically;
      # the checker imports only node: builtins and local sources, so it needs no
      # `bun install`.
      - name: 📚 Check learnings budget
        run: |
          set -o pipefail
          if [ -f scripts/check-learnings-budget.ts ] && [ -f src/core/learnings-budget-check.ts ]; then
            # Resolve the ledger the way the contract does. The bare script
            # defaults to the shipped all/create-only TEMPLATE (0 entries, always
            # passes) — passing the real path explicitly is what keeps this a gate
            # and not a silent no-op.
            ledger="$(jq -r '.learnings.file // ".lisa/PROJECT_LEARNINGS.md"' .lisa.config.json 2>/dev/null || echo '.lisa/PROJECT_LEARNINGS.md')"
            [ -n "$ledger" ] && [ "$ledger" != "null" ] || ledger='.lisa/PROJECT_LEARNINGS.md'
            echo "ℹ️ Lisa source repo — checking $ledger against the in-tree contract"
            bun scripts/check-learnings-budget.ts "$ledger" | tee learnings-budget.out
            # When the ledger exists, demand a real pass: "no learnings file"
            # here would mean we resolved the wrong path and voided the gate.
            if [ -f "$ledger" ]; then
              grep -q "learnings budget passed" learnings-budget.out
            fi
          else
            bunx @codyswann/lisa@2.297.0 check-learnings-budget | tee learnings-budget.out
          fi
          grep -qE "learnings budget passed|no learnings file" learnings-budget.out
        working-directory: ${{ inputs.working_directory || '.' }}

  test_unit:
    permissions:
      contents: read
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',test:unit,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the test-correctness gate
        id: gate
        env:
          GATE_ID: test-correctness
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          if (hit && hit.level === "off") return process.stdout.write("configured=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write("configured=false\n");
          const runner = (require("./.lisa.config.json").gates || {}).runner || process.env.FALLBACK_RUNNER;
          const plain = value => /^[A-Za-z0-9:._@\/= -]+$/.test(value);
          if (!plain(task) || !plain(runner)) { console.error(`::error::gates.${id} resolves to "${runner} ${task}", which is not a plain command.`); process.exit(1); }
          process.stdout.write(`configured=true\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for test:unit script
        id: check_script
        run: |
          if [ -f "package.json" ]; then
            if grep -q '"test:unit"' package.json; then
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Service containers and coverage env are ENVIRONMENT, not tooling, and
      # a project that named its own `test-correctness` task still needs its
      # database up. They stay keyed off the `test:unit` script rather than the
      # gate because Lisa force-ships that script into every host package.json,
      # so a configured project has it too — and because the exact condition
      # string is asserted in tests/integration/quality-workflow.test.ts. The
      # residual gap (a configured project that deleted `test:unit` gets no
      # service containers) needs that assertion relaxed in the same change.
      - name: 🧰 Start coverage service containers
        if: steps.check_script.outputs.exists == 'true' && inputs.coverage_services != ''
        env:
          COVERAGE_SERVICES: ${{ inputs.coverage_services }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const spec = JSON.parse(process.env.COVERAGE_SERVICES || "[]");
          const services = Array.isArray(spec)
            ? spec
            : Object.entries(spec).map(([name, value]) => ({ name, ...value }));
          const quote = value => `'${String(value).replace(/'/g, `'\\''`)}'`;
          const lines = ["set -euo pipefail"];
          const validateName = name => {
            if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$/.test(name)) {
              throw new Error(`Invalid coverage service name: ${name}`);
            }
          };
          for (const [index, service] of services.entries()) {
            if (!service || typeof service !== "object") {
              throw new Error(`coverage_services[${index}] must be an object`);
            }
            if (!service.image || typeof service.image !== "string") {
              throw new Error(`coverage_services[${index}].image is required`);
            }
            const name = service.name || `lisa-coverage-service-${index + 1}`;
            validateName(name);
            lines.push(`docker rm -f ${quote(name)} >/dev/null 2>&1 || true`);
            const args = ["run", "--detach", "--name", name];
            for (const [key, value] of Object.entries(service.env || {})) {
              args.push("--env", `${key}=${value}`);
            }
            for (const port of service.ports || []) {
              args.push("--publish", port);
            }
            if (service.options !== undefined && !Array.isArray(service.options)) {
              throw new Error(`coverage_services[${index}].options must be an array of docker flags`);
            }
            if (Array.isArray(service.options)) {
              args.push(...service.options);
            }
            lines.push(
              `docker ${args.map(quote).join(" ")} ${quote(service.image)}`
            );
            const timeout = Math.trunc(Number(service.healthTimeoutSeconds ?? 60));
            lines.push(`if docker inspect --format='{{if .Config.Healthcheck}}yes{{end}}' ${quote(name)} | grep -q yes; then`);
            lines.push(`  deadline=$((SECONDS + ${Number.isFinite(timeout) ? Math.max(1, timeout) : 60}))`);
            lines.push("  until [ \"$(docker inspect --format='{{.State.Health.Status}}' " + quote(name) + ")\" = healthy ]; do");
            lines.push("    if [ \"$SECONDS\" -ge \"$deadline\" ]; then docker logs " + quote(name) + "; exit 1; fi");
            lines.push("    sleep 2");
            lines.push("  done");
            lines.push("fi");
          }
          fs.writeFileSync("/tmp/lisa-start-coverage-services.sh", `${lines.join("\n")}\n`);
          NODE
          bash /tmp/lisa-start-coverage-services.sh

      - name: 🧪 Apply coverage environment
        if: steps.check_script.outputs.exists == 'true' && inputs.coverage_env != ''
        env:
          COVERAGE_ENV: ${{ inputs.coverage_env }}
        run: |
          node <<'NODE'
          const { randomUUID } = require("node:crypto");
          const fs = require("node:fs");
          const env = JSON.parse(process.env.COVERAGE_ENV || "{}");
          if (!env || Array.isArray(env) || typeof env !== "object") {
            throw new Error("coverage_env must be a JSON object");
          }
          const lines = [];
          for (const [key, value] of Object.entries(env)) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {
              throw new Error(`Invalid coverage_env key: ${key}`);
            }
            const delimiter = `LISA_COVERAGE_ENV_${randomUUID().replace(/-/g, "")}`;
            lines.push(`${key}<<${delimiter}`);
            lines.push(typeof value === "object" && value !== null ? JSON.stringify(value) : String(value));
            lines.push(delimiter);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: 🧪 Run the test-correctness gate
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧪 Run unit tests with coverage
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.check_script.outputs.exists == 'true' && steps.gate.outputs.configured == 'false'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm run test:cov
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn test:cov
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun run test:cov
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip unit tests (no test:unit script)
        if: steps.check_script.outputs.exists == 'false' && steps.gate.outputs.configured == 'false'
        run: echo "Skipping unit tests - test:unit script not found in package.json"

  test_mutation:
    permissions:
      contents: read
    name: 🧬 Mutation Testing Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !contains(format(',{0},', inputs.skip_jobs), ',test:mutation,') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
