        if: inputs.cache_build == true && steps.build_cache.outputs.cache-hit == 'true'
        run: echo "::notice::Build cache hit — skipped \`${{ inputs.package_manager }} run build\`"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: build-output-${{ github.run_id }}
          path: |
            dist
            build
            .next
            out
          # `.next` is hidden, so without this a Next.js project's build output
          # is dropped from the artifact — and because the other three paths do
          # not exist there either, `if-no-files-found: ignore` turns that into
          # a silent no-op rather than a warning.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Skipped required checks (#2426)
  # ---------------------------------------------------------------------------
  # GitHub counts a SKIPPED required status check as SATISFIED. A job named in
  # `skip_jobs` still reports a green checkmark against its required context
  # having run zero steps in zero seconds, so that merge gate can never be red
  # and therefore can never block anything. Measured twice in this portfolio:
  # acmeorgd (TUN-402) and gemini, whose ruleset required
  # `🔍 Quality Checks / 🎭 Playwright E2E Tests` while its ci.yml skipped it.
  #
  # Lisa shipped the guard, the npm scripts and the seeded declaration, but no
  # workflow ran it — so adopters had to wire it by hand and none did. This job
  # is that wiring.
  #
  # OFFLINE arm on purpose. The `:remote` arm reads the live ruleset over the
  # network with `gh`, and the enforced pull-request path may not depend on
  # network or auth: a flaky gate gets skipped, and a skipped gate is the exact
  # false-green class this check exists to refuse. Two snapshots in one repo
  # cannot see a ruleset edited in the admin console, so the remote arm runs on
  # a schedule instead — `.github/workflows/required-checks-drift.yml`, shipped
  # create-only beside this workflow's caller.
  #
  # Both `[ ! -f ]` guards below are load-bearing, and they are why this cannot
  # redden a repository for a reason unrelated to skipped checks: a project
  # without the script (non-TypeScript stacks, anything not yet re-applied) or
  # without the declaration reports a notice and passes. What it will not do is
  # read nothing and call that a clean bill of health — it says which piece is
  # missing.
  #
  # A SEEDED repository is the dangerous case, and it is handled inside the
  # guard (#2476). `required_contexts` is a CACHE of a live ruleset fetch, and
  # Lisa's seed ships it EMPTY and unstamped because Lisa cannot know what your
  # ruleset requires — an earlier seed shipped a guess that was measured wrong
  # in this fleet, claiming one context was required that no ruleset required
  # and omitting six that were. Until `ruleset.baseline_fetched_at` is stamped,
  # the guard prints NOT CHECKED and suppresses every rule that reads the
  # cache. It never prints a ✅ it cannot support. Refusal is exit 1 except
  # under the seed's `"enforcement": "warn"`, which keeps a fresh install loud
  # rather than red.
  # Gate-config validity. `lisa-gates.mjs validate` catches an unknown gate id,
  # a moment a gate cannot legally run at, and a malformed level — each with a
  # did-you-mean. It has always existed and, until this job, nothing ever ran
  # it: its only callers were prose lines inside lisa-doctor SKILL.md files, so
  # a typo'd gate id resolved to nothing and read as a working declaration.
  # That is `declared-but-uncallable` applied to config validation itself.
  #
  # DELIBERATELY NOT A GATE, and deliberately not skippable via `skip_jobs`.
  # A project that could declare this `off` — or name it in `skip_jobs` — could
  # switch off validation OF ITS OWN gate declarations, which is the circularity
  # that manufactures vacuous greens in the first place. Everything else in this
  # workflow answers to the config; this is the one job that judges it.
  gate_config_validity:
    permissions:
      contents: read
    name: 🧭 Gate Config Validity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧭 Validate the gates block
        run: |
          set -euo pipefail
          # Resolution order prefers the PACKAGE copy over the in-repo one.
          # The same file ships inside @codyswann/lisa, so a consumer already
          # has it under node_modules whether or not it was copied in; reading
          # it from there is one versioned copy instead of a per-repo fork that
          # silently stops receiving fixes. The in-repo path stays first-class
          # only until the copies are retired, and the third entry is Lisa
          # validating itself, where node_modules holds no copy of Lisa.
          for candidate in \
            "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" \
            "scripts/lisa-gates.mjs" \
            "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done

          if [ -z "${RESOLVER:-}" ]; then
            # A project with no gates block has nothing to validate and is not
            # yet on this template. One WITH a gates block and no resolver is a
            # different thing entirely: its declarations govern the required
            # contexts and nothing can check them, so that fails rather than
            # passing quietly.
            if [ -f .lisa.config.json ] && node -e 'process.exit(Object.keys((require("./.lisa.config.json").gates)||{}).length ? 0 : 1)'; then
              echo "::error::.lisa.config.json declares a gates block but no lisa-gates.mjs could be found to validate it. Run \`lisa apply\` so the resolver is installed."
              exit 1
            fi
            echo "No gates resolver and no gates block — project not yet on the gate registry; nothing to validate."
            exit 0
          fi

          echo "Validating .lisa.config.json gates via $RESOLVER"
          node "$RESOLVER" validate
        working-directory: ${{ inputs.working_directory || '.' }}

  # NO `if:`, AND NO GATE. This job is not declarable and not skippable, by the
  # same rule that exempts `🧭 Gate Config Validity` above: a gate whose job is
  # to detect silencing cannot itself be silenceable.
  #
  # It carried a `skipped_required_checks` skip token until #2933. #2846 read
  # the missing registry row as an oversight and proposed making it a declarable
  # gate; the owner's ruling was the opposite, and rests on the comparison the
  # issue itself drew. `gate_config_validity` is exempt and has NO skip token,
  # which is why nothing can silence it. This job was exempt and had one — so
  # the exemption bought it nothing and the off-switch was the whole problem.
  # Declaring it `off`, by either mechanism, means "I may silence a required
  # check without anyone objecting". Relocating that declaration from a workflow
  # input into a settings file would not have made it less self-defeating.
  #
  # The general rule is recorded in `NON_DECLARABLE_JOBS` in
  # scripts/lisa-gates.mjs, so the next meta-gate inherits it rather than
  # re-arguing it, and `tests/integration/quality-non-declarable-jobs.test.ts`
  # refuses a skip token or a gate row for anything in that table.
  skipped_required_checks:
    permissions:
      contents: read
    name: 🔒 Skipped Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔒 Refuse a skip that silences a required check
        # ONCE ANY JOB IS SKIPPED, AN ABSENT PROVER IS A FAILURE, NEVER A SKIP.
        # An empty input is different: zero skipped jobs cannot silence a
        # required context, so that case is proved directly before resolving
        # either per-project artifact (#3385).
        #
        # Both arms of this step used to `exit 0`: one for a missing script,
        # one for a missing declaration. Lisa's own repository has neither
        # under `scripts/`, so this job reported SUCCESS after printing
        # "skipping" on every pull request since it shipped — on the very
        # repository that owns the epic against gates that report satisfied
        # without proving anything (#2933). A guard against silencing required
        # checks that is itself silently green is the defect it exists to catch.
        #
        # Resolved from two places for the same reason `📐 Threshold Ratchet`
        # above is: Lisa mirrors only 2 of the 11 copy-overwrite scripts under
        # `scripts/`, so the in-repo template is a legitimate second address for
        # the SAME file, not a bypass. When neither resolves for a non-empty
        # skip list, the step FAILS and names what is missing.
        env:
          SKIP_JOBS: ${{ inputs.skip_jobs }}
        run: |
          set -eu
          if [ -z "${SKIP_JOBS:-}" ]; then
            echo "skip_jobs is empty; no required status check can be silenced by a skipped job."
            exit 0
          fi
          script=scripts/check-skipped-required-checks.mjs
          upstream=typescript/copy-overwrite/scripts/check-skipped-required-checks.mjs
          if [ ! -f "$script" ] && [ -f "$upstream" ]; then
            echo "Using the in-repo template at $upstream; no installed copy under scripts/."
            script="$upstream"
          fi
          if [ ! -f "$script" ]; then
            echo "::error title=Skipped-required-check prover missing::scripts/check-skipped-required-checks.mjs does not exist, so no skip token was compared against the ruleset's required contexts. The prover's absence is a FAILURE, never a skip — GitHub counts a skipped required check as SATISFIED, and a guard that passes because it found nothing to run with is the same false green. Run 'lisa apply' to install the Lisa-managed script."
            exit 1
          fi
          if [ ! -f .github/required-checks.json ]; then
            echo "::error title=Required-checks declaration missing::.github/required-checks.json does not exist, so this guard has no ruleset snapshot to compare skips against and cannot answer. It is create-only and Lisa ships a seed — run 'lisa apply' to get it, then transcribe your ruleset's required contexts into it. Reporting a clean bill of health from a comparison that never happened is the exact failure this gate refuses."
            exit 1
          fi
          node "$script"

  # Threshold ratchet: quality thresholds may tighten, never weaken. Compares
  # every watched gate file (coverage/e2e/eslint thresholds, stryker break,
  # k6 bounds, audit-ignore lists) against the PR's merge-base with the same
  # deterministic comparator the agent-time hooks and pre-commit run. This is
  # the non-bypassable layer: agent hooks can be absent (headless runtimes) and
  # local git hooks can be uninstalled, but nothing weakened lands in a PR.
  # Human-approved exceptions live in .lisa.config.json (thresholdRatchet.allow)
  # and are honored only once merged into the base branch.
  threshold_ratchet:
    permissions:
      contents: read
    name: 📐 Threshold Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',threshold_ratchet,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"threshold_ratchet":"skip"')) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # fetch-depth 0 brings all branches, so the base ref is available
          # without a credentialed fetch later in the job.
          fetch-depth: 0
          persist-credentials: false

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # NOT interchangeable with the built-in below, and a project swapping one
      # for the other has to know it. The built-in compares against the pull
      # request's MERGE BASE (`--base origin/$BASE_REF`). Lisa's own
      # `check:thresholds` compares against `HEAD^`, because it exists to serve
      # the push moment where there is no base ref to speak of. A declared task
      # that keeps the `HEAD^` baseline would, at the pull-request moment,
      # compare one commit instead of the branch — proving a weaker property
      # under the same gate name. A task declared here must take the merge base.
      - name: 🎛️ Resolve the threshold-monotonicity gate
        id: gate
        env:
          GATE_ID: threshold-monotonicity
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📐 Run the threshold-monotonicity gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📐 Compare thresholds against merge-base
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        # Kept, not replaced: a required context that runs zero steps reports
        # GREEN, so removing this before every project is guaranteed to declare
        # the gate would turn a red check into a silent pass.
        if: steps.gate.outputs.configured == 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Not a pull request — nothing to ratchet against."
            exit 0
          fi
          script=scripts/check-threshold-ratchet.mjs
          upstream=typescript/copy-overwrite/scripts/check-threshold-ratchet.mjs
          # Lisa's own repository ships this script as a template and does not
          # keep a second copy under scripts/ — only 2 of the 11 copy-overwrite
          # scripts are mirrored there, and a mirror is a surface that drifts
          # out of band from the thing it mirrors. So the upstream path is a
          # legitimate second place to find the SAME file, not a bypass: when
          # neither exists the job still fails below.
          if [ ! -f "$script" ] && [ -f "$upstream" ]; then
            echo "Using the in-repo template at $upstream; no installed copy under scripts/."
            script="$upstream"
          fi
          if [ ! -f "$script" ]; then
            echo "::error title=Threshold ratchet gate missing::scripts/check-threshold-ratchet.mjs does not exist, so no quality threshold was compared. The gate's absence is a FAILURE, never a skip — a check that passes because it found nothing is worse than no check, and the PostToolUse hook fails open on the stated grounds that this layer guarantees the gate. Run 'lisa apply' to install the Lisa-managed script, or add 'threshold_ratchet' to skip_jobs to decline the gate deliberately, which at least records the decision in the caller."
            exit 1
          fi
          if ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            echo "Base ref origin/$BASE_REF is not available in this checkout — cannot evaluate the ratchet."
            exit 1
          fi
          # The head branch NAME, so the ratchet can tell a promotion between
          # deploy-chain branches from an ordinary PR (#2531). Passed only when
          # the branch resolves in this checkout — a fork PR's head ref does
          # not, and an unresolvable head must leave the gate strict, never
          # relax it. Omitting the flag is the pre-#2531 behavior exactly.
          if git rev-parse --verify "origin/$HEAD_REF" >/dev/null 2>&1; then
            node "$script" --base "origin/$BASE_REF" --head "origin/$HEAD_REF"
          else
            node "$script" --base "origin/$BASE_REF"
          fi

  # ---------------------------------------------------------------------------
  # Server-side backstop for work-item traceability (#1978, fleet rollout #2046)
  # ---------------------------------------------------------------------------
  # The client-side gates (commit-msg `validate-commit`, pre-push
  # `validate-push`) are fail-safe but locally bypassable: an agent owns its
  # `.git`, so it can repoint `refs/remotes/origin/HEAD` to empty the
  # branch-authored range and launder commits carrying a missing, mixed, or
  # closed-issue Work-Item trailer past the hook (#1956's security review).
  # `validate-pr` recomputes `rev-list base..head` from SHAs in the GitHub event
  # payload, with no exclusion logic and without ever reading a symref, so
  # nothing in the pusher's repository can shrink the range. An EMPTY range is a
  # failure, not a pass.
  #
  # This job lived only in Lisa's own ci.yml until #2046; every host repo had
  # the bypassable client-side half and no backstop, which is the configuration
  # #1978 called "not a gate" — and host repos are exactly where agents run
  # unattended.
  #
  # Inherits the validator's exemptions: merge commits and
  # `chore(release): x.y.z [skip ci]` subjects skip validation entirely.
  work_item_traceability:
    name: 🔗 Work-Item Traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful on pull_request: the range and the PR number both come
    # from the event payload. Other events report success.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && !contains(format(',{0},', inputs.skip_jobs), ',work_item_traceability,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"work_item_traceability":"skip"')) }}
    # DELIBERATELY no `permissions:` block. This job needs pull-requests:read
    # (`gh pr view`) and issues:read (`gh issue view`), but a called workflow
    # may only DOWNGRADE the caller's grant: requesting a scope the caller never
    # held is a startup_failure for the ENTIRE run, not a skipped job (#2046,
    # #2566). These workflows are consumed @main by repos whose ci.yml is
    # create-only, so an escalation here would break every one of them —
    # including on push paths where this job does not even run. Inheriting the
    # caller's token instead keeps the blast radius inside this job.
    #
    # "Inherits the caller's grant" is only true because this workflow declares
    # NO workflow-level `permissions:` block. A workflow-level block is not a
    # floor — it is a CEILING that also zeroes every scope it omits, for every
    # job that declares none of its own. This workflow used to carry
    # `permissions: contents: read` at the top, and that silently capped this
    # job at contents+metadata no matter what the caller granted. Each job now
    # carries its own copy of that floor instead; this one, and only this one,
    # is left blank on purpose. Do not reintroduce a workflow-level block.
    #
    # Corrects the record from #2476, which claimed this was measured working on
    # a consumer granting all three scopes. It was not: on 2026-08-14 two
    # consumers granting contents/issues/pull-requests read both received
    # `Contents: read, Metadata: read` and nothing else. The earlier red result
    # was read as a genuine missing trailer when it was this scope gap.
    #
    # The readiness probe below FAILS when a scope is missing — it used to exit 0
    # with a warning, which reported success for a gate that had verified
    # nothing. That strictness is correct and must stay; the bug was the
    # plumbing, not the refusal.

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          # `rev-list base..head` needs both endpoints and everything between
          # them. A shallow clone would make the range error out or silently
          # under-report, which would void the gate. fetch-depth: 0 also brings
          # every branch down as refs/remotes/origin/*, which the next step uses.
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR head itself, not the default synthetic
          # refs/pull/N/merge: that ref does not exist while the PR has
          # conflicts, and it can lag head.sha immediately after a push. Either
          # would redden this job for a reason unrelated to traceability.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        # Lisa's BUILT-IN validator needs no dependencies — it is plain node,
        # which is why this job never installed before. The install is here for
        # the OTHER path: a project that names its own traceability task runs
        # that task's own tooling, and `<runner> <task>` cannot execute a script
        # whose dependencies are absent. Every other façade job installs first,
        # and this one now matches them.
        #
        # It does NOT make an otherwise-unreadable declaration readable. The
        # resolver comes from the installed package OR the project's copied
        # scripts/lisa-gates.mjs, and installing only affects the first —
        # measured on this workflow's first run of this job (2026-08-18):
        # neither path exists in Lisa's own repository, so this job and the
        # fifteen older façade jobs alike resolved `configured=false` and ran
        # their fallbacks. That is a SEPARATE defect from #2680, recorded in
        # docs/design/gates-and-policy.md; do not read this install as its fix.
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # WHY THIS JOB WAS CONVERTED (#2680). Its `if:` keyed on `skip_jobs` and
      # nothing else, so `gates.traceability` governed the LOCAL runner
      # (lisa-run-gates, `moments: PR_ONLY`) and governed nothing here.
      # Declaring the gate `off` still produced a red check; declaring it
      # `required` changed nothing, because the job already ran on every pull
      # request. One key meant two different things on two surfaces, and
      # nothing anywhere said so — a declaration that reads as a decision taken
      # and governs nothing.
      #
      # The JOB'S OWN condition is deliberately left keyed on `skip_jobs`.
      # A required status context that runs zero steps reports SATISFIED on
      # GitHub, so `off` has to empty the job rather than skip it; dropping the
      # context is `contextsFor`'s job, from the same declaration.
      #
      # `optional` needs no branch here, and that is the whole point of the
      # level: it resolves exactly like `required` and the job still fails on a
      # missing trailer, but `contextsFor` emits a required context only for
      # `required`, so the red check blocks nothing. Making the step swallow
      # its own exit code instead would be a continue-on-error green, which is
      # the defect this façade exists to prevent.
      - name: 🎛️ Resolve the traceability gate
        id: gate
        env:
          GATE_ID: traceability
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔗 Resolve the branch-authored commit range
        id: range
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Default to the payload's base.sha. Prefer the base branch's CURRENT
          # tip when it descends from it: a PR that merge-synced the base branch
          # carries the base's own commits (whose trailers reference other, often
          # closed, work items) inside base.sha..head, and those are not
          # branch-authored. Starting the range at the tip drops them by plain
          # set subtraction — no exclusion logic, nothing for a pusher to steer.
          # The tip is whatever CI fetched from GitHub, NOT the agent-repointable
          # local origin/HEAD symref that #1956's bypass abused.
          base="$PR_BASE_SHA"
          tip="$(git rev-parse -q --verify "refs/remotes/origin/${PR_BASE_REF}" || true)"
          # The ancestry check keeps this monotonic: if the base branch was
          # rewritten or the ref is missing, fall back to base.sha rather than
          # widening the exclusion to an unrelated history.
          if [ -n "$tip" ] && git merge-base --is-ancestor "$base" "$tip"; then
            base="$tip"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Validating ${base}..${PR_HEAD_SHA}"

      - name: 🔗 Run the traceability gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        # The project named its own prover. It gets the same event-derived
        # inputs the built-in gets — a traceability check of any shape needs
        # the commit range, the PR number and a token — but none of the
        # readiness plumbing below, which is specific to Lisa's validator.
        # It stays fail-CLOSED regardless: `validate-pr` refuses a PR it
        # cannot read rather than reporting a success it did not earn, and a
        # declared task that is absent exits non-zero.
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
          GH_TOKEN: ${{ github.token }}
          LISA_PR_BASE_SHA: ${{ steps.range.outputs.base }}
          LISA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LISA_PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_LOGIN: ${{ secrets.JIRA_LOGIN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        # Deliberate word split, as on every other façade job.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔗 Validate Work-Item traceability
        # FALLBACK. Runs when nothing resolves — no resolver, no `gates` block,
        # the gate not declared at this moment, or declared `await`-proved. It
        # is byte-for-byte what this job did before #2680, so an unmigrated
        # project is unchanged. `== 'false'` and not `!= 'true'`, because
        # `off` satisfies the negative form and would keep running the very
        # tooling the declaration turned off.
        if: steps.gate.outputs.configured == 'false'
        # Env-var form (equivalent to --base/--head/--pr-number) keeps event
        # payload values out of the shell command entirely.
        env:
          GH_TOKEN: ${{ github.token }}
          LISA_PR_BASE_SHA: ${{ steps.range.outputs.base }}
          LISA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LISA_PR_NUMBER: ${{ github.event.pull_request.number }}
          # Only the configured tracker's credentials are read. `tracker: github`
          # needs none of these; jira and linear cannot verify their backlink
          # without them, which the readiness check below reports as
          # not-enforceable rather than as a traceability failure.
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_LOGIN: ${{ secrets.JIRA_LOGIN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ ! -f scripts/lisa-work-item.mjs ]; then
            echo "scripts/lisa-work-item.mjs not present — project not yet on the work-item template; skipping."
            exit 0
          fi
          # A project mid-onboarding has no tracker configured yet. The
          # validator hard-fails on a missing `tracker`, which would redden
          # every PR in a repo that has not adopted tracked work at all — a
          # gate nobody can satisfy teaches people to ignore red checks.
          if [ ! -f .lisa.config.json ] || \
             ! node -e 'const c=require("./.lisa.config.json");process.exit(typeof c.tracker==="string"&&c.tracker?0:1)' 2>/dev/null; then
            echo "No tracker configured in .lisa.config.json — work-item traceability is not enforceable here; skipping."
            exit 0
          fi
          # Credential readiness: jira/linear cannot verify the PR backlink
          # without their API credentials. Reporting a credential gap as a
          # traceability failure would be a false red, so name the missing
          # secret and skip. `tracker: github` needs only github.token.
          tracker="$(node -p 'require("./.lisa.config.json").tracker' 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          # Token-scope readiness — checked FIRST, because every arm of this
          # gate goes through the GitHub API and none of them can run without
          # it. A reusable workflow may only DOWNGRADE the caller's grant, so a
          # scope the caller never held cannot be recovered here; the repair is
          # always the same three lines in the CALLER's ci.yml.
          #
          # This used to `exit 0` with a warning, which made the check report
          # success while verifying nothing — measured on a private consumer
          # whose gate was green with no trailer, no body line, and no backlink.
          # A gate that cannot verify must not report success (#2476, #2497), so
          # it now fails and names the exact scope and the exact edit.
          # Two different faults print here, and they used to share one line:
          # a caller genuinely missing the grant, and a run that resolved a STALE
          # upstream. `rerun` replays the reusable-workflow SHA the original run
          # resolved, so a fresh attempt can execute old code with no sign of it
          # anywhere in the UI. Four separate misdiagnoses traced to that
          # ambiguity, so the message now names both and hands over the command
          # that tells them apart. This job cannot resolve its own SHA itself:
          # that needs `actions: read`, and requesting a scope the caller may not
          # hold is a startup_failure for the caller's whole run.
          scope_gap() {
            echo "::error::Work-Item Traceability could verify NOTHING: the token reached this job without '$1', so the gate refused rather than report a success it had not earned."
            echo "::error::Cause A — this repo's caller does not grant it. Add contents/issues/pull-requests read to the quality job's permissions in .github/workflows/ci.yml, or run 'lisa apply' to have Lisa add the block."
            echo "::error::Cause B — this run resolved a STALE upstream. A re-run replays the reusable-workflow SHA the original run resolved; only a NEW push re-resolves @main."
            echo "::error::Tell them apart: gh api repos/${GITHUB_REPOSITORY:-<owner>/<repo>}/actions/runs/${GITHUB_RUN_ID:-<run-id>} --jq '.referenced_workflows[]|\"\(.path)@\(.ref) \(.sha)\"' — if that sha predates the fix you want, it is Cause B and no caller edit will help."
            echo "::error::The scopes this job actually received are listed above under 'GITHUB_TOKEN Permissions'. If '$1' is absent there, the grant never arrived; the group is the ground truth, not this message."
            exit 1
          }
          pr_probe="repos/${GITHUB_REPOSITORY}/pulls?per_page=1"
          if [ -n "${LISA_PR_NUMBER:-}" ]; then
            pr_probe="repos/${GITHUB_REPOSITORY}/pulls/${LISA_PR_NUMBER}"
          fi
          # Needed on EVERY tracker: the PR body carries the Work-Item line and
          # `gh pr view` is how the validator reads it.
          if ! gh api "$pr_probe" >/dev/null 2>&1; then
            scope_gap "pull-requests: read"
          fi
          # How much of the contract this project asked to have proved. The
          # validator owns the precedence rules (config key, environment
          # override, default); re-deriving them here in shell would be a
          # second parser of the same declaration, which is the drift #2721
          # removed elsewhere in this gate.
          #
          # A repository's COPY of the validator updates on its own schedule
          # while this workflow is consumed @main, so the copy here may predate
          # the subcommand. That copy can only ever prove the full contract, so
          # it is reported as `full` and the degrade path below refuses to
          # pretend otherwise.
          verify_err="$(mktemp)"
          if verify="$(node scripts/lisa-work-item.mjs verify-level 2>"$verify_err")"; then
            levelled=1
          elif grep -q "Usage: lisa-work-item.mjs" "$verify_err"; then
            # The validator's own usage text is what an UNKNOWN SUBCOMMAND
            # produces, and it is the only signature that means "this copy is
            # older than the subcommand". Reading every failure as staleness
            # would swallow a broken config into a silent `full`.
            levelled=0
            verify=full
            echo "::warning::scripts/lisa-work-item.mjs predates workItem.verify (#2721), so this run proves the FULL contract regardless of what .lisa.config.json declares. Run 'lisa apply' to update the copied script."
          else
            # Anything else is a real refusal — an unrecognised level, an
            # unreadable config — and it is reported as one. A typo quietly
            # resolving to a level is exactly what the validator refuses to do,
            # and re-introducing that here would undo it.
            cat "$verify_err"
            echo "::error::Work-Item Traceability could not resolve its verification level. The validator's refusal is printed above; it is a configuration fault, not a missing trailer."
            rm -f "$verify_err"
            exit 1
          fi
          rm -f "$verify_err"
          echo "Work-item verification level: $verify"
          # Needed only when the tracker item is actually READ, which is only
          # under `full`. A trailer-only project proves its reference from the
          # commits and the body alone, so demanding issues:read of it would
          # fail a gate over a scope nothing in the run consumes.
          if [ "$verify" = "full" ] && [ "$tracker" = "github" ] && \
             ! gh api "repos/${GITHUB_REPOSITORY}/issues?per_page=1" >/dev/null 2>&1; then
            scope_gap "issues: read"
          fi
          # Credential readiness for the non-GitHub trackers, under `full` only.
          #
          # This used to `exit 0` with a warning, and #2476 knowingly left it as
          # the last fail-open in this gate: a jira or linear repository whose
          # secret was unmapped got a GREEN required check having verified
          # nothing — no trailer, no body line, no backlink. One consumer maps
          # a secret that resolves to the EMPTY STRING, which lands in exactly
          # this branch.
          #
          # A missing credential is now what it always was — an inability to
          # prove requirements 2-4 — and it degrades to the level that needs no
          # credential rather than to nothing. The reference checks still run
          # and a missing trailer still fails the job. The warning stays loud,
          # because a project that declared `full` and is getting `trailer` has
          # a gap to close.
          credential_gap=""
          if [ "$verify" = "full" ] && [ "$tracker" = "jira" ] && { [ -z "${JIRA_API_TOKEN:-}" ] || [ -z "${JIRA_LOGIN:-}" ]; }; then
            credential_gap="JIRA_API_TOKEN/JIRA_LOGIN"
          fi
          if [ "$verify" = "full" ] && [ "$tracker" = "linear" ] && [ -z "${LINEAR_API_KEY:-}" ]; then
            credential_gap="LINEAR_API_KEY"
          fi
          if [ -n "$credential_gap" ]; then
            echo "::warning::tracker is $tracker and workItem.verify is \"full\", but $credential_gap is not mapped to this workflow. The tracker checks (repo scope, claimed state, PR backlink) CANNOT run; the Work-Item reference itself is still enforced. Map the secret in the caller's ci.yml to restore them, or declare workItem.verify=\"trailer\" if that is the intent."
            if [ "$levelled" = "1" ]; then
              verify=trailer
            else
              # The one place this job still reports success without proving
              # anything, and it is bounded to a repository whose COPIED
              # validator predates #2721: that copy has no trailer-only level to
              # fall back to, and hard-failing it would redden every pull
              # request in a repository that did nothing wrong on a schedule it
              # did not choose. It self-heals on the next `lisa apply`.
              echo "::warning::This repository's copied validator predates the trailer-only level, so there is nothing to degrade to and the gate is NOT enforced on this run. Run 'lisa apply' to update scripts/lisa-work-item.mjs."
              exit 0
            fi
          fi
          LISA_WORK_ITEM_VERIFY="$verify" node scripts/lisa-work-item.mjs validate-pr

  performance_budget:
    name: ⚡ Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Explicit, because an OMITTED block inherits the caller's full grant —
    # which is why quality-workflow.test.ts requires one on every job but the
    # single deliberate blank. Checkout, a web build and a headless browser
    # need nothing beyond read.
    permissions:
      contents: read
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"performance_budget":"skip"')) }}
    # No `skip_jobs` token, deliberately. That input is being retired (see the
    # `moment` input above), and a gate declared in `.lisa.config.json` is
    # declined by setting its level `off`. The preallocation plan skips that
    # already-empty job before runner allocation; a missing or broken plan runs
    # it, so ambiguity cannot suppress its existing fallback. Adding a new
    # token here would have grown the very list the `moment` input exists to
    # shrink.

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        run: |
          set -euo pipefail
          if [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          else
            ${{ inputs.package_manager }} install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the performance-budget gate
        id: gate
        env:
          GATE_ID: performance-budget
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
