  # A `test` job running bare `npm test` used to sit here (#2485). It was
  # deleted, not made required, for two reasons:
  #
  #   1. It was pure duplication. `🧪 Run Unit Tests` runs `test:cov` and
  #      `🧪 Run Integration Tests` runs `test:integration` over the same
  #      suites WITH coverage, and both are required contexts. Lisa force-ships
  #      the `test:unit` script into every host package.json, so no project
  #      lost its only test execution when the bare job went away.
  #   2. It was a confusable-pair hazard. `🧪 Run Tests`, `🧪 Run Unit Tests`,
  #      and `🧪 Run Integration Tests` are three near-identical names, and the
  #      one that did NOT block was the one whose failure read most alarmingly
  #      — "Run Tests failed" reasonably reads as the required test gate. It
  #      merged red on #2456 and #2461 with nobody noticing.
  #
  # The `test` skip token went with it. Removing it changes no other token's
  # semantics: every gate here matches with the sentinel-comma idiom
  # (`,test,`), which is exact-byte, so `test:unit` / `test:integration` /
  # `test:e2e` were never affected by it and are not affected by its absence.
  # A caller still passing `skip_jobs: 'test'` is inert rather than broken.

  verification_coverage:
    permissions:
      contents: read
    name: ✅ Verification Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Per-change verification (UAT) gate: a feat/fix must ship a verification
    # (e2e) spec, unless labeled verification-exempt. Only meaningful on
    # pull_request (it needs the base/head SHAs to diff).
    #
    # ONE ADOPTION CONTROL, AND IT IS THE DECLARATION (#3021). This job used to
    # carry two: the `coverage-adequacy` gate row it answers to, and a
    # `verify_enforced` boolean input read by this very `if:`. They could
    # disagree, and the losing one lost in SILENCE — a project declaring the
    # gate required at pull-request while leaving the input at its default
    # `false` got no job at all. The input is retired; a caller still passing it
    # is refused by name in the first step below rather than ignored.
    #
    # WHY THE COLLAPSE IS NOT A DELETION, which is the whole of the work.
    # Measured across every caller of this workflow on its own default branch:
    # 22 callers, 2 setting the input true, 20 relying on its default. With the
    # input simply gone this job runs for all 22, and the façade's
    # `configured=false` fallback runs a bespoke spec-delta check most of them
    # fail — because an undeclared gate falls back rather than standing down.
    #
    # So THIS job stands down instead: when `coverage-adequacy` is not declared
    # at this moment it runs zero proving steps and reports green, with a
    # warning saying so. That is byte-for-byte the outcome those 20 already had
    # from a skipped job, so the collapse cannot redden them; and it inverts the
    # registry's general rule for exactly one job, which is why the inversion is
    # written down rather than merely done. The entry is
    # `DECLARATION_REQUIRED_JOBS` in scripts/lisa-gates.mjs, owned by #3147 —
    # the fleet migration that seeds a declaration into every caller and then
    # makes the stand-down fatal, restoring the invariant with no exception.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"verification_coverage":"skip"')) }}
    steps:
      # FIRST, and it FAILS rather than warns. A retired control that is
      # silently ignored takes the enforcement with it and tells nobody: the
      # two callers that set this input true are relying on it to run this
      # check, and quietly dropping them to the stand-down path would remove
      # enforcement while reporting success. Refusing by name costs them one
      # red run and names the one-line remedy — the `bdd_mode` precedent
      # (#3016), applied to the second half of the same collapse.
      #
      # `true` is the only value a boolean input can be distinguished on: an
      # explicitly passed `false` is indistinguishable from the default, and it
      # means the same thing anyway now that the declaration decides.
      - name: 🚫 verify_enforced is retired
        if: ${{ inputs.verify_enforced }}
        run: |
          set -euo pipefail
          echo '::error::verify_enforced is RETIRED (CodySwannGT/lisa#3021). It was a second adoption control for this job, and it disagreed silently with the coverage-adequacy declaration the job already answers to. Remove verify_enforced from your quality.yml call and declare the gate instead: in .lisa.config.json set gates.coverage-adequacy.pull-request to {"level":"required","run":"check:verification"}, which reproduces exactly what this input used to run.'
          exit 1

      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}
      # PRECONDITION FIRST, and it is a file read rather than an install.
      #
      # This job has never installed dependencies — it runs plain `node` against
      # a shipped script. Resolving a gate needs the Lisa package, so a naive
      # façade would add an unconditional install to a job that had none, on
      # every pull request in the fleet. Reading `.lisa.config.json` for a
      # `gates` block costs nothing and answers the only question that matters:
      # a project that declares no gates can never resolve one, so it goes
      # straight to the fallback and this job stays exactly as cheap as before.
      - name: 🔎 Check whether this project declares any gates
        id: gates_declared
        run: |
          set -euo pipefail
          if [ -f ".lisa.config.json" ] && node -e 'const c = require("./.lisa.config.json"); process.exit(c.gates && Object.keys(c.gates).length ? 0 : 1)' 2>/dev/null; then
            echo "declared=true" >> "$GITHUB_OUTPUT"
          else
            echo "declared=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🍞 Setup Bun
        if: steps.gates_declared.outputs.declared == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gates_declared.outputs.declared == 'true'
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
