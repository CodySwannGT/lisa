        run: |
          if [[ -z "${SNYK_TOKEN// }" ]]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ SNYK_TOKEN is not configured"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ SNYK_TOKEN is available"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: 🔧 Setup Node.js
        if: steps.gate.outputs.configured == 'false' && (steps.check_snyk.outputs.has_token == 'true')
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: steps.gate.outputs.configured == 'false' && (inputs.package_manager == 'bun')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.configured == 'false' && (steps.check_snyk.outputs.has_token == 'true')
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🛡️ Run Snyk to check for vulnerabilities
        if: steps.gate.outputs.configured == 'false' && (steps.check_snyk.outputs.has_token == 'true')
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: 📤 Upload Snyk results
        if: always() && steps.gate.outputs.configured == 'false' && steps.check_snyk.outputs.has_token == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 14

      # A DECLINE, not a pass. The distinction is the whole point of this job's
      # place in the gate: `🔒 Security Scan` can be green while this scan
      # examined nothing, and a reader with only the required context in front
      # of them cannot tell. So the decline says which property went unproven,
      # by which prover, in an annotation an audit can key on — rather than an
      # echo that reads as housekeeping.
      - name: 🛡️ Snyk Scan Skipped
        if: steps.gate.outputs.configured == 'false' && steps.check_snyk.outputs.has_token != 'true'
        run: |
          echo "::warning title=dependency-vulnerability partly unproven::SNYK_TOKEN is not configured, so the supply-chain half of dependency-vulnerability was NOT proved. 🔒 Security Scan proves the ship-scope half and can be green while this one examined nothing — a green there does not mean this ran. Add SNYK_TOKEN, or declare gates.dependency-vulnerability with a task that covers both depths."

