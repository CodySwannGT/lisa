            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔎 Run the structural-rules gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 Check for sgconfig.yml
        id: check_config
        if: steps.gate.outputs.configured == 'false'
        run: |
          if [ -f "sgconfig.yml" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔍 Check for ast-grep rules
        id: check_rules
        if: steps.check_config.outputs.has_config == 'true'
        run: |
          RULES_DIR="ast-grep/rules"
          if [ -d "$RULES_DIR" ]; then
            RULE_COUNT=$(find "$RULES_DIR" -name "*.yml" -o -name "*.yaml" 2>/dev/null | grep -v ".gitkeep" | wc -l | tr -d ' ')
            if [ "$RULE_COUNT" -gt 0 ]; then
              echo "has_rules=true" >> $GITHUB_OUTPUT
              echo "rule_count=$RULE_COUNT" >> $GITHUB_OUTPUT
            else
              echo "has_rules=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_rules=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🔎 Run ast-grep scan
        if: steps.check_config.outputs.has_config == 'true' && steps.check_rules.outputs.has_rules == 'true'
        run: ${{ inputs.package_manager }} run sg:scan
        working-directory: ${{ inputs.working_directory || '.' }}

      # Counts rule-test files rather than trusting the runner's exit code.
      # `ast-grep test` exits 0 on an empty test directory, and a host project
      # ships ast-grep/rule-tests/ empty, so an ungated step would report
      # success having asserted nothing about any rule.
      #
      # Discovery is not suffix-based: ast-grep loads every YAML file directly
      # inside testDir and binds it to a rule by its `id`. __snapshots__ is a
      # subdirectory and .gitkeep is not YAML, so -maxdepth 1 over *.yml/*.yaml
      # counts exactly what the runner will run.
      - name: 🔍 Check for ast-grep rule tests
        id: check_rule_tests
        if: steps.check_config.outputs.has_config == 'true'
        run: |
          TESTS_DIR="ast-grep/rule-tests"
          if [ -d "$TESTS_DIR" ]; then
            TEST_COUNT=$(find "$TESTS_DIR" -maxdepth 1 \( -name "*.yml" -o -name "*.yaml" \) | wc -l | tr -d ' ')
            if [ "$TEST_COUNT" -gt 0 ]; then
              echo "has_rule_tests=true" >> $GITHUB_OUTPUT
              echo "rule_test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
            else
              echo "has_rule_tests=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_rule_tests=false" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Invokes the ast-grep binary directly, never a `sg:test` package.json
      # script. Everything that TRIGGERS this step — sgconfig.yml and the
      # rule-test files — is shipped by Lisa, but a script alias lives in the
      # host project's package.json, which Lisa only rewrites on `lisa apply`.
      # Trigger and target travel by different routes at different speeds, so
      # they can never be guaranteed to agree: this workflow is consumed at
      # @main, so #2525's step reached every consumer immediately while the
      # script did not, and each one went red on `Script not found "sg:test"`
      # (#2532). Gating on the script existing (the first patch) traded that
      # for a step that reports success having run nothing, which is the worse
      # failure. The binary has no such split — it is present in any project
      # whose sg:scan already works, and npx fetches it when it is not — so the
      # step is self-sufficient and the whole failure class is gone (#2530).
      #
      # `sg:test` stays in package.lisa.json as a local developer alias. CI no
      # longer depends on it.
      - name: 🧪 Run ast-grep rule tests
        if: steps.check_config.outputs.has_config == 'true' && steps.check_rule_tests.outputs.has_rule_tests == 'true'
        run: |
          # The project's own pinned CLI first, so CI runs the same version as
          # `sg:scan` and the developer's machine. npx only when it has none.
          if [ -x "node_modules/.bin/ast-grep" ]; then
            exec node_modules/.bin/ast-grep test
          fi
          echo "::notice::@ast-grep/cli is not a dependency of this project; running the Lisa-pinned CLI via npx."
          exec npx --yes --package "@ast-grep/cli@0.40.4" ast-grep test
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ AST Grep Skipped (no config)
        if: steps.gate.outputs.configured == 'false' && steps.check_config.outputs.has_config != 'true'
        run: |
          echo "::warning::ast-grep scan skipped - no sgconfig.yml found"
          echo "To enable ast-grep scanning, add sgconfig.yml to your project root"

      - name: ⏭️ AST Grep Skipped (no rules)
        if: steps.check_config.outputs.has_config == 'true' && steps.check_rules.outputs.has_rules != 'true'
        run: |
          echo "::warning::ast-grep scan skipped - no rules defined in ast-grep/rules/"
          echo "To enable ast-grep scanning, add rule YAML files to ast-grep/rules/"

      - name: ⏭️ AST Grep Rule Tests Skipped (none defined)
        if: steps.check_config.outputs.has_config == 'true' && steps.check_rule_tests.outputs.has_rule_tests != 'true'
        run: |
          echo "::warning::ast-grep rule tests skipped - no rule test files in ast-grep/rule-tests/"
          echo "This job going green does NOT mean any ast-grep rule has test coverage."
          echo "To cover a rule, add ast-grep/rule-tests/<rule-id>-test.yml with valid/invalid cases,"
          echo "then run 'ast-grep test --update-all' to record its snapshot."

  floor_collisions:
    permissions:
      contents: read
    name: 🧱 Security Floor Collisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Catches a security floor that a package manager will silently delete.
    #
    # An override naming a package the project also depends on directly gets
    # rewritten by bun to `$name` on every install, at which point the override
    # adopts the dependency line's range instead of its own. When that line is
    # lower — the normal case, since the override exists *because* it is too
    # low — the floor is gone. Seen in acmeorgc/frontend on bun 1.3.11:
    # `"postcss": ">=8.5.18"` became `"$postcss"` against `^8.5.0`, back inside
    # the range GHSA patches at 8.5.18. It reads as a tidy-up in the diff and
    # recurs on every install, so restoring it by hand never holds.
    #
    # Deliberately offline and dependency-free: it is a structural question
    # about the manifest, not a question about the advisory database, so it
    # cannot go quiet when a network call fails. Whether a surviving floor is
    # high enough is the separate job of the advisory check.
    #
    # FAILS CLOSED on a missing script, matching the BDD coverage gate above
    # rather than the `exit 0` this used to carry. A green security check that
    # examined nothing is the failure mode the whole job exists to catch, and
    # it is indistinguishable from a real pass at every surface a reader has.
    # Declining the gate is still possible — it just has to be said out loud,
    # in the caller's `skip_jobs`, where it is reviewable.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',floor_collisions,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"floor_collisions":"skip"')) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      #
      # The fallback below FAILS CLOSED on a missing script, and that stays
      # exactly as it was: it is the whole point of the job. What the façade
      # adds is a way to decline the gate that is not a `skip_jobs` token in a
      # caller's CI file — declaring `security-floor-integrity` `off` says the
      # same thing in the settings file, where `lisa doctor` and every audit
      # that reads the declaration can see it.
      - name: 🎛️ Resolve the security-floor-integrity gate
        id: gate
        env:
          GATE_ID: security-floor-integrity
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      # Only on the declared path. Lisa's own prover is dependency-free, which
      # is why this job never installed anything; a task the project named may
      # not be, and running it against a tree with no node_modules fails for a
      # reason that has nothing to do with the property.
      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🍞 Setup Bun
        if: steps.gate.outputs.configured == 'true' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📦 Install dependencies
        if: steps.gate.outputs.configured == 'true'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧱 Run the security-floor-integrity gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧱 Check for collapsible security floors
        # FALLBACK — unchanged behaviour, fail-closed included, for a project
        # with no `gates` block and for one whose block does not name this
        # gate.
        if: steps.gate.outputs.configured == 'false'
        run: |
          set -o pipefail
          script=scripts/lisa-floor-collisions.mjs
          upstream=all/copy-overwrite/scripts/lisa-floor-collisions.mjs
          # Lisa's own repository ships this script as a template and does not
          # keep a second copy of it under scripts/ — only 2 of the 11
          # copy-overwrite scripts are mirrored there, and a mirror is a
          # surface that drifts out of band from the thing it mirrors. So the
          # upstream path is a legitimate second place to find the SAME file,
          # not a bypass: when neither exists the job still fails below.
          if [ ! -f "$script" ] && [ -f "$upstream" ]; then
            echo "Using the in-repo template at $upstream; no installed copy under scripts/."
            script="$upstream"
          fi
          if [ ! -f "$script" ]; then
            echo "::error title=Floor-collision gate missing::$script does not exist, so no security floor was examined. The gate's absence is a FAILURE, never a skip — a security check that passes because it found nothing is worse than no check. Run 'lisa apply' to install the Lisa-managed script, or add 'floor_collisions' to skip_jobs to decline the gate deliberately, which at least records the decision in the caller."
            exit 1
          fi
          node "$script" | tee -a "$GITHUB_STEP_SUMMARY"

