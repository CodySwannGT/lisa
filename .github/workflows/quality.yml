    permissions:
      contents: read
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',test:unit,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"test_unit":"skip"')) }}

