      - name: 📱 Maestro Tests Skipped (no app file)
        if: steps.gate.outputs.configured == 'false' && (steps.check_maestro.outputs.has_token == 'true' && steps.check_project_id.outputs.has_project_id == 'true' && steps.check_app_file.outputs.has_app_file != 'true')
