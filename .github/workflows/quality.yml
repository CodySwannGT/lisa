          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⚡ Run the performance budget (lighthouse:check)
        # The façade's ordinary fallback contract: reproduce today's behavior
        # byte for byte for a project that has not migrated.
        #
        # Today's behavior is the standalone `lighthouse.yml`, which every
        # consumer wires by hand into its own `ci.yml` and which runs exactly
        # `export:web` then `lighthouse:check`. Reproducing that here is what
        # lets `lighthouse.yml` be deleted without a synchronised edit in four
        # repositories on the same day — each can drop its stale caller
        # whenever it likes, and until it does the measurement still happens,
        # once, here.
        #
        # This is also why the gate's declared task is `perf:check` while the
        # fallback runs `lighthouse:check`. The registry names the CONCERN, as
        # it does for every other gate — `test:e2e`, not `test:playwright` —
        # and a project that has not yet added a `perf:check` script keeps
        # working on the script it already has. No consumer needs a same-day
        # `package.json` alias for this to land.
        if: steps.check_script.outputs.exists == 'true' && steps.gate.outputs.configured == 'false'
        run: ${{ inputs.package_manager }} run lighthouse:check
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ⏭️ Skip the performance budget (no export:web script)
        if: steps.check_script.outputs.exists == 'false' && steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          JOB_CONTEXT: ⚡ Performance Budget
          EXECUTOR: export:web script
        run: |
          # THE FAMILY'S ONE CONTROL. This body is byte-identical in all six
          # presence-gated jobs and carries no per-job adoption input: what
          # varies is the two env values above, and what DECIDES is the single
          # `gates.unproven` key read below. `bdd_coverage` hand-rolled its own
          # three-state input for the same decision; six more of those is six
          # more adoption operations, so this family reads one setting.
          #
          # Read inline rather than through the installed resolver on purpose.
          # This workflow is referenced @main while the resolver comes from
          # whatever @codyswann/lisa version the project installed, so calling a
          # new subcommand would exit non-zero on every consumer that has not
          # bumped — reddening a fleet over a verb, which is the exact failure
          # mode the default below exists to prevent.
          #
          # ABSENT means `warn`, so a project that declares nothing keeps
          # today's behaviour and no version bump can turn it red. An
          # UNRECOGNISED value is refused, not defaulted: a denylist fails open
          # on exactly the value nobody anticipated.
          set -euo pipefail
          RESPONSE=warn
          if [ -f .lisa.config.json ]; then
            RESPONSE=$(node -e 'let v;try{v=(JSON.parse(require("node:fs").readFileSync(".lisa.config.json","utf8")).gates||{}).unproven}catch(e){v=undefined};process.stdout.write(v===undefined?"warn":String(v))')
          fi
          MESSAGE="$GATE_ID is UNPROVEN at $GATE_MOMENT: $JOB_CONTEXT found no $EXECUTOR and no gates.$GATE_ID declaration, so it proved nothing. This job's name is a branch-protection context on some rulesets, and a required context that passes because it found nothing is worse than no gate. Two remedies: declare gates.$GATE_ID at $GATE_MOMENT in .lisa.config.json - including \"off\", which makes the absence a decision rather than an inference - or run 'lisa apply' to install the shipped $EXECUTOR."
          case "$RESPONSE" in
            warn)
              echo "::warning title=$GATE_ID unproven::$MESSAGE"
              ;;
            fail)
              echo "::error title=$GATE_ID unproven::$MESSAGE"
              exit 1
              ;;
            *)
              echo "::error title=gates.unproven is invalid::gates.unproven is \"$RESPONSE\", which is not one of warn, fail. An unrecognised response is refused rather than read as permission to report success."
              exit 1
              ;;
          esac
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 📤 Upload performance reports
        if: always() && steps.gate.outputs.configured != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          # `.lighthouseci/` is a dot-directory and upload-artifact skips hidden
          # paths unless they are named explicitly.
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

