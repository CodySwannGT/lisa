          {
            echo "### 🧾 BDD behavior contract"
            echo
            case "$GATE_CONFIGURED:$GATE_LEVEL" in
              "true:required")
                echo "The \`behavior-contract\` gate is **declared \`required\`**. Absence fails: missing config, malformed manifest, zero scenarios, zero mappings, floor regression, a deleted scenario, or no base revision — and the failure blocks, because \`🔍 Quality Checks / 🧾 BDD Behavior Contract\` is a merge condition at this level."
                ;;
              "true:optional")
                echo "The \`behavior-contract\` gate is **declared \`optional\`**. Absence is still reported — missing config, malformed manifest, zero scenarios, zero mappings, floor regression, a deleted scenario, or no base revision — but the failure does not block: it does not fail this workflow, is not a merge condition, and skips nothing sequenced after it."
                echo "Declare it \`required\` to make \`🔍 Quality Checks / 🧾 BDD Behavior Contract\` a merge condition."
                ;;
              "off:off")
                echo "The \`behavior-contract\` gate is declared **off**. Nothing was proved, on the record."
                ;;
              *)
                echo "The \`behavior-contract\` gate is **not declared here**, so this job proved nothing. Declare it in \`.lisa.config.json\` at \`required\`, \`optional\`, or \`off\`."
                ;;
            esac
            echo
            echo "Traceability coverage is not execution coverage and is not a pass rate — see \`docs/e2e-bdd-coverage.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  learnings_budget:
    permissions:
      contents: read
    name: 📚 Learnings Budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Hard budget gate for the project learnings surface (per-entry length cap,
    # entry count, and token ceiling). The ledger lives cold in .lisa/ and
    # reaches agents only through the contract's bounded projection — this gate
    # keeps the document contract-valid and the projection serveable, and fails
    # the build when the file grows past budget. The check reads the learnings
    # file resolved from .lisa.config.json; a project that has never recorded a
    # learning has no file and passes silently.
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',learnings_budget,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"learnings_budget":"skip"')) }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

