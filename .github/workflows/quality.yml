          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⏭️ Stand down — coverage-adequacy is not declared
        # THE STAND-DOWN, and it is LOUD on purpose. This job's `name:` is a
        # branch-protection context, and a required context that runs zero
        # steps reports GREEN — so an operator who is never told has no way to
        # learn that the check they think is guarding the repository is inert.
        # It warns rather than fails because failing is precisely what the 20
        # callers relying on the retired input's default must not start doing.
        if: steps.declaration.outputs.present != 'true'
        env:
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning::coverage-adequacy is not declared at ${GATE_MOMENT}, so this job proved NOTHING and reported green. It is the one job in quality.yml that stands down instead of falling back to a built-in, recorded as DECLARATION_REQUIRED_JOBS in lisa-gates.mjs and owned by CodySwannGT/lisa#3147. Turn it on by setting gates.coverage-adequacy.pull-request in .lisa.config.json to {\"level\":\"required\",\"run\":\"check:verification\"}."
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: ✅ Require a verification (e2e) spec delta on feat/fix
        # FALLBACK — reachable only BEHIND a declaration now (#3021). It still
        # runs when a declaration resolves to no runnable task, which is the
        # case the fallback exists for; it no longer runs merely because a
        # project never mentioned the gate, because that population is the 20
        # callers whose job did not run at all before the collapse.
        if: steps.gate.outputs.configured == 'false' && steps.declaration.outputs.present == 'true'
        run: node scripts/check-verification-coverage.mjs
        working-directory: ${{ inputs.working_directory || '.' }}
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFY_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

