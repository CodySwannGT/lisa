# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.
# -----------------------------------------------------------------------------
# Quality Checks Workflow
# -----------------------------------------------------------------------------
# ⚠️ WARNING: THIS FILE IS AUTO-GENERATED. DO NOT EDIT MANUALLY! ⚠️
# Any changes may be overwritten by the generation process.
# This workflow runs various quality checks on the codebase including:
# - Linting
# - Type checking
# - Unit tests
# - Format checking
# - Build verification
# - Security scanning
# - AI-powered code quality and security analysis (non-blocking)
# - Enterprise security tools:
#   - Static security analysis (SonarCloud)
#   - Snyk dependency vulnerability scanning
#   - GitGuardian secret detection
#   - FOSSA license compliance checking
# - E2E testing:
#   - Playwright web E2E tests (auto-detects playwright.config.ts)
#   - Maestro Cloud mobile E2E tests (requires MAESTRO_API_KEY, project ID, and app binary)
#
# Example usage in another workflow:
# ```yaml
# quality:
#   uses: ./.github/workflows/quality.yml
#   with:
#     node_version: '22.21.1'
#     package_manager: 'npm'
#     skip_jobs: 'npm_security_scan,sonarcloud,snyk'
#   secrets:
#     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # For static security analysis
#     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # For Snyk dependency scanning
#     GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}  # For secret detection
#     FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}  # For license compliance
#     MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}  # For Maestro Cloud E2E
# ```

name: 🔍 Quality Checks

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string
      moment:
        # Which set of gates applies. Every job below resolves its gate from
        # `.lisa.config.json` AT THIS MOMENT, so one input decides whether this
        # run enforces the pull-request set or a scheduled one.
        #
        # This exists to retire `skip_jobs` inversion. A nightly caller that
        # wants only the E2E gates currently has no way to say so, and instead
        # names the two dozen jobs it does NOT want — a list that silently goes
        # stale every time a job is added, and which turns required contexts
        # into vacuous greens (see `skip_jobs` below). Declaring the gate at
        # `continuous:<environment>` instead says the same thing positively,
        # from the same declaration that drives the required-context list.
        #
        # An unknown moment is REFUSED by scripts/lisa-gates.mjs rather than
        # resolving to nothing: a moment is looked up as a key on each gate, so
        # a typo would otherwise match nothing, report `configured=false` for
        # every job, and run each fallback while claiming the registry declared
        # nothing here.
        description: 'Which gate set applies: a fixed moment (pull-request, push, commit) or a family with an environment (continuous:dev, pre-deploy:production). Defaults to pull-request; an unrecognised value fails the run.'
        required: false
        default: 'pull-request'
        type: string
      skip_jobs:
        # ⚠️ PREFER `gates` IN .lisa.config.json. `skip_jobs` is retained
        # because repositories pass it today, but it is unsafe by
        # construction: GitHub counts a SKIPPED required status check as
        # SATISFIED, so a job named here reports GREEN against a context its
        # ruleset still requires, having run zero steps. That gate can never
        # be red and therefore can never block anything — measured twice in
        # this portfolio (see the `skipped_required_checks` job below).
        #
        # The safe replacement is to set the gate to `off` (or `optional`) in
        # the `gates` block of .lisa.config.json. It cannot produce a vacuous
        # green, because ONE declaration drives BOTH sides: the job condition
        # and the required-context list, which `contextsFor` in
        # scripts/lisa-gates.mjs derives from the same entry and which emits a
        # context only for `required`. A gate turned off vanishes from the
        # ruleset instead of silently satisfying it. `skip_jobs` cannot offer
        # that, because it is a workflow input and nothing edits the ruleset.
        #
        # ⚠️ NO SPACES. Each token is matched exactly, as `,<token>,` inside
        # `format(',{0},', inputs.skip_jobs)`. GitHub Actions expression syntax
        # has no string-replace function — the available string functions are
        # contains/startsWith/endsWith/format/join/toJSON/fromJSON/hashFiles —
        # so this workflow cannot trim for you. `'lint, lint_slow'` yields the
        # token `" lint_slow"`, which matches nothing, and the job RUNS. That
        # fails closed, so nothing unverified ships; it just silently does not
        # do what you asked. `scripts/check-skipped-required-checks.mjs` reports
        # exactly this as `whitespace_in_skip_token`, and the
        # `🔒 Skipped Required Checks` job below runs it on every pull request.
        #
        # That job takes NO TOKEN, and neither does `🧭 Gate Config Validity`.
        # A gate whose job is to detect silencing cannot itself be silenceable:
        # a token that switched it off would mean "I may silence a required
        # check without anyone objecting", which is the one claim this input is
        # not allowed to make. The rule is written down, generalised, in
        # `NON_DECLARABLE_JOBS` in scripts/lisa-gates.mjs.
        description: 'Jobs to skip. Comma-separated with NO SPACES — tokens are matched exactly, so `lint, lint_slow` silently skips nothing beyond `lint`. (lint,lint_slow,typecheck,test:unit,test:mutation,test:integration,test:e2e,maestro_e2e,playwright_e2e,e2e_coverage,bdd_coverage,state_classification,learnings_budget,threshold_ratchet,work_item_traceability,format,build,test_node_suites,dead_code,conflict_markers,sg_scan,floor_collisions,npm_security_scan,github_issue)'
        required: false
        default: ''
        type: string
      working_directory:
        description: 'Directory to run commands in (if not root)'
        required: false
        default: ''
        type: string
      compliance_framework:
        description: 'Compliance framework to validate against (none, soc2, iso27001, hipaa, pci-dss)'
        required: false
        default: 'none'
        type: string
      require_approval:
        description: 'Require approval for production deployments (uses GitHub environments)'
        required: false
        default: false
        type: boolean
      audit_retention_days:
        description: 'Number of days to retain audit logs'
        required: false
        default: 90
        type: number
      generate_evidence_package:
        description: 'Generate compliance evidence package for audits'
        required: false
        default: false
        type: boolean
      approval_environment:
        description: 'GitHub environment name for approval gate (must exist in repo settings). Set to empty string to skip even when require_approval is true.'
        required: false
        default: 'production'
        type: string
      maestro_app_file:
        description: 'Path to app binary for Maestro Cloud E2E tests (e.g., app-release.apk or App.app). Required for Maestro tests to run.'
        required: false
        default: ''
        type: string
      maestro_workspace:
        description: 'Path to Maestro workspace directory containing test flows (default: .maestro)'
        required: false
        default: '.maestro'
        type: string
      maestro_include_tags:
        description: 'Comma-separated tags to include in Maestro test run (e.g., smoke,critical)'
        required: false
        default: ''
        type: string
      maestro_project_id:
        description: 'Maestro Cloud project ID. Required for Maestro tests to run.'
        required: false
        default: ''
        type: string
      playwright_setup_command:
        description: 'INERT — the Playwright suite now lives in playwright-e2e.yml, which has its own input of this name. Passing this here does nothing.'
        # INERT since the Playwright suite moved to its own reusable workflow
        # (.github/workflows/playwright-e2e.yml). Kept declared, and that is
        # deliberate rather than laziness: a caller passing an input this
        # workflow does not declare is a `startup_failure` for its ENTIRE run,
        # decided before any job executes. Installed callers still pass these,
        # so removing them would break `ci.yml` in every consumer that had done
        # nothing wrong. They are removed once no caller passes them.
        required: false
        default: ''
        type: string
      playwright_shards:
        description: 'INERT — the Playwright suite now lives in playwright-e2e.yml, which has its own input of this name. Passing this here does nothing.'
        # INERT since the Playwright suite moved to its own reusable workflow
        # (.github/workflows/playwright-e2e.yml). Kept declared, and that is
        # deliberate rather than laziness: a caller passing an input this
        # workflow does not declare is a `startup_failure` for its ENTIRE run,
        # decided before any job executes. Installed callers still pass these,
        # so removing them would break `ci.yml` in every consumer that had done
        # nothing wrong. They are removed once no caller passes them.
        required: false
        default: 2
        type: number
      cache_build:
        description: 'Cache build output between runs to skip `expo export` and `<pm> run build` when source unchanged. Default false = full rebuild every run (unchanged behavior). When true, cache key hashes lockfiles + src/app/components/features sources + Expo/Metro/Babel/TS configs; invalidates when any of those change.'
        required: false
        default: false
        type: boolean
      concurrency_group:
        description: 'Optional concurrency group to serialize whole workflow runs that share mutable external state (e.g. Playwright E2E that switches the server-side org of a shared test user; concurrent runs otherwise stomp each other). When set, every run passing the same string queues one-behind-another (cancel-in-progress: false). It MUST differ from the calling workflow concurrency group, or parent/child runs sharing a group can deadlock. Default empty = no cross-run serialization (a unique group per run, prior behavior preserved).'
        required: false
        default: ''
        type: string
      verify_enforced:
        description: 'RETIRED. This was a SECOND adoption control for the verification_coverage job, running alongside the coverage-adequacy gate declaration that job already answers to — two controls for one question, and the losing one lost silently: a project declaring coverage-adequacy required at pull-request while leaving this input at its default false got no job at all. Declare the gate in .lisa.config.json instead; that declaration is now the only control, and gates.coverage-adequacy.pull-request set to {"level":"required","run":"check:verification"} reproduces exactly what this input used to run. The input is still ACCEPTED so that a caller which has not migrated keeps a valid workflow file rather than failing to parse, but passing it fails the verification_coverage job with a message naming the remedy. It is removed once no caller sets it.'
        required: false
        default: false
        type: boolean
      bdd_mode:
        description: 'RETIRED. This was a private three-state adoption axis (not-adopted / bootstrap / enforced) for the bdd_coverage job, running alongside the gate registry every other quality job answers to — two controls for one question, and the losing one lost silently. `bootstrap`, a time-boxed grace period with a named owner and an expiry, was `optional` carrying paperwork and it hid red rather than showing it; the owner retired the state and the axis with it. Declare the `behavior-contract` gate in .lisa.config.json at `required`, `optional`, or `off` instead — that declaration is now the only control. The input is still ACCEPTED so that a caller which has not migrated keeps a valid workflow file rather than failing to parse, but passing any value fails the bdd_coverage job with a message naming the remedy. It is removed once no caller sets it.'
        required: false
        default: ''
        type: string
      coverage_services:
        description: 'Optional JSON service-container spec for the coverage job. Empty string preserves prior behavior. Accepts an object map or array with image plus optional name, ports, env, options, and healthTimeoutSeconds.'
        required: false
        default: ''
        type: string
      coverage_env:
        description: 'Optional JSON object of extra environment variables scoped to the coverage job before test:cov. Empty string preserves prior behavior.'
        required: false
        default: ''
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token for SAST analysis'
        required: false
      SNYK_TOKEN:
        description: 'Snyk token for dependency vulnerability scanning'
        required: false
      GITGUARDIAN_API_KEY:
        description: 'GitGuardian API key for secret detection'
        required: false
      FOSSA_API_KEY:
        description: 'FOSSA API key for license compliance checking'
        required: false
      MAESTRO_API_KEY:
        description: 'Maestro Cloud API key for mobile E2E testing'
        required: false
      # Work-item traceability reads the configured tracker to verify the
      # PR's backlink. `tracker: github` needs nothing beyond the job's own
      # github.token; jira and linear need their API credentials, and without
      # them the job reports a credential failure rather than a real
      # traceability failure — so a jira/linear repo MUST map these.
      JIRA_API_TOKEN:
        description: 'Atlassian/Jira API token (only when tracker is jira)'
        required: false
      JIRA_LOGIN:
        description: 'Atlassian account email for the Jira API token (only when tracker is jira)'
        required: false
      LINEAR_API_KEY:
        description: 'Linear API key (only when tracker is linear)'
        required: false

# Cross-run serialization is opt-in via the `concurrency_group` input.
#
# Historically this workflow set NO concurrency and deferred entirely to the
# calling workflow, to avoid parent/child deadlocks (a parent run holding a
# group slot while waiting on a child that queues on the same group). That
# hazard only exists when parent and child SHARE a group with
# `cancel-in-progress: false`, so this opt-in is deadlock-safe by construction:
#   - default (input empty): the group is unique per run (github.run_id), so no
#     run ever waits on another — behavior is identical to having no concurrency.
#   - set: callers pass a constant string DISTINCT from their own top-level
#     concurrency group, serializing these runs across PRs without ever sharing
#     a group with the parent.
# Used to mutex suites that mutate shared external state — e.g. Playwright E2E
# that switches a shared test user's server-side org (concurrent CI runs across
# PRs otherwise stomp each other's org context).
concurrency:
  group: ${{ inputs.concurrency_group != '' && inputs.concurrency_group || format('lisa-quality-no-serialize-{0}', github.run_id) }}
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# Least-privilege token scope (deliberate, audited — see #1769)
# -----------------------------------------------------------------------------
# `contents: read` is the FLOOR for every job in this workflow. An audit of all
# 32 jobs found ZERO uses of `gh`, `github.rest.*`, `github.request`,
# `GITHUB_TOKEN`, or `github.token` anywhere in the file, so no job needs a
# write scope:
#   - SonarCloud PR decoration is performed server-side by the GitHub App, not
#     by the workflow token (the scan action receives SONAR_TOKEN only).
#   - Snyk / GitGuardian / FOSSA / Maestro authenticate with their own secrets.
#   - `zaproxy/action-baseline` runs with `allow_issue_writing: false`; if that
#     flag is ever flipped to true, that job — and only that job — needs
#     `issues: write` added at the job level.
#   - `actions/github-script` in audit_logger only writes a local file and the
#     step summary; artifact upload/download and cache use the run-scoped
#     runtime token, not GITHUB_TOKEN.
#   - verification_coverage deliberately reads PR labels from the event payload
#     instead of the API, so it must NEVER gain a `pull-requests` scope.
# This workflow is `workflow_call`-only and consumed fleet-wide via @main.
# Reusable-workflow tokens can only be DOWNGRADED relative to the caller's
# grant, never escalated, so this floor is safe for every consumer: callers
# granting >= read keep working, and no job relies on a write scope.
# Jobs that touch neither the repository nor the API declare `permissions: {}`.
# Never widen this floor — grant a job its minimal scope at the job level.

jobs:
  gate_plan:
    permissions:
      contents: read
    name: 🗺️ Gate Preallocation Plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🗺️ Plan explicit-off gates
        id: plan
        if: always()
        env:
          GATE_MOMENT: ${{ inputs.moment }}
          EXPECTED_PLAN_KEYS: lint,lint_slow,typecheck,verification_coverage,test_unit,test_mutation,test_integration,playwright_e2e_aggregate,format,build,work_item_traceability,performance_budget,test_node_suites,environment_reset,environment_reseed,dead_code,learnings_budget,conflict_markers,sg_scan,npm_security_scan,threshold_ratchet,e2e_coverage,bdd_coverage,state_classification,floor_collisions,secret_scanning,license_compliance,maestro_e2e,sonarcloud,snyk
        run: |
          set -uo pipefail
          PLAN="{}"
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done

          if [ -z "$RESOLVER" ]; then
            echo "::warning::No compatible gate planner was found; running every existing quality job."
          else
            ERROR_FILE="$(mktemp)"
            if CANDIDATE_PLAN="$(node "$RESOLVER" quality-plan --moment="$GATE_MOMENT" 2>"$ERROR_FILE")" &&
              PLAN_JSON="$CANDIDATE_PLAN" node -e '
                const plan = JSON.parse(process.env.PLAN_JSON || "");
                if (!plan || Array.isArray(plan) || typeof plan !== "object") process.exit(1);
                if (Object.values(plan).some(value => value !== "run" && value !== "skip")) process.exit(1);
                const expected = (process.env.EXPECTED_PLAN_KEYS || "").split(",").sort();
                const actual = Object.keys(plan).sort();
                if (actual.length !== expected.length || actual.some((key, index) => key !== expected[index])) process.exit(1);
              '; then
              PLAN="$CANDIDATE_PLAN"
            else
              echo "::warning::Gate planning was unavailable or invalid; running every existing quality job."
              sed 's/^/gate-plan: /' "$ERROR_FILE"
            fi
            rm -f "$ERROR_FILE"
          fi

          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

  # ─── The generic pull-request gate runner ────────────────────────────────
  # THE ASYMMETRY THIS CLOSES. `lisa-run-gates.mjs` resolves whatever a moment
  # declares and runs `$runner $task`, so adding a gate to the registry and
  # declaring it at `commit` makes it run with no wiring and no hook edit. Its
  # own doc comment states the design: the git hooks used to hardcode both the
  # tool and the list of steps, "which meant the answer to 'what does this
  # project prove before a commit?' lived in a shell script that only a shell
  # could read."
  #
  # This workflow never made that move. Every gated job below carries its own
  # copy of the resolve step with one hardcoded `GATE_ID:`, and a gate outside
  # that set is unreachable from a declaration no matter what a project writes.
  # These two jobs are the pull-request moment's answer: one resolution, and
  # one leg per gate the declaration names that no hand-written job below
  # already posts a context for.
  #
  # WHY A MATRIX CAN CARRY A BRANCH-PROTECTION CONTEXT, which is the belief
  # this design turns on and was MEASURED rather than assumed. A matrix job
  # whose `name:` is STATIC posts a suffixed context — every leg emits the same
  # name and GitHub disambiguates them — which is why `playwright-e2e.yml`
  # carries a separate aggregate job whose whole purpose is to own the stable
  # name. A `name:` that is ITSELF a matrix expression cannot collide, so
  # GitHub adds nothing. Both halves were posted on one commit, through a
  # reusable workflow called by a named job — the exact shape of this file —
  # and read back from the check-runs endpoint branch protection matches
  # against:
  #
  #     🔍 Quality Checks / 🧪 Probe Static (alpha)   ← static name, suffixed
  #     🔍 Quality Checks / 🧪 Probe Alpha            ← matrix name, verbatim
  #
  # So `name: ${{ matrix.label }}` posts `🔍 Quality Checks / <label>`, which
  # is the string `contextsFor()` already derives from the same declaration.
  # The two cannot disagree, and no ruleset edit is required anywhere.
  #
  # WHAT DOES NOT GET A LEG, and why that is the safety property. A gate a
  # hand-written job below already proves is excluded, because exactly one job
  # may be named a gate's label — two jobs posting one context is branch
  # protection matching whichever reported last. `jobBackedGates()` derives
  # that exclusion from `QUALITY_JOB_GATES` minus `GENERIC_RUNNER_GATES`, so a
  # block is deleted and its gate migrated in ONE commit, after its leg has
  # been observed green, and never in the other order.
  gate_legs:
    permissions:
      contents: read
    name: 🧮 Declared Gate Legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      count: ${{ steps.legs.outputs.count }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🧮 Resolve the declared gates no built-in job proves
        id: legs
        env:
          GATE_MOMENT: ${{ inputs.moment }}
        # FOUR ANSWERS, and telling them apart is the whole point of this step.
        # Collapsing any of them into "no legs" silently drops every declared
        # gate — and a required context that never reports does not read as
        # skipped, it holds the pull request at "Expected — Waiting for status
        # to be reported" forever. A missing prover must be LOUD, not absent.
        #
        #   1. NO RESOLVER AT ALL — a project that predates the registry.
        #      Empty list, warning, pass. There is nothing it could have
        #      declared, so there is no leg it can be missing, and every
        #      property it proves today is proved by a built-in job as before.
        #
        #   2. A RESOLVER TOO OLD TO KNOW `legs`. Also empty, also a warning,
        #      also a pass — and this is a real population, not a hypothetical:
        #      consumers call this workflow at `@main` while holding whatever
        #      copy of `lisa-gates.mjs` their last `lisa` run installed. It is
        #      told apart from case 3 by asking the same resolver for `list`, a
        #      command every version has had. `list` works and `legs` does not
        #      ⇒ old. Neither works ⇒ broken.
        #
        #      MEASURED, not reasoned. Run the resolver as it stood immediately
        #      before `legs` existed and it answers, verbatim:
        #
        #        $ node lisa-gates.mjs legs --moment="$GATE_MOMENT" --json
        #        usage: lisa-gates.mjs validate|list|needs|contexts|skip-jobs|…
        #        exit 1
        #        $ node lisa-gates.mjs list --moment="$GATE_MOMENT" --json
        #        exit 0
        #
        #      That asymmetry is the whole discriminator, and it is recorded
        #      here rather than only in the pull request because the rule on
        #      its own reads like a plausible convention a later reader may
        #      tidy away. The evidence is what makes it a fact about the
        #      shipped artifact. If a future version ever makes `list` fail
        #      where `legs` succeeds, this branch is wrong and the measurement
        #      above is how you would know.
        #
        #   3. A RESOLVER THAT CANNOT ANSWER — malformed config, unreadable
        #      registry. FAILS. The project HAS a registry, its declarations
        #      are the only thing that decides these contexts, and a resolver
        #      that cannot answer has not said "no gates", it has said nothing.
        #
        #   4. AN ANSWER THAT IS NOT WELL FORMED. Also FAILS, and separately,
        #      so a corrupt payload can never be downgraded into case 2.
        #
        # WHY THERE IS NO INSTALL STEP ABOVE. The resolver is dependency-free
        # by construction, and skipping the install is what lets this job be
        # cheap enough to gate every leg on. The candidate order is unchanged
        # from every façade job below, so nothing here prefers a different copy
        # — an uninstalled `node_modules` simply is not one of the candidates.
        #
        # The output is validated before it is trusted, for the same reason the
        # in-job façade validates its own: `.lisa.config.json` is a file a pull
        # request can edit, and `label` reaches a job name while `runner` and
        # `task` reach a shell. `momentLegs()` refuses a task that is not a
        # plain word at the source; this re-checks the SHAPE here, because the
        # resolver that answered may be one this workflow has never seen.
        run: |
          set -uo pipefail
          LEGS='[]'
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done

          if [ -z "$RESOLVER" ]; then
            echo "::warning::This project ships no gate registry, so no gate can be declared at $GATE_MOMENT and the generic runner has nothing to run. Every property proved today is proved by a built-in job."
          else
            ERROR_FILE="$(mktemp)"
            if ! CANDIDATE="$(node "$RESOLVER" legs --moment="$GATE_MOMENT" --json 2>"$ERROR_FILE")"; then
              if node "$RESOLVER" list --moment="$GATE_MOMENT" --json >/dev/null 2>&1; then
                echo "::warning::This project's gate registry predates the generic pull-request runner, so it cannot say which gates it declares at $GATE_MOMENT. Nothing is lost: every property proved today is proved by a built-in job. Run \`lisa\` to install a registry that can, and the declarations take over."
              else
                echo "::error::The gate registry is installed but could not resolve the legs for $GATE_MOMENT. Every gate this project declares at that moment would report nothing, and a required context that never reports holds the pull request open rather than passing it. Fix the registry or the declaration; this job will not guess."
                sed 's/^/gate-legs: /' "$ERROR_FILE"
                rm -f "$ERROR_FILE"
                exit 1
              fi
            elif LEGS_JSON="$CANDIDATE" node -e '
                const legs = JSON.parse(process.env.LEGS_JSON || "");
                if (!Array.isArray(legs)) process.exit(1);
                const plainTask = /^[A-Za-z0-9:._@\/= -]+$/;
                const plainRunner = /^[A-Za-z0-9._@\/= -]+$/;
                const noOp = [":", "true", "false", "echo", "printf"];
                for (const leg of legs) {
                  if (!leg || typeof leg !== "object") process.exit(1);
                  for (const field of ["gate", "label", "level", "action", "runner", "task"]) {
                    if (typeof leg[field] !== "string") process.exit(1);
                  }
                  if (typeof leg.install !== "boolean") process.exit(1);
                  if (typeof leg.timeout !== "number" || !Number.isInteger(leg.timeout) || leg.timeout < 1) process.exit(1);
                  if (!["run", "report", "unproved"].includes(leg.action)) process.exit(1);
                  if (!leg.gate || !leg.label) process.exit(1);
                  if (leg.action !== "run") continue;
                  if (!plainTask.test(leg.task)) process.exit(1);
                  const head = leg.runner.trim().split(" ")[0];
                  if (!plainRunner.test(leg.runner) || !head || noOp.includes(head)) process.exit(1);
                }
                // Two legs under one label is two jobs posting one context.
                const labels = legs.map(leg => leg.label);
                if (new Set(labels).size !== labels.length) process.exit(1);
              '; then
              LEGS="$CANDIDATE"
            else
              echo "::error::The gate registry answered for $GATE_MOMENT, and the answer is not a well-formed leg list. Deliberately fatal rather than empty: a corrupt payload must not be mistaken for a registry that is merely old, or every declared gate would stop reporting while the run stayed green."
              echo "gate-legs: $CANDIDATE"
              rm -f "$ERROR_FILE"
              exit 1
            fi
            rm -f "$ERROR_FILE"
          fi

          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          COUNT="$(LEGS_JSON="$LEGS" node -e 'process.stdout.write(String(JSON.parse(process.env.LEGS_JSON).length))')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::$COUNT declared gate(s) at $GATE_MOMENT are proved by the generic runner rather than by a built-in job."
        working-directory: ${{ inputs.working_directory || '.' }}

  declared_gates:
    permissions:
      contents: read
    # THE CONTEXT. See the block above: a matrix job named by a matrix
    # expression posts this string verbatim, and `contextsFor()` derives
    # `🔍 Quality Checks / <label>` from the same registry `label` this reads.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    needs: [gate_legs]
    # `count != '0'` is required, not defensive: an empty matrix is a workflow
    # error, not an empty job set. `result == 'success'` is the honest reading
    # of a planner that failed — it could not say which legs exist, so this
    # cannot run them, and the red planner above is what the operator sees.
    if: ${{ needs.gate_legs.result == 'success' && needs.gate_legs.outputs.count != '0' }}
    strategy:
      # One failing gate must not cancel the others. An operator fixing a red
      # pull request needs every verdict from one run, not one per attempt.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate_legs.outputs.legs) }}
    steps:
      - name: 📥 Checkout repository
        if: matrix.action == 'run'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📎 Fetch retained nightly guard release tags
        if: matrix.action == 'run' && github.repository == 'CodySwannGT/lisa'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # These refs exist only in Lisa. Reusable-workflow jobs otherwise run
          # in the caller's checkout, where fetching Lisa tags would fail (and
          # private callers deliberately have no persisted checkout credential).
          if [ "${GITHUB_REPOSITORY:-}" != "CodySwannGT/lisa" ] || [ ! -f scripts/generate-nightly-e2e-guard-certificate.mjs ]; then
            echo "::notice::Retained nightly guard artifacts are not present in this caller; exact-ref fetch is not applicable."
            exit 0
          fi
          # The token is available only to this contents:read step. A command-
          # scoped helper avoids writing credentials into git configuration.
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            fetch --no-tags origin \
            refs/tags/v2.353.0:refs/tags/v2.353.0 \
            refs/tags/v4.17.16:refs/tags/v4.17.16 \
            refs/tags/v4.26.1:refs/tags/v4.26.1

      - name: 🔧 Setup Node.js
        if: matrix.action == 'run'
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: matrix.action == 'run' && inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📥 Install dependencies
        # READ FROM THE REGISTRY, not from a list in this file. A gate whose
        # prover Lisa wrote and which imports only `node:` builtins declares
        # `needs: { deps: false }`, and its leg skips the install entirely —
        # otherwise every gate pays the most expensive setup in the set.
        # `momentLegs()` honours that claim ONLY while Lisa's own prover is
        # what resolved: the moment a project names a `run:` of its own, Lisa
        # has no idea what it imports and `install` comes back true.
        if: matrix.action == 'run' && matrix.install
        # `inputs.package_manager` reaches the shell through `env:` for the
        # same reason every matrix value does. The façade jobs below expand it
        # inline and predate the rule; a new job does not get to inherit that.
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚦 Run the declared gate
        id: gate_run
        # The generic runner's half of the same rule the façade jobs below
        # carry: a leg whose gate is declared `optional` reports its red
        # without failing the workflow. `matrix.level` is the declared level,
        # carried through `momentLegs()` from the same declaration the façade
        # resolves — this path never lost it, and now neither does that one.
        continue-on-error: ${{ matrix.level == 'optional' }}
        if: matrix.action == 'run'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ matrix.runner }}
          GATE_TASK: ${{ matrix.task }}
        # Deliberate word split, exactly as the in-job façade does it. Both
        # values were validated as plain words twice — at the source in
        # `momentLegs()` and again in the planner above — so the runner
        # ("npm run", "bun run", "just") and a task carrying flags both reach
        # argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # See the façade jobs below: continuing on error is half the fix, and
        # this is the half that keeps the red visible.
        #
        # Conditioned on `matrix.action` like every other step in this job. A
        # step without one runs on every leg, which would make the action
        # coverage above read as complete while the job did something on a leg
        # it was never meant to touch.
        if: always() && matrix.action == 'run' && steps.gate_run.outcome == 'failure' && matrix.level == 'optional'
        env:
          GATE_ID: ${{ matrix.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          GATE_SUMMARY: ${{ matrix.summary }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so this did not prove that $GATE_SUMMARY It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — so nothing here proved that $GATE_SUMMARY"
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🙈 Report the gate this project turned off
        # A DECLARED-OFF GATE STILL REPORTS. `contextsFor()` emits no context
        # for an off gate, so a ruleset generated from the same declaration
        # stops requiring it — but a ruleset that still names it must see this
        # succeed, because a required context that never reports holds the pull
        # request at "Expected — Waiting for status to be reported" rather than
        # passing it. Absence is not a skip. Nothing is proved here and the
        # notice says so, which is the difference between this and a required
        # context that runs zero steps and reports green by accident.
        if: matrix.action == 'report'
        # Through `env:` rather than inline `${{ }}`, because a matrix value
        # interpolated straight into a shell body is a shell injection with
        # extra steps — and one shipped summary already carries a double quote.
        env:
          GATE_ID: ${{ matrix.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          GATE_SUMMARY: ${{ matrix.summary }}
        run: |
          echo "::notice::$GATE_ID is declared \"off\" at $GATE_MOMENT, so nothing here proved that $GATE_SUMMARY This project has said on the record that it does not govern the property at this moment. Nothing was proved and nothing was meant to be."

      - name: ❓ Refuse a gate nothing can prove
        # NOT PROVED, and distinct from FAILED. The gate is declared, so it is
        # not "unconfigured"; there is simply no task for the runner to run —
        # a custom `x-` gate declared without a `run:`, or a registry entry
        # whose default prover this project has no script for. A job that
        # skips its proving step when the prover is missing reports green
        # having measured nothing, which is the defect this whole subsystem
        # exists to stop, so this blocks instead.
        if: matrix.action == 'unproved'
        env:
          GATE_ID: ${{ matrix.gate }}
          GATE_LEVEL: ${{ matrix.level }}
          GATE_MOMENT: ${{ inputs.moment }}
          GATE_SUMMARY: ${{ matrix.summary }}
        run: |
          echo "::error::NOT PROVED: $GATE_ID is declared \"$GATE_LEVEL\" at $GATE_MOMENT and nothing resolves to a task that could prove it. What it would have proved: $GATE_SUMMARY Give it a \"run:\" naming one of this project's own tasks, or declare it \"off\" to say on the record that this project does not govern the property here."
          exit 1

  lint:
    permissions:
      contents: read
    name: 🧹 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',lint,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"lint":"skip"')) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📥 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      # ─── Gate façade ─────────────────────────────────────────────────────
      # THE CONTRACT (stated once here; the other converted jobs point back).
      #
      # A gate is a PROPERTY that must hold, not a tool. `oxlint` is not a
      # gate — *code style* is the gate, and oxlint is one way to prove it.
      # Lisa owns the vocabulary (`code-style`); the PROJECT owns the
      # implementation, by naming one of its own tasks in the `gates` block of
      # .lisa.config.json. Resolution goes through the shipped registry,
      # scripts/lisa-gates.mjs, so this workflow never has to know what the
      # project lints with. Swapping oxlint for biome is one line of project
      # config and nothing here.
      #
      # THE FALLBACK is deliberate and load-bearing. `configured` is false —
      # and the steps below run TODAY'S hardcoded invocation, byte for byte —
      # whenever nothing resolves, which covers every one of:
      #   * no scripts/lisa-gates.mjs (project predates the registry),
      #   * no `gates` block (the state of essentially every installed
      #     project right now, including Lisa itself),
      #   * this gate not declared at the `pull-request` moment,
      #   * this gate declared `await`-proved rather than run.
      # An unmigrated project therefore behaves EXACTLY as it does today.
      # A declaration explicitly set `off` is the one different state: the
      # planner skips it before allocation, matching the old in-job path that
      # ran zero proving steps after allocation.
      #
      # Note what the fallback does NOT do: it never turns the job into a
      # no-op. This job's `name:` is a branch-protection context, and a
      # required context that runs zero steps reports GREEN — that is the
      # `skip_jobs` defect (see the header). Retiring a gate means dropping it
      # from the required-context list, which is derived from the same
      # declaration by `contextsFor`, so the two can never disagree.
      #
      # WHY THE EXECUTION RESOLVE STEP IS REPEATED IN EVERY GATED JOB. The
      # shared gate_plan job is only a cost hint: it can answer `off`, and its
      # dependents use `always()` plus a run-on-planner-failure condition. It
      # never supplies the runner, task or fallback decision. That distinction
      # is load-bearing: a failed `needs:` parent normally leaves dependents
      # SKIPPED, and a skipped required check counts as SATISFIED. One
      # independent execution resolution per job is what keeps each context
      # unable to be satisfied by something other than its own gate.
      # The repeated text is therefore an INVOCATION, not a reimplementation:
      # the resolver is scripts/lisa-gates.mjs and the only thing that differs
      # between copies is GATE_ID.
      # tests/integration/quality-gate-facade.test.ts asserts every block is
      # byte-identical once GATE_ID is normalised, so they cannot drift apart
      # the way two hand-maintained copies would.
      #
      # Three properties of the resolve step below are load-bearing:
      #   * Nothing discards stderr, and `pipefail` is on. A malformed
      #     .lisa.config.json fails the step loudly instead of reading as "no
      #     gate is configured" and quietly falling back to tooling the
      #     project may have deliberately replaced.
      #   * `plain()` rejects anything that is not a bare word, because
      #     .lisa.config.json is a file a pull request can edit and the
      #     resolved value reaches a shell. Flags are allowed; `$( )`,
      #     backticks, `;`, `&&` and quotes are not. It tests `typeof` FIRST:
      #     `RegExp.prototype.test` COERCES, so a bare `test(true)` examines
      #     the string "true" and passes, and `gates.runner: true` then
      #     survives the fallback too because `true` is truthy.
      #   * The runner and the task get DIFFERENT character classes, and the
      #     runner is additionally refused when it is a shell no-op. A task
      #     legitimately carries a colon (`test:cov`, `lint:staged`); a
      #     runner never does, and `:` is the shell's no-op builtin — so
      #     `"runner": ":"` was a plain string that passed a validator
      #     written to permit it. Every gate then "ran" as `: <task>` and
      #     reported success, with the `configured == 'false'` fallbacks
      #     skipped because resolution had succeeded. One key, both layers
      #     off, green and silent. Not-an-injection is not the same claim as
      #     is-a-runner, and only the first was ever being checked.
      #     `lisa-gates.mjs` refuses the same values at the source, so a bad
      #     runner is reported once rather than nineteen times; both halves
      #     are executed against the same fixtures by
      #     tests/integration/quality-gate-runner-validation.test.ts.
      - name: 🎛️ Resolve the code-style gate
        id: gate
        env:
          GATE_ID: code-style
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🦀 Verify oxlint is installed
        # FALLBACK ONLY. oxlint is REQUIRED in the Phase 2 hybrid pipeline.
        # Fail loudly if a downstream project skipped its installation; the
        # slow ESLint pass alone is no longer a complete lint and must not
        # silently substitute. A project that declared its own `code-style`
        # task has said what proves the property, so demanding oxlint of it
        # would be this workflow overriding the project's own answer.
        if: steps.gate.outputs.configured == 'false'
        run: |
          if [ ! -x "node_modules/.bin/oxlint" ]; then
            echo "::error::oxlint is required but not installed at node_modules/.bin/oxlint. Add 'oxlint' as a devDependency (Lisa governance pins it via package.lisa.json) and run '${{ inputs.package_manager }} install'."
            exit 1
          fi
          echo "oxlint $(./node_modules/.bin/oxlint --version | head -1) found."
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🧹 Run the code-style gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Run linter (oxlint + eslint)
        # FALLBACK. The `lint` npm script in package.lisa.json is forced to
        # "oxlint && eslint . --quiet" by Lisa governance, so this single
        # step runs both linters in sequence. Per-project script semantics
        # (e.g. Lisa itself uses --disable-nested-config) are preserved.
        if: steps.gate.outputs.configured == 'false'
        run: ${{ inputs.package_manager }} run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

  lint_slow:
    permissions:
      contents: read
    name: 🐢 Slow Lint Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate_plan]
    if: ${{ always() && !cancelled() && !contains(format(',{0},', inputs.skip_jobs), ',lint_slow,') && (needs.gate_plan.result != 'success' || !contains(needs.gate_plan.outputs.plan, '"lint_slow":"skip"')) }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🍞 Setup Bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: 📥 Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "npm" ]; then
            npm ci
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile
          fi
        working-directory: ${{ inputs.working_directory || '.' }}

      # Gate façade — contract and fallback rationale documented in full on the
      # 🧹 Lint job above.
      - name: 🎛️ Resolve the code-style-slow gate
        id: gate
        env:
          GATE_ID: code-style-slow
          FALLBACK_RUNNER: ${{ inputs.package_manager }} run
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          RESOLVER=""
          for candidate in "node_modules/@codyswann/lisa/all/copy-overwrite/scripts/lisa-gates.mjs" "scripts/lisa-gates.mjs" "all/copy-overwrite/scripts/lisa-gates.mjs"; do
            if [ -f "$candidate" ]; then RESOLVER="$candidate"; break; fi
          done
          # Both are emitted BEFORE the early exit, so the report step below can
          # name its gate and reuse this resolution even on the path where no
          # resolver exists at all — which is the path most installed projects
          # are on, and the one that most needs saying out loud.
          echo "gate=$GATE_ID" >> "$GITHUB_OUTPUT"
          echo "resolver=$RESOLVER" >> "$GITHUB_OUTPUT"
          if [ -z "$RESOLVER" ]; then echo "configured=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node "$RESOLVER" list --moment="$GATE_MOMENT" --json --include-off | node -e '
          let raw = ""; process.stdin.on("data", d => { raw += d }).on("end", () => {
          const id = process.env.GATE_ID, hit = JSON.parse(raw || "[]").find(g => g.id === id);
          const level = hit && ["required", "optional", "off"].includes(hit.level) ? hit.level : "";
          if (hit && !level) { console.error(`::error::gates.${id} declares level ${JSON.stringify(hit.level)}, which is not one of "required", "optional" or "off".`); process.exit(1); }
          if (level === "off") return process.stdout.write("configured=off\nlevel=off\n");
          const task = hit && hit.mode === "run" && hit.task ? hit.task : "";
          if (!task) return process.stdout.write(`configured=false\nlevel=${level}\n`);
          const declared = (require("./.lisa.config.json").gates || {}).runner;
          const runner = declared === undefined ? process.env.FALLBACK_RUNNER : declared;
          const plain = (value, pattern) => typeof value === "string" && pattern.test(value);
          const head = typeof runner === "string" ? runner.trim().split(" ")[0] : "";
          if (!plain(task, /^[A-Za-z0-9:._@\/= -]+$/)) { console.error(`::error::gates.${id} resolves to task "${task}", which is not a plain word.`); process.exit(1); }
          if (!plain(runner, /^[A-Za-z0-9._@\/= -]+$/) || !head || [":", "true", "false", "echo", "printf"].includes(head)) { console.error(`::error::gates.runner is ${JSON.stringify(runner)}, which is not a task runner; gates.${id} would have run "${runner} ${task}". A runner must be a plain STRING, may not contain a colon, and may not be a shell no-op.`); process.exit(1); }
          process.stdout.write(`configured=true\nlevel=${level}\nrunner=${runner}\ntask=${task}\n`); });
          ' >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🚨 Report the unconfigured gate
        # REPORT ONLY — it never fails the job and never changes what runs.
        # `|| true` is what makes that true rather than merely intended: the
        # body runs under `set -euo pipefail`, and the resolver is whatever
        # copy of the registry the project happens to have installed, which
        # may predate `unconfigured` and exit non-zero on it. Without it a
        # reporter would fail a branch-protection context — a new gate
        # nobody declared, shipped to a fleet where every project reports.
        #
        # The steps below this one run a command written into this workflow,
        # and on essentially every installed project that is the DEFAULT rather
        # than the exception: nothing seeds a `gates` block into a consumer, so
        # `configured` is false and the property is proved by something the
        # settings file has no idea about. That was invisible until here.
        #
        # Deliberately not a failure. The fallback cannot be deleted and an
        # absent declaration cannot be made fatal until a declaration is
        # guaranteed to exist, because this job's `name:` is a
        # branch-protection context and a required context that runs zero steps
        # reports GREEN. Order: seed declarations, then fail closed, then the
        # fallback is unreachable. This is the step that makes the size of the
        # gap measurable per repository in the meantime.
        #
        # Uniform across every façade job by construction: the gate id and the
        # resolver both come from the resolve step's outputs, so this block is
        # byte-identical everywhere and cannot drift into naming the wrong gate.
        if: steps.gate.outputs.configured == 'false'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
          RESOLVER: ${{ steps.gate.outputs.resolver }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVER" ]; then
            echo "::warning::$GATE_ID is UNCONFIGURED at $GATE_MOMENT: this project ships no gate registry, so the built-in steps below run a command written into the workflow that nothing declared."
            exit 0
          fi
          node "$RESOLVER" unconfigured --moment="$GATE_MOMENT" --gate="$GATE_ID" --surface=quality-workflow --format=github || true
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🐢 Run the code-style-slow gate
        id: gate_run
        # NON-BLOCKING ONLY WHERE THE PROJECT DECLARED IT SO. `optional` means
        # "show me the red, do not block on it", and it used to mean the exact
        # opposite: the level was discarded at the resolve step above, both
        # levels left as `configured=true`, and an optional gate failed this
        # reusable workflow, failed the caller's `release` job, and skipped
        # every job sequenced after it. A skipped job renders like a passing
        # one, so nothing said shipping had stopped.
        #
        # An expression, never a literal `true`: this may only continue on
        # error for the level that asked to. `required` still fails, and the
        # step below reports the failure that no longer blocks — see it for
        # why continuing on error is only half the fix.
        continue-on-error: ${{ steps.gate.outputs.level == 'optional' }}
        if: steps.gate.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          GATE_RUNNER: ${{ steps.gate.outputs.runner }}
          GATE_TASK: ${{ steps.gate.outputs.task }}
        # Deliberate word split. Both values were validated above to be plain
        # words, so the runner ("npm run", "bun run", "just") and a task
        # carrying flags both reach argv without a shell metacharacter.
        run: $GATE_RUNNER $GATE_TASK
        working-directory: ${{ inputs.working_directory || '.' }}

      - name: 🟡 Report the optional gate that failed
        # OPTIONAL IS NON-BLOCKING, NOT INVISIBLE. `continue-on-error` above
        # marks the STEP successful, and on its own that trades a silent skip
        # for a silent pass — the operator loses the red they explicitly asked
        # for when they wrote `optional`. This step is the other half: an
        # annotation and a run-summary entry that this workflow writes itself,
        # so the report does not depend on how the UI chooses to render a
        # continued-on-error step.
        #
        # `outcome`, not `conclusion`. `conclusion` is the value
        # `continue-on-error` rewrote to success; reading it here would make
        # this step unreachable in exactly the case it exists to report.
        if: always() && steps.gate_run.outcome == 'failure' && steps.gate.outputs.level == 'optional'
        env:
          GATE_ID: ${{ steps.gate.outputs.gate }}
          GATE_MOMENT: ${{ inputs.moment }}
        run: |
          set -euo pipefail
          echo "::warning title=$GATE_ID failed and is optional::$GATE_ID is declared \"optional\" at $GATE_MOMENT and its task FAILED, so the property it proves does NOT hold. It did not fail this workflow and skipped nothing downstream, because that is what \"optional\" declares. Declare it \"required\" to make the failure block."
          {
            echo "### 🟡 $GATE_ID failed (optional)"
            echo
            echo "The \`$GATE_ID\` gate is declared **optional** at \`$GATE_MOMENT\`, and its task failed — the property it proves does **not** hold."
            echo
            echo "By declaration that did not fail this workflow and skipped nothing after it. Declare it \`required\` to make the failure a merge condition, or \`off\` to say on the record that this project does not govern the property here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🐢 Run slow lint rules
        # FALLBACK — unchanged behavior for a project with no `gates` block.
        if: steps.gate.outputs.configured == 'false'
        run: ${{ inputs.package_manager }} run lint:slow
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        working-directory: ${{ inputs.working_directory || '.' }}

