  # Environment facade. The TASK IS THE VERIFY, NOT THE RESET: a gate whose
  # task were `environment:reset` would converge a shared environment on every
  # pull request that declared it required. `environment:reset:verify` only
  # exercises the refusal path — it calls the reset entry point directly,
  # outside the project's own client, against a target the guard must reject,
  # and fails if that call succeeds. Safe to run anywhere, and it distinguishes
