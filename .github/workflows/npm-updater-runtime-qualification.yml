name: npm updater Rails runtime qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails_runtime:
    name: npm updater Ubuntu runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4.11'
          bundler: '2.4.10'
          bundler-cache: false
      - name: Qualify fixed tools, original hooks and four owned Rails roles
        env:
          TMPDIR: /tmp
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/lisa-rails-qualification"
          node tests/fixtures/npm-update-hosted-runtime/qualify.mjs --source "$GITHUB_WORKSPACE" --result "$RUNNER_TEMP/lisa-rails-qualification/summary.json"
      - name: Retain sanitized qualification metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-updater-rails-runtime
          path: ${{ runner.temp }}/lisa-rails-qualification/summary.json
          if-no-files-found: error
          retention-days: 7
