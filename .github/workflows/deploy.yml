# This is an example deployment workflow that demonstrates the recommended pattern:
# 1. Call the release.yml workflow to create a release
# 2. Implement your custom deployment logic
# 3. Optionally run load tests for staging deployments
#
# The release.yml workflow is kept separate from deployment to allow:
# - Different deployment strategies per project (AWS, Azure, GCP, etc.)
# - Custom deployment logic without modifying the release workflow
# - Optional load testing based on environment
# - Flexibility to deploy the same release to multiple environments

name: Release and Deploy

on:
  push:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - main
          - staging
          - dev

# Prevent concurrent runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Required permissions for creating releases and OIDC publishing
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  # Environment setup
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  # The pre-deploy gate, BEFORE the release job rather than beside it.
  #
  # `release` needs this, so a required gate that fails stops the release from
  # being cut at all — the deploy stops before releasing, which is the point. A
  # gate job that ran in parallel with the release would report red after the tag
  # and the npm publish had already happened, which is a report, not a gate.
  #
  # The moment carries the environment, so one line of config decides whether a
  # gate holds a production release, a staging one, or neither.
  pre_deploy_gates:
    name: 🚦 Pre-Deploy Gates
    uses: ./.github/workflows/gates.yml
    needs: [determine_environment]
    with:
      moment: pre-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit

  release:
    name: Release
    uses: ./.github/workflows/release.yml
    needs: [determine_environment, pre_deploy_gates]
    with:
      environment: ${{ needs.determine_environment.outputs.environment }}
      release_strategy: 'standard-version'
      require_approval: false
      require_signatures: false
      generate_sbom: true
      override_blackout: true
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit

  # Publish to npm (only on main, and only if a version was created)
  publish_npm:
    name: Publish to npm
    needs: [determine_environment, release]
    if: ${{ needs.determine_environment.outputs.environment == 'main' && !contains(github.event.head_commit.message, '[skip ci]') && needs.release.outputs.tag != '' }}
    uses: ./.github/workflows/publish-to-npm.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      release_commit: ${{ needs.release.outputs.release_commit }}
      node_version: '22.21.1'
      package_manager: 'bun'

  # The deploy-outcome guard.
  #
  # `publish_npm` is a reusable-workflow call, so it cannot carry a guard step of
  # its own the way the stack templates' deploy jobs do. This job is that guard:
  # it runs on every deploy, never skips, and so reports green or red and never
  # the third, silent state. A job that skips when the release fails is, as a
  # status check, indistinguishable from one that passed — which is how a
  # release can silently not ship while every status field says it did (#3467).
  #
  # Keep the `run:` body byte-identical to the guard in every stack template's
  # deploy workflow; a test asserts the copies have not drifted apart.
  deploy_outcome:
    name: 🚨 Deploy Outcome
    needs: [determine_environment, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 🚨 Confirm the release shipped
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.determine_environment.outputs.environment }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "${RELEASE_RESULT}" = "success" ]; then
            echo "✅ The release succeeded. Deploying to ${DEPLOY_ENVIRONMENT}."
            exit 0
          fi
          {
            echo "### 🚨 Nothing new was deployed to ${DEPLOY_ENVIRONMENT}"
            echo ""
            echo "The **Release** step did not succeed (it reported \`${RELEASE_RESULT}\`), so no"
            echo "new version reached \`${DEPLOY_ENVIRONMENT}\`. Whatever was already running"
            echo "there is untouched and still working — this change simply has not shipped."
            echo ""
            echo "**What to do next**"
            echo ""
            echo "1. Open the **Release** job in this run and read the step marked in red."
            echo "2. The most common cause is that this version number was already released from"
            echo "   another branch. The fix is to raise \`version\` in \`package.json\` above every"
            echo "   version already released, then merge again."
            echo "3. If anything here is unclear, send this run's link to whoever looks after"
            echo "   deployments. Do not merge anything else into this branch until it is fixed."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          echo "::error title=Nothing new was deployed to ${DEPLOY_ENVIRONMENT}::The release did not succeed (${RELEASE_RESULT}), so this change did not ship and the previous version is still running. Open the Release job in this run to see why, fix it, then merge again."
          exit 1

  # The post-deploy gate. It proves a property of what is now live, so it runs
  # after the publish rather than instead of it — a red here does not un-ship the
  # release, it says the shipped thing does not hold and hands the operator a
  # named gate to act on.
  #
  # `always() && !cancelled()` so that a skipped publish (every environment but
  # main) does not skip the gate with it, and a cancelled run does not report a
  # verdict about a deploy that never finished.
  post_deploy_gates:
    name: 🚦 Post-Deploy Gates
    uses: ./.github/workflows/gates.yml
    needs: [determine_environment, release, publish_npm]
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    with:
      moment: post-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit
