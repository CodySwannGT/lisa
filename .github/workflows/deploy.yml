# This is an example deployment workflow that demonstrates the recommended pattern:
# 1. Call the release.yml workflow to create a release
# 2. Implement your custom deployment logic
# 3. Optionally run load tests for staging deployments
#
# The release.yml workflow is kept separate from deployment to allow:
# - Different deployment strategies per project (AWS, Azure, GCP, etc.)
# - Custom deployment logic without modifying the release workflow
# - Optional load testing based on environment
# - Flexibility to deploy the same release to multiple environments

name: Release and Deploy

on:
  push:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - main
          - staging
          - dev

# Prevent concurrent runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Required permissions for creating releases and OIDC publishing
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  # Environment setup
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  # The pre-deploy gate, BEFORE the release job rather than beside it.
  #
  # `release` needs this, so a required gate that fails stops the release from
  # being cut at all — the deploy stops before releasing, which is the point. A
  # gate job that ran in parallel with the release would report red after the tag
  # and the npm publish had already happened, which is a report, not a gate.
  #
  # The moment carries the environment, so one line of config decides whether a
  # gate holds a production release, a staging one, or neither.
  pre_deploy_gates:
    name: 🚦 Pre-Deploy Gates
    uses: ./.github/workflows/gates.yml
    needs: [determine_environment]
    with:
      moment: pre-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit

  release:
    name: Release
    uses: ./.github/workflows/release.yml
    needs: [determine_environment, pre_deploy_gates]
    with:
      environment: ${{ needs.determine_environment.outputs.environment }}
      release_strategy: 'standard-version'
      require_approval: false
      require_signatures: false
      generate_sbom: true
      override_blackout: true
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit

  # Publish to npm (only on main, and only if a version was created)
  publish_npm:
    name: Publish to npm
    needs: [determine_environment, release]
    if: ${{ needs.determine_environment.outputs.environment == 'main' && !contains(github.event.head_commit.message, '[skip ci]') && needs.release.outputs.tag != '' }}
    uses: ./.github/workflows/publish-to-npm.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      release_commit: ${{ needs.release.outputs.release_commit }}
      node_version: '22.21.1'
      package_manager: 'bun'

  # The deploy-outcome guard.
  #
  # `publish_npm` is a reusable-workflow call, so it cannot carry a guard step of
  # its own the way the stack templates' deploy jobs do. This job is that guard:
  # it runs on every deploy, never skips, and so reports green or red and never
  # the third, silent state. A job that skips when the release fails is, as a
  # status check, indistinguishable from one that passed — which is how a
  # release can silently not ship while every status field says it did (#3467).
  #
  # Keep the `run:` body byte-identical to the guard in every stack template's
  # deploy workflow; a test asserts the copies have not drifted apart.
  deploy_outcome:
    name: 🚨 Deploy Outcome
    needs: [determine_environment, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 🚨 Confirm the release shipped
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.determine_environment.outputs.environment }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "${RELEASE_RESULT}" = "success" ]; then
            echo "✅ The release succeeded. Deploying to ${DEPLOY_ENVIRONMENT}."
            exit 0
          fi
          {
            echo "### 🚨 Nothing new was deployed to ${DEPLOY_ENVIRONMENT}"
            echo ""
            echo "The **Release** step did not succeed (it reported \`${RELEASE_RESULT}\`), so no"
            echo "new version reached \`${DEPLOY_ENVIRONMENT}\`. Whatever was already running"
            echo "there is untouched and still working — this change simply has not shipped."
            echo ""
            echo "**What to do next**"
            echo ""
            echo "1. Open the **Release** job in this run and read the step marked in red."
            echo "2. The most common cause is that this version number was already released from"
            echo "   another branch. The fix is to raise \`version\` in \`package.json\` above every"
            echo "   version already released, then merge again."
            echo "3. If anything here is unclear, send this run's link to whoever looks after"
            echo "   deployments. Do not merge anything else into this branch until it is fixed."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          echo "::error title=Nothing new was deployed to ${DEPLOY_ENVIRONMENT}::The release did not succeed (${RELEASE_RESULT}), so this change did not ship and the previous version is still running. Open the Release job in this run to see why, fix it, then merge again."
          exit 1

  # Reconcile the release artifacts against the registry when the publish did
  # not succeed (CodySwannGT/lisa#3684).
  #
  # THE ORDERING IS THE DEFECT. The GitHub Release, the tag and the provenance
  # statement are all produced by the `release` job, which by construction
  # finishes before `publish_npm` starts. So all three are cut on the
  # EXPECTATION of a publish, never on evidence of one. Measured: v4.33.7 was
  # released at 21:35:32 and its publish failed at 21:38:28 with an E401 from
  # npm's OIDC exchange. Three artifacts asserted the release had happened; the
  # registry, the only one a consumer installs from, disagreed, and still did a
  # day later.
  #
  # Moving the publish inside the release job would fix the ordering at the
  # root. This does the other half the ticket allows — reconcile afterwards —
  # because an artifact asserting a release exists must not outlive the failure
  # of the thing it asserts.
  #
  # WHY IT RE-ASKS THE REGISTRY RATHER THAN TRUSTING THE JOB RESULT. A failed
  # publish job does not prove the version is absent: the failure may be the
  # verification step itself, after a publish that landed. Retracting a GitHub
  # Release for a version that IS installable would be a false accusation, so
  # this acts only on a proven `missing` and merely reports an `unprovable`.
  # The check reports those as different words precisely so this job can tell
  # them apart.
  #
  # WHY `cancelled` COUNTS AS A FAILURE HERE. The incident's re-run was
  # cancelled by the next release under this workflow's concurrency group, so
  # that run's final conclusion reads `cancelled` — neither success nor failure,
  # and the first thing a human or an automation reads. A cancelled publish is a
  # publish that did not happen. The issue this job files names the version and
  # outlives the run whose label lost the truth.
  reconcile_release:
    name: Reconcile release against the registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [determine_environment, release, publish_npm]
    if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.tag != '' && (needs.publish_npm.result == 'failure' || needs.publish_npm.result == 'cancelled') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '22.21.1'

      - name: Ask the registry whether the version landed
        id: landed
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          echo "package=$package_name" >> "$GITHUB_OUTPUT"
          set +e
          node scripts/check-npm-publish-landed.mjs \
            --package "$package_name" \
            --version "$VERSION" \
            --attempts 3 > "$RUNNER_TEMP/verdict.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/verdict.txt"
          verdict="$(sed -n 's/^npm-publish-landed: \([a-z]*\) .*/\1/p' "$RUNNER_TEMP/verdict.txt" | head -n 1)"
          if [ -z "$verdict" ]; then
            echo "::error::The publish check printed no verdict line, so nothing was proved here either."
            exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Retract the GitHub Release that asserts a shipped version
        if: steps.landed.outputs.verdict == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release for $TAG; nothing to retract."
            exit 0
          fi
          gh release edit "$TAG" --draft
          echo "Converted the GitHub Release for $TAG to a draft: the registry has no such version."

      - name: File the skipped version so it outlives this run
        uses: actions/github-script@v8
        env:
          PACKAGE: ${{ steps.landed.outputs.package }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          VERDICT: ${{ steps.landed.outputs.verdict }}
          PUBLISH_RESULT: ${{ needs.publish_npm.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { PACKAGE, VERSION, TAG, VERDICT, PUBLISH_RESULT } = process.env;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `Release ${TAG} did not reach npm`;
            const body = [
              `The publish job for \`${TAG}\` finished as **${PUBLISH_RESULT}**, and the`,
              `registry check returned **${VERDICT}** for \`${PACKAGE}@${VERSION}\`.`,
              ``,
              `A failed or cancelled publish leaves a tag — and possibly a GitHub Release`,
              `and a provenance statement — asserting a version consumers cannot install.`,
              `The version counter then moves on, which is what makes the hole invisible`,
              `in every downstream view: a changelog reads as a continuous sequence and`,
              `a package page lists a continuous run of versions. Only an`,
              `exact-version registry request ever shows the hole.`,
              ``,
              `- Run: ${runUrl}`,
              `- Exact-version endpoint: https://registry.npmjs.org/${PACKAGE}/${VERSION}`,
              ``,
              `To close this: re-run the publish job for \`${TAG}\`, then confirm the`,
              `endpoint above returns 200. Do not confirm against \`dist-tags.latest\` —`,
              `it lags a successful publish and answers about a different version.`,
            ].join("\n");
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
            });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Filed issue #${created.data.number}`);
            }

      - name: Refuse to end green
        env:
          PACKAGE: ${{ steps.landed.outputs.package }}
          VERSION: ${{ needs.release.outputs.version }}
          VERDICT: ${{ steps.landed.outputs.verdict }}
        run: |
          echo "::error::$PACKAGE@$VERSION was tagged and released, but the registry says $VERDICT."
          exit 1

  # The post-deploy gate. It proves a property of what is now live, so it runs
  # after the publish rather than instead of it — a red here does not un-ship the
  # release, it says the shipped thing does not hold and hands the operator a
  # named gate to act on.
  #
  # `always() && !cancelled()` so that a skipped publish (every environment but
  # main) does not skip the gate with it, and a cancelled run does not report a
  # verdict about a deploy that never finished.
  post_deploy_gates:
    name: 🚦 Post-Deploy Gates
    uses: ./.github/workflows/gates.yml
    needs: [determine_environment, release, publish_npm]
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    with:
      moment: post-deploy:${{ needs.determine_environment.outputs.environment }}
      node_version: '22.21.1'
      package_manager: 'bun'
    secrets: inherit
