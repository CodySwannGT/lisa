# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: K6 Load Testing

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so load-test.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
      environment:
        description: 'Target environment to test'
        required: true
        type: string
      test_scenario:
        description: 'Test scenario to run (smoke, load, stress, spike, soak)'
        required: false
        type: string
        default: 'smoke'
      base_url:
        description: 'Base URL of the application to test'
        required: true
        type: string
      k6_version:
        description: 'k6 version to use'
        required: false
        type: string
        default: 'latest'
      test_duration:
        description: 'Override test duration (e.g., 5m, 1h)'
        required: false
        type: string
      virtual_users:
        description: >-
          Override number of virtual users. Leave it out (or pass 0) to keep the
          script's own `vus`. GitHub renders an omitted `number` input as 0, and
          k6 refuses K6_VUS=0 with a configuration error, so only a whole number
          above 0 is ever exported (CodySwannGT/lisa#4526).
        required: false
        type: number
        default: 0
      thresholds_config:
        description: 'Path to custom thresholds configuration'
        required: false
        type: string
      test_script:
        description: >-
          Path to custom k6 test script. Left at its default, the run uses
          ./scripts/k6-run.sh when the repository provides one (it must be
          executable, and must exit with k6's own status), else `k6 run` on
          .github/k6/scenarios/<test_scenario>.js, and fails when neither
          exists. A path that does not exist fails the run.
        required: false
        type: string
        default: '.github/k6/scripts/default-test.js'
      fail_on_threshold:
        description: >-
          Fail workflow if thresholds are not met (k6 exit 99). It suppresses
          ONLY a threshold breach: a missing runner or script, a script error,
          a configuration error or any other nonzero exit always fails the job,
          because no threshold was evaluated (CodySwannGT/lisa#4526).
        required: false
        type: boolean
        default: true
      upload_results:
        description: 'Upload test results as artifacts'
        required: false
        type: boolean
        default: true
      cloud_run:
        description: >-
          Run tests on k6 Cloud (requires K6_CLOUD_TOKEN secret). Uses
          `k6 cloud run <script>`, which needs a k6 that has the `cloud run`
          subcommand: the default `k6_version: latest` does.
        required: false
        type: boolean
        default: false
    outputs:
      test_passed:
        description: 'Whether the test passed all thresholds'
        value: ${{ jobs.k6_test.outputs.passed }}
      exit_code:
        description: >-
          Exit status of the test run: 0 passed, 99 thresholds breached, any
          other value means the test could not run or k6 errored.
        value: ${{ jobs.k6_test.outputs.exit_code }}
      results_url:
        description: 'URL to test results (if uploaded)'
        value: ${{ jobs.k6_test.outputs.results_url }}
      summary:
        description: 'Test execution summary'
        value: ${{ jobs.k6_test.outputs.summary }}
    secrets:
      K6_CLOUD_TOKEN:
        required: false
        description: 'k6 Cloud API token for cloud runs'
      CUSTOM_HEADERS:
        required: false
        description: 'Custom headers for authenticated endpoints (JSON format)'

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: load-test.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  k6_test:
    name: K6 Load Test - ${{ inputs.test_scenario }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.run_test.outputs.passed }}
      exit_code: ${{ steps.run_test.outputs.exit_code }}
      results_url: ${{ steps.upload_results.outputs.artifact-url }}
      summary: ${{ steps.generate_summary.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up k6
        run: |
          if [ "${{ inputs.k6_version }}" = "latest" ]; then
            sudo gpg -k
            sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update
            sudo apt-get install k6
          else
            K6_VERSION="${{ inputs.k6_version }}"
            wget "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
            tar -xzf "k6-v${K6_VERSION}-linux-amd64.tar.gz"
            sudo mv "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/
          fi
          k6 version

      - name: Prepare test environment
        id: prepare_test
        # Inputs reach the script through `env:`, never as `${{ }}` source text,
        # so a value carrying shell syntax stays a value.
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_SCENARIO: ${{ inputs.test_scenario }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TEST_DURATION: ${{ inputs.test_duration }}
          VIRTUAL_USERS: ${{ inputs.virtual_users }}
          CUSTOM_HEADERS: ${{ secrets.CUSTOM_HEADERS }}
          CLOUD_RUN: ${{ inputs.cloud_run }}
          CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        run: |
          # Create results directory
          mkdir -p k6-results

          # Export environment variables for k6
          {
            echo "K6_BASE_URL=${BASE_URL}"
            echo "K6_SCENARIO=${TEST_SCENARIO}"
            echo "K6_ENVIRONMENT=${TARGET_ENVIRONMENT}"
          } >> "$GITHUB_ENV"

          # Set custom duration if provided
          if [ -n "${TEST_DURATION}" ]; then
            echo "K6_DURATION=${TEST_DURATION}" >> "$GITHUB_ENV"
          fi

          # Set custom VUs only for a whole number above 0. An omitted
          # `virtual_users` renders as 0, and exporting K6_VUS=0 overrides the
          # script's own `vus` with a value k6 refuses (exit 104) before
          # running anything (CodySwannGT/lisa#4526). The Run step reads K6_VUS
          # back from here, so this is the one place the rule lives.
          # 0 and empty mean "not overridden" and stay silent; anything else
          # that is not a whole number above 0 is named, so a typo is not
          # quietly ignored.
          case "${VIRTUAL_USERS}" in
            '') ;;
            *[!0-9]*)
              echo "::warning title=virtual_users ignored::virtual_users '${VIRTUAL_USERS}' is not a whole number above 0, so it was ignored and the script's own vus applies."
              ;;
            *)
              if [ "${VIRTUAL_USERS}" -gt 0 ]; then
                echo "K6_VUS=${VIRTUAL_USERS}" >> "$GITHUB_ENV"
              fi
              ;;
          esac

          # Set custom headers if provided
          if [ -n "${CUSTOM_HEADERS}" ]; then
            echo "K6_CUSTOM_HEADERS=${CUSTOM_HEADERS}" >> "$GITHUB_ENV"
          fi

          # Set cloud token if cloud run is enabled
          if [ "${CLOUD_RUN}" = "true" ] && [ -n "${CLOUD_TOKEN}" ]; then
            echo "K6_CLOUD_TOKEN=${CLOUD_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Run k6 test
        id: run_test
        env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_SCENARIO: ${{ inputs.test_scenario }}
          TEST_SCRIPT: ${{ inputs.test_script }}
          THRESHOLDS_CONFIG: ${{ inputs.thresholds_config }}
          FAIL_ON_THRESHOLD: ${{ inputs.fail_on_threshold }}
          CLOUD_RUN: ${{ inputs.cloud_run }}
        run: |
          # The status is captured and classified below rather than left to
          # `bash -e`. Only a threshold breach (k6 exit 99) may be suppressed by
          # fail_on_threshold: false. Every other nonzero status — a missing
          # runner or script (127/126), a script error (107), a configuration
          # error (104), an abort — means no threshold was evaluated, so the
          # step fails whatever fail_on_threshold says. Before
          # CodySwannGT/lisa#4526 all of them were reported green as "failed
          # thresholds".
          set +e

          DEFAULT_TEST_SCRIPT=".github/k6/scripts/default-test.js"
          RUNNER="./scripts/k6-run.sh"

          # Fail a run that never started. It ignores fail_on_threshold:
          # nothing was measured, so there is no threshold result to suppress.
          could_not_run() {
            echo "::error title=k6 test did not run::$2"
            {
              echo "exit_code=$1"
              echo "passed=false"
              echo "outcome=error"
            } >> "$GITHUB_OUTPUT"
            echo "❌ k6 test did not run (exit code $1): $2" >> "$GITHUB_STEP_SUMMARY"
            exit "$1"
          }

          if [ -n "${THRESHOLDS_CONFIG}" ] && [ ! -f "${THRESHOLDS_CONFIG}" ]; then
            could_not_run 1 "thresholds_config '${THRESHOLDS_CONFIG}' not found: fix the thresholds_config path or add the file"
          fi

          SCRIPT=""
          USED_RUNNER=false
          if [ "${TEST_SCRIPT}" = "${DEFAULT_TEST_SCRIPT}" ] && [ -e "${RUNNER}" ]; then
            # A runner that is present but cannot execute is a mistake in the
            # repository, not a reason to quietly run something else instead.
            if [ ! -f "${RUNNER}" ] || [ ! -x "${RUNNER}" ]; then
              could_not_run 126 "k6 runner ${RUNNER} exists but is not an executable file: run 'chmod +x ${RUNNER}' and commit it, or pass test_script"
            fi
            # The repository provides its own runner: use it for standard
            # scenarios. No --no-thresholds: fail_on_threshold is applied to
            # exit 99 below, so a breach is still REPORTED when it may not fail.
            USED_RUNNER=true
            CMD=("${RUNNER}" --scenario "${TEST_SCENARIO}" --url "${BASE_URL}" --json --csv)
            if [ "${CLOUD_RUN}" = "true" ]; then CMD+=(--cloud); fi
            if [ -n "${K6_DURATION:-}" ]; then CMD+=(--duration "${K6_DURATION}"); fi
            if [ -n "${K6_VUS:-}" ]; then CMD+=(--vus "${K6_VUS}"); fi
            if [ -n "${THRESHOLDS_CONFIG}" ]; then
              echo "::warning title=thresholds_config not applied::${RUNNER} is not passed thresholds_config '${THRESHOLDS_CONFIG}'; a custom runner must load it itself, or pass test_script to run k6 directly."
            fi
          else
            if [ "${TEST_SCRIPT}" = "${DEFAULT_TEST_SCRIPT}" ]; then
              # Lisa does not ship the runner, so a repository without one runs
              # the scenario file for test_scenario directly.
              case "${TEST_SCENARIO}" in
                '' | *[!A-Za-z0-9_-]*)
                  could_not_run 1 "test_scenario '${TEST_SCENARIO}' is not a plain scenario name (letters, digits, '-' and '_' only)"
                  ;;
              esac
              SCRIPT=".github/k6/scenarios/${TEST_SCENARIO}.js"
              if [ ! -f "${SCRIPT}" ]; then
                could_not_run 1 "k6 runner ${RUNNER} not found, and there is no scenario file ${SCRIPT} to run instead: provide ${RUNNER}, add ${SCRIPT}, or pass test_script"
              fi
            else
              SCRIPT="${TEST_SCRIPT}"
              if [ ! -f "${SCRIPT}" ]; then
                could_not_run 1 "k6 test script '${SCRIPT}' not found: fix the test_script path or add the file"
              fi
            fi

            # A cloud run is `k6 cloud run <script>`; `k6 run` has no --cloud
            # flag and refuses it as unknown. Results stay in k6 Cloud, so the
            # local --out files are only written for a local run.
            if [ "${CLOUD_RUN}" = "true" ]; then
              CMD=(k6 cloud run)
            else
              CMD=(k6 run --out json=k6-results/results.json --out csv=k6-results/results.csv)
            fi
            if [ -n "${THRESHOLDS_CONFIG}" ]; then CMD+=(--config "${THRESHOLDS_CONFIG}"); fi
            CMD+=("${SCRIPT}")
          fi

          # K6_DURATION and K6_VUS override the script's own options, so say
          # what this run will actually do before doing it.
          echo "Effective k6 run:"
          echo "  command:  ${CMD[*]}"
          echo "  script:   ${SCRIPT:-chosen by ${RUNNER} for scenario ${TEST_SCENARIO}}"
          echo "  VUs:      ${K6_VUS:-script default}"
          echo "  duration: ${K6_DURATION:-script default}"

          "${CMD[@]}"
          TEST_EXIT_CODE=$?

          echo "exit_code=${TEST_EXIT_CODE}" >> "$GITHUB_OUTPUT"

          case "${TEST_EXIT_CODE}" in
            0)
              echo "passed=true" >> "$GITHUB_OUTPUT"
              echo "outcome=passed" >> "$GITHUB_OUTPUT"
              echo "✅ Test passed all thresholds" >> "$GITHUB_STEP_SUMMARY"
              ;;
            99)
              echo "passed=false" >> "$GITHUB_OUTPUT"
              echo "outcome=thresholds_failed" >> "$GITHUB_OUTPUT"
              echo "❌ Test failed thresholds (k6 exit code 99)" >> "$GITHUB_STEP_SUMMARY"
              if [ "${FAIL_ON_THRESHOLD}" = "true" ]; then
                echo "::error title=k6 thresholds failed::The test ran and breached its thresholds (k6 exit code 99)."
                exit 99
              fi
              echo "::warning title=k6 thresholds failed::The test ran and breached its thresholds (k6 exit code 99); fail_on_threshold is false, so the job continues."
              ;;
            *)
              echo "passed=false" >> "$GITHUB_OUTPUT"
              echo "outcome=error" >> "$GITHUB_OUTPUT"
              echo "❌ k6 could not run the test or errored (exit code ${TEST_EXIT_CODE}): no threshold was evaluated, so fail_on_threshold does not apply" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=k6 test did not complete::k6 exited ${TEST_EXIT_CODE}, which is not a threshold result (that is 99). The test could not run or errored; see the log above."
              if [ "${USED_RUNNER}" = "true" ]; then
                RUNNER_NOTE="${RUNNER} exited ${TEST_EXIT_CODE}. A custom runner must exit with k6's own status (99 for a threshold breach) for fail_on_threshold to apply."
                echo "::error title=k6 runner exit status::${RUNNER_NOTE}"
                echo "${RUNNER_NOTE}" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit "${TEST_EXIT_CODE}"
              ;;
          esac

      - name: Generate test summary
        id: generate_summary
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TEST_SCENARIO: ${{ inputs.test_scenario }}
          BASE_URL: ${{ inputs.base_url }}
          RUN_OUTCOME: ${{ steps.run_test.outputs.outcome }}
          RUN_EXIT_CODE: ${{ steps.run_test.outputs.exit_code }}
        run: |
          # The status names the real cause: a threshold breach and a test that
          # never ran are different failures (CodySwannGT/lisa#4526).
          case "${RUN_OUTCOME}" in
            passed) STATUS="✅ PASSED" ;;
            thresholds_failed) STATUS="❌ FAILED — thresholds breached (k6 exit code 99)" ;;
            error) STATUS="❌ ERROR — the test did not run to completion (exit code ${RUN_EXIT_CODE}); no threshold was evaluated" ;;
            *) STATUS="❌ NOT RUN — the k6 step produced no result" ;;
          esac

          SUMMARY=$(printf '# K6 Load Test Results\n\n**Environment:** %s\n**Test Scenario:** %s\n**Base URL:** %s\n**Test Status:** %s\n' \
            "${TARGET_ENVIRONMENT}" "${TEST_SCENARIO}" "${BASE_URL}" "${STATUS}")

          # Add summary to GitHub Step Summary
          printf '%s\n' "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"

          # Point at detailed metrics if a local run wrote them
          if [ -f "k6-results/results.json" ]; then
            printf '\n## Key Metrics\n\n📊 Detailed metrics available in artifacts\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Output summary for workflow output
          {
            echo "summary<<EOF"
            printf '%s\n' "${SUMMARY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test results
        id: upload_results
        if: always() && inputs.upload_results
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-${{ inputs.environment }}-${{ inputs.test_scenario }}-${{ github.run_id }}
          path: k6-results/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `${{ steps.generate_summary.outputs.summary }}`;
            const resultsUrl = '${{ steps.upload_results.outputs.artifact-url }}';

            let comment = summary;
            if (resultsUrl) {
              comment += `\n\n[📊 View detailed results](${resultsUrl})`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
