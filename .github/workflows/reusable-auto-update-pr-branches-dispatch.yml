# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.

name: Auto-update PR branches - Dispatch Handler (Reusable)

on:
  workflow_call:
    inputs:
      action:
        description: 'The dispatch action type (auto-update-pr-branches or auto-update-pr-branch)'
        required: true
        type: string
      ref_name:
        description: 'The branch name that was pushed to'
        required: false
        type: string
        default: ''
      repo_full_name:
        description: 'Full repository name (owner/repo)'
        required: true
        type: string
      pr_number:
        description: 'The pull request number (for single PR updates)'
        required: false
        type: number
        default: 0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for authenticating the action'
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check_claude_setup:
    name: 🔑 Check Claude Setup
    runs-on: ubuntu-latest
    outputs:
      has_claude_token: ${{ steps.check.outputs.has_claude_token }}
    steps:
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "has_claude_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_claude_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set - Claude automation will be skipped. Provision the secret to enable it."
          fi

  # One job serves both dispatch actions. They differ only in WHICH pull
  # requests are in scope — a list discovered from the pushed branch, or a
  # single number — which is a variable, not a second job. Splitting them
  # duplicated the body, and the copy drifted: the single-PR job referenced
  # `steps.plugins.outputs.*` while having no `plugins` step, so both values
  # resolved to empty string on every single-PR run and nothing said so
  # (CodySwannGT/lisa#3512).
  update-pr-branches:
    needs: [check_claude_setup]
    # Double-quoted deliberately. Unquoted, the ` #` in `Update PR #{0}` opens a
    # YAML comment, which truncates the scalar to `${{ ... format('Update PR` —
    # still VALID YAML, so every parser-based check passes, but an unterminated
    # Actions expression, so the workflow fails to LOAD. The run then has zero
    # jobs and its name degrades to its path (CodySwannGT/lisa#3512).
    name: "${{ inputs.action == 'auto-update-pr-branch' && format('Update PR #{0}', inputs.pr_number) || format('Update open PRs targeting {0}', inputs.ref_name) }}"
    if: |
      needs.check_claude_setup.outputs.has_claude_token == 'true' &&
      (inputs.action == 'auto-update-pr-branches' || inputs.action == 'auto-update-pr-branch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `update-branch` merges on GitHub's servers, which never run a local
      # merge driver — that path stays uncovered by design. This registers the
      # driver for the fallback case where the server merge conflicts and the
      # agent resolves it locally in this clone (CodySwannGT/lisa#1995).
      - name: Register the learnings union merge driver
        continue-on-error: true
        run: |
          if npx --no-install lisa install-merge-driver .; then
            exit 0
          fi
          echo "::warning title=Learnings merge driver not registered::Could not register the union merge driver. If the server-side branch update conflicts and this run resolves it locally, the learnings ledger falls back to git's line merge, which produces conflict markers instead of a union by entry id (CodySwannGT/lisa#1995)."

      # The update loop is a script, not a prompt. Nothing in it needs
      # judgement — it is a list, a loop, and an idempotent API call — and as an
      # LLM prompt under `--max-turns 3` it had a deterministic ceiling on how
      # many PRs it could process, plus no guarantee it processed any of them
      # (CodySwannGT/lisa#3512).
      - name: Discover pull requests in scope
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo_full_name }}
          BASE: ${{ inputs.ref_name }}
          SINGLE_PR: ${{ inputs.pr_number }}
          ACTION: ${{ inputs.action }}
        run: |
          set -uo pipefail

          # Each row: <number> TAB <base ref> TAB <head label>.
          # The head label carries the owner so a fork PR compares against the
          # right repository rather than silently against this one.
          JQ='.[] | select(.head.repo != null)
              | [ (.number|tostring), .base.ref,
                  (.head.repo.owner.login + ":" + .head.ref) ]
              | @tsv'

          if [ "$ACTION" = "auto-update-pr-branch" ]; then
            gh api "repos/${REPO}/pulls/${SINGLE_PR}" \
              --jq '[ (.number|tostring), .base.ref,
                      (.head.repo.owner.login + ":" + .head.ref) ] | @tsv' \
              > "${RUNNER_TEMP}/targets.tsv" 2>/dev/null || : > "${RUNNER_TEMP}/targets.tsv"
          else
            # `--paginate` on the REST endpoint, not `gh pr list`, whose JSON
            # mode silently caps at 30 results when no `--limit` is given. A
            # repo with more than 30 open PRs on one base had the tail dropped
            # before any loop ran.
            gh api --paginate "repos/${REPO}/pulls?state=open&base=${BASE}&per_page=100" \
              --jq "$JQ" > "${RUNNER_TEMP}/targets.tsv" 2>/dev/null || : > "${RUNNER_TEMP}/targets.tsv"
          fi

          COUNT=$(grep -c . "${RUNNER_TEMP}/targets.tsv" || true)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "::notice title=PRs in scope::${COUNT} open pull request(s) to consider."

      - name: Update PR branches
        id: update
        if: steps.discover.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo_full_name }}
        run: |
          set -uo pipefail

          # Number of commits the head is behind its base. Empty (not 0) when
          # the comparison itself fails, so "could not measure" can never be
          # mistaken for "up to date".
          behind_by() {
            gh api "repos/${REPO}/compare/$1...$2" --jq '.behind_by' 2>/dev/null
          }

          : > "${RUNNER_TEMP}/conflicted.txt"

          while IFS=$'\t' read -r pr base head; do
            [ -n "${pr:-}" ] || continue

            before=$(behind_by "$base" "$head")
            if [ "${before:-}" = "0" ]; then
              echo "PR #${pr}: already current."
              continue
            fi

            echo "PR #${pr}: behind by ${before:-unknown}; requesting update-branch."
            if err=$(gh api -X PUT "repos/${REPO}/pulls/${pr}/update-branch" \
                       -f update_method=merge 2>&1); then
              echo "PR #${pr}: update accepted."
            else
              # A conflict is a real, distinct outcome that no retry fixes —
              # it is the case the local merge driver exists for. Everything
              # else is a failure and is reported as one. The replaced code
              # collapsed both, and "already up to date", into one echo.
              if printf '%s' "$err" | grep -qiE 'conflict|merge'; then
                echo "PR #${pr}: server-side update conflicts; queued for local resolution."
                echo "$pr" >> "${RUNNER_TEMP}/conflicted.txt"
              else
                echo "::warning title=Update request failed::PR #${pr}: $(printf '%s' "$err" | head -c 300)"
              fi
            fi
          done < "${RUNNER_TEMP}/targets.tsv"

          CONFLICTED=$(paste -sd, "${RUNNER_TEMP}/conflicted.txt" 2>/dev/null || true)
          echo "conflicted=${CONFLICTED}" >> "$GITHUB_OUTPUT"

      - name: Read plugins from project settings
        id: plugins
        if: steps.update.outputs.conflicted != ''
        run: |
          if [ -f .claude/settings.json ]; then
            MARKETPLACES=$(jq -r '(.extraKnownMarketplaces // {}) | to_entries[] | .value.source | if .source == "github" then "https://github.com/\(.repo).git" else empty end' .claude/settings.json 2>/dev/null || echo "")
            MARKETPLACE_NAMES=$(jq -r '(.extraKnownMarketplaces // {}) | to_entries[] | .value.source.repo // .key | split("/") | last' .claude/settings.json 2>/dev/null || echo "")
            PLUGINS=$(jq -r '(.enabledPlugins // {}) | to_entries[] | select(.value == true) | .key' .claude/settings.json 2>/dev/null | while IFS= read -r plugin; do
              mk="${plugin##*@}"
              if echo "$MARKETPLACE_NAMES" | grep -qx "$mk"; then
                echo "$plugin"
              fi
            done)
          else
            MARKETPLACES=""
            PLUGINS=""
          fi
          {
            echo "marketplaces<<PLUGINS_EOF"
            echo "$MARKETPLACES"
            echo "PLUGINS_EOF"
            echo "plugins<<PLUGINS_EOF"
            echo "$PLUGINS"
            echo "PLUGINS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The agent survives for the one case that genuinely needs judgement: the
      # server-side merge conflicted, so the merge has to happen in this clone
      # where the union merge driver is registered. It is no longer on the
      # common path, and its result is not trusted — the verification step
      # below measures the outcome either way.
      - name: Resolve conflicting updates locally
        if: steps.update.outputs.conflicted != ''
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions'
          prompt: |
            The server-side branch update failed with a merge conflict for these
            pull requests in "${{ inputs.repo_full_name }}": ${{ steps.update.outputs.conflicted }}

            For each one, check out the PR branch in this clone, merge its base
            branch into it resolving conflicts, and push. The union merge driver
            for the learnings ledger is already registered in this clone, so let
            git handle that file rather than resolving it by hand.

            Leave any PR whose conflict you cannot resolve correctly untouched
            and say which. Do not force-push and do not close any PR.
          claude_args: |
            --allowedTools "Bash(*)"

      # The gate. It measures `behind_by` on every PR in scope AFTER the fact,
      # so it is independent of whether any step above exited 0 — which is the
      # whole point: the replaced implementation reported success having updated
      # 3 of 4 PRs. Deliberately carries no `continue-on-error`.
      - name: Verify branch freshness
        if: always() && steps.discover.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo_full_name }}
        run: |
          set -uo pipefail

          # `update-branch` is asynchronous — it returns 202 and merges after.
          # Measuring once, immediately, would race it. Poll to convergence and
          # only then call a PR behind. `VERIFY_TIMEOUT` exists so the tests can
          # drive the non-converging case without waiting out the real budget.
          DEADLINE=$(( $(date +%s) + ${VERIFY_TIMEOUT:-180} ))

          behind_by() {
            gh api "repos/${REPO}/compare/$1...$2" --jq '.behind_by' 2>/dev/null
          }

          # Deliberately no bash arrays and no `mapfile`: this script also runs
          # on macOS runners, whose system bash is 3.2, where `mapfile` does not
          # exist and empty-array expansion under `set -u` is an error.
          fresh=""; stale=""; conflicted=""; unmeasured=""
          n_fresh=0; n_stale=0; n_conflicted=0; n_unmeasured=0

          is_conflicted() {
            [ -s "${RUNNER_TEMP}/conflicted.txt" ] || return 1
            grep -qxF "$1" "${RUNNER_TEMP}/conflicted.txt"
          }

          while IFS=$'\t' read -r pr base head; do
            [ -n "${pr:-}" ] || continue

            b=$(behind_by "$base" "$head")
            while [ "${b:-}" != "0" ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
              sleep 5
              b=$(behind_by "$base" "$head")
            done

            if [ "${b:-}" = "0" ]; then
              fresh="${fresh} #${pr}"; n_fresh=$((n_fresh + 1))
            elif [ -z "${b:-}" ]; then
              unmeasured="${unmeasured} #${pr}"; n_unmeasured=$((n_unmeasured + 1))
            elif is_conflicted "$pr"; then
              conflicted="${conflicted} #${pr} (behind ${b})"; n_conflicted=$((n_conflicted + 1))
            else
              stale="${stale} #${pr} (behind ${b})"; n_stale=$((n_stale + 1))
            fi
          done < "${RUNNER_TEMP}/targets.tsv"

          {
            echo "### Auto-update PR branches"
            echo
            echo "| outcome | count | pull requests |"
            echo "| --- | --- | --- |"
            echo "| up to date | ${n_fresh} | ${fresh:-—} |"
            echo "| still behind | ${n_stale} | ${stale:-—} |"
            echo "| conflicted | ${n_conflicted} | ${conflicted:-—} |"
            echo "| not measurable | ${n_unmeasured} | ${unmeasured:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A conflict is reported, not failed: it is a real state that needs a
          # human or a follow-up, and failing the handler on it would make the
          # signal useless on repos where one PR is durably conflicted.
          if [ "$n_conflicted" -gt 0 ]; then
            echo "::warning title=PRs left conflicted::${conflicted} — the server-side update conflicts and local resolution did not clear it."
          fi

          rc=0
          if [ "$n_unmeasured" -gt 0 ]; then
            echo "::error title=Branch freshness not measurable::Could not compare ${unmeasured} against their base. Treating as a failure rather than a pass, because an unmeasurable branch is exactly the case that used to read as success."
            rc=1
          fi
          if [ "$n_stale" -gt 0 ]; then
            echo "::error title=PRs still behind after auto-update::${stale} — the update was requested and did not take effect. This is the failure that previously reported success (CodySwannGT/lisa#3512)."
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::notice title=All PR branches current::${n_fresh} pull request(s) verified up to date with their base."
          fi
          exit "$rc"
