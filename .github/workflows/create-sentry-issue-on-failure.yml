# This file is managed by Lisa.
# Do not edit directly — changes will be overwritten on the next `lisa` run.
# -----------------------------------------------------------------------------
# Sentry Issue Creation Workflow (DEPRECATED)
# -----------------------------------------------------------------------------
# ⚠️ DEPRECATED: Sentry is no longer a dispatch destination for CI failures.
# CI failures are work items for the tracker declared in .lisa.config.json
# (jira | github | linear) — see create-issue-on-failure.yml. Sentry is
# observability for runtime errors; filing synthetic CI-failure events there
# pollutes release health and exits the Lisa work-item lifecycle entirely.
# This file is kept only so legacy callers that reference it directly by path
# do not hard-fail at run startup. Do not add new callers.
# -----------------------------------------------------------------------------
# ⚠️ WARNING: THIS FILE IS AUTO-GENERATED. DO NOT EDIT MANUALLY! ⚠️
# Any changes may be overwritten by the generation process.
# This workflow creates a Sentry issue when another workflow fails.
# It captures details about the failure and creates a standardized issue
# to help track and resolve CI/CD problems in Sentry.
#
# Example usage in another workflow:
# ```yaml
# create_sentry_issue_on_failure:
#   if: failure()
#   uses: ./.github/workflows/create-sentry-issue-on-failure.yml
#   with:
#     workflow_name: 'My Workflow'
#     failed_job: 'build_and_test'
#     SENTRY_ORG: ${{ vars.SENTRY_ORG }}
#     SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
#   secrets:
#     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
# ```

name: 🔴 Sentry Issue on Workflow Failure

on:
  workflow_call:
    inputs:
      expected_workflow_contract_major:
        description: >-
          The contract major of THIS workflow the caller was written against.
          Consumers track `@main`, so create-sentry-issue-on-failure.yml changes under them with no pull
          request in their repository; comparing this value against the major
          the workflow declares is the only way a run can tell a compatible
          change from a breaking one — or from nothing having been looked at.
          A caller that omits it is told so loudly and never quietly passed.
          Seeded beside the `uses:` line in every Lisa caller template and
          enforced by Lisa's `check-workflow-contract-assertions.mjs` gate.
        required: false
        default: ''
        type: string
      workflow_name:
        required: true
        type: string
        description: 'Name of the workflow that failed'
      tracking_action:
        required: false
        type: string
        default: ''
        description: 'Combined tracker action: create, refresh, or close'
      tracking_marker:
        required: false
        type: string
        default: ''
        description: 'Stable combined tracker ownership marker'
      tracking_title:
        required: false
        type: string
        default: ''
        description: 'Combined tracker title'
      tracking_body:
        required: false
        type: string
        default: ''
        description: 'Combined tracker body'
      tracking_id:
        required: false
        type: string
        default: ''
        description: 'Provider identity when already known'
      tracking_findings:
        required: false
        type: string
        default: '[]'
        description: 'Exact combined nightly suite findings'
      failed_job:
        required: false
        type: string
        description: 'Name of the job that failed (optional)'
      SENTRY_ORG:
        required: true
        type: string
        description: 'Sentry organization slug (e.g., your-company)'
      SENTRY_PROJECT:
        required: true
        type: string
        description: 'Sentry project slug (e.g., serverless-knowledge-platform)'
      environment:
        required: false
        type: string
        default: 'production'
        description: 'Environment where the failure occurred'
      level:
        required: false
        type: string
        default: 'error'
        description: 'Sentry issue level (debug, info, warning, error, fatal)'
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '22.21.1'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string
      working_directory:
        description: 'Directory to run commands in (if not root)'
        required: false
        default: ''
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
        description: 'Sentry Auth Token with project:write scope'

# Concurrency is managed by the parent workflow that calls this one
# This avoids deadlocks between parent and child workflows

jobs:
  workflow_contract:
    # The caller-facing half of the staleness handshake (CodySwannGT/lisa#3698).
    # `.github/reusable-workflow-contracts.json` records the major, every shipped
    # caller template is seeded with it, and
    # `check-workflow-contract-assertions.mjs` in Lisa refuses a template that
    # takes the `uses:` reference and drops the assertion — the two are one unit.
    name: 🔖 Workflow Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 🔖 Assert the caller still understands this workflow
        env:
          # The contract major THIS revision speaks. Bump it here and in
          # .github/reusable-workflow-contracts.json in the same commit, and
          # reseed every caller template in that commit too.
          DECLARED_MAJOR: '1'
          EXPECTED_MAJOR: ${{ inputs.expected_workflow_contract_major }}
          WORKFLOW_FILE: create-sentry-issue-on-failure.yml
        # Byte-identical to workflow-contract-assertion.sh in Lisa across every
        # reusable workflow; the gate proves it rather than trusting it.
        run: |
          set -eu

          # The consumer-side half of a two-party contract (CodySwannGT/lisa#3698).
          #
          # Every consumer reference to a Lisa reusable workflow tracks `@main` by ruling,
          # not by accident. So this workflow changes under a consumer between two runs of
          # one pull request, with no PR, no review and no record in their repository.
          # That is intended. What was missing is any way for them to TELL: an unchanged
          # workflow and a rewritten one produced the same silence, and an investigation
          # that fetched `@main` afterwards was reading a different artifact than the run
          # it was investigating and could not know it.
          #
          # This step is the signal, and it deliberately asserts the CONTRACT rather than
          # the ref. Asserting the ref — a tag, a SHA, a tree hash — goes red on every
          # legitimate upstream change and is deleted within a week, which is how a
          # staleness check becomes a staleness problem. The major asserts the property a
          # caller actually depends on: "the inputs and behaviour you were seeded against
          # still hold". A compatible change stays green, because receiving compatible
          # changes is the entire point of tracking `@main`; only a declared break speaks.
          echo "workflow:                                  ${WORKFLOW_FILE}"
          echo "contract major declared by this revision:  ${DECLARED_MAJOR}"
          echo "contract major the caller was seeded with: ${EXPECTED_MAJOR:-<none passed>}"

          # NOT DETERMINED, said out loud.
          #
          # A caller that passes nothing is not failed. Caller workflows ship create-only
          # and are never overwritten, so every consumer seeded before this shipped passes
          # nothing — while this workflow is live in all of them on their next run.
          # Failing closed here would redden the entire fleet over a file Lisa cannot
          # update on their behalf: the two-channel mistake this handshake exists to
          # catch, committed in the other direction.
          #
          # It must not be SILENT either. Silence is the defect. So the run says plainly
          # that it measured nothing, and says what to add.
          case "${EXPECTED_MAJOR}" in
            '' | *[!0-9]*)
              echo "::warning title=Workflow contract NOT DETERMINED::This run cannot tell whether ${WORKFLOW_FILE} changed under you. Its caller passed expected_workflow_contract_major='${EXPECTED_MAJOR}', which is not a whole number, so there is nothing to compare against the major ${DECLARED_MAJOR} this revision declares. Add 'expected_workflow_contract_major: ${DECLARED_MAJOR}' to the 'with:' block beside your 'uses: ...@main' line. Until you do, this check is measuring nothing and its green means only that."
              exit 0
              ;;
          esac

          if [ "${EXPECTED_MAJOR}" != "${DECLARED_MAJOR}" ]; then
            echo "::error title=Workflow contract mismatch::${WORKFLOW_FILE} on @main declares contract major ${DECLARED_MAJOR}; this caller was seeded against major ${EXPECTED_MAJOR}. A major bump is Lisa stating that an input or a behaviour you depend on changed in a way you must react to. Read the workflow header for what moved, update this caller, then set expected_workflow_contract_major: ${DECLARED_MAJOR}."
            exit 1
          fi

          echo "contract major ${DECLARED_MAJOR} agreed: ${WORKFLOW_FILE} has not declared a break under this caller."

  create_sentry_issue:
    name: 📝 Create Sentry Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}

      - name: 🔴 Create Sentry Issue
        if: inputs.tracking_action == ''
        id: create_sentry_issue
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'N/A' }}
        run: |
          cd "${{ inputs.working_directory || '.' }}"

          # Set variables
          WORKFLOW_NAME="${{ inputs.workflow_name }}"
          FAILED_JOB="${{ inputs.failed_job || 'Unknown' }}"
          ENVIRONMENT="${{ inputs.environment }}"
          LEVEL="${{ inputs.level }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Get commit message from env so GitHub expressions are never expanded inside shell.
          COMMIT_MESSAGE="${COMMIT_MESSAGE:-N/A}"

          # Create error message
          if [ "$FAILED_JOB" != "Unknown" ]; then
            ERROR_MESSAGE="CI/CD Workflow Failure: ${WORKFLOW_NAME} - ${FAILED_JOB}"
          else
            ERROR_MESSAGE="CI/CD Workflow Failure: ${WORKFLOW_NAME}"
          fi

          # Get current timestamp in ISO format
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # Create JSON payload for Sentry API using jq for proper escaping
          PAYLOAD=$(jq -n \
            --arg message "${ERROR_MESSAGE}" \
            --arg level "${LEVEL}" \
            --arg timestamp "${TIMESTAMP}" \
            --arg workflow_name "${WORKFLOW_NAME}" \
            --arg failed_job "${FAILED_JOB}" \
            --arg run_url "${RUN_URL}" \
            --arg repository "${{ github.repository }}" \
            --arg commit "${{ github.sha }}" \
            --arg commit_message "${COMMIT_MESSAGE}" \
            --arg triggered_by "${{ github.actor }}" \
            --arg environment "${ENVIRONMENT}" \
            --arg ref "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            '{
              "message": $message,
              "level": $level,
              "timestamp": $timestamp,
              "platform": "other",
              "sdk": {
                "name": "github-actions",
                "version": "1.0.0"
              },
              "logger": "github-actions.ci",
              "environment": $environment,
              "tags": {
                "workflow": $workflow_name,
                "job": $failed_job,
                "repository": $repository,
                "triggered_by": $triggered_by,
                "ref": $ref,
                "source": "github-actions"
              },
              "extra": {
                "workflow_run_url": $run_url,
                "commit_sha": $commit,
                "commit_message": $commit_message,
                "run_id": $run_id,
                "failure_type": "ci_cd_workflow"
              },
              "contexts": {
                "runtime": {
                  "name": "github-actions",
                  "version": "latest"
                },
                "os": {
                  "name": "ubuntu-latest"
                }
              },
              "fingerprint": ["github-actions", $workflow_name, $failed_job]
            }')

          # Debug: Print the payload to see what'\''s being sent (without sensitive data)
          echo "Debug: Generated payload:"
          echo "$PAYLOAD" | jq 'del(.extra.commit_message)' | head -20

          # Debug: Print Sentry configuration
          echo "Debug: SENTRY_ORG=${{ inputs.SENTRY_ORG }}"
          echo "Debug: SENTRY_PROJECT=${{ inputs.SENTRY_PROJECT }}"
          echo "Debug: API URL=https://sentry.io/api/0/projects/${{ inputs.SENTRY_ORG }}/${{ inputs.SENTRY_PROJECT }}/store/"

          # First, let's get the DSN for this project
          DSN_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            "https://sentry.io/api/0/projects/${{ inputs.SENTRY_ORG }}/${{ inputs.SENTRY_PROJECT }}/keys/")

          DSN_STATUS=$(echo "$DSN_RESPONSE" | tail -n1)
          DSN_BODY=$(echo "$DSN_RESPONSE" | head -n -1)

          if [ "$DSN_STATUS" = "200" ]; then
            # Extract the DSN from the first key
            DSN=$(echo "$DSN_BODY" | jq -r '.[0].dsn.public // empty')
            echo "Debug: Found DSN: ${DSN:0:50}..." # Show first 50 chars for security
            
            # Parse DSN to get the project ID and key
            if [[ $DSN =~ https://([^@]+)@([^/]+)/([0-9]+) ]]; then
              SENTRY_KEY="${BASH_REMATCH[1]}"
              SENTRY_HOST="${BASH_REMATCH[2]}"
              PROJECT_ID="${BASH_REMATCH[3]}"
              
              # Call Sentry API to create issue using the store endpoint with proper auth
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_key=$SENTRY_KEY" \
                -H "Content-Type: application/json" \
                -X POST \
                --data "${PAYLOAD}" \
                "https://${SENTRY_HOST}/api/${PROJECT_ID}/store/")
            else
              echo "Error: Could not parse DSN"
              exit 1
            fi
          else
            echo "Error: Could not retrieve project DSN. Status: $DSN_STATUS"
            echo "Response: $DSN_BODY"
            exit 1
          fi

          # Extract HTTP status code from response
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            # Extract issue ID from response
            ISSUE_ID=$(echo "$RESPONSE_BODY" | jq -r '.id // empty')
            
            if [ -n "$ISSUE_ID" ] && [ "$ISSUE_ID" != "null" ]; then
              echo "Successfully created Sentry issue: $ISSUE_ID"
              echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT
              echo "issue_url=https://sentry.io/organizations/${{ inputs.SENTRY_ORG }}/issues/?project=${{ inputs.SENTRY_PROJECT }}&query=$ISSUE_ID" >> $GITHUB_OUTPUT
            else
              echo "Issue created but no ID returned. Response:"
              echo "$RESPONSE_BODY" | jq . || echo "$RESPONSE_BODY"
            fi
          else
            echo "Failed to create Sentry issue. API response:"
            echo "Status: $HTTP_STATUS"
            echo "Body: $RESPONSE_BODY"
            
            # Provide helpful error messages
            if [ "$HTTP_STATUS" = "400" ]; then
              echo "Error: Bad request. Please check the payload format."
            elif [ "$HTTP_STATUS" = "401" ]; then
              echo "Error: Authentication failed. Please check SENTRY_AUTH_TOKEN."
            elif [ "$HTTP_STATUS" = "403" ]; then
              echo "Error: Permission denied. Please check token permissions (needs project:write)."
            elif [ "$HTTP_STATUS" = "404" ]; then
              echo "Error: Project not found. Please check SENTRY_ORG and SENTRY_PROJECT."
            elif [ "$HTTP_STATUS" = "429" ]; then
              echo "Error: Rate limit exceeded. Please try again later."
            fi
            
            exit 1
          fi

      - name: 📢 Report Issue Creation
        if: inputs.tracking_action == '' && steps.create_sentry_issue.outputs.issue_id
        run: |
          cd "${{ inputs.working_directory || '.' }}"
          echo "Created Sentry issue: ${{ steps.create_sentry_issue.outputs.issue_id }}"
          echo "Issue URL: ${{ steps.create_sentry_issue.outputs.issue_url }}"

      - name: 📢 Report Creation Attempt
        if: inputs.tracking_action == '' && steps.create_sentry_issue.conclusion == 'success' && !steps.create_sentry_issue.outputs.issue_id
        run: |
          cd "${{ inputs.working_directory || '.' }}"
          echo "Sentry event was sent successfully, but issue ID was not returned."
          echo "Check your Sentry dashboard: https://sentry.io/organizations/${{ inputs.SENTRY_ORG }}/issues/?project=${{ inputs.SENTRY_PROJECT }}"

      - name: 📌 Reconcile combined nightly E2E tracker
        if: inputs.tracking_action != ''
        env:
          TRACKING_DESTINATION: sentry
          TRACKING_ACTION: ${{ inputs.tracking_action }}
          TRACKING_MARKER: ${{ inputs.tracking_marker }}
          TRACKING_TITLE: ${{ inputs.tracking_title }}
          TRACKING_BODY: ${{ inputs.tracking_body }}
          TRACKING_ID: ${{ inputs.tracking_id }}
          SENTRY_ORG: ${{ inputs.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ inputs.SENTRY_PROJECT }}
          PROVIDER_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LISA_CONFIG_PATH: .lisa.config.json
          NIGHTLY_E2E_FINDINGS: ${{ inputs.tracking_findings }}
        run: node scripts/nightly-e2e-provider-action.mjs
