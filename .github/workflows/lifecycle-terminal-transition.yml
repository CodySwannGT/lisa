name: 🎯 Terminal Transition On Merge

# Completes the work items THIS push shipped, and only those.
#
# The gap it closes (CodySwannGT/lisa#3704): the terminal transition — the
# configured `done` role plus the native close — is owned by two skills,
# `lisa-drive-pr-to-merge` and the build-intake completion phase. Work driven
# directly, with `gh pr create` and `gh pr merge`, runs neither. It ships, and
# the item stays in `status:ready` — the lane build intake dispatches from, so
# shipped work advertises itself as buildable and gets rebuilt.
#
# Why this is not the daily drift sweep. That sweep answers a BACKLOG question,
# "what has ever shipped and is still open" — ~97 items when this was written.
# `--apply` over it completes all of them, which is why it runs in report mode
# and why nothing automatic has ever been allowed to apply it. `--since` bounds
# the same evidence to what one push added, which is a question a merge can
# both answer and act on. The two are complements: this is the forward path,
# the daily sweep is the backstop, and neither can do the other's job.
#
# The evidence is unchanged and is not a PR title or a branch name: a commit
# reachable from the deploy branch whose own `Work-Item:` trailer names the
# item, plus — inside `complete` — a merged pull request in this repository
# whose BASE BRANCH resolves through `deploy.branches` to the production
# environment. A merge onto an integration branch earns no terminal role.
#
# Idempotent by construction: a completed item is closed and no longer carries
# the ready or claimed role, so it is not in the open-lane listing the subject
# list is built from. A re-run over the same range writes nothing, and an item
# an operator moved by hand looks identical to one this workflow moved.
#
# NOTE: repo-specific to the Lisa monorepo, NOT a Lisa template — do not move
# it under plugins/src or the create-only template sets. Host projects reach
# their terminal role through `lisa-drive-pr-to-merge`; a workflow that closes
# issues is not something to install into a repository unasked.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete:
    name: 🎯 Complete what this push shipped
    if: ${{ github.repository == 'CodySwannGT/lisa' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The evidence is what the deploy branch's commits DECLARE, and the
          # bound is a commit that must resolve here. A shallow clone finds
          # neither: it would refuse on the bound, which is the correct answer
          # but a needlessly expensive way to get it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '22.21.1'
      - name: Complete the items this push shipped
        id: transition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          # A branch-creation push carries the all-zero SHA, and a
          # `workflow_dispatch` carries no `before` at all. Neither names a
          # range, and this job refuses to invent one: an UNBOUNDED --apply
          # here would complete the whole backlog on a single fire. Said out
          # loud rather than skipped silently, and the daily sweep still
          # reports anything this run could not bound.
          if [ -z "${PUSH_BEFORE:-}" ] || \
             ! git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null; then
            printf 'NOT DETERMINED: this event carries no resolvable "before" revision (%s), so the range this push added is unknown.\n' "${PUSH_BEFORE:-<absent>}" | tee transition.txt
            printf 'No item was completed. The daily Lifecycle Drift Sweep still reports anything left behind.\n' | tee -a transition.txt
            exit 0
          fi
          node scripts/lisa-work-item.mjs sweep --apply --since "$PUSH_BEFORE" | tee transition.txt
      - name: Publish what happened
        if: always()
        run: |
          {
            echo '## Terminal transition'
            echo
            echo '```'
            cat transition.txt 2>/dev/null || echo 'the transition produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when an item could not be completed
        run: |
          # `grep -c` exits non-zero on zero matches, which would read as
          # "a refusal happened" here — the inverse of the truth. Count
          # without letting the exit status decide.
          refused="$(grep -c '^work-item NOT completed' transition.txt || true)"
          if [ "${refused:-0}" -gt 0 ]; then
            echo "::error::${refused} work item(s) this push shipped could not be completed; the run summary says why."
            exit 1
          fi
          echo "Nothing was left un-completed."

  # A run nobody reads is the same as no run. A red run files a deduplicated
  # issue, which is the named consumer a "reported, not guessed" outcome needs
  # in order to be worth reporting at all.
  create_issue_on_failure:
    if: ${{ failure() && github.repository == 'CodySwannGT/lisa' }}
    needs: complete
    uses: ./.github/workflows/create-github-issue-on-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow_name: 'Terminal transition on merge'
      failed_job: 'complete'
      package_manager: 'bun'
