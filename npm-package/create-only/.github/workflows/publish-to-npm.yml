# Lisa will not overwrite it. (copy-overwrite assets ARE replaced each run.)
# You can customize this file — Lisa will not overwrite it.

# Reusable workflow for publishing to npm with OIDC trusted publishing
# This workflow is not callable directly - it must be called from another workflow
#
# Usage:
#   publish:
#     uses: ./.github/workflows/publish-to-npm.yml
#     needs: [release]
#     with:
#       tag: ${{ needs.release.outputs.tag }}
#       version: ${{ needs.release.outputs.version }}
#       node_version: '22.x'
#       package_manager: 'bun'

name: Publish to npm

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to publish from'
        required: true
        type: string
      version:
        description: 'Version to publish'
        required: true
        type: string
      node_version:
        description: 'Node.js version to use'
        required: false
        default: '20.x'
        type: string
      package_manager:
        description: 'Package manager to use (npm, yarn, or bun)'
        required: false
        default: 'npm'
        type: string

# Required permissions for OIDC publishing
permissions:
  contents: read
  id-token: write # Required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Job-level so every step below reads these from the environment instead of
    # having them substituted into its script. A `${{ }}` expression is
    # substituted by Actions BEFORE the shell parses the script, so an
    # interpolated value is shell SOURCE TEXT rather than an argument - and
    # `tag`, `version` and `package_manager` are all free-text `type: string`
    # inputs that reach `git checkout`, `npm version` and a bare command name.
    # Paired with the shape gates in Validate inputs below (#3717).
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      PACKAGE_MANAGER: ${{ inputs.package_manager }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Tag input is empty - cannot publish without a version tag"
            echo "This usually means the version job was skipped (e.g., promotion merge detected)"
            exit 1
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Version input is empty - cannot publish without a version"
            exit 1
          fi
          # Shape gates, so a value carrying shell metacharacters is refused
          # before it reaches `git checkout`, `npm version`, or a command name.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag input is not a valid version tag"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version input is not a valid semantic version"
            exit 1
          fi
          case "$PACKAGE_MANAGER" in
            npm|yarn|pnpm|bun) ;;
            *)
              echo "::error::Unsupported package manager: must be npm, yarn, pnpm or bun"
              exit 1
              ;;
          esac
          echo "✅ Inputs validated: tag=$RELEASE_TAG, version=$RELEASE_VERSION"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for tag to be available
        run: |
          echo "Waiting for tag $RELEASE_TAG to be available..."
          for i in {1..30}; do
            git fetch --tags
            if git tag --list | grep -qx "$RELEASE_TAG"; then
              echo "Tag $RELEASE_TAG is now available"
              git checkout "$RELEASE_TAG"
              break
            fi
            echo "Attempt $i/30: Tag not found yet, waiting 10 seconds..."
            sleep 10
          done

          # Final check
          if [ "$(git describe --exact-match --tags 2>/dev/null)" != "$RELEASE_TAG" ]; then
            echo "Error: Tag $RELEASE_TAG is still not available after 5 minutes"
            exit 1
          fi

      - name: Setup bun
        if: inputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.8'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
          cache: ${{ inputs.package_manager != 'bun' && inputs.package_manager || '' }}

      - name: Update npm for OIDC support
        # npm 12 requires a newer Node release than the generated project may pin.
        run: npm install -g npm@11.7.0

      - name: Install dependencies
        run: |
          if [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "bun" ]; then
            bun install --frozen-lockfile
          fi

      - name: Build package
        run: |
          "$PACKAGE_MANAGER" run build

      - name: Update package version
        run: |
          # Update package.json to match the release version
          VERSION="$RELEASE_VERSION"
          if [ -n "$VERSION" ]; then
            echo "Updating package.json to version $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Publish to npm with OIDC
        run: npm publish --access public --provenance
        # npm publish is required for OIDC provenance - bun publish doesn't support --provenance yet
        # Configure trusted publisher at: https://www.npmjs.com/package/<package-name>/access

      - name: Publish @codyswann/eslint-plugin-code-organization
        if: ${{ hashFiles('eslint-plugin-code-organization/package.json') != '' }}
        run: |
          cd eslint-plugin-code-organization
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance

      - name: Publish @codyswann/eslint-plugin-component-structure
        if: ${{ hashFiles('eslint-plugin-component-structure/package.json') != '' }}
        run: |
          cd eslint-plugin-component-structure
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance

      - name: Publish @codyswann/eslint-plugin-ui-standards
        if: ${{ hashFiles('eslint-plugin-ui-standards/package.json') != '' }}
        run: |
          cd eslint-plugin-ui-standards
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance

      - name: Notify on success
        run: echo "Successfully published version $RELEASE_VERSION to npm with provenance"
