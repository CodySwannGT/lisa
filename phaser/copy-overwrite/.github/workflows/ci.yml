# This file is managed by Lisa and IS replaced on each `lisa` run.
# Do not edit directly — durable changes belong upstream in Lisa.

name: 🔍 CI Quality Checks

on:
  pull_request:
    # Include labeled/unlabeled so toggling the verification-exempt label
    # re-runs CI (the verification gate keys on PR labels).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Quality Checks
    permissions:
      contents: read
      # work_item_traceability reads the tracker issue to verify the PR
      # backlink. A reusable workflow can only DOWNGRADE the caller's
      # grant, so without issues:read that job cannot enforce anything.
      issues: read
      pull-requests: read
    uses: CodySwannGT/lisa/.github/workflows/quality.yml@main
    with:
      node_version: '22.21.1'
      package_manager: 'bun'
      skip_jobs: ''
      # Verification IS UAT: a feat/fix must ship a tests/e2e verification spec
      # (an agent playing the game), unless labeled verification-exempt.
      #
      # NO LONGER OPTED IN HERE, because there is no longer an input to opt in
      # with. `verify_enforced` was a second adoption control for that job and
      # was retired in CodySwannGT/lisa#3021; a caller still passing it now
      # FAILS the job by name, so a phaser project shipping this file would be
      # born red. The control is the `coverage-adequacy` declaration, and this
      # stack ships no `.lisa.config.json`, so a phaser project turns the gate
      # back on for itself:
      #
      #   "gates": { "coverage-adequacy":
      #     { "pull-request": { "level": "required", "run": "check:verification" } } }
      #
      # which runs the same script on the same diff. Until it does, the check
      # is enforced only by .husky/pre-push.verify — a hook, not a
      # branch-protection context. Closing that is CodySwannGT/lisa#3147.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
      # Only the configured tracker's credentials are used. tracker:
      # github needs none of these; jira/linear cannot verify the PR
      # backlink without them and report not-enforceable instead.
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_LOGIN: ${{ secrets.JIRA_LOGIN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
