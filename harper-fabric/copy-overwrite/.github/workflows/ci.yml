# This file is managed by Lisa and IS replaced on each `lisa` run.
# Do not edit directly — durable changes belong upstream in Lisa.

name: 🔍 CI Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: 🔍 Quality Checks
    permissions:
      contents: read
      # work_item_traceability reads the tracker issue to verify the PR
      # backlink. A reusable workflow can only DOWNGRADE the caller's
      # grant, so without issues:read that job cannot enforce anything.
      issues: read
      pull-requests: read
    uses: CodySwannGT/lisa/.github/workflows/quality.yml@main
    with:
      # Travels with the `uses:` line above — the two are one unit. Lisa's
      # reusable workflows are tracked at `@main`, so that file changes under
      # this repository with no pull request here. This is the contract major it
      # spoke when Lisa seeded this file; the run fails loudly if it has since
      # declared a break, and says NOT DETERMINED if this line goes missing
      # (CodySwannGT/lisa#3698).
      expected_workflow_contract_major: '1'
      node_version: '22.21.1'
      package_manager: 'bun'
      skip_jobs: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
      # Only the configured tracker's credentials are used. tracker:
      # github needs none of these; jira/linear cannot verify the PR
      # backlink without them and report not-enforceable instead.
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_LOGIN: ${{ secrets.JIRA_LOGIN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
